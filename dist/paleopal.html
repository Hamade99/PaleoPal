<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0e1417">
<title>Paleopal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1417; --deep:#141d21; --panel:#1b262a; --line:#2b3a3f;
  --bone:#e9e1cb; --dim:#93a29c; --ink:#101a18;
  --moss:#7ea55f; --ochre:#d9a441; --rust:#c2603c; --sky:#7fb2c9;
  --safe: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  align-items:flex-start;
  background:radial-gradient(120% 80% at 50% 0%,#182226 0%,var(--bg) 60%);
  color:var(--bone);
  font-family:Inter,system-ui,sans-serif;
  display:flex;justify-content:center;
  overscroll-behavior:none;
}
#app{
  width:100%;max-width:440px;margin:auto 0;
  display:flex;flex-direction:column;
  padding:10px 12px calc(10px + var(--safe));
  position:relative;
}

/* ---------- top ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.brand{font-family:'Pixelify Sans',monospace;font-weight:700;font-size:19px;letter-spacing:.5px;color:var(--bone)}
.brand span{color:var(--moss)}
.wallet{display:flex;align-items:center;gap:6px;font-family:'Pixelify Sans';font-size:17px;color:var(--ochre);
  background:#161f22;border:1px solid var(--line);border-radius:7px;padding:3px 9px 2px;box-shadow:0 2px 0 #0b1113}
#coinArt{display:flex}
.iconbtn{background:#1b2529;border:1px solid var(--line);color:var(--dim);width:34px;height:34px;border-radius:8px;
  cursor:pointer;font-size:14px;font-family:'Pixelify Sans';display:grid;place-items:center;box-shadow:0 2px 0 #0b1113}
.iconbtn:active{transform:translateY(2px);box-shadow:none}
#btnNest{position:relative}
#nestCount{position:absolute;right:-3px;top:-4px;min-width:14px;height:14px;border-radius:8px;
  background:var(--moss);color:#0e1417;font-family:'Pixelify Sans';font-size:10px;line-height:14px;
  text-align:center;font-style:normal}
#nestCount:empty{display:none}
.row.pet.here{border-color:var(--moss);box-shadow:0 2px 0 #0b1214,inset 0 0 0 1px rgba(126,165,95,.35)}
.row .art{overflow:hidden}
.iconbtn:hover{color:var(--bone);border-color:#3d5158}

/* ---------- identity ---------- */
.ident{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dname{font-family:'Pixelify Sans';font-size:22px;line-height:1;cursor:pointer;border-bottom:1px dashed transparent}
.dname:hover{border-bottom-color:var(--line)}
.dsub{font-size:12.5px;color:var(--dim)}
#nameEdit{font:inherit;font-family:'Pixelify Sans';font-size:22px;background:var(--panel);color:var(--bone);border:1px solid var(--line);border-radius:6px;padding:1px 6px;width:150px}

/* ---------- needs ---------- */
.needs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:9px}
.need{background:var(--deep);border:1px solid var(--line);border-radius:9px;padding:6px 7px 7px}
.need b{display:block;font-weight:500;font-size:10.5px;color:var(--dim);margin-bottom:5px;letter-spacing:.1px}
.track{position:relative;height:7px;background:#080d0f;box-shadow:inset 0 0 0 1px #000;overflow:hidden}
.fill{height:100%;width:50%;transition:width .5s linear,background .4s}
.seg{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 4px,var(--deep) 4px 6px)}
.need.low b{color:var(--rust)}

/* ---------- stage ---------- */
.stage{position:relative;border-radius:13px;background:#1d282c;padding:9px 9px 11px;
  border:1px solid #35474c;box-shadow:inset 0 1px 0 #43585e,0 4px 0 #0a1012}
canvas#scene{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:none;cursor:pointer;
  border-radius:5px;box-shadow:0 0 0 2px #0a0f11,inset 0 0 0 1px #000}
.screw{position:absolute;width:4px;height:4px;border-radius:50%;background:#0e1618;box-shadow:0 1px 0 #4a5f65}
.screw.tl{left:3px;top:3px}.screw.tr{right:3px;top:3px}.screw.bl{left:3px;bottom:3px}.screw.br{right:3px;bottom:3px}
.lamp{position:absolute;right:9px;bottom:3px;width:5px;height:5px;border-radius:50%;
  background:var(--moss);box-shadow:0 0 5px rgba(126,165,95,.9)}
.lamp.rest{background:var(--sky);box-shadow:0 0 5px rgba(127,178,201,.8)}
.lamp.bad{background:var(--rust);box-shadow:0 0 6px rgba(194,96,60,.95)}
.bubble{
  position:absolute;left:50%;top:16px;transform:translate(-50%,-6px);
  background:var(--bone);color:var(--ink);font-size:12.5px;font-weight:500;
  padding:6px 10px;border-radius:9px;max-width:88%;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;line-height:1.25;
  box-shadow:0 4px 0 rgba(0,0,0,.35)
}
.bubble.on{opacity:1;transform:translate(-50%,0)}
.picks span{position:absolute;bottom:16px;transform:translateX(-50%);text-align:center;
  font-size:10.5px;color:#b9c4bd;line-height:1.35;white-space:nowrap;
  background:rgba(10,18,16,.78);border:1px solid rgba(90,116,104,.5);border-radius:6px;padding:3px 7px}
.picks b{display:block;font-size:11.5px;color:var(--bone);font-weight:600;font-family:'Pixelify Sans';letter-spacing:.3px}
.badge{
  position:absolute;left:16px;bottom:19px;display:flex;gap:5px;flex-wrap:wrap;max-width:70%;
}
.tag{background:rgba(16,26,24,.82);border:1px solid #3a4d45;color:var(--bone);font-size:10.5px;
  padding:3px 7px;border-radius:20px;display:flex;align-items:center;gap:4px}
.tag.warn{border-color:#7a3a2b;color:#f0b7a3}
.dot{width:5px;height:5px;border-radius:50%;background:var(--moss)}
.tag.warn .dot{background:var(--rust)}

/* ---------- mood strip ---------- */
.moodrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 2px 10px}
.mood{font-size:13px;color:var(--bone)}
.mood em{font-style:normal;color:var(--dim)}
.bondwrap{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
.pip{width:8px;height:8px;border-radius:2px;background:#243034;transform:rotate(45deg)}
.pip.on{background:var(--rust)}

/* ---------- actions ---------- */
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding-top:2px}
.act{
  background:linear-gradient(#26343a,#1a2429);border:1px solid #35474c;color:var(--bone);
  border-radius:9px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-family:'Pixelify Sans';font-size:12px;letter-spacing:.3px;cursor:pointer;position:relative;padding:5px 2px;
  box-shadow:inset 0 1px 0 #43585e,0 3px 0 #0b1214
}
.act:active{transform:translateY(3px);box-shadow:inset 0 1px 0 #43585e}
.act .ico{display:flex;height:24px;align-items:center}
.act[disabled]{opacity:.3;cursor:default;box-shadow:none;transform:none}
.act .nub{position:absolute;top:5px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--rust);box-shadow:0 0 5px rgba(194,96,60,.9)}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,10,11,.65);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,102%);
  width:100%;max-width:440px;margin:auto 0;background:var(--deep);border:1px solid var(--line);border-bottom:0;
  border-radius:18px 18px 0 0;padding:14px 14px calc(16px + var(--safe));z-index:6;
  transition:transform .26s cubic-bezier(.2,.9,.3,1);max-height:82vh;overflow-y:auto
}
.sheet.on{transform:translate(-50%,0)}
.sheet h2{font-family:'Pixelify Sans';font-size:18px;font-weight:700;margin-bottom:2px}
.sheet p.lede{font-size:12.5px;color:var(--dim);margin-bottom:12px;line-height:1.45}
.grip{width:38px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.row{
  box-shadow:0 2px 0 #0b1214;
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);color:var(--bone);
  border-radius:11px;padding:10px 12px;margin-bottom:7px;cursor:pointer;font:inherit
}
.row:active{transform:translateY(2px);box-shadow:none}
.row[disabled]{opacity:.4;cursor:default}
.row .art{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center}
.row .art canvas{image-rendering:pixelated}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:13.5px;font-weight:600}
.row .t small{display:block;font-size:11.5px;color:var(--dim);margin-top:1px;line-height:1.35}
.row .px{font-family:'Pixelify Sans';font-size:15px;color:var(--ochre);flex:0 0 auto}
.row .px.own{color:var(--moss)}
.log{font-size:12.5px;line-height:1.5;color:var(--bone);border-left:2px solid var(--line);padding:2px 0 2px 10px;margin-bottom:9px}
.log time{display:block;font-size:10.5px;color:var(--dim);margin-bottom:1px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:10.5px;color:var(--dim);font-weight:500}
.stat span{font-family:'Pixelify Sans';font-size:15px}
.note{font-size:12px;color:var(--dim);line-height:1.5;margin-top:4px}
.trait{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:3px 9px;font-size:11.5px;margin:0 5px 5px 0}
.hr{height:1px;background:var(--line);margin:12px 0}
.gamebar{display:flex;justify-content:space-between;font-family:'Pixelify Sans';font-size:15px;padding:0 2px 8px}
.tiny{font-size:11px;color:var(--dim);text-align:center;margin-top:10px;line-height:1.5}
button:focus-visible,.dname:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">PALEO<span>PAL</span></div>
    <div style="display:flex;align-items:center;gap:9px">
      <div class="wallet"><i id="coinArt"></i><span id="coins">0</span></div>
      <button class="iconbtn" id="btnNest" aria-label="Open the nest"><i id="nestCount"></i></button>
      <button class="iconbtn" id="btnDossier" aria-label="Open dossier">i</button>
    </div>
  </div>

  <div class="ident">
    <div class="dname" id="dName" tabindex="0" role="button">…</div>
    <div class="dsub" id="dSub"></div>
    <input id="nameEdit" hidden maxlength="14" aria-label="Rename">
  </div>

  <div class="needs" id="needs"></div>

  <div class="stage">
    <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
    <i class="lamp" id="lamp"></i>
    <canvas id="scene" width="224" height="168"></canvas>
    <div class="badge" id="badges"></div>
    <!-- filled by buildChrome() from SPECIES, so it stays in step with the eggs -->
    <div class="picks" id="picks" hidden></div>
    <div class="bubble" id="bubble"></div>
  </div>

  <div class="moodrow">
    <div class="mood" id="mood"></div>
    <div class="bondwrap" id="bond"></div>
  </div>

  <div class="actions" id="actions"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grip"></div>
  <div id="sheetBody"></div>
</div>
<script>
'use strict';
/* ==========================================================================
   PALEOPAL — a pocket dinosaur care sim
   Sections: core → sprites → species → world → sim → render → ui
   ========================================================================== */

const W = 224, H = 168, GROUND = 140;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;
const rnd   = (a,b) => a + Math.random()*(b-a);
const pick  = a => a[(Math.random()*a.length)|0];
const $     = id => document.getElementById(id);
const HOUR  = 3600e3, MIN = 60e3;

/* ---------- storage: works as artifact, as a file, and inside a webview ---- */
const Store = {
  async get(k){
    if (window.storage) { try { const r = await window.storage.get(k); return r ? r.value : null; } catch(e){ return null; } }
    try { return localStorage.getItem(k); } catch(e){ return null; }
  },
  async set(k,v){
    if (window.storage) { try { await window.storage.set(k,v); return; } catch(e){ return; } }
    try { localStorage.setItem(k,v); } catch(e){}
  },
  async del(k){
    if (window.storage) { try { await window.storage.delete(k); return; } catch(e){ return; } }
    try { localStorage.removeItem(k); } catch(e){}
  }
};

/* ---------- audio ---------- */
let AC = null;
function tone(f, dur, type, vol, delay, slide){
  if (!G || !G.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime + (delay||0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(28, f + slide), t + dur);
    g.gain.setValueAtTime(vol || .06, t);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + .04);
  }catch(e){}
}
const SFX = {
  chomp:()=>{tone(200,.06,'square',.07);tone(140,.08,'square',.07,.06);},
  coin :()=>{tone(880,.06,'square',.05);tone(1320,.09,'square',.05,.06);},
  purr :()=>{tone(300,.14,'sine',.05,0,90);},
  crack:()=>tone(130,.07,'sawtooth',.09,0,-45),
  hatch:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.13,'square',.06,i*.1)),
  bonk :()=>tone(95,.15,'square',.09,0,-45),
  wash :()=>tone(420,.14,'triangle',.06,0,520),
  yawn :()=>tone(480,.42,'sine',.05,0,-300),
  roar :()=>{tone(72,.5,'sawtooth',.11,0,-32);tone(54,.55,'square',.08,.05,-22);},
  pop  :()=>tone(340,.05,'triangle',.07),
  sneeze:()=>{tone(700,.05,'square',.05);tone(240,.16,'sawtooth',.08,.05,-120);}
};

/* ==========================================================================
   SPRITE PIPELINE
   Shapes are drawn as smooth paths on an offscreen canvas, then hard-quantised
   (alpha threshold + palette snap) and given a dilated outline. That gives real
   pixel art with correct anatomy instead of hand-typed ASCII blobs.
   ========================================================================== */

function makeCv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function readCtx(c){ return c.getContext('2d', { willReadFrequently:true }); }
const article = w => /^[aeiou]/i.test(w) ? 'an ' : 'a ';
/* the copy is written out in words, so counts that appear in a sentence are too */
const NUM_WORD = ['No','One','Two','Three','Four','Five','Six','Seven','Eight'];
const numWord = n => NUM_WORD[n] || String(n);

/* tapered tube through a centreline — the workhorse for necks, tails, limbs */
function tube(g, pts, widths, col){
  const n = pts.length;
  const left = [], right = [];
  for (let i=0;i<n;i++){
    const p = pts[i];
    const a = pts[Math.max(0,i-1)], b = pts[Math.min(n-1,i+1)];
    let dx = b[0]-a[0], dy = b[1]-a[1];
    const L = Math.hypot(dx,dy) || 1; dx/=L; dy/=L;
    const w = widths[i]/2;
    left.push([p[0]-dy*w, p[1]+dx*w]);
    right.push([p[0]+dy*w, p[1]-dx*w]);
  }
  if (col) g.fillStyle = col;
  g.beginPath();
  curveThrough(g, left, true);
  const rr = right.slice().reverse();
  for (let i=0;i<rr.length;i++) g.lineTo(rr[i][0], rr[i][1]);
  g.closePath(); g.fill();
  // round the caps so tips read as tips, not chisels
  g.beginPath(); g.arc(pts[0][0],pts[0][1],Math.max(.5,widths[0]/2),0,7); g.fill();
  g.beginPath(); g.arc(pts[n-1][0],pts[n-1][1],Math.max(.5,widths[n-1]/2),0,7); g.fill();
}
function curveThrough(g, p, start){
  if (start) g.moveTo(p[0][0], p[0][1]);
  for (let i=0;i<p.length-1;i++){
    const a=p[i], b=p[i+1];
    const prev=p[Math.max(0,i-1)], next=p[Math.min(p.length-1,i+2)];
    const c1=[a[0]+(b[0]-prev[0])/6, a[1]+(b[1]-prev[1])/6];
    const c2=[b[0]-(next[0]-a[0])/6, b[1]-(next[1]-a[1])/6];
    g.bezierCurveTo(c1[0],c1[1],c2[0],c2[1],b[0],b[1]);
  }
}
function blob(g, pts, col){
  if (col) g.fillStyle = col;
  g.beginPath();
  const p = pts.concat([pts[0],pts[1]]);
  g.moveTo(p[0][0],p[0][1]);
  for (let i=0;i<p.length-1;i++){
    const a=p[i], b=p[i+1];
    const prev=p[(i-1+p.length)%p.length], next=p[(i+2)%p.length];
    g.bezierCurveTo(a[0]+(b[0]-prev[0])/6, a[1]+(b[1]-prev[1])/6,
                    b[0]-(next[0]-a[0])/6, b[1]-(next[1]-a[1])/6, b[0],b[1]);
  }
  g.closePath(); g.fill();
}
function oval(g,x,y,rx,ry,col,rot){
  if (col) g.fillStyle=col; g.beginPath(); g.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot||0,0,7); g.fill();
}

/* hard-edge pass: kill antialiasing, snap to the species ramp, dilate outline */
function crisp(src, palette, outline){
  const w = src.width, h = src.height;
  const g = readCtx(src);
  const img = g.getImageData(0,0,w,h), d = img.data;
  const ramp = palette.map(hex => [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16),hex]);
  const solid = new Uint8Array(w*h);
  for (let i=0;i<w*h;i++){
    const o=i*4;
    if (d[o+3] < 118){ d[o+3]=0; continue; }
    d[o+3]=255; solid[i]=1;
    let best=ramp[0], bd=1e9;
    for (const c of ramp){
      const dd=(c[0]-d[o])**2+(c[1]-d[o+1])**2+(c[2]-d[o+2])**2;
      if (dd<bd){bd=dd;best=c;}
    }
    d[o]=best[0]; d[o+1]=best[1]; d[o+2]=best[2];
  }
  // dilate a 1px outline into the transparent border
  const oc = [parseInt(outline.slice(1,3),16),parseInt(outline.slice(3,5),16),parseInt(outline.slice(5,7),16)];
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const i=y*w+x; if (solid[i]) continue;
    if ((x>0&&solid[i-1])||(x<w-1&&solid[i+1])||(y>0&&solid[i-w])||(y<h-1&&solid[i+w])){
      const o=i*4; d[o]=oc[0]; d[o+1]=oc[1]; d[o+2]=oc[2]; d[o+3]=255;
    }
  }
  g.putImageData(img,0,0);
  return src;
}

/* trim transparent margins so anchors and ground contact stay exact */
function trim(src){
  const w=src.width,h=src.height,g=readCtx(src);
  const d=g.getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(d[(y*w+x)*4+3]){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  }
  if (x1<0) return {cv:src,ox:0,oy:0,w,h};
  const nw=x1-x0+1, nh=y1-y0+1, out=makeCv(nw,nh);
  out.getContext('2d').drawImage(src,x0,y0,nw,nh,0,0,nw,nh);
  return {cv:out, ox:x0, oy:y0, w:nw, h:nh};
}

/* ==========================================================================
   COLOUR + LIGHTING
   Palettes are generated as hue-shifted ramps: shadows drift cooler and more
   saturated, highlights warmer and less saturated. Shading uses one light,
   from the upper left, applied through a distance field so the form reads
   instead of pillowing evenly around the outline.
   ========================================================================== */

function hexToHsl(hex){
  let r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2;
  let h = 0, s = 0;
  if (mx !== mn){
    const d = mx - mn;
    s = l > .5 ? d/(2-mx-mn) : d/(mx+mn);
    h = mx === r ? (g-b)/d + (g<b?6:0) : mx === g ? (b-r)/d + 2 : (r-g)/d + 4;
    h *= 60;
  }
  return [h, s, l];
}
function hslToHex(h, s, l){
  h = ((h % 360) + 360) % 360; s = clamp(s,0,1); l = clamp(l,0,1);
  const c = (1 - Math.abs(2*l-1)) * s, x = c * (1 - Math.abs((h/60)%2 - 1)), m = l - c/2;
  let r,g,b;
  if (h<60) [r,g,b]=[c,x,0]; else if (h<120) [r,g,b]=[x,c,0]; else if (h<180) [r,g,b]=[0,c,x];
  else if (h<240) [r,g,b]=[0,x,c]; else if (h<300) [r,g,b]=[x,0,c]; else [r,g,b]=[c,0,x];
  const q = v => Math.round((v+m)*255).toString(16).padStart(2,'0');
  return '#' + q(r) + q(g) + q(b);
}
/* five steps, darkest first, with the hue rotated along the ramp */
function ramp(base, opts){
  opts = opts || {};
  const [h,s,l] = hexToHsl(base);
  const spread = opts.spread || .17, shift = opts.shift || 22;
  const out = [];
  for (let i=0;i<5;i++){
    const t = (i-2)/2;                                   // -1 shadow … +1 light
    out.push(hslToHex(
      h + (t<0 ? t*shift : t*shift*.55),                 // shadows swing further
      clamp(s + (t<0 ? .10*-t : -.13*t), .05, 1),
      clamp(l + t*spread, .05, .95)
    ));
  }
  return out;
}
function shiftRamp(r, n){ return r.map((_,i) => r[clamp(i+n,0,4)]); }

/* material keys: each shape is painted onto its own layer with a flat key
   colour, so material boundaries stay exact and never blend into each other */
const LAYERS = ['far','skin','belly','limb','head','mark','crest','horn','mouth','sclera','pupil','glint'];
const MARK_LAYER = LAYERS.indexOf('mark');   // only paints where a body layer already is
const BODY_TOP   = LAYERS.indexOf('head');

function buildMaterials(spec){
  const skin = ramp(spec.skin), horn = ramp(spec.horn, {spread:.12, shift:14});
  return {
    far:    { r: shiftRamp(skin, -2), lit:.45 },
    skin:   { r: skin,                lit:1 },
    belly:  { r: ramp(spec.belly),    lit:.65 },
    limb:   { r: shiftRamp(skin, 0),  lit:1.1 },
    head:   { r: skin,                lit:.9 },
    mark:   { r: ramp(spec.mark || spec.crest), lit:.85 },
    crest:  { r: ramp(spec.crest),    lit:.7 },
    horn:   { r: horn,                lit:1.15 },
    mouth:  { r: ramp(spec.mouth, {spread:.10}), lit:.35 },
    sclera: { r: ramp('#f6f2e2', {spread:.07}),  lit:.3 },
    pupil:  { r: ramp('#181410', {spread:.05}),  lit:0 },
    glint:  { r: ramp('#fffdf2', {spread:.04}),  lit:0 },
    outline: spec.outline
  };
}

/* ---------- composite the layers, light them, draw a selective outline ----- */
const LIGHT = [-0.66, -0.75];      // upper-left
const RIM = 6;                     // how deep the lit/shadowed band reaches

function composeSprite(layerCanvases, mats, w, h){
  const n = w*h;
  const id = new Int8Array(n).fill(-1);
  for (let li=0; li<LAYERS.length; li++){
    const d = readCtx(layerCanvases[li]).getImageData(0,0,w,h).data;
    if (li === MARK_LAYER){
      for (let i=0;i<n;i++) if (d[i*4+3] >= 118 && id[i] >= 0 && id[i] <= BODY_TOP) id[i] = li;
    } else {
      for (let i=0;i<n;i++) if (d[i*4+3] >= 118) id[i] = li;
    }
  }
  // distance from the silhouette edge (two-pass chamfer)
  const dist = new Float32Array(n);
  const BIG = 1e6;
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const i = y*w+x;
    if (id[i] < 0){ dist[i] = 0; continue; }
    const out = (x===0||id[i-1]<0) || (x===w-1||id[i+1]<0) || (y===0||id[i-w]<0) || (y===h-1||id[i+w]<0);
    const seam = (x>0&&id[i-1]!==id[i]) || (x<w-1&&id[i+1]!==id[i]) ||
                 (y>0&&id[i-w]!==id[i]) || (y<h-1&&id[i+w]!==id[i]);
    dist[i] = out ? 0 : seam ? 2.6 : BIG;
  }
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const i = y*w+x; if (!dist[i]) continue;
    let v = dist[i];
    if (x>0) v = Math.min(v, dist[i-1]+1);
    if (y>0) v = Math.min(v, dist[i-w]+1);
    if (x>0&&y>0) v = Math.min(v, dist[i-w-1]+1.41);
    if (x<w-1&&y>0) v = Math.min(v, dist[i-w+1]+1.41);
    dist[i] = Math.min(v, BIG);
  }
  for (let y=h-1;y>=0;y--) for (let x=w-1;x>=0;x--){
    const i = y*w+x; if (!dist[i]) continue;
    let v = dist[i];
    if (x<w-1) v = Math.min(v, dist[i+1]+1);
    if (y<h-1) v = Math.min(v, dist[i+w]+1);
    if (x<w-1&&y<h-1) v = Math.min(v, dist[i+w+1]+1.41);
    if (x>0&&y<h-1) v = Math.min(v, dist[i+w-1]+1.41);
    dist[i] = v;
  }

  const out = makeCv(w,h), og = readCtx(out), img = og.createImageData(w,h), D = img.data;
  const rgbCache = new Map();
  const put = (i, hex, a) => {
    let c = rgbCache.get(hex);
    if (!c){ c = [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]; rgbCache.set(hex,c); }
    D[i*4]=c[0]; D[i*4+1]=c[1]; D[i*4+2]=c[2]; D[i*4+3]=a;
  };
  const outRamp = ramp(mats.outline, {spread:.09, shift:10});

  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const i = y*w+x;
    if (id[i] < 0) continue;
    const m = mats[LAYERS[id[i]]];
    const d = dist[i];
    let step = 0;
    if (m.lit > 0 && d < RIM){
      // inward gradient of the distance field points away from the surface
      const gx = (dist[i + (x<w-1?1:0)] - dist[i - (x>0?1:0)]);
      const gy = (dist[i + (y<h-1?w:0)] - dist[i - (y>0?w:0)]);
      const len = Math.hypot(gx,gy) || 1;
      const nx = -gx/len, ny = -gy/len;                   // outward normal
      const lam = nx*LIGHT[0] + ny*LIGHT[1];
      step = Math.round(lam * (1 - d/RIM) * 2.6 * m.lit);
    }
    put(i, m.r[clamp(2 + step, 0, 4)], 255);
  }
  // selective outline: sample the material it hugs, brighten it on the lit side
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const i = y*w+x;
    if (id[i] >= 0) continue;
    let near = -1, ox = 0, oy = 0;
    if (x>0 && id[i-1]>=0){ near = id[i-1]; ox = 1; }
    else if (x<w-1 && id[i+1]>=0){ near = id[i+1]; ox = -1; }
    if (near < 0){
      if (y>0 && id[i-w]>=0){ near = id[i-w]; oy = 1; }
      else if (y<h-1 && id[i+w]>=0){ near = id[i+w]; oy = -1; }
    }
    if (near < 0) continue;
    const lam = ox*LIGHT[0] + oy*LIGHT[1];
    put(i, outRamp[clamp(1 + Math.round(lam*1.4), 0, 3)], 255);
  }
  og.putImageData(img,0,0);
  return out;
}

/* ==========================================================================
   SPECIES ART
   Anatomy follows current reconstructions: lipped jaws and a barrel torso on
   the tyrannosaur, oversized horn sheaths and jugal horns on the ceratopsian,
   a sixty-degree S-curved neck over a shoulder hump on the brachiosaur.
   Proportions are then pushed toward a toy: bigger skull, bigger eye, shorter
   snout, rounder body. Shapes are painted onto material layers, and the
   lighting pass in the colour module turns those layers into shaded pixels.
   ========================================================================== */

const BAKE_W = 232, BAKE_H = 210, BAKE_G = 196, BAKE_CX = 104;

const STAGE = [
  { key:'hatchling', label:'Hatchling', s:.44, head:1.62, snout:.58, neck:.44, limb:.68, tail:.54, horn:.14 },
  { key:'juvenile',  label:'Juvenile',  s:.64, head:1.38, snout:.76, neck:.68, limb:.83, tail:.76, horn:.48 },
  { key:'subadult',  label:'Subadult',  s:.83, head:1.18, snout:.90, neck:.87, limb:.93, tail:.90, horn:.80 },
  { key:'adult',     label:'Adult',     s:1.0, head:1.06, snout:1.00, neck:1.00, limb:1.00, tail:1.00, horn:1.00 }
];

/* --------------------------- gait and limbs -------------------------------
   The foot follows a stance/swing path against the ground, and the leg is
   solved with two-bone inverse kinematics. Bone lengths never change and a
   planted foot never slides, which is what stops a walk cycle looking rubbery.
   -------------------------------------------------------------------------- */
function gaitFoot(phase, stride, lift, duty){
  phase = ((phase % 1) + 1) % 1;
  if (phase < duty){                       // planted: starts ahead, slides back
    const t = phase / duty;
    return [stride * (-0.5 + t), 0];
  }
  const t = (phase - duty) / (1 - duty);   // airborne: swings from back to front
  return [stride * (0.5 - t), -lift * Math.sin(Math.PI * t)];
}
function limbIK(g, hx, hy, tx, ty, L1, L2, w, bend){
  const dx = tx - hx, dy = ty - hy;
  const raw = Math.hypot(dx, dy) || 0.001;
  const d = clamp(raw, Math.abs(L1 - L2) + 0.01, (L1 + L2) * 0.995);
  const ux = dx / raw, uy = dy / raw;
  const a = (L1*L1 - L2*L2 + d*d) / (2*d);
  const h = Math.sqrt(Math.max(0, L1*L1 - a*a));
  const kx = hx + ux*a - uy*h*bend, ky = hy + uy*a + ux*h*bend;
  const ax = hx + ux*d, ay = hy + uy*d;
  tube(g, [[hx,hy],[kx,ky]], [w, w*.64]);
  tube(g, [[kx,ky],[ax,ay]], [w*.64, w*.44]);
  return [ax, ay];
}
/* hy is the hip height above the ground line at y = 0, so the leg always reaches */
function legStep(g, hx, hy, phase, w, cfg, hornG){
  const len = Math.max(4, -hy);
  const mt = len * cfg.mt;
  if (cfg.thigh) oval(g, hx, hy + len*.17, w*.92, len*.25);
  const [ox, oy] = gaitFoot(phase, len*cfg.stride, len*cfg.lift, cfg.duty);
  const tx = hx + ox + len*(cfg.fwd||0), ty = oy;
  const ank = limbIK(g, hx, hy, tx + mt*cfg.back, ty - mt, (len-mt)/2*1.02, (len-mt)/2*1.02, w, cfg.bend);
  drawFoot(g, hornG, ank, tx, ty, w, cfg.foot || 'bird');
  return [tx, ty];
}
function drawFoot(g, hornG, ank, tx, ty, w, kind){
  if (kind === 'hoof'){
    // sauropod manus: the metacarpals stand in a vertical column and the whole
    // hand is a single hoof. No digits are visible in life, so none are drawn.
    tube(g, [[ank[0], ank[1]],[tx, ty - w*.44]], [w*.56, w*.60]);
    blob(g, [[tx - w*.32, ty - w*.52],[tx + w*.32, ty - w*.52],
             [tx + w*.36, ty - w*.10],[tx, ty - w*.03],[tx - w*.36, ty - w*.10]]);
    return;
  }
  if (kind === 'pad'){
    // sauropod pes: a wedge, deep at the heel where the fleshy pad sits and
    // sloping forward onto three claw-bearing inner toes
    tube(g, [[ank[0], ank[1]],[tx + w*.26, ty - w*.46]], [w*.50, w*.54]);
    blob(g, [[tx + w*.52, ty - w*.08],[tx + w*.60, ty - w*.40],[tx + w*.30, ty - w*.60],
             [tx - w*.16, ty - w*.44],[tx - w*.44, ty - w*.20],[tx - w*.40, ty - w*.03],
             [tx + w*.10, ty]]);
    if (hornG){
      blob(hornG, [[tx - w*.36, ty - w*.22],[tx - w*.58, ty - w*.10],[tx - w*.36, ty - w*.01]]);
      blob(hornG, [[tx - w*.20, ty - w*.30],[tx - w*.44, ty - w*.24],[tx - w*.24, ty - w*.12]]);
    }
    return;
  }
  if (kind === 'column'){
    // ceratopsian foot: short, broad and blunt-hooved
    tube(g, [[ank[0], ank[1]],[tx + w*.10, ty - w*.34]], [w*.50, w*.54]);
    blob(g, [[tx + w*.36, ty - w*.06],[tx + w*.40, ty - w*.34],[tx, ty - w*.46],
             [tx - w*.36, ty - w*.28],[tx - w*.38, ty - w*.02]]);
    if (hornG){
      blob(hornG, [[tx - w*.28, ty - w*.20],[tx - w*.46, ty - w*.08],[tx - w*.26, ty - w*.01]]);
      blob(hornG, [[tx - w*.08, ty - w*.26],[tx - w*.28, ty - w*.22],[tx - w*.10, ty - w*.10]]);
    }
    return;
  }
  tube(g, [[ank[0],ank[1]],[tx,ty]], [w*.46, w*.4]);
  oval(g, tx - w*.1, ty - w*.15, w*.56, w*.28);
}
function samplePath(pts, t){
  let total = 0; const seg = [];
  for (let i=0;i<pts.length-1;i++){ const d = Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]); seg.push(d); total += d; }
  let want = clamp(t,0,1) * total;
  for (let i=0;i<seg.length;i++){
    if (want <= seg[i] || i === seg.length-1){
      const u = seg[i] ? clamp(want/seg[i],0,1) : 0;
      return [lerp(pts[i][0], pts[i+1][0], u), lerp(pts[i][1], pts[i+1][1], u)];
    }
    want -= seg[i];
  }
  return pts[pts.length-1];
}
function toes(g, x, y, n, dir, size){
  for (let i=0;i<n;i++) oval(g, x + dir*i*size*1.7, y, size*.78, size*.55);
}
function eyeAt(M, x, y, r, state){
  if (state === 1){                                        // closed: a soft lid line
    tube(M.pupil, [[x-r*1.5,y-r*.1],[x,y+r*.45],[x+r*1.5,y-r*.1]], [r*.55,r*.6,r*.55]);
    return;
  }
  if (state === 2){                                        // squinting, pleased
    tube(M.pupil, [[x-r*1.4,y+r*.45],[x,y-r*.5],[x+r*1.4,y+r*.45]], [r*.55,r*.6,r*.55]);
    return;
  }
  oval(M.sclera, x, y, r*1.1, r*1.24);
  oval(M.pupil,  x - r*.12, y + r*.14, r*.66, r*.86);
  oval(M.glint,  x - r*.46, y - r*.44, r*.3, r*.3);
}

/* ------------------------------ hats -------------------------------------- */
const HAT_ART = {
  frond:  g => { g.fillStyle='#6f9c55'; g.fillRect(4,4,2,5); [[1,1],[3,0],[6,0],[8,1],[2,3],[7,3]].forEach(q=>g.fillRect(q[0],q[1],2,2)); },
  cap:    g => { g.fillStyle='#b08a4a'; g.fillRect(2,1,6,4); g.fillStyle='#8a6a36'; g.fillRect(0,5,10,2); },
  goggles:g => { g.fillStyle='#3a4d55'; g.fillRect(0,2,10,3); g.fillStyle='#9fd2e0'; g.fillRect(1,3,3,2); g.fillRect(6,3,3,2); },
  cone:   g => { g.fillStyle='#d95f7f'; g.fillRect(4,0,2,2); g.fillRect(3,2,4,2); g.fillRect(2,4,6,2); g.fillStyle='#5fb0a5'; g.fillRect(1,6,8,2); },
  hardhat:g => { g.fillStyle='#e0a92f'; g.fillRect(2,1,6,4); g.fillStyle='#c48c1c'; g.fillRect(0,5,10,2); g.fillRect(4,0,2,2); },
  crown:  g => { g.fillStyle='#d9a83f'; g.fillRect(0,0,2,3); g.fillRect(4,0,2,3); g.fillRect(8,0,2,3); g.fillRect(0,3,10,3); g.fillStyle='#c04848'; g.fillRect(4,4,2,2); }
};
function hatCanvas(id){
  const c = makeCv(12,11), g = readCtx(c);
  g.save(); g.translate(1,1); HAT_ART[id](g); g.restore();
  const d = g.getImageData(0,0,12,11), px = d.data, solid = new Uint8Array(12*11);
  for (let i=0;i<12*11;i++){ if (px[i*4+3] >= 118){ px[i*4+3] = 255; solid[i] = 1; } else px[i*4+3] = 0; }
  for (let y=0;y<11;y++) for (let x=0;x<12;x++){
    const i = y*12+x; if (solid[i]) continue;
    if ((x>0&&solid[i-1])||(x<11&&solid[i+1])||(y>0&&solid[i-12])||(y<10&&solid[i+12])){
      px[i*4]=0x24; px[i*4+1]=0x1d; px[i*4+2]=0x13; px[i*4+3]=255;
    }
  }
  g.putImageData(d,0,0);
  return c;

const HATS = {};
for (const k in HAT_ART) HATS[k] = hatCanvas(k);

/* ---------------------------- frame baking -------------------------------- */
const POSES = {
  idle:  [ {body:0, legPhase:0, tail:.2}, {body:1.3, legPhase:0, tail:-.2} ],
  walk:  [ {body:.2, legPhase:0,     tail:0},   {body:1.5, legPhase:1/6, tail:.43},
           {body:.7, legPhase:2/6,   tail:.43}, {body:.2, legPhase:3/6, tail:0},
           {body:1.5, legPhase:4/6,  tail:-.43},{body:.7, legPhase:5/6, tail:-.43} ],
  eat:   [ {body:0, legPhase:0, jaw:1, droop:.7, tail:.3}, {body:0, legPhase:0, jaw:.12, droop:.7, tail:-.1} ],
  sleep: [ {body:-2.5, legPhase:0, droop:1.5, tail:.1, eye:1} ],
  cheer: [ {body:5, legPhase:.5, jaw:.8, tail:.9, eye:2}, {body:0, legPhase:0, jaw:.35, tail:-.7, eye:2} ],
  sick:  [ {body:-1.5, legPhase:0, droop:1.1, tail:-.1, eye:1}, {body:-2.4, legPhase:0, droop:1.2, tail:0, eye:1} ]
};
const matCache = new Map();
function matsFor(spId, skinId){
  const key = spId + '|' + skinId;
  if (!matCache.has(key)){
    const k = skinOf(spId, skinId);
    matCache.set(key, buildMaterials(Object.assign({}, SPECIES[spId].spec, {
      skin:k.skin, belly:k.belly, crest:k.crest, mark:k.mark
    })));
  }
  return matCache.get(key);
}
const frameCache = new Map();
function frameOf(spId, stage, anim, idx, blinking, skinId){
  skinId = skinId || 'wild';
  const poses = POSES[anim] || POSES.idle;
  const pose = poses[idx % poses.length];
  const eye = pose.eye !== undefined ? pose.eye : (blinking ? 1 : 0);
  const key = spId+'|'+skinId+'|'+stage+'|'+anim+'|'+(idx%poses.length)+'|'+eye;
  if (frameCache.has(key)) return frameCache.get(key);

  const sp = SPECIES[spId], st = STAGE[stage], k = st.s * sp.scale;
  const canvases = [], M = {};
  for (const name of LAYERS){
    const c = makeCv(BAKE_W, BAKE_H), g = readCtx(c);
    g.fillStyle = '#000';
    g.translate(BAKE_CX, BAKE_G); g.scale(k, k);
    canvases.push(c); M[name] = g;
  }
  const P = Object.assign({stage, legPhase:0, body:0, jaw:0, tail:0, droop:0}, pose, {eye});
  const anchors = sp.draw(M, P);
  paintPattern(M.mark, skinOf(spId, skinId).pattern);

  const composed = composeSprite(canvases, matsFor(spId, skinId), BAKE_W, BAKE_H);
  const t = trim(composed);
  const conv = a => [BAKE_CX + a[0]*k - t.ox, BAKE_G + a[1]*k - t.oy];
  const out = {
    cv: t.cv, w: t.w, h: t.h,
    ox: BAKE_CX - t.ox, oy: BAKE_G - t.oy,
    eye: conv(anchors.eye), mouth: conv(anchors.mouth), hat: conv(anchors.hat),
    eyeR: (anchors.eyeR || 3) * k, k, hs: k * st.head
  };
  frameCache.set(key, out);
  return out;
}

/* Tyrannosaurus rex sprite
   Part of Paleopal. Load order matters; see build.py. */

const REX_SPEC = { skin:'#7e9c54', belly:'#b8bd80', crest:'#5b7940', horn:'#e9dfba',
                   mouth:'#8e4a45', outline:'#241d13' };
const REX_GAIT = { stride:.46, lift:.17, duty:.56, mt:.22, back:.34, bend:1, thigh:false, foot:'bird' };
function drawRex(M, P){
  const st = STAGE[P.stage];
  const hM = st.head, nM = st.neck, lM = st.limb, tM = st.tail;
  const bob = P.body, jaw = P.jaw||0, sw = P.tail||0, dr = P.droop||0;

  // skeleton landmarks. Hip is the acetabulum; everything else hangs off it.
  const hipX = 16,  hipY = -46*lM - bob;
  const backY = hipY - 24*lM, withX = -18, withY = hipY - 25*lM;
  const bellyY = hipY + 9*lM, throatY = hipY + 3*lM;
  const hx = withX - 26*nM - 4*hM, hy = withY - 10*nM - 2 + dr*9;
  const sM = st.snout;
  const sn = 25*hM*sM, hh = 14.5*hM;
  const T = d => hipX + d*tM;

  // far limb first, behind everything
  blob(M.far, [[hipX+9*lM, hipY-11*lM],[hipX+12*lM, hipY+4*lM],[hipX+2*lM, hipY+15*lM],
               [hipX-9*lM, hipY+13*lM],[hipX-13*lM, hipY-1*lM],[hipX-8*lM, hipY-11*lM]]);
  legStep(M.far, hipX-6, hipY+2, (P.legPhase+.5)%1, 14*lM, REX_GAIT);

  // one continuous mass from nape to tail tip: neck, ribcage, hips and tail
  const topLine = [[hx+11, hy-hh*.35],[withX, withY],[0, backY-1],[hipX+7, backY+1],[T(23), hipY-18*lM+sw*2]];
  blob(M.skin, [
    [hx+11, hy-hh*.35],                     // nape at the skull
    [withX, withY],                         // withers
    [0, backY-1],                           // back
    [hipX+7, backY+1],                      // over the hips
    [T(23), hipY-18*lM+sw*2],               // deep tail base
    [T(48), hipY-13*lM+sw*4],
    [T(72), hipY-7*lM+sw*6],                // tail tip
    [T(70), hipY-4*lM+sw*6],
    [T(43), hipY-1*lM+sw*4],
    [T(17), hipY+4*lM],
    [hipX-6, bellyY],                       // belly
    [-8, bellyY-1],
    [withX-7, throatY-2],                   // chest and throat
    [hx+9, hy+hh*.58]
  ]);

  // skull: deep behind the eye, tapering to a blunt muzzle
  blob(M.head, [[hx+13, hy-hh*.12],[hx+11, hy-hh*.96],[hx-sn*.34, hy-hh*1.03],
                [hx-sn*.86, hy-hh*.72],[hx-sn*1.0, hy-hh*.08],[hx-sn*.92, hy+hh*.24],
                [hx-sn*.45, hy+hh*.32],[hx+13, hy+hh*.36]]);
  // hinged lower jaw. Lips cover the teeth, so a shut mouth shows none of them
  M.head.save(); M.head.translate(hx+10, hy+hh*.14); M.head.rotate(jaw*.44);
  blob(M.head, [[3,-hh*.28],[-sn*.38,-hh*.3],[-sn*.94,-hh*.04],[-sn*.88,hh*.3],[-sn*.34,hh*.46],[3,hh*.4]]);
  M.head.restore();
  if (jaw > .06){
    M.mouth.save(); M.mouth.translate(hx+10, hy+hh*.14); M.mouth.rotate(jaw*.44);
    blob(M.mouth, [[0,-hh*.2],[-sn*.38,-hh*.22],[-sn*.8,-hh*.02],[-sn*.76,hh*.18],[-sn*.28,hh*.26],[0,hh*.22]]);
    M.mouth.restore();
    for (let i=0;i<4;i++) oval(M.horn, hx - sn*.2 - i*sn*.17, hy + hh*.14, Math.max(.8,1.2*hM), Math.max(1.1,2*hM));
  }

  const ex = hx - sn*.46, ey = hy - hh*.42;
  // lacrimal ridge above the eye, and the keratin row along the neck and back
  blob(M.crest, [[ex+7*hM, ey-hh*.32],[ex+1*hM, ey-hh*.66],[ex-7*hM, ey-hh*.5],[ex-6*hM, ey-hh*.26]]);
  for (let i=0;i<10;i++){
    const q = samplePath(topLine, .04 + i*.088);          // ride the actual back line
    oval(M.crest, q[0], q[1] + 1.6*lM, 2.3*lM, 1.4*lM);
  }
  oval(M.belly, -6, bellyY - 2*lM, 17*lM, 4*lM);
  oval(M.belly, hx - sn*.3, hy + hh*.26, sn*.3, hh*.16);

  // two-fingered hand, palm turned inward the way a theropod wrist actually sits
  const ax = withX + 9, ay = withY + 22*lM;
  tube(M.limb, [[ax,ay],[ax-11*lM,ay+11*lM],[ax-20*lM,ay+7*lM]], [10*lM, 7.2*lM, 5.4*lM]);
  toes(M.horn, ax-23*lM, ay+6*lM, 2, -1, Math.max(1.3, 2.3*lM));

  // near limb: a heavy drumstick over the femur, then shank and bird foot
  blob(M.limb, [[hipX+14*lM, hipY-12*lM],[hipX+16*lM, hipY+5*lM],[hipX+5*lM, hipY+18*lM],
                [hipX-8*lM, hipY+15*lM],[hipX-14*lM, hipY-1*lM],[hipX-9*lM, hipY-13*lM]]);
  const foot = legStep(M.limb, hipX, hipY, P.legPhase, 15*lM, REX_GAIT);
  toes(M.horn, foot[0]-9*lM, foot[1]-1, 3, -1, Math.max(1.2, 2.1*lM));

  eyeAt(M, ex, ey, 3.5*hM, P.eye);
  oval(M.mouth, hx - sn*.84, hy - hh*.34, Math.max(.8,1.2*hM), Math.max(.8,1.1*hM));

  return { eye:[ex,ey], eyeR:3.5*hM, mouth:[hx - sn*.82, hy + hh*.12],
           hat:[hx - sn*.16, hy - hh*1.02], top: hy - hh };
}


/* Triceratops horridus sprite

/* ----------------------------- Triceratops --------------------------------- */
const TRI_SPEC = { skin:'#ab7040', belly:'#ca9b64', crest:'#8a5228', horn:'#efe6c8',
                   mouth:'#7e3a30', outline:'#26190f' };
const TRI_HIND = { stride:.34, lift:.11, duty:.66, mt:.15, back:.2,  bend:1,  thigh:true,  foot:'column' };
const TRI_FORE = { stride:.32, lift:.10, duty:.66, mt:.15, back:-.1, bend:-1, thigh:false, foot:'column' };
function drawTrike(M, P){
  const st = STAGE[P.stage];
  const hM = st.head, nM = st.neck, lM = st.limb, tM = st.tail, hF = st.horn, sM = st.snout;
  const bob = P.body, sw = P.tail||0, dr = P.droop||0;

  const hipX = 24, hipY = -41*lM - bob;
  const shX = -12, shY = -38*lM - bob;
  const withY = hipY - 24*lM;                 // tall neural spines make a shoulder hump
  const backY = hipY - 20*lM, bellyY = hipY + 13*lM;
  const T = d => hipX + d*tM;

  legStep(M.far, hipX-7, hipY+2, (P.legPhase+.5)%1, 16*lM, TRI_HIND);
  legStep(M.far, shX-7,  shY+3,  (P.legPhase+.25)%1, 14.5*lM, TRI_FORE);

  // barrel body: deepest at the shoulder hump, dipping over the back, short tail
  blob(M.skin, [
    [shX-11, withY+6*lM],                     // nape, meeting the frill
    [shX,    withY],                          // shoulder hump
    [6,      backY-1],                        // back
    [hipX+3, backY+2],                        // hips
    [T(9),   hipY-16*lM+sw*2],                // hip bulge
    [T(21),  hipY-11*lM+sw*4],                // tail base
    [T(34),  hipY-4*lM+sw*6],                 // tail tip
    [T(32),  hipY-1*lM+sw*6],
    [T(16),  hipY+3*lM],
    [T(4),   hipY+8*lM],
    [hipX-4, bellyY],                         // belly
    [2,      bellyY+2*lM],
    [shX+2,  bellyY-1*lM],
    [shX-9,  hipY+2*lM]                       // throat
  ]);

  // frill: solid bone shield, tilted back, with epoccipital scallops on the rim
  const fx = shX - 15*nM - 4, fy = hipY - 14*lM - 8*nM + dr*4;
  const fRx = 17.5*hM*(.34+.66*hF), fRy = 20.5*hM*(.34+.66*hF);
  const rim = [];
  for (let i=0;i<=12;i++){                    // epoccipitals scallop the rim itself
    const a = Math.PI*1.20 + (Math.PI*1.28) * i/12;
    const r = (i % 2) ? 1.0 : .90;
    rim.push([fx + Math.cos(a)*fRx*r, fy + Math.sin(a)*fRy*r]);
  }
  rim.push([fx - fRx*.5, fy + fRy*.62], [fx - fRx*.95, fy - fRy*.15]);
  blob(M.head, rim);

  // skull: long, low and carried well forward of the frill
  const hx = fx - 19*hM*sM, hy = fy + 9*hM, sn = 21*hM*sM, hh = 10.5*hM;
  blob(M.head, [[hx+18*hM, hy-hh*1.15],[hx-sn*.42, hy-hh*1.2],[hx-sn*.94, hy-hh*.55],
                [hx-sn*1.02, hy+hh*.35],[hx-sn*.45, hy+hh*.95],[hx+18*hM, hy+hh*.9]]);
  // hooked rostral beak
  blob(M.horn, [[hx-sn*.84, hy-hh*.62],[hx-sn*1.36, hy-hh*.02],[hx-sn*1.2, hy+hh*.62],
                [hx-sn*.66, hy+hh*.74]]);
  const ex = hx - sn*.38, ey = hy - hh*.34;
  // brow horns: the keratin sheath ran past the bone core, so they are long
  tube(M.horn, [[ex+4*hM, ey-hh*.7],[ex-10*hM*hF, ey-(hh*.8+hh*1.15*hF)],
                [ex-24*hM*hF, ey-(hh*.85+hh*1.5*hF)]], [7.4*hM, 4.0*hM, 1.0*hM]);
  tube(M.horn, [[ex-4*hM, ey-hh*.78],[ex-17*hM*hF, ey-(hh*.7+hh*.85*hF)],
                [ex-31*hM*hF, ey-(hh*.7+hh*1.05*hF)]], [6.3*hM, 3.4*hM, .9*hM]);
  tube(M.horn, [[hx-sn*.76, hy-hh*.3],[hx-sn*.92, hy-hh*(.5+.55*hF)]], [4.4*hM, 1.3*hM]);
  blob(M.horn, [[hx-sn*.06, hy+hh*.5],[hx-sn*.34, hy+hh*.44],[hx-sn*.16, hy+hh*1.35]]); // jugal horn

  // low nubbin feature scales over the flank and tail base
  for (const q of [[-2,-10],[9,-13],[20,-11],[13,-5],[28,-8],[2,-4]])
    oval(M.crest, q[0], hipY + q[1]*lM, 1.7*lM, 1.2*lM);

  oval(M.belly, 6, bellyY - 3*lM, 22*lM, 5*lM);

  legStep(M.limb, hipX+2, hipY, P.legPhase, 18*lM, TRI_HIND, M.horn);
  legStep(M.limb, shX+4, shY+1, (P.legPhase+.75)%1, 16.5*lM, TRI_FORE, M.horn);

  eyeAt(M, ex, ey, 3.1*hM, P.eye);
  oval(M.mouth, hx - sn*.74, hy - hh*.12, Math.max(.8,1.2*hM), Math.max(.8,1*hM));

  return { eye:[ex,ey], eyeR:3.1*hM, mouth:[hx - sn*1.15, hy + hh*.25],
           hat:[fx - fRx*.1, fy - fRy*.95], top: fy - fRy };
}

/* ------------------------------ the egg choice -----------------------------
   Three places need the same row of eggs: the renderer draws it, the pointer
   handler hit-tests it, and the label strip under the stage names it. All
   three derive from SPECIES here, so adding a species is a registry edit and
   nothing else.

   Slots are centred on the canvas and spaced EGG_GAP apart, tightening once
   the row would otherwise run off the edges. The hit radius follows the gap so
   neighbouring eggs can never claim the same tap.
   -------------------------------------------------------------------------- */
const EGG_GAP = 66, EGG_MARGIN = 24, EGG_HIT = 20;
function eggChoices(){
  const ids = Object.keys(SPECIES), n = ids.length;
  const gap = n < 2 ? 0 : Math.min(EGG_GAP, (W - EGG_MARGIN*2) / (n - 1));
  const hit = n < 2 ? EGG_HIT : Math.min(EGG_HIT, gap/2);
  return ids.map((id, i) => ({ id, x: W/2 + (i - (n-1)/2) * gap, hit }));
}

/* patterns are drawn in local sprite units and masked to the body by the
   compositor, so they can be laid down as simple full-field shapes */
function paintPattern(g, kind){
  if (!kind || kind === 'none') return;
  if (kind === 'stripes'){
    for (let i=0;i<17;i++){
      const x = -110 + i*14;
      tube(g, [[x-5,-140],[x+3,-72],[x+10,4]], [5.5, 6.5, 4.5]);
    }
    return;
  }
  if (kind === 'spots'){
    for (let i=0;i<64;i++){
      const x = -110 + ((i*47) % 232);
      const y = -4 - ((i*61) % 132);
      oval(g, x, y, 3.6, 3.0);
    }
    return;
  }
  if (kind === 'speckle'){
    for (let i=0;i<170;i++){
      const x = -110 + ((i*29) % 232);
      const y = -2 - ((i*43) % 136);
      oval(g, x, y, 1.5, 1.3);
    }
    return;
  }
  if (kind === 'patches'){
    const pts = [[-66,-96],[-14,-74],[32,-100],[74,-64],[-44,-42],[12,-36],
                 [56,-28],[-80,-58],[92,-48],[-30,-112],[46,-120],[8,-58]];
    pts.forEach((q,i) => oval(g, q[0], q[1], 12 + (i%3)*5, 8 + (i%2)*5));
  }
}

const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
const mixHex = (a,b,t) => {
  const A = [1,3,5].map(i=>parseInt(a.slice(i,i+2),16)), B = [1,3,5].map(i=>parseInt(b.slice(i,i+2),16));
  return '#' + A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('');
};
const STARS = Array.from({length:54}, () => ({x:rnd(2,W-2), y:rnd(3,92), p:rnd(0,6.3), b:rnd(.4,1)}));
const MOTES = Array.from({length:14}, () => ({x:rnd(0,W), y:rnd(40,GROUND-6), vx:rnd(2,7), vy:rnd(-3,3), p:rnd(0,6.3)}));

/* --------------------------- baked backdrop -------------------------------- */
const bgCache = new Map();
function ridge(g, cfg){
  // integer-column heightfield: no antialiasing, so the silhouette stays crisp
  for (let x=0;x<W;x++){
    let h = cfg.base;
    for (const w of cfg.waves) h += Math.sin(x*w[0] + w[1]) * w[2];
    h = Math.round(h);
    g.fillStyle = cfg.col; g.fillRect(x, h, 1, GROUND - h + 2);
    g.fillStyle = cfg.lit; g.fillRect(x, h, 1, 1);
    let hn = cfg.base;
    for (const w of cfg.waves) hn += Math.sin((x+1)*w[0] + w[1]) * w[2];
    if (Math.round(hn) > h) g.fillRect(x, h, 1, 2);          // catch light on left faces
  }
}
function conifer(g, x, base, h, body, litc){
  g.fillStyle = '#2f2822';
  g.fillRect(x, base - Math.round(h*.2), 2, Math.round(h*.2));
  for (let k=0;k<3;k++){                                    // three tiers, each wider than the last
    const topY = Math.round(base - h + k*h*.26);
    const botY = Math.round(base - h + k*h*.26 + h*.40);
    const maxW = Math.round(h*.26 + k*h*.11);
    const rows = Math.max(2, botY - topY);
    for (let r=0;r<rows;r++){
      const wd = Math.max(1, Math.round(maxW * (r+1)/rows));
      g.fillStyle = body; g.fillRect(x - (wd>>1), topY + r, wd, 1);
      g.fillStyle = litc; g.fillRect(x - (wd>>1), topY + r, Math.max(1, wd*.4|0), 1);
    }
  }
}

function boulder(g, x, base, w, h, col, lit, shd){
  for (let i=0;i<h;i++){
    const t = i/h, wd = Math.round(w * (0.55 + 0.45*Math.sin((1-t)*Math.PI*0.5)));
    g.fillStyle = col; g.fillRect(x - (wd>>1), base - h + i, wd, 1);
    g.fillStyle = shd; g.fillRect(x + (wd>>1) - 2, base - h + i, 2, 1);
    if (i < 2){ g.fillStyle = lit; g.fillRect(x - (wd>>1) + 1, base - h + i, Math.max(1,wd-3), 1); }
  }
}
function fallenLog(g, x, base, len, col, lit, shd){
  g.fillStyle = col; g.fillRect(x, base - 5, len, 5);
  g.fillStyle = lit; g.fillRect(x, base - 5, len, 1);
  g.fillStyle = shd; g.fillRect(x, base - 1, len, 1);
  g.fillStyle = shd; g.fillRect(x + len - 3, base - 5, 3, 5);
  g.fillStyle = lit; g.fillRect(x + len - 2, base - 4, 1, 3);
  for (let i=6;i<len-6;i+=7){ g.fillStyle = shd; g.fillRect(x+i, base-4, 1, 3); }
}
function cycadPlant(g, x, base, h, col, lit, shd){
  g.fillStyle = shd; g.fillRect(x-2, base - h*.35, 5, h*.35);
  g.fillStyle = col; g.fillRect(x-1, base - h*.35, 3, h*.35);
  for (let a=0;a<5;a++){
    const ang = 0.35 + a*0.52, len = h * (0.72 - Math.abs(a-2)*0.08);
    const dir = a < 2 ? -1 : a > 2 ? 1 : 0;
    const dx = dir === 0 ? 0 : dir;
    for (let t=1;t<=7;t++){
      const u = t/7;
      const px = Math.round(x + dx * Math.cos(ang) * len * u * (dir?1:0));
      const py = Math.round(base - h*.35 - Math.sin(ang) * len * u + u*u*3);
      const lf = Math.max(1, Math.round(lerp(3.2, 1, u)));
      g.fillStyle = (t & 1) ? col : shd; g.fillRect(px - 1, py - lf, 2, lf*2);
      if (t < 3){ g.fillStyle = lit; g.fillRect(px - 1, py - lf, 2, 1); }
    }
  }
}
function reeds(g, x, base, n, col, lit){
  for (let i=0;i<n;i++){
    const rx = x + i*3, h = 6 + ((i*7)%5);
    g.fillStyle = col; g.fillRect(rx, base - h, 1, h);
    g.fillStyle = lit; g.fillRect(rx, base - h, 1, 2);
    g.fillStyle = col; g.fillRect(rx + (i&1?1:-1), base - h + 2, 1, 2);
  }
}
function bakeBg(phase){
  if (bgCache.has(phase)) return bgCache.get(phase);
  const S_ = SKY_SPECS[phase], c = makeCv(W,H), g = readCtx(c);
  const horizon = 108;

  // dithered sky: five steps with a 4x4 ordered dither across each boundary
  for (let y=0;y<horizon;y++){
    const f = (y/horizon) * 4, i = Math.floor(f), fr = f - i;
    const a = mixHex(S_.top, S_.low, clamp(i/4,0,1)), b = mixHex(S_.top, S_.low, clamp((i+1)/4,0,1));
    for (let x=0;x<W;x++){ g.fillStyle = (BAYER[y&3][x&3]/16 < fr) ? b : a; g.fillRect(x,y,1,1); }
  }
  g.fillStyle = S_.low; g.fillRect(0, horizon, W, GROUND - horizon + 2);

  // three depth planes, each flatter and lighter than the one in front
  ridge(g, { base:74, col: mixHex(S_.far, S_.low, .68), lit: mixHex(S_.far, S_.low, .78),
             waves:[[.019,.3,13],[.044,2.6,6]] });
  ridge(g, { base:84, col: mixHex(S_.far, S_.low, .42), lit: mixHex(S_.far, S_.low, .62),
             waves:[[.031,1.1,11],[.071,.4,5],[.013,2.2,7]] });
  // volcano on the far plane
  (function(){
    const px = 168, top = 52, half = 26;
    for (let x=px-half;x<=px+half;x++){
      const t = Math.abs(x-px)/half;
      let y = Math.round(top + Math.pow(t,1.3)*40 + 4);
      if (t < .26) y += 3 - Math.round(t*8);
      g.fillStyle = mixHex(S_.far, '#000000', .22); g.fillRect(x, y, 1, GROUND-y+2);
      g.fillStyle = x < px ? mixHex(S_.far,S_.low,.4) : mixHex(S_.far,'#000000',.42);
      g.fillRect(x, y, 1, 1);
    }
    g.fillStyle = '#c4562f'; g.fillRect(px-6, top+6, 12, 2);
    g.fillStyle = '#e8a44a'; g.fillRect(px-4, top+6, 6, 1);
    g.fillStyle = 'rgba(210,150,120,.20)'; g.fillRect(px-3, top-8, 6, 12); g.fillRect(px-1, top-15, 4, 8);
  })();
  ridge(g, { base:100, col: mixHex(S_.mid, S_.low, .2), lit: mixHex(S_.mid, S_.low, .45),
             waves:[[.048,3.4,8],[.11,1.7,3]] });

  // treeline sitting on the middle plane
  const treeBody = mixHex(S_.tree, S_.low, .18), treeLit = mixHex(S_.tree, S_.low, .38);
  [[14,26],[26,19],[38,23],[196,24],[208,17],[184,20],[120,15],[132,21]]
    .forEach(t => conifer(g, t[0], GROUND-2, t[1], treeBody, treeLit));

  // ground: lit grass edge, then dithered dirt
  const grassLit = mixHex(S_.grass, S_.low, .40), grassDark = mixHex(S_.grass, '#000000', .32);
  for (let x=0;x<W;x++){                                    // tufted, not a ruled line
    const t = (Math.sin(x*.7) > .3 ? 1 : 0) + (Math.sin(x*.31 + 2) > .55 ? 1 : 0) + (Math.sin(x*1.3+1) > .8 ? 1 : 0);
    g.fillStyle = S_.grass; g.fillRect(x, GROUND-1-t, 1, 5+t);
    g.fillStyle = grassLit; g.fillRect(x, GROUND-1-t, 1, 1);
  }
  g.fillStyle = grassDark; g.fillRect(0, GROUND+3, W, 1);
  const d0 = S_.dirt, d1 = mixHex(S_.dirt,'#000000',.22), d2 = mixHex(S_.dirt,S_.low,.22);
  for (let y=GROUND+4;y<H;y++) for (let x=0;x<W;x++){
    const t = (y-GROUND-4)/(H-GROUND-4);
    g.fillStyle = (BAYER[y&3][x&3]/16 < t*.75) ? d1 : d0; g.fillRect(x,y,1,1);
  }
  for (let i=0;i<26;i++){                                   // pebbles
    const x = (rnd(2,W-4))|0, y = (GROUND+6+rnd(0,H-GROUND-9))|0;
    g.fillStyle = d1; g.fillRect(x,y,2,2); g.fillStyle = d2; g.fillRect(x,y,1,1);
  }
  for (let i=0;i<16;i++){                                   // grass tufts
    const x = (rnd(4,W-4))|0, y = (GROUND+5+rnd(0,H-GROUND-10))|0;
    g.fillStyle = mixHex(S_.grass,'#000000',.15); g.fillRect(x,y,1,3);
    g.fillRect(x-1,y+1,1,2); g.fillRect(x+1,y+1,1,2);
  }
  // scenery on the ground line, behind where the animal walks
  const rockCol = mixHex(S_.mid,'#000000',.12), rockLit = mixHex(S_.mid, S_.low,.42), rockShd = mixHex(S_.mid,'#000000',.38);
  boulder(g, 68, GROUND+2, 17, 10, rockCol, rockLit, rockShd);
  boulder(g, 78, GROUND+2, 9, 6, rockCol, rockLit, rockShd);
  boulder(g, 133, GROUND+1, 12, 7, rockCol, rockLit, rockShd);
  const logCol = mixHex(S_.dirt,'#000000',.18), logLit = mixHex(S_.dirt, S_.low,.34), logShd = mixHex(S_.dirt,'#000000',.44);
  fallenLog(g, 92, GROUND+2, 34, logCol, logLit, logShd);
  const plCol = mixHex(S_.tree, S_.low, .22), plLit = mixHex(S_.tree, S_.low, .5), plShd = mixHex(S_.tree,'#000000',.35);
  cycadPlant(g, 32, GROUND+2, 22, plCol, plLit, plShd);
  cycadPlant(g, 116, GROUND+1, 15, plCol, plLit, plShd);
  cycadPlant(g, 190, GROUND+3, 19, plCol, plLit, plShd);
  // watering hole, cut into the dirt on the right
  const px0 = 142, px1 = 212;
  for (let x=px0;x<px1;x++){
    const t = (x-px0)/(px1-px0), dep = Math.round(Math.sin(t*Math.PI)*11);
    if (dep <= 1) continue;
    g.fillStyle = mixHex(S_.dirt,'#000000',.45); g.fillRect(x, GROUND+6, 1, 2);
    g.fillStyle = mixHex(S_.water,'#000000',.25); g.fillRect(x, GROUND+8, 1, dep);
    g.fillStyle = S_.water; g.fillRect(x, GROUND+8, 1, Math.max(1, dep-3));
    g.fillStyle = mixHex(S_.water,S_.low,.45); g.fillRect(x, GROUND+8, 1, 1);
  }
  reeds(g, 138, GROUND+8, 5, plShd, plLit);
  reeds(g, 205, GROUND+8, 4, plShd, plLit);
  bgCache.set(phase,c);
  return c;
}

/* --------------------------- moving backdrop ------------------------------- */
const CLOUDS = [
  { x:30,  y:16, v:1.9, w:26, h:5, near:1 }, { x:140, y:10, v:2.6, w:34, h:6, near:1 },
  { x:88,  y:32, v:1.1, w:20, h:4, near:0 }, { x:196, y:26, v:1.4, w:24, h:4, near:0 }
];
let flyer = null, flyerAt = 4000;
function drawSkyBody(g, phase, now){
  // the sun and moon ride an arc keyed to the player's actual clock
  const d = new Date(), h = d.getHours() + d.getMinutes()/60;
  const night = phase === 'night';
  const t = clamp(night ? ((h + 3) % 24) / 12 : (h - 6) / 13, 0, 1);
  const cx = 18 + t*(W-36), cy = 62 - Math.sin(clamp(t,0,1)*Math.PI) * 44;
  if (night){
    g.fillStyle = '#e8e6d2'; g.beginPath(); g.arc(cx, cy, 7, 0, 7); g.fill();
    g.fillStyle = SKY_SPECS[phase].top; g.beginPath(); g.arc(cx-3.5, cy-2.5, 6, 0, 7); g.fill();
  } else {
    g.fillStyle = phase === 'day' ? 'rgba(250,238,170,.35)' : 'rgba(250,200,140,.3)';
    g.beginPath(); g.arc(cx, cy, 12, 0, 7); g.fill();
    g.fillStyle = phase === 'day' ? '#f7ecac' : '#f6c887';
    g.beginPath(); g.arc(cx, cy, 7, 0, 7); g.fill();
  }
}
function drawClouds(g, phase, dt){
  const lit = phase === 'night' ? 'rgba(196,206,232,.30)' : 'rgba(248,246,234,.92)';
  const shd = phase === 'night' ? 'rgba(150,162,192,.26)' : 'rgba(214,214,204,.85)';
  for (const c of CLOUDS){
    c.x += c.v * dt/1000 * 4; if (c.x > W + c.w) c.x = -c.w;
    const x = Math.round(c.x), y = c.y, w = c.near ? c.w : c.w*.7, hh = c.near ? c.h : c.h-1;
    g.fillStyle = lit;
    g.fillRect(x - w/2, y, w, hh);
    g.fillRect(x - w/4, y - 3, w/2, 3);
    g.fillRect(x + w/6, y - 5, w/4, 2);
    g.fillStyle = shd; g.fillRect(x - w/2, y + hh - 1, w, 1);
  }
}
function drawFlyers(g, dt, now){
  if (!flyer && now > flyerAt){ flyer = { x:-14, y: rnd(18,54), v: rnd(26,40), p:0 }; }
  if (!flyer) return;
  flyer.x += flyer.v * dt/1000; flyer.p += dt;
  if (flyer.x > W + 14){ flyer = null; flyerAt = now + rnd(25,60)*1000; return; }
  const up = Math.sin(flyer.p/130) > 0;
  g.fillStyle = 'rgba(40,48,54,.7)';
  const x = Math.round(flyer.x), y = Math.round(flyer.y);
  g.fillRect(x-1, y, 3, 1);
  if (up){ g.fillRect(x-5, y-2, 4, 1); g.fillRect(x+2, y-2, 4, 1); }
  else   { g.fillRect(x-5, y+2, 4, 1); g.fillRect(x+2, y+2, 4, 1); }
}
function drawMotes(g, dt, phase){
  g.fillStyle = phase === 'night' ? 'rgba(190,205,235,.30)' : 'rgba(255,248,208,.45)';
  for (const m of MOTES){
    m.x += m.vx * dt/1000; m.y += Math.sin(m.p + performance.now()/1400) * .08;
    if (m.x > W+2) m.x = -2;
    g.fillRect(m.x|0, m.y|0, 1, 1);
  }
}
function drawWater(g, phase, now){
  const S_ = SKY_SPECS[phase];
  g.fillStyle = mixHex(S_.water, S_.low, .55);
  for (let i=0;i<4;i++){
    const y = GROUND + 10 + i*2;
    const span = Math.sin(((y - GROUND - 8)/11)) ;
    const half = Math.round(Math.sqrt(Math.max(0, 1 - Math.pow((y-GROUND-8)/12, 2))) * 30);
    if (half < 4) continue;
    const w = Math.round(6 + Math.abs(Math.sin(now/760 + i*1.7)) * (half - 4));
    const cx = 177 + Math.round(Math.sin(now/1100 + i*2.2) * (half - w) * .5);
    g.fillRect(cx - (w>>1), y, w, 1);
  }
}

/* ---------------------- foreground, drawn over the animal ------------------ */
const FRONDS = [ {x:-3, s:1.15, p:0, dir:1}, {x:W+3, s:1.0, p:2.4, dir:-1} ];
function drawFronds(g, phase, now){
  const S_ = SKY_SPECS[phase];
  const dark = mixHex(S_.tree,'#000000',.40), body = S_.tree, lit = mixHex(S_.tree,S_.low,.32);
  for (const f of FRONDS){
    for (let a=0;a<4;a++){
      const ang = 0.44 + a*0.36 + Math.sin(now/1300 + f.p + a*.7) * 0.05;
      const len = (44 - a*5) * f.s;
      const bx = f.x, by = H + 3;
      for (let t=1;t<=13;t++){
        const u = t/13;
        const x = Math.round(bx + f.dir * Math.cos(ang) * len * u);
        const y = Math.round(by - Math.sin(ang) * len * u + u*u*5);
        const lf = Math.max(1, Math.round(lerp(7, 1.5, u) * f.s));
        g.fillStyle = (t & 1) ? body : dark;
        g.fillRect(x - 1, y - lf, 2, lf*2);                  // leaflets across the spine
        g.fillStyle = dark; g.fillRect(x - 1, y - 1, 2, 2);  // spine
        if (t < 5){ g.fillStyle = lit; g.fillRect(x - 1, y - lf, 2, 2); }
      }
    }
  }
}

/* ------------------------------ particles --------------------------------- */
let parts = [];
function emit(type, x, y, n, opt){
  opt = opt || {};
  for (let i=0;i<n;i++) parts.push({
    type, x: x + rnd(-4,4), y: y + rnd(-3,3),
    vx: opt.vx !== undefined ? rnd(-opt.vx,opt.vx) : rnd(-9,9),
    vy: opt.vy !== undefined ? opt.vy + rnd(-6,6) : rnd(-26,-10),
    g: opt.g || 0, life: opt.life || rnd(700,1200), age: 0, col: opt.col
  });
}
function stepParts(dt){
  for (const p of parts){ p.age += dt; p.vy += p.g*dt/1000; p.x += p.vx*dt/1000; p.y += p.vy*dt/1000; }
  parts = parts.filter(p => p.age < p.life);
}
function heartPx(g,x,y,c){ g.fillStyle=c; g.fillRect(x+1,y,1,1); g.fillRect(x+3,y,1,1); g.fillRect(x,y+1,5,2); g.fillRect(x+1,y+3,3,1); g.fillRect(x+2,y+4,1,1); }
function drawParts(g){
  for (const p of parts){
    const x = Math.round(p.x), y = Math.round(p.y), fade = p.age/p.life;
    if (p.type==='heart'){ heartPx(g,x,y,'#e2697c'); g.fillStyle='#f0a3b0'; g.fillRect(x+1,y+1,1,1); }
    else if (p.type==='spark'){ g.fillStyle = p.col||'#fff6d8'; g.fillRect(x,y,2,2); g.fillStyle='#ffffff'; g.fillRect(x,y,1,1); }
    else if (p.type==='crumb'){ g.fillStyle = p.col||'#9b7a52'; g.fillRect(x,y,1,1); }
    else if (p.type==='bubbleZ'){ g.fillStyle='#dfe4f6'; g.fillRect(x,y,2,2); g.fillRect(x+2,y-2,2,2); }
    else if (p.type==='stink'){ g.fillStyle = fade<.5?'#7d9c5a':'#5d7a44'; g.fillRect(x,y,2,2); }
    else if (p.type==='note'){ g.fillStyle='#e8dcbf'; g.fillRect(x,y,2,4); g.fillRect(x+2,y-1,2,2); }
  }
}

function drawMess(g, x, y){

/* ==========================================================================
   CARE SIM
   Every number runs on wall-clock time, so an animal ages identically whether
   the tab is focused, backgrounded, or closed for two days. The keeper holds a
   nest of up to six animals; all of them age, only one is on screen.
   ========================================================================== */

/* The save is the product. A player's streak, their named animals and the time
   they put in all live in this one blob, so nothing here may drop it on the
   floor. SAVE_KEY keeps its historical name so existing installs still find
   their data; the version now travels inside the save, not in the key. */
const SAVE_VERSION = 2;
const SAVE_KEY = 'paleopal:save:2';
const BACKUP_KEY = 'paleopal:save:backup';
const MAX_PETS = 6;

  { id:'berry', name:'Ripe berries',cost:5,  fill:22, joy:6,  treat:false, note:'Sweet, small, gone in a second.' },

const NAMES = ['Pebble','Norbert','Tiny','Bonk','Fern','Cleo','Spike','Dot','Pip','Tank','Mochi','Juniper','Rust','Marrow','Basil','Willow','Grub','Tuck'];
const GROWTH_GATES = [20, 90, 240];      // minutes of well-cared-for time

/* sleep window, in local hours */
const BED_HOUR = 21, WAKE_HOUR = 6;
const ENERGY_AWAKE = 8.5, ENERGY_ASLEEP = 20;   // points per hour

let G = null, S = null;

function freshPet(){
  return {
    sp:null, name:'', born:0, growth:0, hat:null, face:null, owned:[], skin:'wild', skinsOwned:['wild'],
    needs:{ hunger:78, energy:88, hygiene:100, joy:70 },

    traits:{ appetite:0, tempo:0, social:0 },
    asleep:false, ills:[], treats:[], mess:[], log:[],
    nightAwake:0, petBank:0, stageSeen:0, messTimer:0
  };
