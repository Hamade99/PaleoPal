<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#1a1208">
<title>Paleopal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   PALEOPAL — the case
   The game lives inside one moulded, speckled dinosaur egg: a shell, a bone
   bezel, a recessed screen and five keys. All of it is CSS. The project ships
   no image assets and this file does not add any.

   Three rules hold the look together, and they are the whole difference
   between a designed object and a rendered one:

   1. ONE GRID. Every size, pad, radius and offset is a whole number of --px.
      The screen is 224 device pixels wide and snaps to a whole or half
      multiple of that, so the case and the world it contains share a grid.

   2. ONE SURFACE, ONE EDGE. Each material is a flat fill with a single hard
      edge and at most one highlight line. The first pass had gradients,
      inset highlights, drop shadows, a glare sheet and a page vignette all
      running at once at similar strength, which is what makes a thing read as
      rendered rather than moulded.

   3. NOTHING PERFECTLY SYMMETRICAL. Moulded plastic has a seam, a gate mark
      and a maker's stamp, and its decoration is cast, not laid out. The
      osteoderms are irregular, the brand sits off centre against the seam,
      and the four screws are not four of the same screw.
   ========================================================================== */
:root{
  /* the grid. Everything in the case is a multiple of this. */
  --px:4px;
  --lcd-w:448px;                     /* set by JS to a whole or half multiple of 224 */

  /* Screen side. The canvas art is tuned to these, so they do not move. */
  --bg:#0e1417; --deep:#141d21; --panel:#1b262a; --line:#2b3a3f;
  --bone:#e9e1cb; --dim:#8fa39a; --ink:#101a18;
  --moss:#8cb765; --ochre:#e0ac48; --rust:#cf6a44; --sky:#7fb2c9;

  /* Case side. Two families and no more: a warm sandstone plastic for the
     shell and a cool grey-green for everything that is not the shell. The
     first pass ran one saturated amber through the shell, the wallet, the
     buttons and the bezel, so nothing had anything to sit against. */
  --shell:#c08f43;                   /* the moulding */
  --shell-hi:#dcb060;                /* the one highlight line, top edges */
  --shell-lo:#8d6527;                /* the one shade, bottom edges */
  --shell-edge:#42290a;              /* the hard outline, used everywhere */
  --scute:#a9782f;
  --bezel:#d8ccac;                   /* bone */
  --bezel-lo:#a08e69;
  --bezel-edge:#5d5138;
  --key:#2f6b49;                     /* jungle green, the one accent */
  --key-hi:#448a60;
  --key-lo:#1b432e;
  --key-edge:#0c2419;
  --stamp:rgba(52,32,6,.55);         /* moulded lettering */

  --safe:env(safe-area-inset-bottom,0px);

  /* Cast-in speckle. Irregular on purpose: an even field of dots reads as
     noise, a cast one reads as material. */
  --speckles:
    radial-gradient(2px 2px at 17px 23px,rgba(74,44,10,.55) 98%,transparent),
    radial-gradient(1px 1px at 61px 70px,rgba(74,44,10,.45) 98%,transparent),
    radial-gradient(3px 3px at 40px 11px,rgba(120,80,30,.40) 98%,transparent),
    radial-gradient(1px 1px at 88px 47px,rgba(74,44,10,.50) 98%,transparent),
    radial-gradient(2px 2px at 12px 96px,rgba(120,80,30,.38) 98%,transparent),
    radial-gradient(1px 1px at 71px 33px,rgba(74,44,10,.42) 98%,transparent),
    radial-gradient(2px 2px at 34px 58px,rgba(120,80,30,.44) 98%,transparent);
  --speckle-size:97px 97px,97px 97px,131px 131px,131px 131px,73px 73px,73px 73px,113px 113px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  /* One flat ground. The radial vignette was doing the work a photograph does,
     not the work a background does. */
  background:#1a1208;
  color:var(--bone);
  font-family:'Pixelify Sans',ui-monospace,monospace;
  display:flex;align-items:flex-start;justify-content:center;
  overscroll-behavior:none;
}
#app{width:100%;max-width:520px;margin:auto 0;
  padding:calc(var(--px)*10) calc(var(--px)*3) calc(var(--px)*7 + var(--safe));position:relative}

/* ---------- the shell ---------- */
.shell{
  position:relative;
  padding:calc(var(--px)*13) calc(var(--px)*5) calc(var(--px)*10);
  border-radius:50% 50% 44% 44% / 20% 20% 15% 15%;
  background-image:var(--speckles),linear-gradient(var(--shell) 0 100%);
  background-size:var(--speckle-size),100% 100%;
  border:2px solid var(--shell-edge);
  /* one highlight along the crown, one shade along the base, one shadow under
     the whole thing. Nothing else. */
  box-shadow:
    inset 0 3px 0 var(--shell-hi),
    inset 0 -5px 0 var(--shell-lo),
    0 calc(var(--px)*2) 0 #33200a;
}
/* the mould seam, and the gate mark it runs to */
.shell::before{
  content:"";position:absolute;left:50%;top:calc(var(--px)*-1);bottom:calc(var(--px)*-1);
  width:1px;background:rgba(66,41,10,.30);pointer-events:none;
  transform:translateX(calc(var(--px)*9));
}
.shell::after{
  content:"";position:absolute;right:calc(var(--px)*7);bottom:calc(var(--px)*3);
  width:calc(var(--px)*2);height:calc(var(--px)*2);border-radius:50%;
  background:rgba(66,41,10,.22);box-shadow:0 1px 0 rgba(255,236,196,.25);
}

/* Osteoderms over the crown.

   The shell's top edge is an ellipse — `border-radius: 50% / 20%` — whose
   radii both depend on the rendered size of the case, so where the crown
   actually is at a given x is not a number this file can know. Every plate
   used to carry a hand-typed `bottom`, fitted by eye at one window size: the
   arc was twice as steep as the real one, the row ran from 0 to 203 inside a
   224-wide box so the whole ridge sat ten pixels left of the crown it was
   supposed to be growing out of, and the outer plates floated off the shell.

   The look stays here and the arithmetic goes to `fitCrown()` in 08-ui.js.
   Each plate declares where it sits along the ridge and how big it is; the
   function puts it on the real curve and turns it normal to the surface.
   Nothing is mirrored and no two are the same width — a symmetrical row of
   identical plates is the most machine-made thing a case can do. */
.scutes{position:absolute;left:0;right:0;top:0;height:0;pointer-events:none}
.scutes i{position:absolute;
  left:calc(50% + var(--x));width:var(--w);height:var(--h);
  margin-left:calc(var(--w) / -2);
  transform-origin:50% 100%;
  background:var(--scute);
  border:2px solid var(--shell-edge);border-bottom:0;
  border-radius:62% 62% 0 0 / 90% 90% 0 0;
  box-shadow:inset 0 2px 0 var(--shell-hi)}
/* every size a multiple of --px, no two the same, spacing uneven. Broad and
   low rather than tall and narrow: at the first pass they were parallel-sided
   and read as a row of thumbs standing on the case. */
.scutes i:nth-child(1){--x:-104px; --w:12px; --h:8px}
.scutes i:nth-child(2){--x:-76px;  --w:20px; --h:16px}
.scutes i:nth-child(3){--x:-44px;  --w:16px; --h:16px}
.scutes i:nth-child(4){--x:-16px;  --w:24px; --h:20px}   /* tallest, left of centre */
.scutes i:nth-child(5){--x:12px;   --w:20px; --h:20px}
.scutes i:nth-child(6){--x:48px;   --w:20px; --h:12px}
.scutes i:nth-child(7){--x:88px;   --w:16px; --h:8px}

/* ---------- faceplate ---------- */
.shellhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:calc(var(--px)*2);padding:0 calc(var(--px)*2);margin-bottom:calc(var(--px)*3)}
/* the brand is moulded lettering, and it sits against the seam rather than in
   the middle of the shell */
.brand{
  flex:0 0 100%;text-align:center;position:relative;
  font-weight:700;font-size:calc(var(--px)*5);letter-spacing:2px;
  color:var(--stamp);text-shadow:0 1px 0 rgba(255,236,196,.45);
  padding-left:calc(var(--px)*9);
}
.brand span{color:#22503a}
.brand .rivet{position:absolute;left:50%;bottom:calc(var(--px)*-2);
  transform:translateX(calc(-50% + var(--px)*4.5));
  width:calc(var(--px)*11);height:2px;background:rgba(66,41,10,.30);
  box-shadow:0 1px 0 rgba(255,236,196,.35)}
.tools{display:flex;align-items:center;gap:calc(var(--px)*2);margin-top:calc(var(--px)*2)}
.wallet{
  display:flex;align-items:center;gap:calc(var(--px)*1.5);
  font-size:calc(var(--px)*4);color:var(--ochre);
  background:#141d21;border:2px solid var(--shell-edge);
  border-radius:calc(var(--px)*2);
  padding:calc(var(--px)*1) calc(var(--px)*2.5) calc(var(--px)*0.75);
  box-shadow:inset 0 2px 0 #0a1013
}
#coinArt{display:flex}

/* Small keys on the faceplate. Same moulding as the big ones underneath, so
   there is one button in this design rather than three. */
.iconbtn{
  background:var(--shell);
  border:2px solid var(--shell-edge);color:var(--stamp);
  width:calc(var(--px)*9);height:calc(var(--px)*9);
  border-radius:calc(var(--px)*2);cursor:pointer;
  font-size:calc(var(--px)*4);font-family:inherit;display:grid;place-items:center;
  box-shadow:inset 0 2px 0 var(--shell-hi),inset 0 -2px 0 var(--shell-lo),
             0 calc(var(--px)*1) 0 var(--shell-edge)
}
.iconbtn:hover{background:var(--shell-hi)}
.iconbtn:active,.iconbtn.down{transform:translateY(calc(var(--px)*1));
  box-shadow:inset 0 2px 0 var(--shell-lo)}
.iconbtn.off{filter:saturate(.35) brightness(.85)}
.iconbtn.dev{background:var(--key);border-color:var(--key-edge);color:#dff0e4;
  box-shadow:inset 0 2px 0 var(--key-hi),inset 0 -2px 0 var(--key-lo),
             0 calc(var(--px)*1) 0 var(--key-edge)}
.iconbtn.dev:hover{background:var(--key-hi)}
#btnNest{position:relative}
#nestCount{position:absolute;right:calc(var(--px)*-1);top:calc(var(--px)*-1);
  min-width:calc(var(--px)*4);height:calc(var(--px)*4);border-radius:calc(var(--px)*2);
  background:var(--rust);color:#fff;font-size:calc(var(--px)*2.5);
  line-height:calc(var(--px)*3.5);text-align:center;font-style:normal;
  border:1.5px solid var(--shell-edge)}
#nestCount:empty{display:none}

/* ---------- bone bezel ---------- */
.bezel{
  position:relative;border-radius:calc(var(--px)*5);padding:calc(var(--px)*3);
  background:var(--bezel);
  border:2px solid var(--bezel-edge);
  box-shadow:inset 0 2px 0 #f2ead2,inset 0 -3px 0 var(--bezel-lo),
             0 calc(var(--px)*1) 0 rgba(66,41,10,.5)
}
/* Four fixings, not four of the same screw: two slotted, one cross, one plug.
   Nobody reads them individually and everybody reads the difference. */
.screw{position:absolute;width:calc(var(--px)*2);height:calc(var(--px)*2);border-radius:50%;
  background:#b9aa85;box-shadow:inset 0 0 0 1px rgba(80,66,38,.7)}
.screw::after{content:"";position:absolute;left:1px;top:calc(50% - .5px);
  width:calc(100% - 2px);height:1px;background:rgba(70,58,32,.85)}
.screw.tr::before{content:"";position:absolute;top:1px;left:calc(50% - .5px);
  width:1px;height:calc(100% - 2px);background:rgba(70,58,32,.85)}
.screw.br::after{display:none}
.screw.tl{left:calc(var(--px)*1.5);top:calc(var(--px)*1.5)}
.screw.tr{right:calc(var(--px)*1.5);top:calc(var(--px)*1.5)}
.screw.bl{left:calc(var(--px)*1.5);bottom:calc(var(--px)*1.5)}
.screw.br{right:calc(var(--px)*1.5);bottom:calc(var(--px)*1.5)}

.screen{
  border-radius:calc(var(--px)*3);padding:calc(var(--px)*2.5);
  background:var(--bg);
  border:2px solid #05090a;
  box-shadow:inset 0 2px 0 #05090a
}

/* ---------- identity ---------- */
.ident{display:flex;align-items:baseline;gap:calc(var(--px)*2);flex-wrap:wrap;
  margin-bottom:calc(var(--px)*2)}
.dname{font-size:calc(var(--px)*5);line-height:1;cursor:pointer;
  border-bottom:1px dashed transparent;color:var(--bone)}
.dname:hover{border-bottom-color:var(--line)}
.dsub{font-size:calc(var(--px)*3);color:var(--dim)}
#nameEdit{font:inherit;font-size:calc(var(--px)*5);background:var(--panel);color:var(--bone);
  border:1px solid var(--line);border-radius:calc(var(--px)*1);
  padding:1px calc(var(--px)*1.5);width:calc(var(--px)*38)}

/* ---------- needs: the classic icon strip ---------- */
.needs{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--px)*1.5);
  margin-bottom:calc(var(--px)*2.5)}
.need{background:var(--deep);border:1px solid var(--line);
  padding:calc(var(--px)*1.25) calc(var(--px)*1.5) calc(var(--px)*1.5);
  display:flex;flex-direction:column;gap:calc(var(--px)*1)}
.need .cap{display:flex;align-items:center;gap:calc(var(--px)*1);min-height:calc(var(--px)*3.5)}
.need .cap canvas{image-rendering:pixelated;object-fit:contain;
  width:calc(var(--px)*3.5);height:calc(var(--px)*3.5);flex:0 0 calc(var(--px)*3.5)}
.need b{font-weight:500;font-size:calc(var(--px)*2.5);color:var(--dim);letter-spacing:.5px}
/* ten hard cells behind a black grid, square corners */
.track{position:relative;height:calc(var(--px)*2.5);background:#05090a;border:1px solid #000;
  overflow:hidden}
.fill{height:100%;width:50%;transition:width .45s linear,background .4s}
.seg{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#05090a calc(10% - 2px) 10%)}
.need.low b{color:var(--rust)}
.need.low{border-color:#6d3527}

/* ---------- the glass ---------- */
.stage{position:relative;display:flex;flex-direction:column;align-items:center}
/* The screen is 224 device pixels across and only ever shown at a whole or
   half multiple of that, set by fitScreen(). At an arbitrary fraction the
   pixel grid of the world came out uneven against the grid of the case, which
   is visible on everything with a one-pixel line in it. */
.lcd{position:relative;width:var(--lcd-w);max-width:100%;
  box-shadow:0 0 0 2px #05090a,0 0 0 3px rgba(140,183,101,.14)}
canvas#scene{display:block;width:100%;height:auto;image-rendering:pixelated;
  touch-action:none;cursor:pointer}
.lamp{position:absolute;right:0;bottom:calc(var(--px)*-2.5);
  width:calc(var(--px)*1.5);height:calc(var(--px)*1.5);border-radius:50%;background:var(--moss)}
.lamp.rest{background:var(--sky)}
.lamp.bad{background:var(--rust)}

.bubble{
  position:absolute;left:50%;top:calc(var(--px)*8);transform:translate(-50%,-4px);
  background:var(--bone);color:var(--ink);font-size:calc(var(--px)*3);
  padding:calc(var(--px)*1.5) calc(var(--px)*2.5);max-width:86%;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;line-height:1.3;
  border:2px solid var(--ink);z-index:2
}
.bubble.on{opacity:1;transform:translate(-50%,0)}
.picks span{position:absolute;bottom:calc(var(--px)*3.5);transform:translateX(-50%);
  text-align:center;font-size:calc(var(--px)*2.75);color:#b9c4bd;line-height:1.35;
  white-space:nowrap;background:rgba(10,18,16,.85);border:1px solid rgba(90,116,104,.55);
  padding:calc(var(--px)*0.75) calc(var(--px)*1.75)}
.picks b{display:block;font-size:calc(var(--px)*3);color:var(--bone);letter-spacing:.3px}
.badge{position:absolute;left:calc(var(--px)*1);top:calc(var(--px)*1);right:calc(var(--px)*1);
  display:flex;gap:calc(var(--px)*1);flex-wrap:wrap}
.tag{background:rgba(10,18,16,.88);border:1px solid #3a4d45;color:var(--bone);
  font-size:calc(var(--px)*2.5);padding:1px calc(var(--px)*1.5);
  display:flex;align-items:center;gap:calc(var(--px)*1);line-height:1.5}
.tag.warn{border-color:#8a4130;color:#f5c3ad;background:rgba(48,17,9,.88)}
.dot{width:calc(var(--px)*1.25);height:calc(var(--px)*1.25);border-radius:50%;background:var(--moss)}
.tag.warn .dot{background:var(--rust)}

/* ---------- mood strip ---------- */
.moodrow{display:flex;align-items:center;justify-content:space-between;
  gap:calc(var(--px)*2.5);margin:calc(var(--px)*2.5) 0 0}
.mood{font-size:calc(var(--px)*3.25);color:var(--bone);line-height:1.35}
.mood em{font-style:normal;color:var(--dim)}
.bondwrap{display:flex;align-items:center;gap:calc(var(--px)*1.5);font-size:calc(var(--px)*2.75);
  color:var(--dim);flex:0 0 auto}
.bondwrap canvas{image-rendering:pixelated}

/* ---------- the five keys ---------- */
.keys{padding-top:calc(var(--px)*4)}
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--px)*2)}
.act{
  background:var(--key);
  border:2px solid var(--key-edge);color:#dff0e4;
  border-radius:calc(var(--px)*3);min-height:calc(var(--px)*16);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--px)*1);
  font-family:inherit;font-size:calc(var(--px)*3);letter-spacing:.4px;cursor:pointer;
  position:relative;padding:calc(var(--px)*1.5) calc(var(--px)*0.5);
  box-shadow:inset 0 3px 0 var(--key-hi),inset 0 -3px 0 var(--key-lo),
             0 calc(var(--px)*1.5) 0 var(--key-edge)
}
.act:hover{background:var(--key-hi)}
/* A key that opened a screen stays pressed, the way a latching key does. */
.act:active,.act.down{transform:translateY(calc(var(--px)*1.5));
  box-shadow:inset 0 3px 0 var(--key-lo)}
/* A fixed square slot, and the sprite is fitted inside it whatever its shape.
   Two earlier versions of this rule each handled one axis and ignored the
   other: `width` and `height` both set squashed anything that was not square,
   and driving the height alone let a wide sprite grow sideways out of the
   button. `contain` scales by whichever axis runs out first and centres what
   is left over, so an icon can be drawn any size or shape and lands in the
   same box as the other four.

   Seven rather than six because pixCanvas returns a canvas two pixels larger
   than the art, and 14 into 28 is a clean doubling where 14 into 24 is not.
   The button has the room: its min-height is 16 and its contents come to
   about 14. */
.act .ico{display:flex;width:calc(var(--px)*7);height:calc(var(--px)*7);
  align-items:center;justify-content:center}
.act .ico canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.act[disabled]{opacity:.35;cursor:default;transform:none;filter:grayscale(.5);
  box-shadow:0 calc(var(--px)*1.5) 0 var(--key-edge)}
.act .nub{position:absolute;top:calc(var(--px)*1);right:calc(var(--px)*1.5);
  width:calc(var(--px)*2);height:calc(var(--px)*2);border-radius:50%;
  background:var(--rust);border:1px solid #40140a}

/* moulded nameplate and speaker slots */
.plate{display:flex;align-items:center;justify-content:center;gap:calc(var(--px)*2);
  margin-top:calc(var(--px)*4);
  font-size:calc(var(--px)*2.75);letter-spacing:2.4px;color:var(--stamp);
  text-shadow:0 1px 0 rgba(255,240,204,.5)}
.grille{width:calc(var(--px)*8);height:calc(var(--px)*2);
  background:repeating-linear-gradient(90deg,rgba(66,41,10,.34) 0 2px,transparent 2px 5px);
  box-shadow:0 1px 0 rgba(255,236,196,.4)}

/* ---------- the panels that stayed in the DOM ----------
   Only the dossier, the developer harness and the two notices. Everything a
   player does to the animal happens on the glass; these are for reading. */
.scrim{position:fixed;inset:0;background:rgba(10,6,2,.75);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,102%);
  width:100%;max-width:520px;background:var(--deep);
  border:2px solid var(--bezel-edge);border-bottom:0;
  border-radius:calc(var(--px)*4) calc(var(--px)*4) 0 0;
  padding:calc(var(--px)*3) calc(var(--px)*3) calc(var(--px)*4 + var(--safe));z-index:6;
  transition:transform .26s cubic-bezier(.2,.9,.3,1);max-height:84vh;overflow-y:auto
}
.sheet.on{transform:translate(-50%,0)}
.sheet.dock{max-height:52vh}
@media (min-width:860px){
  .sheet.dock{
    left:auto;right:0;top:0;bottom:0;width:calc(var(--px)*90);max-width:38vw;
    max-height:100vh;transform:translateX(104%);
    border-radius:calc(var(--px)*4) 0 0 calc(var(--px)*4);
    border:2px solid var(--bezel-edge);border-right:0;padding-top:calc(var(--px)*4)
  }
  .sheet.dock.on{transform:translateX(0)}
  .sheet.dock .grip{display:none}
}
.sheet h2{font-size:calc(var(--px)*5);font-weight:700;margin-bottom:2px;color:var(--bone)}
.sheet p.lede{font-size:calc(var(--px)*3.25);color:var(--dim);margin-bottom:calc(var(--px)*3);
  line-height:1.5}
.grip{width:calc(var(--px)*11);height:calc(var(--px)*1.25);background:var(--bezel-lo);
  margin:0 auto calc(var(--px)*3)}
.row{
  display:flex;align-items:center;gap:calc(var(--px)*3);width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);color:var(--bone);
  border-radius:calc(var(--px)*2);padding:calc(var(--px)*2.5) calc(var(--px)*3);
  margin-bottom:calc(var(--px)*1.75);cursor:pointer;font:inherit;
  box-shadow:0 calc(var(--px)*0.75) 0 #0b1214
}
.row:hover{border-color:#3d5158}
.row:active{transform:translateY(calc(var(--px)*0.75));box-shadow:none}
.row[disabled]{opacity:.4;cursor:default;box-shadow:none;transform:none}
.row .art{width:calc(var(--px)*7);height:calc(var(--px)*7);flex:0 0 calc(var(--px)*7);
  display:grid;place-items:center;overflow:hidden}
.row .art canvas{image-rendering:pixelated;object-fit:contain;

<script>
'use strict';
/* ==========================================================================
   PALEOPAL — a pocket dinosaur care sim
   Sections: core → sprites → species → world → sim → render → ui
   ========================================================================== */

const W = 224, H = 168, GROUND = 140;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;
const rnd   = (a,b) => a + Math.random()*(b-a);
const pick  = a => a[(Math.random()*a.length)|0];
const $     = id => document.getElementById(id);
const HOUR  = 3600e3, MIN = 60e3;

/* ---------- storage: works as artifact, as a file, and inside a webview ---- */
const Store = {
  async get(k){
    if (window.storage) { const result = await window.storage.get(k); return result ? result.value : null; }
    return localStorage.getItem(k);
  },
  async set(k,v){
    if (window.storage) return window.storage.set(k,v);
    localStorage.setItem(k,v);
  },
  async del(k){
    if (window.storage) return window.storage.delete(k);
    localStorage.removeItem(k);
  }
};

/* ---------- audio ---------- */
let AC = null;
function tone(f, dur, type, vol, delay, slide){
  if (!G || !G.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime + (delay||0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(28, f + slide), t + dur);
    g.gain.setValueAtTime(vol || .06, t);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + .04);
  }catch(e){}
}
const SFX = {
  chomp:()=>{tone(200,.06,'square',.07);tone(140,.08,'square',.07,.06);},
  coin :()=>{tone(880,.06,'square',.05);tone(1320,.09,'square',.05,.06);},
  purr :()=>{tone(300,.14,'sine',.05,0,90);},
  crack:()=>tone(130,.07,'sawtooth',.09,0,-45),
  hatch:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.13,'square',.06,i*.1)),
  bonk :()=>tone(95,.15,'square',.09,0,-45),
  wash :()=>tone(420,.14,'triangle',.06,0,520),
  yawn :()=>tone(480,.42,'sine',.05,0,-300),
  roar :()=>{tone(72,.5,'sawtooth',.11,0,-32);tone(54,.55,'square',.08,.05,-22);},
  pop  :()=>tone(340,.05,'triangle',.07),
  sneeze:()=>{tone(700,.05,'square',.05);tone(240,.16,'sawtooth',.08,.05,-120);}
};

/* ==========================================================================
   SPRITE PIPELINE
   Shapes are drawn as smooth paths on an offscreen canvas, then hard-quantised
   (alpha threshold + palette snap) and given a dilated outline. That gives real
   pixel art with correct anatomy instead of hand-typed ASCII blobs.
   ========================================================================== */

function makeCv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function readCtx(c){ return c.getContext('2d', { willReadFrequently:true }); }
const article = w => /^[aeiou]/i.test(w) ? 'an ' : 'a ';
/* the copy is written out in words, so counts that appear in a sentence are too */
const NUM_WORD = ['No','One','Two','Three','Four','Five','Six','Seven','Eight'];
const numWord = n => NUM_WORD[n] || String(n);

/* tapered tube through a centreline — the workhorse for necks, tails, limbs */
function tube(g, pts, widths, col){
  const n = pts.length;
  const left = [], right = [];
  for (let i=0;i<n;i++){
    const p = pts[i];
    const a = pts[Math.max(0,i-1)], b = pts[Math.min(n-1,i+1)];
    let dx = b[0]-a[0], dy = b[1]-a[1];
    const L = Math.hypot(dx,dy) || 1; dx/=L; dy/=L;
    const w = widths[i]/2;
    left.push([p[0]-dy*w, p[1]+dx*w]);
    right.push([p[0]+dy*w, p[1]-dx*w]);
  }
  if (col) g.fillStyle = col;
  g.beginPath();
  curveThrough(g, left, true);
  const rr = right.slice().reverse();
  for (let i=0;i<rr.length;i++) g.lineTo(rr[i][0], rr[i][1]);
  g.closePath(); g.fill();
  // round the caps so tips read as tips, not chisels
  g.beginPath(); g.arc(pts[0][0],pts[0][1],Math.max(.5,widths[0]/2),0,7); g.fill();
  g.beginPath(); g.arc(pts[n-1][0],pts[n-1][1],Math.max(.5,widths[n-1]/2),0,7); g.fill();
}
function curveThrough(g, p, start){
  if (start) g.moveTo(p[0][0], p[0][1]);
  for (let i=0;i<p.length-1;i++){
    const a=p[i], b=p[i+1];
    const prev=p[Math.max(0,i-1)], next=p[Math.min(p.length-1,i+2)];
    const c1=[a[0]+(b[0]-prev[0])/6, a[1]+(b[1]-prev[1])/6];
    const c2=[b[0]-(next[0]-a[0])/6, b[1]-(next[1]-a[1])/6];
    g.bezierCurveTo(c1[0],c1[1],c2[0],c2[1],b[0],b[1]);
  }
}
function blob(g, pts, col){
  if (col) g.fillStyle = col;
  g.beginPath();
  const p = pts.concat([pts[0],pts[1]]);
  g.moveTo(p[0][0],p[0][1]);
  for (let i=0;i<p.length-1;i++){
    const a=p[i], b=p[i+1];
    const prev=p[(i-1+p.length)%p.length], next=p[(i+2)%p.length];
    g.bezierCurveTo(a[0]+(b[0]-prev[0])/6, a[1]+(b[1]-prev[1])/6,
                    b[0]-(next[0]-a[0])/6, b[1]-(next[1]-a[1])/6, b[0],b[1]);
  }
  g.closePath(); g.fill();
}
function oval(g,x,y,rx,ry,col,rot){
  if (col) g.fillStyle=col; g.beginPath(); g.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot||0,0,7); g.fill();
}

/* hard-edge pass: kill antialiasing, snap to the species ramp, dilate outline */
function crisp(src, palette, outline){
  const w = src.width, h = src.height;
  const g = readCtx(src);
  const img = g.getImageData(0,0,w,h), d = img.data;
  const ramp = palette.map(hex => [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16),hex]);
  const solid = new Uint8Array(w*h);
  for (let i=0;i<w*h;i++){
    const o=i*4;
    if (d[o+3] < 118){ d[o+3]=0; continue; }
    d[o+3]=255; solid[i]=1;
    let best=ramp[0], bd=1e9;
    for (const c of ramp){
      const dd=(c[0]-d[o])**2+(c[1]-d[o+1])**2+(c[2]-d[o+2])**2;
      if (dd<bd){bd=dd;best=c;}
    }
    d[o]=best[0]; d[o+1]=best[1]; d[o+2]=best[2];
  }
  // dilate a 1px outline into the transparent border
  const oc = [parseInt(outline.slice(1,3),16),parseInt(outline.slice(3,5),16),parseInt(outline.slice(5,7),16)];
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const i=y*w+x; if (solid[i]) continue;
    if ((x>0&&solid[i-1])||(x<w-1&&solid[i+1])||(y>0&&solid[i-w])||(y<h-1&&solid[i+w])){
      const o=i*4; d[o]=oc[0]; d[o+1]=oc[1]; d[o+2]=oc[2]; d[o+3]=255;
    }
  }
  g.putImageData(img,0,0);
  return src;
}

/* trim transparent margins so anchors and ground contact stay exact */
function trim(src){
  const w=src.width,h=src.height,g=readCtx(src);
  const d=g.getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(d[(y*w+x)*4+3]){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  }
  if (x1<0) return {cv:src,ox:0,oy:0,w,h};
  const nw=x1-x0+1, nh=y1-y0+1, out=makeCv(nw,nh);
  out.getContext('2d').drawImage(src,x0,y0,nw,nh,0,0,nw,nh);
  return {cv:out, ox:x0, oy:y0, w:nw, h:nh};
}

/* Per-stage multipliers. Every feature that grows on its own schedule gets its
   own column — merging any two of them has produced a bad sprite at least once.

   A scale column and a set of ratios is not growth. With `s` doing most of the
   work the juvenile, subadult and adult were one animal at three sizes with a
   slightly smaller head each time, and the only stage that read as its own
   thing was the hatchling. Growing up changes what an animal *has*, not only
   how big the parts are, so four of these columns turn features on and off
   rather than scaling them:

   `muzzle` is snout DEPTH, and it is separate from `snout`, which is snout
   length. A young tyrannosaur has a shallow, narrow muzzle in front of a large
   braincase; the deep boxy skull is an adult feature and arrives late. Driving
   both off one number gives a hatchling either an adult's slab of a face or a
   pinched adult.

   `bulk` is how deep the trunk and neck are for a given length. Juveniles are
   slab-sided and leggy, adults are barrel-chested with a thick neck. It is the
   difference you actually see across a room.

   `torso` is trunk LENGTH. Young animals are short-bodied and big-headed; the
   body catches up last.

   `fuzz` is protofeather coverage. Juvenile tyrannosaurs are reconstructed
   with a substantial coat that reduces with age, which is both well supported
   and the single most visible thing that can change between two stages of the
   same animal.

   `frill` is separate from `horn` for the reason `snout` is separate from
   `head`: a baby Triceratops already has a frill, deeply scalloped and
   obvious, while its horns are barely stubs.

   of ten skulls: the postorbital horns start as straight stubs, curve
   backward in juveniles, straighten out in subadults, then recurve forward in

/* ------------------------------- gear fit ---------------------------------
   Where one hat sits on one animal, when the species' own anchor is not quite
   right for it. The anchor is a place on the skull and it is the same place
   for every hat; a party cone and a bone crown are not the same shape and do
   not want the identical spot, and that difference is taste, not anatomy, so
   it lives here as data rather than in the draw functions.

   `dx` moves it toward the tail and `dy` moves it down the screen, so a hat
   that should ride higher takes a negative `dy`. Both are in sprite units, so
   they scale with the animal and a fit made on an adult still holds on a
   hatchling. `s` multiplies the width the species asked for. An absent
   species, an absent hat or an absent field all mean "no change", so this
   table only ever says the things that are not already right.

   `at` is the exception to that inheritance, one growth stage at a time, and
   it is the same arrangement `SPECIES_STAGE` has for proportions: the fit on
   the hat is what that hat does on that animal at every age, and a row under
   `at` is where one age departs from it. Sizes are what usually need it — a
   crown in proportion on an adult skull is a bucket on a hatchling, and the
   two heads are not the same shape, only the same animal later.

/* The one place a fit is resolved: the hat's own row, then whatever the stage
   overrides on top of it. Read through this rather than reaching into
   GEAR_FIT, the same way everything reads proportions through artFor(). */
function gearFor(spId, hatId, stage){
  const base = (GEAR_FIT[spId] || {})[hatId] || {};
  const at = (base.at || {})[(STAGE[stage] || {}).key] || {};
  const pick = k => (at[k] !== undefined ? at[k] : base[k]);
  return { dx: pick('dx') || 0, dy: pick('dy') || 0, s: pick('s') || 1 };
}

/* The growth row and the proportions a species draws with at a given stage,
   with its own overrides folded in. Every draw function starts here rather
   than reading STAGE and its TUNE table directly.

   frame of every animation — and dropped by artChanged(), like everything
   else the game has worked out in advance. */
const stageCache = new Map();
function artFor(spId, stage){
  const key = spId + '|' + stage;
  if (stageCache.has(key)) return stageCache.get(key);
  const st = Object.assign({}, STAGE[stage]);
  const tune = Object.assign({}, (SPECIES[spId] && SPECIES[spId].tune) || {});
  const adj = (SPECIES_STAGE[spId] || [])[stage] || {};

    if (k in st) st[k] = adj[k];
    else tune[k] = adj[k];
