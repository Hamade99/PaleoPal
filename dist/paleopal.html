/* ---------------------------- drawing from PIX ----------------------------
   Three ways a stored sprite is used, and none of them wants the others'
   behaviour, so they are three functions rather than one with flags.
   -------------------------------------------------------------------------- */

/* Straight onto a context, at a scale, optionally in one flat colour. `flat`
   is what gives a food item the hard outline every animal in this game has:
   stamped four times a pixel out in each direction under the real thing. A
   bounding rectangle will not do it — that comes out as a black plaque. */
function pixDraw(g, id, x, y, s, flat){
  const p = PIX[id];
  if (!p) return;
  s = s || 1;
  const ox = (p.ox || 0), oy = (p.oy || 0);
  for (let r=0;r<p.rows.length;r++){
    const row = p.rows[r];
    for (let c=0;c<row.length;c++){
      const ch = row[c];
      if (ch === ' ') continue;
      g.fillStyle = flat || p.pal[PIX_CH.indexOf(ch)];
      g.fillRect(x + (c-ox)*s, y + (r-oy)*s, s, s);
    }
  }
}
const PIX_CH = '0123456789abcdefghijklmnopqrstuvwxyz';

/* Onto its own canvas, with a hard outline dilated around it. Icons and
   headgear both want this and both used to carry their own copy of the loop.
   Cached, because paintChrome runs about once a second and the shop redraws
   every frame it is open.

   The canvas is a pixel bigger than the sprite on every side. The outline is
   dilated *outward*, so a canvas cut to the sprite's exact size has nowhere to
   put it, and any art pixel touching the edge silently lost its outline on
   that side — eleven of the twenty-nine sprites did, and `icon.play`, which
   fills its box, had none at all on any side. A sprite is art, not a box: it
   should not have to keep a spare row clear to be drawn correctly.

   The pad is published on the canvas because headgear places itself from the
   canvas size and would otherwise ride a pixel high. */
const PIX_PAD = 1;
const pixCache = new Map();
function pixCanvas(id, outline){
  const key = id + '|' + outline;
  if (pixCache.has(key)) return pixCache.get(key);
  const p = PIX[id];
  if (!p) return makeCv(1,1);
  const w = p.w + PIX_PAD*2, h = p.h + PIX_PAD*2;
  const c = makeCv(w, h), g = readCtx(c);
  c.pad = PIX_PAD;
  pixDraw(g, id, (p.ox || 0) + PIX_PAD, (p.oy || 0) + PIX_PAD, 1);
  const d = g.getImageData(0,0,w,h), px = d.data, solid = new Uint8Array(w*h);
  for (let i=0;i<w*h;i++){ if (px[i*4+3] >= 118){ px[i*4+3] = 255; solid[i] = 1; } else px[i*4+3] = 0; }
  const [orr, og, ob] = [1,3,5].map(i => parseInt(outline.slice(i,i+2), 16));
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const i = y*w+x; if (solid[i]) continue;
    if ((x>0&&solid[i-1])||(x<w-1&&solid[i+1])||(y>0&&solid[i-w])||(y<h-1&&solid[i+w])){
      px[i*4]=orr; px[i*4+1]=og; px[i*4+2]=ob; px[i*4+3]=255;
    }
  }
  g.putImageData(d,0,0);
  pixCache.set(key, c);
  return c;
}
/* Anything the editor changes has to drop the caches, or the game goes on
   showing what it baked before the edit. */
function pixInvalidate(){ pixCache.clear(); if (typeof HATS === 'object') for (const k in HATS) delete HATS[k]; }

/* Everything the game has baked, dropped in one call. The editor changes a
   number and then has to make the game forget four independent caches — the
   frame cache, the material cache, the pixel cache and the two backdrop
   caches. Forgetting one of them is how an editor ends up showing the old
   sprite on a new palette, so there is one function and it clears them all.
   It is called at runtime, so the caches defined in later modules are there. */
function artChanged(){
  pixInvalidate();
  if (typeof frameCache !== 'undefined') frameCache.clear();
  if (typeof matCache   !== 'undefined') matCache.clear();
  if (typeof warmQueue  !== 'undefined') warmQueue.length = 0;
  if (typeof bgCache    !== 'undefined') bgCache.clear();
  if (typeof skyCache   !== 'undefined') skyCache.clear();
  stageCache.clear();
}

/* ==========================================================================
   COLOUR + LIGHTING
   Palettes are generated as hue-shifted ramps: shadows drift cooler and more
   saturated, highlights warmer and less saturated. Shading uses one light,
   from the upper left, applied through a distance field so the form reads
   instead of pillowing evenly around the outline.
   ========================================================================== */

function hexToHsl(hex){
  let r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2;
  let h = 0, s = 0;
  if (mx !== mn){
    const d = mx - mn;
    s = l > .5 ? d/(2-mx-mn) : d/(mx+mn);
    h = mx === r ? (g-b)/d + (g<b?6:0) : mx === g ? (b-r)/d + 2 : (r-g)/d + 4;
    h *= 60;
  }
  return [h, s, l];
}
function hslToHex(h, s, l){
  h = ((h % 360) + 360) % 360; s = clamp(s,0,1); l = clamp(l,0,1);
  const c = (1 - Math.abs(2*l-1)) * s, x = c * (1 - Math.abs((h/60)%2 - 1)), m = l - c/2;
  let r,g,b;
  if (h<60) [r,g,b]=[c,x,0]; else if (h<120) [r,g,b]=[x,c,0]; else if (h<180) [r,g,b]=[0,c,x];
  else if (h<240) [r,g,b]=[0,x,c]; else if (h<300) [r,g,b]=[x,0,c]; else [r,g,b]=[c,0,x];
  const q = v => Math.round((v+m)*255).toString(16).padStart(2,'0');
  return '#' + q(r) + q(g) + q(b);
}
/* five steps, darkest first, with the hue rotated along the ramp */
function ramp(base, opts){
  opts = opts || {};
  const [h,s,l] = hexToHsl(base);
  const spread = opts.spread || .19, shift = opts.shift || 22;
  const out = [];
  for (let i=0;i<5;i++){
    const t = (i-2)/2;                                   // -1 shadow … +1 light
    out.push(hslToHex(
      h + (t<0 ? t*shift : t*shift*.55),                 // shadows swing further
      clamp(s + (t<0 ? .10*-t : -.13*t), .05, 1),
      clamp(l + t*spread, .05, .95)
    ));
  }
  return out;
}
function shiftRamp(r, n){ return r.map((_,i) => r[clamp(i+n,0,4)]); }
/* blend two hexes. Used to pull the underside toward the flank hue so that
   countershading reads as light falling off a body rather than as a second
   colour painted onto it. */
function mixCol(a, b, t){
  const A = [1,3,5].map(i => parseInt(a.slice(i,i+2),16));
  const B = [1,3,5].map(i => parseInt(b.slice(i,i+2),16));
  return '#' + A.map((v,i) => Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('');
}

/* Material keys, in paint order: a later layer wins where two overlap.

   The compositor only draws an internal edge where two *different* materials
   meet, so two shapes sharing a layer merge into one region with nothing
   between them. That is why the mandible has a layer of its own instead of
   sharing `head` — painted onto `head` it was drawn correctly, hinged
   correctly, and completely invisible, which is what left every animal with a
   mouthless face.

   `shield` and `jaw` sit below `head`, so a frill and a lower jaw pass behind
   the skull. `belly` and `mark` sit above the body but are masked to it, so
   both can be painted generously and let the mask trim them to the
   silhouette. `mark` stops below `belly`, which is how a coat pattern fades
   out where the countershading starts rather than running across it.

   `horn` sits above `mouth` because teeth, beaks and claws stand in front of
   the mouth cavity, not behind it. The other way round the gape painted over
   every tooth in it.

   `beak` is a layer and not just a colour on `horn` because a rostral and a
   brow horn are different materials and the compositor only draws an edge
   between different materials. Sharing `horn`, a ceratopsian's beak was two
   near-white blobs stuck on the front of a tan face with nothing dividing
   them from the horn sheaths above. A species that does not set `spec.beak`
   gets its horn colour here and nothing changes for it. */
const LAYERS = ['far','skin','limb','shield','jaw','head','belly','mark','crest','mouth','horn','beak','sclera','pupil','glint'];
const BODY_TOP    = LAYERS.indexOf('head');
const BELLY_LAYER = LAYERS.indexOf('belly');
const MARK_LAYER  = LAYERS.indexOf('mark');
/* Countershading belongs to the trunk, the skull and the jaw. It is kept off
   the limbs — near-side limbs carry their own lit ramp and far-side limbs are
   held back in shade, and letting the belly claim either bleached every leg to
   the same cream as the underside. */
const BELLY_OK = LAYERS.map(n => n === 'skin' || n === 'shield' || n === 'jaw' || n === 'head');

function buildMaterials(spec){
  const skin = ramp(spec.skin), horn = ramp(spec.horn, {spread:.12, shift:14});
  return {
    /* Far-side limbs. Two steps down with the contrast raised turned them
       into a black mass slung under the body that read as shadow rather than
       as legs, which on the four-legged animals is half the sprite. */
    far:    { r: shiftRamp(skin, -1), lit:.55 },
    skin:   { r: skin,                lit:1 },
    limb:   { r: shiftRamp(skin, 0),  lit:1.1 },
    /* display structures: a frill or a plate carries its own colour, which is
       standard in modern reconstructions and is also the only thing that
       stops a shield reading as a lump of neck at this size */
    shield: { r: ramp(spec.shield || spec.crest), lit:.85 },
    /* a shade under the skull, so the lip line reads as a step and not only
       as a seam */
    jaw:    { r: shiftRamp(skin, -1), lit:.85 },
    head:   { r: skin,                lit:.9 },
    /* Pulled a third of the way back toward the flank. Taken neat, the belly
       colours are far enough from the body that the underside read as a
       painted stripe; taken a step down their own ramp they fell into the
       dark, saturated end and inverted the countershading outright. */
    belly:  { r: ramp(mixCol(spec.belly, spec.skin, .38)), lit:.62 },
    mark:   { r: ramp(spec.mark || spec.crest), lit:.85 },
    crest:  { r: ramp(spec.crest),    lit:.7 },
    horn:   { r: horn,                lit:1.15 },
    /* Keratin, but not the same keratin. A beak is duller and darker than a
       horn sheath, and it has to be, or it reads as bone stuck to the face. */
    beak:   { r: ramp(spec.beak || spec.horn, {spread:.10, shift:8}), lit:.95 },
    mouth:  { r: ramp(spec.mouth, {spread:.10}), lit:.35 },
    sclera: { r: ramp('#f6f2e2', {spread:.07}),  lit:.3 },
    pupil:  { r: ramp('#181410', {spread:.05}),  lit:0 },
    glint:  { r: ramp('#fffdf2', {spread:.04}),  lit:0 },
    outline: spec.outline
  };
}

/* ---------- composite the layers, light them, draw a selective outline ----- */
const LIGHT = [-0.66, -0.75];      // upper-left
const RIM = 6;                     // how deep the lit/shadowed band reaches

/* Every pass below is per-pixel, and a sprite occupies well under half the
   box it is drawn in. The flatten pass has to look at all of it — that is how
   it finds out where the animal is — but it records the bounds while it goes,
   and the distance field, the lighting and the outline then run over those
   bounds plus a two-pixel margin for the dilation. Outside them every pixel is
   background, which is the value the arrays already hold. */
function composeSprite(layerCanvases, mats, w, h){
  const n = w*h;
  const id = new Int8Array(n).fill(-1);
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  const seen = i => {
    const x = i % w, y = (i - x) / w;
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  };
  for (let li=0; li<LAYERS.length; li++){
    const d = readCtx(layerCanvases[li]).getImageData(0,0,w,h).data;
    if (li === MARK_LAYER){
      // a coat rides the body, and stops where the countershading starts
      for (let i=0;i<n;i++) if (d[i*4+3] >= 118 && id[i] >= 0 && id[i] <= BODY_TOP) id[i] = li;
    } else if (li === BELLY_LAYER){
      for (let i=0;i<n;i++) if (d[i*4+3] >= 118 && id[i] >= 0 && BELLY_OK[id[i]]) id[i] = li;
    } else {
      for (let i=0;i<n;i++) if (d[i*4+3] >= 118){ if (id[i] < 0) seen(i); id[i] = li; }
    }
  }
  if (x1 < 0) return makeCv(w,h);                 // nothing was drawn
  x0 = Math.max(0, x0-2); y0 = Math.max(0, y0-2);
  x1 = Math.min(w-1, x1+2); y1 = Math.min(h-1, y1+2);

  // distance from the silhouette edge (two-pass chamfer)
  const dist = new Float32Array(n);
  const BIG = 1e6;
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
    const i = y*w+x;
    if (id[i] < 0){ dist[i] = 0; continue; }
    const out = (x===0||id[i-1]<0) || (x===w-1||id[i+1]<0) || (y===0||id[i-w]<0) || (y===h-1||id[i+w]<0);
    const seam = (x>0&&id[i-1]!==id[i]) || (x<w-1&&id[i+1]!==id[i]) ||
                 (y>0&&id[i-w]!==id[i]) || (y<h-1&&id[i+w]!==id[i]);
    dist[i] = out ? 0 : seam ? 2.6 : BIG;
  }
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
    const i = y*w+x; if (!dist[i]) continue;
    let v = dist[i];
    if (x>0) v = Math.min(v, dist[i-1]+1);
    if (y>0) v = Math.min(v, dist[i-w]+1);
    if (x>0&&y>0) v = Math.min(v, dist[i-w-1]+1.41);
    if (x<w-1&&y>0) v = Math.min(v, dist[i-w+1]+1.41);
    dist[i] = Math.min(v, BIG);
  }
  for (let y=y1;y>=y0;y--) for (let x=x1;x>=x0;x--){
    const i = y*w+x; if (!dist[i]) continue;
    let v = dist[i];
    if (x<w-1) v = Math.min(v, dist[i+1]+1);
    if (y<h-1) v = Math.min(v, dist[i+w]+1);
    if (x<w-1&&y<h-1) v = Math.min(v, dist[i+w+1]+1.41);
    if (x>0&&y<h-1) v = Math.min(v, dist[i+w-1]+1.41);
    dist[i] = v;
  }

  const out = makeCv(w,h), og = readCtx(out), img = og.createImageData(w,h), D = img.data;
  const rgbCache = new Map();
  const put = (i, hex, a) => {
    let c = rgbCache.get(hex);
    if (!c){ c = [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]; rgbCache.set(hex,c); }
    D[i*4]=c[0]; D[i*4+1]=c[1]; D[i*4+2]=c[2]; D[i*4+3]=a;
  };
  const outRamp = ramp(mats.outline, {spread:.09, shift:10});

  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
    const i = y*w+x;
    if (id[i] < 0) continue;
    const m = mats[LAYERS[id[i]]];
    const d = dist[i];
    let step = 0;
    if (m.lit > 0 && d < RIM){
      // inward gradient of the distance field points away from the surface
      const gx = (dist[i + (x<w-1?1:0)] - dist[i - (x>0?1:0)]);
      const gy = (dist[i + (y<h-1?w:0)] - dist[i - (y>0?w:0)]);
      const len = Math.hypot(gx,gy) || 1;
      const nx = -gx/len, ny = -gy/len;                   // outward normal
      const lam = nx*LIGHT[0] + ny*LIGHT[1];
      step = Math.round(lam * (1 - d/RIM) * 3.0 * m.lit);
    }
    put(i, m.r[clamp(2 + step, 0, 4)], 255);
  }
  // selective outline: sample the material it hugs, brighten it on the lit side
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
    const i = y*w+x;
    if (id[i] >= 0) continue;
    let near = -1, ox = 0, oy = 0;
    if (x>0 && id[i-1]>=0){ near = id[i-1]; ox = 1; }
    else if (x<w-1 && id[i+1]>=0){ near = id[i+1]; ox = -1; }
    if (near < 0){
      if (y>0 && id[i-w]>=0){ near = id[i-w]; oy = 1; }
      else if (y<h-1 && id[i+w]>=0){ near = id[i+w]; oy = -1; }
    }
    if (near < 0) continue;
    const lam = ox*LIGHT[0] + oy*LIGHT[1];
    put(i, outRamp[clamp(1 + Math.round(lam*1.4), 0, 3)], 255);
  }
  og.putImageData(img,0,0);
  return out;
}

/* ==========================================================================
   SPECIES ART
   Anatomy follows current reconstructions: lipped jaws and a barrel torso on
   the tyrannosaur, oversized horn sheaths and jugal horns on the ceratopsian,
   a sixty-degree S-curved neck over a shoulder hump on the brachiosaur.
   Proportions are then pushed toward a toy: bigger skull, bigger eye, shorter
   snout, rounder body. Shapes are painted onto material layers, and the
   lighting pass in the colour module turns those layers into shaded pixels.
   ========================================================================== */

/* The box every frame is drawn into. `BAKE_CX` is the centreline and `BAKE_G`
   the ground line inside it; a species draws with the ground at y = 0.

   Every pass in composeSprite is per-pixel over this whole box, so its area is
   the bake cost. The box was 232x210 and the largest frame any species and
   stage produces is 143x94 — five sixths of every pass was spent on empty
   canvas. Measured across every species, stage and animation, the union of
   what is actually touched is 154x95, and this is that plus a margin.

   It is a starting size rather than a limit now: a bake that touches the edge
   of the box grows it and runs again. See growBake below. */
let BAKE_W = 168, BAKE_H = 112, BAKE_G = 100, BAKE_CX = 84;

/* …and it grows if it has to.

   Every one of those numbers was fitted to the animals as they were, which was
   fine while the proportions only changed when someone edited a draw function.
   With the proportions on sliders they change all the time, and the first thing
   anyone does is make the tail longer — at which point the tip ran off the box
   and was cut square, silently, because a bake has no way of complaining.

   So a bake checks whether it touched the edge of its own box, and if it did,
   the box grows and everything re-bakes. It costs a couple of wasted bakes the
   first time a sprite outgrows the box and nothing after that. The cap is there
   because bake cost is the box's area, and an animal that needs more than this
   has something wrong with it rather than something long about it. */
const BAKE_MAX_W = 360, BAKE_MAX_H = 260;
function growBake(){
  if (BAKE_W >= BAKE_MAX_W && BAKE_H >= BAKE_MAX_H) return false;
  if (BAKE_W < BAKE_MAX_W){ BAKE_W += 32; BAKE_CX += 16; }   // half each side
  if (BAKE_H < BAKE_MAX_H){ BAKE_H += 24; BAKE_G  += 24; }   // all of it above
  frameCache.clear();                     // every cached frame was baked smaller
  return true;
}
/* Anything drawn against the border was cut off by it. The compositor leaves a
   two-pixel margin for the outline dilation, so a lit pixel on the boundary is
   not a near miss. */
function touchedEdge(cv){
  const g = readCtx(cv), w = cv.width, h = cv.height;
  const d = g.getImageData(0, 0, w, h).data;
  const hot = i => d[i*4+3] > 8;
  for (let x=0;x<w;x++) if (hot(x) || hot((h-1)*w + x)) return true;
  for (let y=0;y<h;y++) if (hot(y*w) || hot(y*w + w-1)) return true;
  return false;
}

/* STAGE, the per-stage multipliers, is data and lives in 00-art.js with the
   rest of what the editor can turn. */

/* --------------------------- gait and limbs -------------------------------
   The foot follows a stance/swing path against the ground, and the leg is
   solved with two-bone inverse kinematics. Bone lengths never change and a
   planted foot never slides, which is what stops a walk cycle looking rubbery.
   -------------------------------------------------------------------------- */
function gaitFoot(phase, stride, lift, duty){
  phase = ((phase % 1) + 1) % 1;
  if (phase < duty){                       // planted: starts ahead, slides back
    const t = phase / duty;
    return [stride * (-0.5 + t), 0];
  }
  const t = (phase - duty) / (1 - duty);   // airborne: swings from back to front
  return [stride * (0.5 - t), -lift * Math.sin(Math.PI * t)];
}
function limbIK(g, hx, hy, tx, ty, L1, L2, w, bend){
  const dx = tx - hx, dy = ty - hy;
  const raw = Math.hypot(dx, dy) || 0.001;
  const d = clamp(raw, Math.abs(L1 - L2) + 0.01, (L1 + L2) * 0.995);
  const ux = dx / raw, uy = dy / raw;
  const a = (L1*L1 - L2*L2 + d*d) / (2*d);
  const h = Math.sqrt(Math.max(0, L1*L1 - a*a));
  const kx = hx + ux*a - uy*h*bend, ky = hy + uy*a + ux*h*bend;
  const ax = hx + ux*d, ay = hy + uy*d;
  tube(g, [[hx,hy],[kx,ky]], [w, w*.64]);
  tube(g, [[kx,ky],[ax,ay]], [w*.64, w*.44]);
  return [ax, ay];
}
/* hy is the hip height above the ground line at y = 0, so the leg always reaches */
function legStep(g, hx, hy, phase, w, cfg, hornG){
  const len = Math.max(4, -hy);
  const mt = len * cfg.mt;
  if (cfg.thigh) oval(g, hx, hy + len*.17, w*.92, len*.25);
  const [ox, oy] = gaitFoot(phase, len*cfg.stride, len*cfg.lift, cfg.duty);
  const tx = hx + ox + len*(cfg.fwd||0), ty = oy;
  const ank = limbIK(g, hx, hy, tx + mt*cfg.back, ty - mt, (len-mt)/2*1.02, (len-mt)/2*1.02, w, cfg.bend);
  drawFoot(g, hornG, ank, tx, ty, w, cfg.foot || 'bird');
  return [tx, ty];
}
function drawFoot(g, hornG, ank, tx, ty, w, kind){
  if (kind === 'hoof'){
    // sauropod manus: the metacarpals stand in a vertical column and the whole
    // hand is a single hoof. No digits are visible in life, so none are drawn.
    tube(g, [[ank[0], ank[1]],[tx, ty - w*.44]], [w*.56, w*.60]);
    blob(g, [[tx - w*.32, ty - w*.52],[tx + w*.32, ty - w*.52],
             [tx + w*.36, ty - w*.10],[tx, ty - w*.03],[tx - w*.36, ty - w*.10]]);
    return;
  }
  if (kind === 'pad'){
    // sauropod pes: a wedge, deep at the heel where the fleshy pad sits and
    // sloping forward onto three claw-bearing inner toes
    tube(g, [[ank[0], ank[1]],[tx + w*.26, ty - w*.46]], [w*.50, w*.54]);
    blob(g, [[tx + w*.52, ty - w*.08],[tx + w*.60, ty - w*.40],[tx + w*.30, ty - w*.60],
             [tx - w*.16, ty - w*.44],[tx - w*.44, ty - w*.20],[tx - w*.40, ty - w*.03],
             [tx + w*.10, ty]]);
    if (hornG){
      blob(hornG, [[tx - w*.36, ty - w*.22],[tx - w*.58, ty - w*.10],[tx - w*.36, ty - w*.01]]);
      blob(hornG, [[tx - w*.20, ty - w*.30],[tx - w*.44, ty - w*.24],[tx - w*.24, ty - w*.12]]);
    }
    return;
  }
  if (kind === 'column'){
    // ceratopsian foot: short, broad and blunt-hooved
    tube(g, [[ank[0], ank[1]],[tx + w*.10, ty - w*.34]], [w*.50, w*.54]);
    blob(g, [[tx + w*.36, ty - w*.06],[tx + w*.40, ty - w*.34],[tx, ty - w*.46],
             [tx - w*.36, ty - w*.28],[tx - w*.38, ty - w*.02]]);
    if (hornG){
      blob(hornG, [[tx - w*.28, ty - w*.20],[tx - w*.46, ty - w*.08],[tx - w*.26, ty - w*.01]]);
      blob(hornG, [[tx - w*.08, ty - w*.26],[tx - w*.28, ty - w*.22],[tx - w*.10, ty - w*.10]]);
    }
    return;
  }
  tube(g, [[ank[0],ank[1]],[tx,ty]], [w*.46, w*.4]);
  oval(g, tx - w*.1, ty - w*.15, w*.56, w*.28);
}
/* How long a polyline is, in local units. Anything spaced along a path has to
   be spaced by distance and not by count: a fixed number of filaments spread
   over a hatchling's short back overlap into one solid band, and the same
   number over an adult's is a row of separated spikes. The coat painter
   learned this in session 8; the fuzz needed telling too. */
function pathLength(pts){
  let d = 0;
  for (let i=0;i<pts.length-1;i++) d += Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]);
  return d;
}
function samplePath(pts, t){
  let total = 0; const seg = [];
  for (let i=0;i<pts.length-1;i++){ const d = Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]); seg.push(d); total += d; }
  let want = clamp(t,0,1) * total;
  for (let i=0;i<seg.length;i++){
    if (want <= seg[i] || i === seg.length-1){
      const u = seg[i] ? clamp(want/seg[i],0,1) : 0;
      return [lerp(pts[i][0], pts[i+1][0], u), lerp(pts[i][1], pts[i+1][1], u)];
    }
    want -= seg[i];
  }
  return pts[pts.length-1];
}
function toes(g, x, y, n, dir, size){
  for (let i=0;i<n;i++) oval(g, x + dir*i*size*1.7, y, size*.78, size*.55);
}
function eyeAt(M, x, y, r, state){
  /* A shut eye is a line, not a shape. The lid used to be drawn as wide as the
     pupil with rounded caps, which at this size read as a black smudge across
     the face rather than as a closed eye. */
  if (state === 1){                                        // closed: a soft lid line
    tube(M.pupil, [[x-r*1.35,y-r*.08],[x,y+r*.34],[x+r*1.35,y-r*.08]], [r*.24,r*.32,r*.24]);
    return;
  }
  if (state === 2){                                        // squinting, pleased
    tube(M.pupil, [[x-r*1.3,y+r*.34],[x,y-r*.40],[x+r*1.3,y+r*.34]], [r*.24,r*.32,r*.24]);
    return;
  }
  if (state === 3){
    /* Half-lidded: ill, but awake. The sick pose used to borrow the shut lid
       from sleep, so an animal that needed a remedy and an animal that needed
       leaving alone were the same picture — and since `sick` overrides idle
       for as long as the illness lasts, a poorly animal simply had its eyes
       closed all day. The eye is open here, only sunk and hooded: the white
       still shows, which is the whole difference at this size. */
    oval(M.sclera, x, y + r*.28, r*1.04, r*.74);
    oval(M.pupil,  x - r*.10, y + r*.36, r*.60, r*.60);
    oval(M.glint,  x - r*.42, y + r*.10, r*.24, r*.22);
    tube(M.pupil, [[x-r*1.32,y-r*.22],[x,y-r*.02],[x+r*1.26,y-r*.28]], [r*.22,r*.30,r*.22]);
    return;
  }
  oval(M.sclera, x, y, r*1.1, r*1.24);
  oval(M.pupil,  x - r*.12, y + r*.14, r*.66, r*.86);
  oval(M.glint,  x - r*.46, y - r*.44, r*.3, r*.3);
}

/* ------------------------------- T. rex ----------------------------------- */

/* ------------------------------ hats -------------------------------------
   The art lives in PIX in 00-art.js and the outline pass lives in pixCanvas,
   so this is now only the cache. It used to be six hand-written fillRect
   functions and a private copy of the dilation loop. */
const HATS = {};
Object.defineProperty(HATS, 'get', { value:null });          // keep it a plain bag
const HAT_IDS = Object.keys(PIX).filter(k => k.slice(0,4) === 'hat.').map(k => k.slice(4));
/* A hat is hung by the bottom of its art, and the art is not the canvas. Every
   hat is drawn in a 12x11 grid with its brim wherever the artist put it, so the
   crown has four blank rows under it and the cap three, and the outline pass
   adds one more all round. Hanging by the canvas edge floated every hat that
   distance above the skull, scaled up with the animal, which is what made a
   worn hat read as a hovering object rather than as headgear. Measure the last row that has ink in it once, at
   bake time, and hang from that. `pixInvalidate()` drops HATS, so an edit in
   the editor re-measures. */
function hatArt(id){
  if (!HATS[id]){
    const c = pixCanvas('hat.' + id, '#241d13');
    const d = readCtx(c).getImageData(0, 0, c.width, c.height).data;
    let foot = 0, x0 = c.width, x1 = -1, seen = false;
    for (let y = c.height - 1; y >= 0; y--){
      let ink = false;
      for (let x = 0; x < c.width; x++) if (d[(y*c.width + x)*4 + 3] > 0){
        ink = true; if (x < x0) x0 = x; if (x > x1) x1 = x;
      }
      if (ink) seen = true; else if (!seen) foot++;
    }
    c.foot = foot;                    // blank rows below the art, canvas pad included
    c.inkW = x1 >= x0 ? x1 - x0 + 1 : c.width;
    c.inkCx = x1 >= x0 ? (x0 + x1 + 1)/2 : c.width/2;
    HATS[id] = c;
  }
  return HATS[id];
}

/* Headgear rides the anchors the sprite hands back, so it sits on the skull
   rather than floating at a guessed offset.

   It takes the hat and the species as arguments instead of reading `S`, which
   is what lets the editor draw a preview by calling this rather than by
   reimplementing it. A preview that recomputes placement its own way is a
   preview that can disagree with the game, and an editor that teaches you the
   wrong thing about your own edit is worse than no editor. */
function drawGear(g, f, x, y, flip, hatId, spId){
  if (!hatId || !PIX['hat.' + hatId]) return;
  /* The anchor is where the hat touches the animal: the bottom of the ink lands
     on it and the ink is centred over it. Both are measured off the baked art
     rather than assumed, because a hat is drawn wherever it suits the artist
     inside its 12x11 grid and none of them fill it.

     The species puts the anchor on the right part of the skull; `GEAR_FIT` is
     where one particular hat on one particular animal says that is not quite
     it. Its nudges are in sprite units, so they are multiplied by the animal's
     own scale and a fit made on an adult holds on a hatchling, and they are
     applied before the flip so they stay on the same end of the head when the
     animal turns round. */
  const fit = gearFor(spId, hatId, f.stage);
  const art = hatArt(hatId), scale = Math.max(.6, f.hatW * fit.s / art.inkW),
        w = art.width * scale, hgt = art.height * scale;
  const hx = f.hat[0] + fit.dx * f.k, hy = f.hat[1] + fit.dy * f.k;
  const ax = flip ? x + (f.ox - hx) : x - f.ox + hx;
  const ay = y - f.oy + hy;
  g.save(); g.translate(Math.round(ax), Math.round(ay));
  if (flip) g.scale(-1, 1);
  g.drawImage(art, -art.inkCx * scale, -(art.height - art.foot) * scale, w, hgt);
  g.restore();
}

/* ---------------------------- frame baking -------------------------------- */
/* Walk and idle are generated rather than typed out, because the only reason
   they were six frames and two frames was that a bake cost eight milliseconds
   and every pose is one. It costs about a third of that now, so the cycles are
   as long as they should be: twelve frames of walk reads as a walk instead of
   as six positions, and four frames of idle is a breath instead of a twitch.

   The body rises twice per stride, once under each foot, with sharp peaks and
   a flat trough — that asymmetry is the push-off. The tail swings once per
   stride, a quarter cycle behind it. */
const WALK_FRAMES = 12, IDLE_FRAMES = 4;
const TAU = Math.PI * 2;
const poseCycle = (count, fn) => Array.from({length:count}, (_, i) => fn(i/count, i));

const POSES = {
  idle:  poseCycle(IDLE_FRAMES, p => ({
           body: .65 - .65*Math.cos(TAU*p),          // one slow breath
           legPhase: 0,
           tail: .22*Math.sin(TAU*p)
         })),
  walk:  poseCycle(WALK_FRAMES, p => ({
           body: .2 + 1.3*Math.pow(Math.abs(Math.sin(TAU*p)), 1.4),
           legPhase: p,
           tail: .48*Math.sin(TAU*p + Math.PI/4)
         })),
  get eat(){ return POSE_ART.eat; },
  get wary(){ return POSE_ART.wary; },
  get inspect(){ return POSE_ART.inspect; },
  /* Asleep is deep and slow and the eyes are shut. Ill is shallow, uneven and
     the eyes are open but hooded. The two used to share a lid and a droop,
     which is why an ill animal read as a sleeping one. */
  sleep: poseCycle(2, p => ({
           body: -2.5 + .40*(1 - Math.cos(TAU*p)),
           legPhase: 0, droop: 1.5, tail: .1, eye: 1
         })),
  get cheer(){ return POSE_ART.cheer; },
  sick:  poseCycle(4, p => ({
           body: -1.5 + .55*Math.sin(TAU*p),
           legPhase: 0,
           droop: 1.05 + .20*Math.cos(TAU*p),
           tail: -.12 + .08*Math.sin(TAU*p),
           eye: 3
         }))
};
const matCache = new Map();
function matsFor(spId, skinId){
  const key = spId + '|' + skinId;
  if (!matCache.has(key)){
    const k = skinOf(spId, skinId);
    matCache.set(key, buildMaterials(Object.assign({}, SPECIES[spId].spec, {
      skin:k.skin, belly:k.belly, crest:k.crest, mark:k.mark
    })));
  }
  return matCache.get(key);
}
/* Least-recently-used, because the key space is species x coat x stage x
   animation x frame x eye and every entry is a canvas. A player only ever has
   one species, one coat and one stage live, which is about thirty frames; the
   rest of what gets baked is shop and nest thumbnails. The cap is generous
   enough never to evict anything in use and small enough to bound the memory. */
const FRAME_CACHE_MAX = 180;
const frameCache = new Map();
function frameOf(spId, stage, anim, idx, blinking, skinId){
  skinId = skinId || 'wild';
  const poses = POSES[anim] || POSES.idle;
  const pose = poses[idx % poses.length];
  const eye = pose.eye !== undefined ? pose.eye : (blinking ? 1 : 0);
  const key = spId+'|'+skinId+'|'+stage+'|'+anim+'|'+(idx%poses.length)+'|'+eye;
  if (frameCache.has(key)){
    const hit = frameCache.get(key);
    frameCache.delete(key); frameCache.set(key, hit);   // Map keeps insertion order
    return hit;
  }

  /* Retry at a larger box if this bake ran off the edge of it. Six is well
     past the cap; the loop ends when growBake() says there is no more room. */
  let out = null;
  for (let attempt = 0; attempt < 6; attempt++){
    out = bakeOnce(spId, stage, pose, eye, skinId);
    if (!out.clipped || !growBake()) break;
  }
  delete out.clipped;
  frameCache.set(key, out);
  while (frameCache.size > FRAME_CACHE_MAX) frameCache.delete(frameCache.keys().next().value);
  return out;
}

function bakeOnce(spId, stage, pose, eye, skinId){
  const sp = SPECIES[spId], A = artFor(spId, stage), st = A.st, k = st.s * sp.scale;
  const canvases = [], M = {};
  for (const name of LAYERS){
    const c = makeCv(BAKE_W, BAKE_H), g = readCtx(c);
    g.fillStyle = '#000';
    g.translate(BAKE_CX, BAKE_G); g.scale(k, k);
    canvases.push(c); M[name] = g;
  }
  const P = Object.assign({stage, legPhase:0, body:0, jaw:0, tail:0, droop:0}, pose, {eye});
  const anchors = sp.draw(M, P);
  // Countershading and the coat both ride the body the draw function just laid
  // down, never a path computed alongside it — the same rule the surface
  // detail follows. Belly first: the coat is masked to stop where it starts.
  paintBelly(M.belly, anchors.spine, sp.belly);
  paintPattern(M.mark, skinOf(spId, skinId).pattern, anchors.spine);

  const composed = composeSprite(canvases, matsFor(spId, skinId), BAKE_W, BAKE_H);
  const t = trim(composed);
  const conv = a => [BAKE_CX + a[0]*k - t.ox, BAKE_G + a[1]*k - t.oy];
  return {
    cv: t.cv, w: t.w, h: t.h,
    ox: BAKE_CX - t.ox, oy: BAKE_G - t.oy,
    eye: conv(anchors.eye), mouth: conv(anchors.mouth), hat: conv(anchors.hat),
    /* How wide the hat should be drawn, in screen pixels. The species says it,
       the way it already says how big the eye is, because the three skulls are
       nothing like each other: sized off `hs` alone a Brachiosaurus wore the
       same cap as a rex four times its skull length. */
    hatW: (anchors.hatW || 14) * k,
    eyeR: (anchors.eyeR || 3) * k, k, hs: k * st.head, stage,
    clipped: touchedEdge(composed)
  };
}

/* Bake ahead. A cold bake is a few milliseconds and every pose is one, so a
   twelve-frame walk baked lazily hitches twelve times the first time an animal
   crosses the pen. Two frames a tick fills the whole of the current stage and
   coat inside a second, and does nothing at all once it is full. */
let warmQueue = [], warmKey = '';
function warmFrames(spId, stage, skinId){
  const key = spId + '|' + skinId + '|' + stage;
  if (key !== warmKey){
    warmKey = key;
    warmQueue = [];
    for (const anim in POSES)
      for (let i=0;i<POSES[anim].length;i++) warmQueue.push([anim, i, false]);
    warmQueue.push(['idle', 0, true]);            // the blink is a bake of its own
  }
  for (let n=0; n<2 && warmQueue.length; n++){
    const [anim, i, blink] = warmQueue.shift();
    frameOf(spId, stage, anim, i, blink, skinId);
  }
}

/* ==========================================================================
   SCREEN FONT
   The menus live inside the 224x168 screen, so their text has to be drawn as
   pixels rather than laid out as DOM. This is that font: 5x7 fixed width, one
   glyph per entry, seven rows of five bits each encoded as base32 so the table
   stays readable at a glance and small in the build.

   Drawing a glyph pixel by pixel would be thousands of fillRect calls a frame,
   so each colour the interface uses is baked once into a strip of every glyph
   and drawn from there. Colours are few and fixed, so the strips are built on
   first use and then never again.

   There are no image assets here either. The strips are drawn from the table
   at load, the same way every other picture in this game is made.
   ========================================================================== */

const FONT_W = 5, FONT_H = 7;
const FONT_ADV = 6;                 // glyph width plus one column of tracking
const FONT_LINE = 9;                // baseline to baseline

const B32 = '0123456789ABCDEFGHIJKLMNOPQRSTUV';
const GLYPHS = {
  ' ':'0000000', '0':'EHJLPHE', '1':'4C4444E', '2':'EH1248V', '3':'V2421HE', '4':'26AIV22',
  '5':'VGU11HE', '6':'68GUHHE', '7':'V124888', '8':'EHHEHHE', '9':'EHHF12C', 'A':'EHHVHHH',
  'B':'UHHUHHU', 'C':'EHGGGHE', 'D':'SIHHHIS', 'E':'VGGUGGV', 'F':'VGGUGGG', 'G':'EHGNHHF',
  'H':'HHHVHHH', 'I':'E44444E', 'J':'72222IC', 'K':'HIKOKIH', 'L':'GGGGGGV', 'M':'HRLLHHH',
  'N':'HPLJHHH', 'O':'EHHHHHE', 'P':'UHHUGGG', 'Q':'EHHHLID', 'R':'UHHUKIH', 'S':'FGGE11U',
  'T':'V444444', 'U':'HHHHHHE', 'V':'HHHHHA4', 'W':'HHHLLRH', 'X':'HHA4AHH', 'Y':'HHA4444',
  'Z':'V1248GV', 'a':'00E1FHF', 'b':'GGUHHHU', 'c':'00FGGGF', 'd':'11FHHHF', 'e':'00EHVGE',
  'f':'698U888', 'g':'0FHHF1E', 'h':'GGUHHHH', 'i':'40C444E', 'j':'20622IC', 'k':'GGIKOKI',
  'l':'C44444E', 'm':'00QLLLL', 'n':'00UHHHH', 'o':'00EHHHE', 'p':'0UHHUGG', 'q':'0FHHF11',
  'r':'00MOGGG', 's':'00FGE1U', 't':'88U8896', 'u':'00HHHJD', 'v':'00HHHA4', 'w':'00HHLLA',
  'x':'00HA4AH', 'y':'0HHHF1E', 'z':'00V248V', '.':'00000CC', ',':'0000664', ':':'0CC0CC0',
  '!':'4444404', '?':'EH16404', '\'':'4400000', '-':'000E000', '+':'044V440', '/':'12448G0',
  '%':'PQ248BJ', '(':'2488842', ')':'8422248', '*':'0LEVEL0', '#':'AVAAAVA',
  '\u00b7':'000CC00', '\u25b6':'8CEFEC8', '\u25c0':'26EUE62', '\u25b2':'044EEV0',
  '\u25bc':'0VEE440'
};

/* cursor and scroll marks, addressed by name so the screen code does not have
   to carry literal box-drawing characters around */
const GL_RIGHT = '▶', GL_LEFT = '◀', GL_UP = '▲', GL_DOWN = '▼';
const GL_DOT = '·';

const fontStrips = new Map();
function fontStrip(col){
  let strip = fontStrips.get(col);
  if (strip) return strip;
  const keys = Object.keys(GLYPHS);
  const cv = makeCv(keys.length * FONT_W, FONT_H), g = readCtx(cv);
  g.fillStyle = col;
  const index = new Map();
  keys.forEach((ch, n) => {
    const code = GLYPHS[ch], ox = n * FONT_W;
    index.set(ch, ox);
    for (let row=0; row<FONT_H; row++){
      const bits = B32.indexOf(code[row]);
      for (let bit=0; bit<FONT_W; bit++)
        if (bits & (1 << (FONT_W - 1 - bit))) g.fillRect(ox + bit, row, 1, 1);
    }
  });
  strip = { cv, index };
  fontStrips.set(col, strip);
  return strip;
}

const textW = s => s.length ? s.length * FONT_ADV - 1 : 0;

/* Draw a single line. `align` is 'left' (default), 'right' or 'centre', and x
   is the edge the alignment refers to. Returns the x the line ended at. */
function text(g, str, x, y, col, align){
  str = String(str);
  const strip = fontStrip(col || '#e9e1cb');
  let px = Math.round(align === 'right'  ? x - textW(str)
                    : align === 'centre' ? x - textW(str)/2 : x);
  const py = Math.round(y);
  for (let i=0; i<str.length; i++){
    const ox = strip.index.get(str[i]);
    if (ox !== undefined) g.drawImage(strip.cv, ox, 0, FONT_W, FONT_H, px, py, FONT_W, FONT_H);
    px += FONT_ADV;
  }
  return px;
}

/* Greedy wrap to a pixel width. Long words are broken rather than allowed to
   run off the screen, because at this size one over-long word is the whole
   line. */
function wrapText(str, maxW){
  const cols = Math.max(1, Math.floor((maxW + 1) / FONT_ADV));
  const out = [];
  for (const para of String(str).split('\n')){
    let line = '';
    for (const word of para.split(' ')){
      let w = word;
      while (w.length > cols){                     // break a word too long to fit
        if (line) { out.push(line); line = ''; }
        out.push(w.slice(0, cols));
        w = w.slice(cols);
      }
      if (!line) line = w;
      else if (line.length + 1 + w.length <= cols) line += ' ' + w;
      else { out.push(line); line = w; }
    }
    out.push(line);
  }
  return out;
}

/* Wrapped paragraph. Returns the y it finished at, so callers can stack. */
function textBlock(g, str, x, y, maxW, col, lineH){
  const step = lineH || FONT_LINE;
  for (const line of wrapText(str, maxW)){ text(g, line, x, y, col); y += step; }
  return y;
}

/* Cut a string to fit, with a trailing dot rather than three: at six pixels a
   character an ellipsis costs three characters of the thing being named. */
function fit(str, maxW){
  const cols = Math.max(1, Math.floor((maxW + 1) / FONT_ADV));
  str = String(str);
  return str.length <= cols ? str : str.slice(0, cols - 1) + '.';
}

/* Tyrannosaurus rex sprite
   Part of Paleopal. Load order matters; see build.py. */

const REX_GAIT = { stride:.46, lift:.17, duty:.56, mt:.22, back:.34, bend:1, thigh:false, foot:'bird' };
function drawRex(M, P){
  const A = artFor('rex', P.stage), st = A.st, T_ = A.tune;
  const hM = st.head, nM = st.neck, lM = st.limb, tM = st.tail;
  const bk = st.bulk, tor = st.torso, fz = st.fuzz, bs = st.horn;
  const bob = P.body, jaw = P.jaw||0, sw = P.tail||0, dr = P.droop||0;

  /* Skeleton landmarks. Hip is the acetabulum; everything else hangs off it.

     `torso` shortens the trunk in young animals and `bulk` deepens it, which
     between them are most of the difference between a leggy slab-sided
     juvenile and a barrel-chested adult. Before they existed the three older
     stages were one animal at three sizes. */
  const hipX = 16,  hipY = -T_.hipH*lM - bob;
  const backY = hipY - T_.backH*lM, withX = -T_.shoulder*tor, withY = hipY - T_.withersH*lM;
  const bellyY = hipY + T_.bellyD*lM*bk, throatY = hipY + T_.bellyD/3*lM*bk;
  const hx = withX - T_.neckLen*nM - 4*hM, hy = withY - T_.neckDrop*nM - 2 + dr*9;
  const sM = st.snout;
  /* Skull depth at the orbit, and at the muzzle. A young tyrannosaur carries a
     shallow snout in front of a large braincase; the deep boxy skull is an
     adult feature and arrives late. One depth for both gave a hatchling an
     adult's slab of a face at hatchling scale. */
  const hh = T_.headDepth*hM, fh = hh * (0.46 + 0.54*st.muzzle);
  const dep = u => hh + (fh - hh) * u;     // linear taper along the snout
  const sn = T_.headLen*hM*sM;
  const T = d => hipX + d*tM;

  // far limb first, behind everything
  blob(M.far, [[hipX+9*lM, hipY-11*lM],[hipX+12*lM, hipY+4*lM],[hipX+2*lM, hipY+15*lM],
               [hipX-9*lM, hipY+13*lM],[hipX-13*lM, hipY-1*lM],[hipX-8*lM, hipY-11*lM]]);
  legStep(M.far, hipX-6, hipY+2, (P.legPhase+.5)%1, 14*lM, REX_GAIT);

  // one continuous mass from nape to tail tip: neck, ribcage, hips and tail
  const TL = T_.tailLen;
  const topLine = [[hx+11, hy-hh*.35],[withX, withY],[0, backY-1],[hipX+7, backY+1],[T(TL*23/72), hipY-T_.tailBase*lM+sw*2]];
  blob(M.skin, [
    [hx+11, hy-hh*.35],                     // nape at the skull
    [withX, withY],                         // withers
    [0, backY-1],                           // back
    [hipX+7, backY+1],                      // over the hips
    [T(TL*23/72), hipY-T_.tailBase*lM*bk+sw*2],   // deep tail base
    [T(TL*48/72), hipY-13*lM+sw*4],
    [T(TL),     hipY-7*lM+sw*6],                // tail tip
    [T(TL*70/72), hipY-4*lM+sw*6],
    [T(TL*43/72), hipY-1*lM+sw*4],
    [T(TL*17/72), hipY+4*lM*bk],
    [hipX-6, bellyY],                       // belly
    [-8, bellyY-1],
    [withX-7*bk, throatY-2],                // chest and throat
    [hx+9, hy+hh*.58]
  ]);

  /* Skull.

     The first version made every horizontal line straight: a flat roof from
     nape to muzzle, a ruler-straight oral margin under it, and a squared
     premaxilla at the end. Three straight lines and a right angle is a box
     with an eye on it, which is most of what made the face read as goofy.

     Three curves replace them, and none of them costs an anatomical claim:

       - the braincase domes over the orbit and falls away behind it. A
         tyrannosaur skull is deep and vaulted through the postorbital, and a
         big rounded braincase over a big eye is also the whole of what makes
         an animal read as young.
       - the oral margin is sinuous rather than level: high at the cheek,
         bowed down through the tooth row, lifting again at the tip. That is
         the shape the maxilla actually has, and read as a face it is a
         slight smile.
       - the muzzle keeps its squared-off front — a near-vertical premaxilla
         is the quickest way to read tyrannosaur rather than generic theropod
         at this size — but it is shorter and deeper than it was, so the head
         is a head rather than a snout with a skull behind it. */
  const lipBack = hy + hh*.26, lipMid = hy + dep(.46)*.44, lipTip = hy + fh*.30;
  blob(M.head, [
    [hx+14, hy-hh*.06],                     // occiput, meeting the nape
    [hx+12, hy-hh*.90],
    [hx+2,  hy-hh*1.18],                    // vaulted braincase, over the orbit
    [hx-sn*.34, hy-dep(.34)*1.06],
    [hx-sn*.66, hy-dep(.66)*.84],
    [hx-sn*.88, hy-dep(.88)*.56],
    // three near-vertical stations across the front, so the curve through
    // them stays flat instead of rounding the premaxilla off
    [hx-sn*1.00, hy-fh*.30],
    [hx-sn*1.05, hy+fh*.02],
    [hx-sn*1.02, lipTip-fh*.06],
    [hx-sn*.92, lipTip],                    // the oral margin, and its curve
    [hx-sn*.46, lipMid],
    [hx+14, lipBack]
  ]);

  /* Hinged mandible, on its own material. It was always drawn and always
     hinged, but it was painted onto `head`, and the compositor only draws an
     edge where two different materials meet — so the whole lower jaw merged
     into the skull and the animal had no mouth. It hangs below the upper
     jaw's oral margin, and that boundary is the lip line. The ventral profile
     is what shows, so it carries a rounded chin rather than the flat slab it
     had, which is the other half of the goofy face.

     −x is forward, so the jaw opens on a negative rotation. */
  const hinge = [hx + 12, hy + hh*.18], jawA = -jaw * .34;
  const jawLength = sn + 12;
  M.jaw.save(); M.jaw.translate(hinge[0], hinge[1]); M.jaw.rotate(jawA);
  blob(M.jaw, [[2,-hh*.12],[-jawLength*.42,-dep(.42)*.10],[-jawLength*.96,fh*.06],
               [-jawLength*.94,fh*.32],[-jawLength*.66,dep(.66)*.52],[-jawLength*.24,hh*.58],[2,hh*.46]]);
  M.jaw.restore();
  // pale chin, carried by the jaw rather than left floating under it
  M.belly.save(); M.belly.translate(hinge[0], hinge[1]); M.belly.rotate(jawA);
  oval(M.belly, -sn*.54, hh*.42, sn*.24, hh*.10);
  M.belly.restore();

  const about = (p, a, o) => [o[0] + (p[0]-o[0])*Math.cos(a) - (p[1]-o[1])*Math.sin(a),
                              o[1] + (p[0]-o[0])*Math.sin(a) + (p[1]-o[1])*Math.cos(a)];
  if (jaw > .06){
    /* The gape is the wedge between the two oral margins, anchored at the
       hinge. Drawing it as a slab carried around by the mandible put mouth
       lining outside the head; drawing it through `blob` bowed the curves
       outward and swallowed the whole face. Straight edges, because the two
       margins it runs between are straight. */
    const uTip = [hx - sn*.91, lipTip - hh*.02];
    const lTip = about([hinge[0] - jawLength*.96, hinge[1] + fh*.06], jawA, hinge);
    const gape = [hinge, uTip, lTip];
    M.mouth.beginPath();
    M.mouth.moveTo(gape[0][0], gape[0][1]);
    for (let i=1;i<gape.length;i++) M.mouth.lineTo(gape[i][0], gape[i][1]);
    M.mouth.closePath(); M.mouth.fill();
    /* Teeth. The large ones are maxillary; the dentary shows tips only, which
       is both what the animal had and what reads at this size. */
    const tw = Math.max(.9, 1.25*hM);
    for (let i=0;i<5;i++){
      const u = .18 + i*.17;
      oval(M.horn, lerp(hinge[0],uTip[0],u), lerp(hinge[1],uTip[1],u) + hh*.10,
           tw, Math.max(1.3, (2.4 - i*.22)*hM));
    }
    for (let i=0;i<4;i++){
      const u = .26 + i*.18;
      oval(M.horn, lerp(hinge[0],lTip[0],u), lerp(hinge[1],lTip[1],u) - hh*.08,
           tw*.8, Math.max(1.0, 1.5*hM));
    }
  } else {
    // shut: lips cover the teeth, so all that shows is the oral margin itself
    tube(M.mouth, [[hx+10, lipBack+hh*.02],[hx-sn*.46, lipMid],[hx-sn*.91, lipTip-hh*.02]],
         [Math.max(.9,1.5*hM), Math.max(.8,1.25*hM), Math.max(.6,.8*hM)]);
  }

  const ex = hx - sn*.40, ey = hy - hh*.34;
  /* Brow over the orbit. The lacrimal boss and the postorbital rugosity are
     adult ornament: they are barely there on a hatchling and heaviest on a
     full-grown animal, so this rides the same column the other horns do.
     It is a rounded hood rather than the flat plate it was — a straight bar
     over a round eye reads as a scowl. */
  const bw = .40 + .60*bs;
  blob(M.crest, [[ex+7.5*hM, ey-hh*.30],[ex+2*hM, ey-hh*(.30+.44*bw)],
                 [ex-6*hM, ey-hh*(.30+.30*bw)],[ex-7.5*hM, ey-hh*.30],
                 [ex-4*hM, ey-hh*.22],[ex+3*hM, ey-hh*.24]]);
  if (bs > .55){                                          // the postorbital boss
    oval(M.crest, ex + 8.5*hM, ey - hh*.16, 2.4*hM*bs, 3.0*hM*bs);
  }

  /* The coat.

     A juvenile tyrannosaur is reconstructed with a substantial covering of
     filaments that reduces with age; an adult keeps a keratin row down the
     neck and back and little else. This is the single most visible thing that
     can differ between two stages of one animal, and without it the juvenile,
     subadult and adult were one silhouette at three sizes.

     Both the down and the keratin row ride `topLine`, the same points the body
     outline uses, so neither can float off the back. The down is drawn as
     overlapping ovals of uneven length: an even row of equal spines is a
     mohawk, and what this wants to read as is a ragged fringe. */
  const backLen = pathLength(topLine);
  if (fz > .10){
    // one filament every few units of spine, not a fixed count: at a fixed
    // count a hatchling's short back took thirty-seven of them and they
    // overlapped into a solid band, which is a thicker animal, not a coat
    const n = Math.max(7, Math.round(backLen / (3.4*lM)));
    for (let i=0;i<n;i++){
      const t = i/(n-1);
      const q = samplePath(topLine, .01 + t*.92);
      const wob = Math.abs(Math.sin(i*2.39 + 1.1));
      // long enough to break the outline: a coat that stops at the back line
      // is a texture, and this has to read as a covering
      const len = (1.8 + T_.fuzzLen*fz) * lM * (0.40 + 0.60*wob) * (1 - t*.40);
      oval(M.crest, q[0] + len*.40, q[1] - len*.30, 1.5*lM, len*.62);
    }
    // and a tuft at the nape, where a young theropod's coat is thickest
    for (let i=0;i<4;i++){
      const len = (2.2 + T_.fuzzLen*5.6/5.2*fz) * lM * (0.55 + 0.45*Math.abs(Math.sin(i*3.1)));
      oval(M.crest, hx + 11 + i*2.4*lM, hy - hh*.36 - len*.30, 1.7*lM, len*.58);
    }
  }
  // the keratin row: sparse and low when young, a full row on an adult
  const rows = Math.max(5, Math.round(backLen / (5.6*lM)));
  for (let i=0;i<rows;i++){
    const q = samplePath(topLine, .04 + i*(.88/rows));     // ride the actual back line
    oval(M.crest, q[0], q[1] + 1.6*lM, 2.3*lM, (.8 + .6*(1-fz))*lM);
  }
  // the ventral countershading is painted from the spine by paintBelly

  // two-fingered hand, palm turned inward the way a theropod wrist actually sits
  const ax = withX + 9, ay = withY + 22*lM;
  tube(M.limb, [[ax,ay],[ax-T_.armLen*lM,ay+T_.armLen*lM],[ax-T_.armLen*20/11*lM,ay+7*lM]], [10*lM, 7.2*lM, 5.4*lM]);
  toes(M.horn, ax-T_.armLen*23/11*lM, ay+6*lM, 2, -1, Math.max(1.3, 2.3*lM));

  // near limb: a heavy drumstick over the femur, then shank and bird foot
  blob(M.limb, [[hipX+14*lM, hipY-12*lM],[hipX+16*lM, hipY+5*lM],[hipX+5*lM, hipY+18*lM],
                [hipX-8*lM, hipY+15*lM],[hipX-14*lM, hipY-1*lM],[hipX-9*lM, hipY-13*lM]]);
  const foot = legStep(M.limb, hipX, hipY, P.legPhase, 15*lM, REX_GAIT);
  toes(M.horn, foot[0]-9*lM, foot[1]-1, 3, -1, Math.max(1.2, 2.1*lM));

  /* A larger eye set lower and further forward. Both eyes face forward, which
     the dossier promises, and a low, large orbit under a domed braincase is
     also the proportion that reads as young rather than as lizard. */
  eyeAt(M, ex, ey, 4.0*hM, P.eye);
  // naris: a slot well back from the tip, in the upper half of the muzzle
  oval(M.mouth, hx - sn*.78, hy - hh*.26, Math.max(.9,1.5*hM), Math.max(.7,.9*hM));

  /* Centreline for the coat painter: nape to tail tip, carrying the body's
     half-depth at each station so a band knows how far to run. */
  const spine = [
    [hx + 13,   hy + hh*.06,  hh*.52],   // nape
    [withX - 4, withY + 12*lM, 12*lM],   // withers
    [-4,        hipY - 7*lM,   16*lM],   // ribcage
    [hipX + 4,  hipY - 7*lM,   16*lM],   // hips
    [T(TL*24/72), hipY - 9*lM,    9*lM],   // tail base
    [T(TL*48/72), hipY - 7*lM,    5.5*lM],
    [T(TL),     hipY - 6*lM,    2.0*lM]  // tail tip
  ];

  /* Headgear sits on the skull roof behind the orbit — the flat over the
     braincase, not the muzzle and not the occiput. `hatW` spans about half the
     skull, which is as much of the roof as there is behind the eye. */
  return { eye:[ex,ey], eyeR:4.0*hM, mouth:[hx - sn*.82, hy + hh*.14],
           hat:[hx - sn*.22, hy - hh*1.10], hatW: sn*.54,
           top: hy - hh*1.18, spine };
}


/* Triceratops horridus sprite
   Part of Paleopal. Load order matters; see build.py.

   Proportions follow the modern skeletals: a deep barrel torso, a tail about
   one and a half times the length of the torso and deep at its base, and a
   skull-and-frill unit carried forward of the shoulder rather than sitting on
   top of it.

   Rebuilt from the frame outwards after the previous animal was rejected as
   awkward next to the other two. Six passes of moving control points on it had
   changed nothing, and the reason showed up the moment the colour was stripped
   off and the silhouettes were put side by side: on the rex you can name every
   part from the outline alone, and on this one the frill ran straight into the
   shoulder, so the whole top line from beak to tail tip was a single unbroken
   lump. The notch of sky between the back of the frill and the shoulder is
   what says Triceratops, and nothing else about the animal can make up for
   its absence.

   Three things follow from that, and they are the rewrite:

     - the head is carried far enough forward, and the frill tipped back far
       enough, to open that notch
     - the neck is drawn on `head` rather than `skin`. The layer order is
       skin, shield, head, so the frill used to be painted across the neck and
       the animal read as a face with a plate leaning on it. Now the head unit
       covers the shield's base and the shield stands behind it
     - the barrel has three heights along the top and three along the bottom
       instead of one each, and the shoulder and haunch are their own masses,
       so the legs come out of an animal rather than out of a plank

   The tail also lost a third of its length; it was carrying about as much of
   the animal's area as the whole body.

   Growth follows Horner and Goodwin's series of ten skulls:
     - the frill is present and deeply scalloped from the start, and lengthens
       with positive allometry (STAGE.frill)
     - the epoccipitals along the rim start as deep deltoid scallops and
       flatten to low spindles that fuse into the margin (`epi`, per stage
       in SPECIES_STAGE)
     - the brow horns are straight stubs, curve backward in juveniles,
       straighten in subadults and recurve forward in adults (STAGE.hornBend)
   -------------------------------------------------------------------------- */
const TRI_HIND = { stride:.34, lift:.11, duty:.66, mt:.15, back:.2,  bend:1,  thigh:true,  foot:'column' };
const TRI_FORE = { stride:.32, lift:.10, duty:.66, mt:.15, back:-.1, bend:-1, thigh:false, foot:'column' };
function drawTrike(M, P){
  const A = artFor('trike', P.stage), st = A.st, T_ = A.tune;
  const hM = st.head, nM = st.neck, lM = st.limb, tM = st.tail;
  const hF = st.horn, sM = st.snout, fM = st.frill, bend = st.hornBend;
  const bk = st.bulk, tor = st.torso;
  const bob = P.body, jaw = P.jaw||0, sw = P.tail||0, dr = P.droop||0;
  const TL = T_.tailLen;

  /* The frame the animal hangs on. Three heights along the top — withers,
     a dip, then the haunch — and three along the bottom — brisket, a slight
     waist, then the flank. The old one had one height for the whole back and
     one for the whole belly, which is a loaf with a head on it, and no amount
     of moving the corners fixed that. */
  const hipX  = T_.hipBack*tor, shX = -T_.shoulder*tor;
  const hipY  = -T_.hipH*lM - bob;
  const shY   = hipY + 2*lM;                       // glenoid, just under the hip
  const withY = shY - T_.withersH*lM;              // shoulder hump: the high point
  const backY = hipY - T_.backH*lM;                // mid back, below the withers
  const rumpY = hipY - T_.rumpH*lM;                // rising again over the hip
  const bellyY = hipY + T_.bellyD*lM*bk;
  const chestY = hipY + T_.chestD*lM*bk;           // the chest hangs lower than the waist
  const T = d => hipX + d*tM;

  legStep(M.far, hipX-6, hipY+2, (P.legPhase+.5)%1, 16*lM, TRI_HIND);
  legStep(M.far, shX-6,  shY+3,  (P.legPhase+.25)%1, 14.5*lM, TRI_FORE);

  /* One closed mass: chest, barrel, hips and tail. The neck is deliberately
     NOT in here — see below. */
  blob(M.skin, [
    [shX-9,       withY+9*lM],                     // front of the shoulder
    [shX+1,       withY],                          // withers
    [5,           backY],                          // mid back
    [hipX-2,      rumpY],                          // haunch
    [T(TL*13/62), hipY-T_.tailBase*lM*bk + sw*1.5],// the tail leaves the hips deep
    [T(TL*30/62), hipY-T_.tailBase*.62*lM + sw*3],
    [T(TL*46/62), hipY-T_.tailBase*.36*lM + sw*5],
    [T(TL),       hipY-T_.tailBase*.10*lM + sw*7], // tip
    [T(TL*58/62), hipY+1*lM + sw*7],
    [T(TL*38/62), hipY+3.5*lM + sw*4],
    [T(TL*16/62), hipY+5*lM*bk + sw*1.5],
    [hipX+2,      hipY+5.75*lM*bk],                // under the haunch, no shelf
    [hipX-6,      bellyY],                         // flank
    [6,           bellyY - T_.waistD*lM],          // waist
    [shX+7,       chestY],                         // deep chest
    [shX-7,       chestY - T_.chestD*.55*lM],      // brisket
    [shX-9,       withY+18*lM]                     // up the front of the shoulder
  ]);

  /* Haunch and shoulder as their own rounded masses, on the same material so
     they swell the outline without drawing a line across it. A quadruped this
     size reads by its two big muscle groups; without them the legs look
     pushed into a plank. */
  oval(M.skin, hipX-6, hipY-6*lM, T_.haunchR*lM*bk, T_.haunchR*.82*lM*bk);
  oval(M.skin, shX+5,  shY-6*lM,  T_.shoulderR*lM*bk, T_.shoulderR*.9*lM*bk);

  /* The head is carried forward of the shoulder, at about shoulder height.
     `neckLen` is the whole run from the glenoid to the occiput; the neck
     starts a third of the way along it and the skull hangs off the rest. */
  const nkX = shX - T_.neckLen*nM*.35, nkY = withY + T_.neckDrop*lM;
  const hx = nkX - T_.neckLen*nM*.65 - 9*hM*sM, hy = nkY + 6*lM + dr*5;
  const sn = T_.headLen*hM*sM, hh = T_.headDepth*hM;

  /* Frill: a shield standing behind the skull.

     Drawn before the neck and the skull, both of which are on `head`, and the
     layer order is skin, shield, head — so its lower margin is tucked behind
     them and only the arc above and behind the skull roof shows. Painted the
     other way round, which is how it was, the shield lies across the neck and
     the animal reads as a face with a plate leaning on it.

     What actually identifies this animal in silhouette is the notch of sky
     between the back of the frill and the shoulder. Every version without that
     notch read as one unbroken lump from beak to tail whatever else was done
     to it, so the frill is tipped back hard and the head carried far enough
     forward to open it. */
  const fx = hx + 14*hM, fy = hy - hh*1.16;
  const fRx = T_.frillW*hM*fM, fRy = T_.frillH*hM*fM;
  const fTilt = T_.frillTilt;
  const fc = Math.cos(fTilt), fs = Math.sin(fTilt);
  const rot = (px,py) => [fx + px*fc - py*fs, fy + px*fs + py*fc];
  const epi = T_.epi;
  const rim = [];
  const A0 = Math.PI*1.06, A1 = Math.PI*1.94;   // front edge, over the crown, down the back
  /* The epoccipitals scallop the rim itself. Sixteen of them came out as a
     one-pixel sawtooth that read as fur; an adult shows five or six knobs in
     side profile, so the rim is stepped at that count instead. */
  const EPI_N = 8;
  for (let i=0;i<=EPI_N;i++){
    const a = A0 + (A1-A0)*i/EPI_N;
    const r = (i % 2) ? 1.0 : (1 - epi);
    rim.push(rot(Math.cos(a)*fRx*r, Math.sin(a)*fRy*r));
  }
  rim.push(rot(fRx*.80, fRy*.52));              // rear-bottom corner, behind the neck
  rim.push(rot(fRx*.10, fRy*.60));              // bottom margin, behind the cheek
  rim.push(rot(-fRx*.74, fRy*.34));             // front-bottom, where the skull joins
  blob(M.shield, rim);
  /* The epoccipitals as bone, not only as a step in the outline. They are
     separate ossifications that fuse to the margin, so they are the colour of
     the horns rather than of the shield, and at this size a scalloped edge on
     its own is invisible — a row of pale knobs is what makes the rim read as
     a rim. They shrink with age on the same schedule as the scallops. */
  for (let i=1;i<EPI_N;i+=2){
    const a = A0 + (A1-A0)*i/EPI_N;
    const q = rot(Math.cos(a)*fRx, Math.sin(a)*fRy);
    oval(M.horn, q[0], q[1], (1.1 + epi*7)*hM*fM, (1.0 + epi*5.5)*hM*fM);
  }

  /* The neck, on `head` rather than `skin`, so it covers the frill's base and
     the two of them read as one head unit standing in front of the shield. */
  tube(M.head, [[shX+2, withY+11*lM],[nkX-2, nkY+1*lM],[hx+14*hM, hy-hh*.10]],
       [T_.neckThick*lM*bk, T_.neckThick*.94*lM*bk, 12*hM]);

  /* Skull: deep, boxy, and carried forward and below the frill base. It stops
     at the oral margin, because the mandible has to live somewhere. */
  const lipY = hy + hh*.38;
  blob(M.head, [
    [hx+15*hM,   hy-hh*1.02],                   // back of the skull roof
    [hx+2*hM,    hy-hh*1.20],                   // roof over the orbit
    [hx-sn*.32,  hy-hh*1.08],
    [hx-sn*.66,  hy-hh*.84],                    // sloping to the beak
    [hx-sn*.90,  hy-hh*.46],
    [hx-sn*1.00, hy-hh*.06],
    [hx-sn*.88,  lipY-hh*.02],                  // oral margin
    [hx-sn*.38,  lipY+hh*.06],
    [hx+4*hM,    hy+hh*.86],                    // deep cheek, down to the jugal
    [hx+16*hM,   hy+hh*.36]
  ]);

  /* Jaw and beak.

     A ceratopsian bites with two beaks — the rostral above, the predentary
     below — and they meet. The first pass built the mandible as a fixed
     fraction of the snout measured from the hinge, which left its tip twenty
     units short of the upper beak: a permanent underbite that read as a
     shark. The rostral overhung it, and both were drawn on `horn`, so the
     front of the face was two pale blobs with nothing between them.

     The mandible is built against the upper beak's own tip now. `beakL` is
     where that tip falls in hinge-local coordinates, so the lower jaw closes
     on it however the skull is scaled, at every growth stage. */
  const jHinge = [hx + 8*hM, hy + hh*.44], jawA = -jaw*.26;
  const beakTip = -sn*1.10;                      // the upper beak, from hx
  const beakL = beakTip - 8*hM;                  // the same point, from the hinge
  M.jaw.save(); M.jaw.translate(jHinge[0], jHinge[1]); M.jaw.rotate(jawA);
  /* Deep at the back where the coronoid process is, tapering to the beak.
     Carried at one depth the whole way it was a slab, and the face came out
     as three stacked bands: skull, jaw, beak. */
  blob(M.jaw, [[4, -hh*.10],
               [beakL*.30, -hh*.18],             // dorsal margin, under the tooth row
               [beakL*.66, -hh*.12],
               [beakL*.90,  hh*.06],             // rising to meet the predentary
               [beakL*.84,  hh*.30],
               [beakL*.40,  hh*.42],
               [4, hh*.48]]);
  M.jaw.restore();

  /* Rostral: the hooked tip of the upper beak, and only the tip. It used to
     start a third of the way back down the snout, which is a parrot's face
     rather than a Triceratops'. */
  blob(M.beak, [[hx-sn*.94, hy-hh*.30],[hx+beakTip, hy-hh*.02],[hx+beakTip-sn*.06, hy+hh*.26],
                [hx+beakTip+sn*.10, hy+hh*.44],[hx-sn*.90, lipY-hh*.04]]);
  // predentary, riding the jaw so it opens with it, closing on the rostral
  M.beak.save(); M.beak.translate(jHinge[0], jHinge[1]); M.beak.rotate(jawA);
  // it hooks up at the front, the way a predentary does, and stays inside the
  // mandible's own outline instead of hanging off it as a spike
  blob(M.beak, [[beakL*.56, -hh*.06],[beakL*.92, hh*.02],[beakL*.86, hh*.26],[beakL*.52, hh*.34]]);
  M.beak.restore();

  if (jaw > .06){
    const uTip = [hx + beakTip + sn*.06, lipY - hh*.04];
    const lTip = [jHinge[0] + (beakL*.86)*Math.cos(jawA) - (hh*.06)*Math.sin(jawA),
                  jHinge[1] + (beakL*.86)*Math.sin(jawA) + (hh*.06)*Math.cos(jawA)];
    M.mouth.beginPath();
    M.mouth.moveTo(jHinge[0], jHinge[1]);
    M.mouth.lineTo(uTip[0], uTip[1]);
    M.mouth.lineTo(lTip[0], lTip[1]);
    M.mouth.closePath(); M.mouth.fill();
  } else {
    tube(M.mouth, [[hx+6*hM, lipY+hh*.06],[hx-sn*.38, lipY+hh*.04],[hx-sn*.86, lipY-hh*.02]],
         [Math.max(.9,1.4*hM), Math.max(.8,1.2*hM), Math.max(.6,.9*hM)]);
  }
  const ex = hx - sn*.30, ey = hy - hh*.34;

  /* Brow horns. The keratin sheath ran well past the bone core, so an adult's
     are long; the curvature is the ontogenetic sequence — straight stubs, then
     backward, then straightening, then recurved forward. The mid control point
     bows against the tip, which is what makes a recurve read as a recurve
     rather than as a bent stick.

     They spring from above the orbit, which is where a postorbital horn is,
     and they are rooted low enough on the skull to read as growing out of the
     face rather than off the front of the frill.

     Width tracks the sheath as well as the skull. Scaling thickness on head
     bulk alone gave hatchlings two fat cones where they should have stubs. */
  const hl = hh*(.50 + T_.hornLen*hF);
  const hw = hM * (.40 + .60*hF);
  const browHorn = (dx, dy, len, w) => {
    const bx = ex + dx*hM, by = ey + dy;
    const tip = [bx - len*(.34 + .58*bend), by - len*.82];
    const mid = [(bx + tip[0])/2 + len*.20*bend, (by + tip[1])/2 + len*.06];
    tube(M.horn, [[bx,by], mid, tip], [w*hw, w*.52*hw, w*.12*hw]);
  };
  browHorn( 5, -hh*.52, hl,     9.6);
  browHorn(-4, -hh*.62, hl*.88, 7.8);
  // nasal horn: small in T. horridus, and small at every age
  tube(M.horn, [[hx-sn*.72, hy-hh*.30],[hx-sn*.86, hy-hh*(.50+.5*hF)]], [4.0*hM, 1.2*hM]);
  /* Jugal horn: a point on the cheek, and it has to stay on the cheek. Run
     down past the mandible's ventral line it stops being a cheek boss and
     becomes a pale tusk hanging under the jaw — which, with the rostral also
     drawn in horn, was the second of the two white tips on the front of this
     face. */
  blob(M.beak, [[hx-sn*.04, hy+hh*.60],[hx-sn*.28, hy+hh*.56],[hx-sn*.12, hy+hh*.90]]);

  /* Nubbin feature scales, kept to the flank where there is room for them.
     Scattered over the whole animal they read as dirt rather than as skin. */
  for (const q of [[6,-12],[18,-14],[30,-11],[13,-6]])
    oval(M.crest, q[0], hipY + q[1]*lM, 1.6*lM, 1.1*lM);

  // the ventral countershading is painted from the spine by paintBelly

  legStep(M.limb, hipX-1, hipY, P.legPhase, 18*lM, TRI_HIND, M.horn);
  legStep(M.limb, shX+3,  shY+1, (P.legPhase+.75)%1, 16.5*lM, TRI_FORE, M.horn);

  eyeAt(M, ex, ey, 3.4*hM, P.eye);

  /* Centreline for the coat painter: nape to tail tip, with the body's
     half-depth at each station so a band knows how far to run. */
  const spine = [
    [shX-4,   withY+8*lM,   8*lM],   // base of the neck
    [shX+5,   hipY-T_.backH*.75*lM, 16*lM],   // shoulder
    [5,       hipY-T_.backH*.70*lM, 17*lM],
    [hipX,    hipY-T_.rumpH*.72*lM, 16*lM],   // hips
    [T(TL*15/62), hipY-7*lM,   10*lM],   // tail base
    [T(TL*32/62), hipY-6*lM,    7*lM],
    [T(TL*48/62), hipY-4*lM,    4.5*lM],
    [T(TL),     hipY-2*lM,    2.0*lM]  // tail tip
  ];

  /* Headgear goes on the skull roof, not on the frill. The crown of the frill
     is the highest point on the animal, which is why it was the anchor, but a
     hat up there is a hat on a shield standing behind the head — it read as
     hovering in the sky behind the animal, because that is where the top of the
     frill is. The roof is the strip between the brow horns and the frill's
     front edge, so the hat is placed along it and sized to it: far enough back
     to clear the horns, far enough forward that the frill rises behind it. */
  const crown = rot(fRx*.10, -fRy*.96);        // still the highest point, for `top`
  const roofBack = fx - fRx*.30*fc;            // where the frill leaves the skull
  const roofFront = ex + 5*hM;                 // the brow horn bases
  return { eye:[ex,ey], eyeR:3.4*hM, mouth:[hx - sn*1.12, hy + hh*.22],
           hat:[roofFront + (roofBack - roofFront)*.52, hy - hh*1.12],
           hatW: (roofBack - roofFront)*1.05,
           top: crown[1], spine };
}

/* Brachiosaurus altithorax sprite
   Part of Paleopal. Load order matters; see build.py. */

/* ---------------------------- Brachiosaurus -------------------------------- */
const BRA_FORE = { stride:.30, lift:.06, duty:.74, mt:.07, back:0,   bend:-1, thigh:false, foot:'hoof' };
const BRA_HIND = { stride:.30, lift:.06, duty:.74, mt:.15, back:.30, bend:1,  thigh:true,  foot:'pad' };
function drawBrachio(M, P){
  const A = artFor('brachio', P.stage), st = A.st;
  const hM = st.head, nM = st.neck, lM = st.limb, tM = st.tail;
  const bk = st.bulk, tor = st.torso, cr = st.horn;
  const bob = P.body, jaw = P.jaw||0, sw = P.tail||0, dr = P.droop||0;

  /* The forelimbs run about 1.2 times the hindlimbs — the trait the animal is
     named for, and the reason the back slopes. It is an ADULT trait. Sauropod
     growth series have hatchlings built much closer to square, with the
     disproportion and the long neck arriving together, so a baby is a
     level-backed, short-necked, big-headed thing and only the adult is the
     silhouette everyone recognises. Held at 1.2 from hatching, every stage
     was the adult at a different size, which was the complaint. */
  const mature = P.stage / (STAGE.length - 1);          // 0 hatchling, 1 adult
  const T_ = A.tune, TL = T_.tailLen;
  const hindLen = T_.hindH*lM, foreLen = hindLen * (1.00 + (T_.foreRatio-1)*mature);
  const shX = -T_.shoulder*tor, shY = -foreLen - bob, hipX = T_.hipBack*tor, hipY = -hindLen - bob;

  legStep(M.far, shX-7,  shY+4, (P.legPhase+.25)%1, 14*lM, BRA_FORE);
  legStep(M.far, hipX-7, hipY+3,(P.legPhase+.5)%1,  14*lM, BRA_HIND);

  // short tail for a sauropod, carried clear of the ground
  tube(M.skin, [[hipX,hipY],[hipX+TL*22/86*tM,hipY+1+sw*3],[hipX+TL*44/86*tM,hipY+3+sw*5],
                [hipX+TL*66/86*tM,hipY+6+sw*7],[hipX+TL*tM,hipY+10+sw*9]],
       [31*lM*bk, 22*lM*bk, 14*lM, 7*lM, 2.5*lM]);
  // the back slopes down from the shoulders to the hips
  tube(M.skin, [[shX,shY],[8*tor,shY+8],[hipX,hipY]],
       [T_.bodyD*39/44*lM*bk, T_.bodyD*lM*bk, T_.bodyD*34/44*lM*bk]);
  oval(M.skin, shX + 2, shY - 6*lM, 18*lM*bk, 12*lM*bk);    // shoulder hump

  // neck near sixty degrees, S-curved, drooping slightly at the head end
  const nl = T_.neckLen*nM;
   const n1 = [shX - 9 - dr,  shY - nl*.30 + dr*2];
   const n2 = [shX - 19 - dr*3, shY - nl*.63 + dr*5];
   const n3 = [shX - 23 - dr*4, shY - nl*.94 + dr*8];
  /* The whole neck thickens with `bulk`, the head end included. Left at its
     adult width under a hatchling's oversized skull, the neck came out as a
     stick with a head on the end of it. */
  tube(M.head, [[shX-3, shY-9],n1,n2,n3],
       [T_.neckThick*lM*bk, T_.neckThick*19/26*lM*bk, T_.neckThick*15/26*lM*bk, T_.neckThick*12.5/26*lM*bk]);

  const sM = st.snout;
  const hx = n3[0] - 7*hM, hy = n3[1] - 4*hM, sn = T_.headLen*hM*sM, hh = T_.headDepth*hM;
  // the muzzle is shallower than the braincase, and more so when young
  const fh = hh * (0.62 + 0.38*st.muzzle);

  /* The skull is about ten pixels long, so only three things can read on it:
     the crest silhouette, the eye, and the jaw line. It had two. The muzzle is
     squared off in front, where the spatulate teeth sat, rather than rounded
     to a lump. */
  const lipY = hy + hh*.34;
  blob(M.head, [[hx+10*hM,hy-hh*.8],[hx-sn*.35,hy-hh*1.15],[hx-sn*.94,hy-fh*.52],
                [hx-sn*1.04,hy-fh*.06],[hx-sn*.98,lipY-fh*.06],
                [hx-sn*.30,lipY+hh*.06],[hx+10*hM,hy+hh*.72]]);

  /* Mandible. The sauropod jaw line is long and close to straight, running
     back to below the eye. */
   const jHinge = [hx + 6*hM, hy + hh*.30], jawA = -jaw*.22;
   const jawLength = sn + 6*hM;
  M.jaw.save(); M.jaw.translate(jHinge[0], jHinge[1]); M.jaw.rotate(jawA);
   blob(M.jaw, [[2,-hh*.06],[-jawLength*.42,-hh*.12],[-jawLength*.98,hh*.02],
                      [-jawLength*.94,hh*.34],[-jawLength*.30,hh*.46],[3,hh*.36]]);
  M.jaw.restore();
  if (jaw > .06){
    const uTip = [hx - sn*.96, lipY - hh*.08];
   const lTip = [jHinge[0] - jawLength*.98*Math.cos(jawA) - hh*.02*Math.sin(jawA),
              jHinge[1] - jawLength*.98*Math.sin(jawA) + hh*.02*Math.cos(jawA)];
    M.mouth.beginPath();
    M.mouth.moveTo(jHinge[0], jHinge[1]);
    M.mouth.lineTo(uTip[0], uTip[1]);
    M.mouth.lineTo(lTip[0], lTip[1]);
    M.mouth.closePath(); M.mouth.fill();
  } else {
    tube(M.mouth, [[hx+4*hM, hy+hh*.30],[hx-sn*.44, lipY+hh*.02],[hx-sn*.92, lipY-hh*.08]],
         [Math.max(.9,1.3*hM), Math.max(.8,1.1*hM), Math.max(.6,.8*hM)]);
  }

  /* The nasal chamber on the roof of a very small skull, and it grows. On a
     hatchling it is a low swelling; the tall arch is an adult's, so it rides
     the horn column the other two species use for their ornament. It is the
     only thing this skull can say at ten pixels long besides the eye and the
     jaw line, so it is worth having it change. */
  const crTop = 1.10 + (T_.crestH-1.10)*cr, crBack = 0.85 + 0.85*cr;
  blob(M.crest, [[hx+2*hM,hy-hh*1.0],[hx-sn*.16,hy-hh*crTop],
                 [hx-sn*.62,hy-hh*crBack],[hx-sn*.6,hy-hh*.85]]);
   oval(M.mouth, hx - sn*.82, hy - fh*.38, Math.max(.7,.9*hM), Math.max(.6,.7*hM));

  // the ventral countershading is painted from the spine by paintBelly

  const nf = legStep(M.limb, shX+4, shY+2, (P.legPhase+.75)%1, 17*lM, BRA_FORE);
  legStep(M.limb, hipX+2, hipY, P.legPhase, 17*lM, BRA_HIND, M.horn);
  oval(M.horn, nf[0] - 5.4*lM, nf[1] - 2.6*lM, 1.9*lM, 2.2*lM);   // short brachiosaurid thumb claw

  eyeAt(M, hx - sn*.48, hy - hh*.3, 2.9*hM, P.eye);

  /* Centreline for the coat painter. It runs the whole animal, neck included,
     so banding comes down the neck and resolves into rings out the tail —
     which is the one place a sauropod coat has somewhere to go. */
  const spine = [
    [n3[0], n3[1] + 4,   9*lM],          // base of the skull
    [n2[0], n2[1],      10*lM],
    [n1[0], n1[1],      13*lM],
    [shX - 2, shY + 2,  19*lM],          // shoulder hump
    [8*tor,   shY + 8,  22*lM],          // deepest, over the ribs
    [hipX,    hipY,     17*lM],          // hips
    [hipX + TL*22/86*tM, hipY + 1,  11*lM],    // tail
    [hipX + TL*44/86*tM, hipY + 3,   7*lM],
    [hipX + TL*66/86*tM, hipY + 6,   3.5*lM],
    [hipX + TL*tM,     hipY + 10,  1.5*lM]
  ];

  /* Headgear goes over the nasal arch, the only thing on this skull tall enough
     to hang a hat on. Both the centre and the width come off the arch's own
     control points rather than a fraction of the snout: the arch is built from
     `crTop` and `crBack`, which move with `st.horn` as the animal grows, so a
     hand-picked fraction of `sn` drifted across it — a pixel and a half behind
     the middle on an adult and the same distance in front of it on a hatchling,
     which is what made every hat look pushed off one edge or the other. */
  const crestBack = hx + 2*hM, crestFront = hx - sn*.62;
  /* Nudged forward off the exact summit. The arch is not symmetrical — the
     front slope is long and the back one drops away — so a hat centred on the
     highest pixel sits over the back slope and looks pushed off the edge, which
     is the complaint even though the arithmetic was centred. */
  return { eye:[hx - sn*.48, hy - hh*.3], eyeR:2.9*hM, mouth:[hx - sn*.9, hy + hh*.5],
           hat:[(crestBack + crestFront)/2 - sn*.12, hy - hh*crTop*.97],
           hatW: (crestBack - crestFront)*1.05,
           top: hy - hh*crTop, spine };
}
