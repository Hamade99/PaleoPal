  tossFood(id);                                   // the food arcs in; effects land on the bite
  refreshLight();
}
function swallow(id){
  const f = FOODS.find(x => x.id === id), sp = SPECIES[S.sp];
  const loved = sp.likes.includes(id), hated = sp.dislikes.includes(id);
  const tA = trait('appetite');
  S.needs.hunger = clamp(S.needs.hunger + f.fill * (hated ? .5 : 1), 0, 100);
  S.needs.joy = clamp(S.needs.joy + (f.joy + (loved ? 9 : hated ? -6 : 0)) * tA.foodJoy, 0, 100);
  if (loved){ S.bond = clamp(S.bond + 1.5, 0, 100); emit('heart', dino.x, dinoTop - 4, 3, {vy:-16}); }
  if (f.treat) S.treats.push(Date.now());
  S.tally = S.tally || {};
  S.tally.meals = (S.tally.meals || 0) + 1;
  say(loved ? 'Its favourite. Gone in one gulp.' : hated ? 'It eats it. Slowly. Resentfully.' : 'Nom.');
  refresh();
}
function scrub(){
  if (S.asleep) return refuse(S.name + ' is asleep.');
  const n = S.mess.length;
  S.mess.forEach(m => emit('spark', m.x, GROUND-6, 4));
  S.mess = [];
  G.coins += n;
  S.needs.hygiene = clamp(S.needs.hygiene + 22 + n*10, 0, 100);
  S.needs.joy = clamp(S.needs.joy + 4, 0, 100);
  SFX.wash();
  say(n ? 'Scrubbed clean. Found ' + n + ' coin' + (n>1?'s':'') + ' in the muck.' : 'A good rinse.');
  emit('spark', dino.x, GROUND-30, 8);
  refresh();
}
/* `at` is the point in canvas units that was actually touched. Hearts used to
   come off a fixed spot above the sprite, which read as unrelated to the tap;
   they now rise from under the finger. */
function pet(at){
  if (!hatched() || S.asleep || S.vet) return;
  const now = performance.now();
  if (now - (S.lastPetAt||0) < 320) return;
  S.lastPetAt = now;
  S.petBank++;
  const gain = clamp(1.1 - S.bond/160, .25, 1.1) * trait('social').bond;
  S.bond = clamp(S.bond + gain, 0, 100);
  S.needs.joy = clamp(S.needs.joy + 1.6, 0, 100);
  const hx = at ? at[0] : dino.x, hy = at ? at[1] : dinoTop - 4;
  emit('heart', hx - 3, hy - 6, 1, {vx:5, vy:-19, life:1000});
  SFX.purr();
  if (hasIll('blues') && S.petBank >= 8) cure('company', true);
  refreshLight();
}
function tuckIn(){
  if (!hatched()) return;
  if (S.vet) return refuse(S.name + ' is already down.');
  if (S.asleep) return refuse(S.name + ' is already asleep.');
  if (S.needs.energy > 70) return refuse('Too wide awake to settle. Try below 70 energy.');
  setSleep(true, true);
  S.bond = clamp(S.bond + 1.5, 0, 100);
  S.nightAwake = 0;
  S.wokeAt = 0;
  say(S.name + ' curls up and goes out like a light.');
  refresh();
}
/* The other half of the switch, and the one that was missing entirely: an
   animal put itself to sleep and there was no way to get it back. It could be
   starving, filthy and asleep at once, and every key that would have fixed
   that refused because it was asleep.

   Waking costs, because sleep is how energy comes back and the animal went
   under for a reason. It loses a little of what it had banked and a little
   trust, and at night it starts running up the late-hours count — the same
   field a player who keeps their animal up past bedtime fills, and the one
   that brings on a chill. The cost is a consequence of a decision, not a
   die roll. */
function wakeUp(){
  if (!hatched()) return;
  if (S.vet) return refuse(S.name + ' has not fallen asleep. It has collapsed, and needs a vet.');
  if (!S.asleep) return refuse(S.name + ' is already awake.');
  setSleep(false, true);
  S.wokeAt = Date.now();
  S.needs.energy = clamp(S.needs.energy - 4, 0, 100);
  S.bond = clamp(S.bond - 2, 0, 100);
  if (isNight()) S.nightAwake += .5;
  logEvent(S.name + ' was woken early.');
  say(S.name + ' blinks awake, and is not impressed.');
  refresh();
}
function treat(remedyId){
  const r = REMEDIES.find(x => x.id === remedyId);
  if (G.coins < r.cost) return refuse('Not enough coins.');
  if (!S.ills.length) return refuse('Nothing to treat. ' + S.name + ' is well.');
  if (hasIll(r.cures)) return cure(remedyId);
  G.coins -= r.cost;
  S.bond = clamp(S.bond - 2, 0, 100);
  SFX.bonk();
  say('That was not it. ' + S.name + ' looks no better.');
  logEvent('Tried ' + r.name.toLowerCase() + '. Wrong call.');
  refresh();
}
function cure(remedyId, free){
  const r = REMEDIES.find(x => x.id === remedyId);
  if (!free) G.coins -= r.cost;
  S.ills = S.ills.filter(i => i.id !== r.cures);
  S.health = clamp(S.health + 30, 0, 100);
  S.bond = clamp(S.bond + 4, 0, 100);
  S.petBank = 0;
  if (r.cures === 'chill') S.nightAwake = 0;
  if (r.cures === 'mites') S.needs.hygiene = clamp(S.needs.hygiene + 30, 0, 100);
  if (r.cures === 'blues') S.needs.joy = clamp(S.needs.joy + 25, 0, 100);
  SFX.hatch();
  anim.play('cheer', 1400);
  emit('heart', dino.x, GROUND-40, 6);
  say(S.name + ' shakes it off. That was the right call.');
  logEvent('Cured ' + ILLS[r.cures].name.toLowerCase() + '.');
  refresh();
}
function vetVisit(){
  if (G.coins < 30) return refuse('The vet costs 30 coins.');
  G.coins -= 30; S.vet = false; S.health = 60; S.ills = [];
  S.needs.hunger = Math.max(S.needs.hunger, 50);
  S.needs.joy = Math.max(S.needs.joy, 40);
  S.bond = clamp(S.bond - 5, 0, 100);
  setSleep(false, true);
  logEvent('Came home from the vet.');
  say(S.name + ' is home and steady again.');
  refresh();
}
function buyHat(id){
  const h = HAT_SHOP.find(x => x.id === id), slot = h.slot;
  if (S.owned.includes(id)){ S[slot] = S[slot] === id ? null : id; SFX.pop(); refresh(); return; }
  if (G.coins < h.cost) return refuse('Not enough coins.');
  G.coins -= h.cost; S.owned.push(id); S[slot] = id;
  SFX.coin(); say('Suits it.');
  refresh();
}
function buySkin(id){
  const k = skinOf(S.sp, id);
  if (S.skinsOwned.includes(id)){
    S.skin = id; SFX.pop(); say(S.name + ' tries on ' + k.name.toLowerCase() + '.');
    refresh(); return;
  }
  if (G.coins < k.cost) return refuse('Not enough coins.');
  G.coins -= k.cost; S.skinsOwned.push(id); S.skin = id;
  SFX.coin(); say('A whole new coat.');
  logEvent('Unlocked the ' + k.name.toLowerCase() + ' coat.');
  refresh();
}
function doTrick(){
  if (bondPips() < 3) return refuse(S.name + ' does not know you well enough yet.');
  if (S.asleep) return refuse(S.name + ' is asleep.');
  S.needs.joy = clamp(S.needs.joy + 12, 0, 100);
  S.needs.energy = clamp(S.needs.energy - 3, 0, 100);
  S.bond = clamp(S.bond + .8, 0, 100);
  anim.play('cheer', 1600); SFX.roar();
  emit('note', dino.x, dinoTop, 5, {vy:-18, life:1100});
  say(pick(['It spins on the spot.','A short, proud roar.','It stamps twice and looks at you.']));
  closeSheet(); refresh();
}
function refuse(msg){ SFX.bonk(); say(msg); }

/* ------------------------------- the nest ---------------------------------- */
function switchPet(i){
  if (i === G.active || !G.pets[i]) return;
  G.active = i; S = G.pets[i];
  dino.x = W/2; dino.tx = W/2; dino.dist = 0; dino.dig = 0;
  feedFX = null;
  mode = hatched() ? 'live' : (S.sp ? 'egg' : 'choose');
  anim.play('idle', 0);
  closeSheet();
  document.title = (S.name || 'Paleopal') + ' — Paleopal';
  if (hatched()) say(S.name + ' trots over.');
  refresh(); paintChrome(); save();
}
function newEgg(){
  if (G.pets.length >= MAX_PETS) return refuse('The nest is full at ' + MAX_PETS + '.');
  G.pets.push(freshPet());
  G.active = G.pets.length - 1;
  S = G.pets[G.active];
  mode = 'choose';
  closeSheet(); refresh(); paintChrome(); save();
}
function releasePet(i){
  if (G.pets.length <= 1) return refuse('That is your only animal.');
  G.pets.splice(i, 1);
  G.active = clamp(G.active >= i ? G.active - 1 : G.active, 0, G.pets.length - 1);
  S = G.pets[G.active];
  mode = hatched() ? 'live' : (S.sp ? 'egg' : 'choose');
  closeSheet(); refresh(); paintChrome(); save();
}

/* ==========================================================================
   DEVELOPER TOOLS
   A test harness, not a cheat menu. There is no way to check a sprite across
   four growth stages, or to see what mites look like, without either playing
   for four hours or reaching in and setting the value. Everything here writes
   the same fields the simulation writes, so nothing below can produce a state
   the game could not have reached on its own.

   `G.dev` gates the button in the top bar; long-pressing the brand plate
   toggles it. It ships on. See ROADMAP.md — it comes off before release.
   ========================================================================== */
const DEV_COINS = 99999;

const DEV = {
  /* --- purse --- */
  fillPurse(){ G.coins = DEV_COINS; DEV.done('Purse filled.'); },
  addCoins(n){ G.coins = clamp(G.coins + n, 0, DEV_COINS); DEV.done('+' + n + ' coins.'); },
  emptyPurse(){ G.coins = 0; DEV.done('Purse emptied.'); },

  /* --- growth ---
     stageIdx() compares against GROWTH_GATES with <, so parking growth exactly
     on a gate lands in the stage above it. stageSeen is moved with it, or the
     next tick announces a growth spurt that did not happen. */
  setStage(i){
    if (!hatched()) return refuse('Hatch something first.');
    S.growth = i === 0 ? 0 : GROWTH_GATES[i-1];
    S.stageSeen = i;
    DEV.done(S.name + ' is now ' + article(STAGE[i].label) + STAGE[i].label.toLowerCase() + '.');
  },

  /* --- needs and health --- */
  fillNeeds(){
    for (const k in S.needs) S.needs[k] = 100;
    S.health = 100; S.vet = false; S.asleep = false;
    DEV.done('Every meter full.');
  },
  drainNeeds(){
    for (const k in S.needs) S.needs[k] = 8;
    DEV.done('Every meter down to eight.');
  },
  setBond(v){ S.bond = clamp(v, 0, 100); DEV.done('Bond set to ' + Math.round(S.bond) + '.'); },
  collapse(){ S.health = 0; S.vet = true; S.asleep = true; DEV.done(S.name + ' has collapsed.'); },
  toggleSleep(){ S.asleep = !S.asleep; DEV.done(S.asleep ? 'Asleep.' : 'Awake.'); },

  /* --- illness --- */
  toggleIll(id){
    if (hasIll(id)) S.ills = S.ills.filter(i => i.id !== id);
    else S.ills.push({ id, since: Date.now() });
    DEV.done(hasIll(id) ? ILLS[id].name + ' set.' : ILLS[id].name + ' cleared.');
  },
  cureAll(){ S.ills = []; S.vet = false; S.health = Math.max(S.health, 60); DEV.done('All clear.'); },

  /* --- world --- */
  addMess(){ if (S.mess.length < 4) S.mess.push({ x: rnd(28, W-28) }); DEV.done('Mess dropped.'); },
  clearMess(){ S.mess = []; DEV.done('Pen cleaned.'); },

  /* --- wardrobe --- */
  unlockAll(){
    S.skinsOwned = SKINS[S.sp].map(k => k.id);
    S.owned = HAT_SHOP.map(h => h.id);
    DEV.done('Every coat and every hat unlocked.');
  },

  /* --- species ---
     Coats are per species, so the wardrobe has to be reset with the skeleton
     or S.skin points at an id that SKINS[S.sp] has never heard of. */
  becomeSpecies(id){
    S.sp = id;
    S.skin = 'wild'; S.skinsOwned = ['wild'];
    if (!S.born){ S.born = Date.now(); S.stageSeen = stageIdx(); }
    if (!S.name) S.name = pick(NAMES);
    mode = 'live';
    DEV.done('Now ' + article(SPECIES[id].common) + SPECIES[id].common + '.');
  },
  hatchNow(){
    if (!S.sp) return refuse('Pick an egg first.');
    if (S.born) return refuse('Already hatched.');
    hatch();
  },

  /* --- time --- */
  bumpStreak(){ G.streak += 1; G.lastDay = new Date().toDateString(); DEV.done('Streak is ' + G.streak + '.'); },

  done(msg){
    save(); refresh(); paintChrome();
    if (msg) say(msg);
    if (openPanel) renderSheet(openPanel);
  }
};

/* ==========================================================================
   BEHAVIOUR + RENDER
   ========================================================================== */

const cv = $('scene'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

let mode = 'boot';            // boot | choose | egg | live | game
let dino = { x: W/2, dir: -1, tx: W/2, until: 0, walking:false, dig:0, digAt: 0, dist: 0 };
let dinoTop = GROUND - 40, dinoBox = [0,0,0,0];
let egg = { cracks: 0, wob: 0 };
let game = null, feedFX = null;
let blinkAt = 0, blinking = false, zAt = 0;

const anim = {
  name:'idle', frame:0, t:0, until:0,
  play(n, ms){ this.name = n; this.frame = 0; this.t = 0; this.until = performance.now() + ms; },
  pick(){
    if (performance.now() < this.until) return this.name;
    if (S.vet || S.asleep) return 'sleep';
    if (S.ills.length) return 'sick';
    return dino.walking ? 'walk' : 'idle';
  }
};

let sayTimer = 0;
function say(text, ms){
  const b = $('bubble');
  b.textContent = text; b.classList.add('on');
  clearTimeout(sayTimer);
  sayTimer = setTimeout(() => b.classList.remove('on'), ms || 2800);
}

/* ------------------------------ feeding ----------------------------------- */
function tossFood(id){
  feedFX = { id, t: 0, phase: 'fly', from: [dino.x - dino.dir*46, 8], id2: id };
  SFX.pop();
}
function stepFeed(dt){
  if (!feedFX) return;
  feedFX.t += dt;
  if (feedFX.phase === 'fly' && feedFX.t > 620){
    feedFX.phase = 'bite'; feedFX.t = 0;
    anim.play('eat', 1500); SFX.chomp();
    emit('crumb', dino.x - 12*dino.dir, GROUND-26, 8, {vy:12, g:90, life:600});
    swallow(feedFX.id);
  } else if (feedFX.phase === 'bite' && feedFX.t > 900){
    feedFX = null;
  }
}
function drawFeed(g, mouth){
  if (!feedFX || feedFX.phase !== 'fly') return;
  const u = clamp(feedFX.t / 620, 0, 1);
  const x = lerp(feedFX.from[0], mouth[0], u);
  const y = lerp(feedFX.from[1], mouth[1], u) - Math.sin(u*Math.PI) * 22;
  drawItem(g, feedFX.id, Math.round(x) - 3, Math.round(y) - 2, 1.6);
}

/* ------------------------------ behaviour --------------------------------- */
function stepBehaviour(dt, now){
  if (mode !== 'live') return;
  const busy = feedFX || performance.now() < anim.until;
  const canMove = !S.asleep && !S.vet && !S.ills.length && !busy;

  if (dino.dig > 0){
    dino.dig -= dt;
    if (Math.random() < .35) emit('crumb', dino.x - 12*dino.dir, GROUND-2, 1, {vy:-18, g:120, life:520});
    if (dino.dig <= 0){
      const found = 3 + ((Math.random()*4)|0) + (bondPips() >= 4 ? 3 : 0);
      G.coins += found;
      SFX.coin(); emit('spark', dino.x - 12*dino.dir, GROUND-8, 6);
      say('Dug up a fossil chip. +' + found + ' coins.');
      dino.digAt = now + rnd(6,11)*MIN;
      refreshLight();
    }
    dino.walking = false;
    return;
  }
  if (!canMove){ dino.walking = false; return; }

  if (now > dino.until){ dino.tx = rnd(26, W-26); dino.until = now + rnd(2600, 6500) / trait('tempo').speed; }
  const d = dino.tx - dino.x;
  if (Math.abs(d) > 3){
    dino.walking = true; dino.dir = d > 0 ? 1 : -1;
    const step = SPECIES[S.sp].speed * trait('tempo').speed * (0.6 + stageIdx()*0.14) * dt/1000;
    dino.x += dino.dir * step;
    dino.dist += step;
  } else dino.walking = false;

  if (now > dino.digAt && !dino.walking && S.needs.energy > 30){ dino.dig = 1800; say('Sniff, sniff...'); }
}

/* ------------------------------- draw ------------------------------------- */
let lastSceneAt = 0;
let screenLayout = null;
function drawScene(now){
  const dt = clamp(now - lastSceneAt, 0, 120); lastSceneAt = now;

  /* A screen replaces the view rather than sliding over it. On the device this
     copies there is one display and it shows one thing at a time; leaving the
     habitat visible behind a menu is what a web overlay does. */
  if (screenOpen()){
    const sc = SCREENS[screen];
    screenLayout = sc.layout ? sc.layout() : {};
    sc.draw(ctx, screenLayout);
    return;
  }
  const phase = skyPhase(new Date());
  ctx.drawImage(bakeBg(phase), 0, 0);

  if (phase === 'night'){
    for (const s of STARS){
      const tw = Math.sin(now/520 + s.p);
      if (tw > .15){ ctx.fillStyle = tw > .8 ? '#ffffff' : 'rgba(232,228,200,.8)'; ctx.fillRect(s.x|0, s.y|0, 1, 1); }
    }
  }
  drawSkyBody(ctx, phase, now);
  drawPlume(ctx, phase, now);
  drawClouds(ctx, phase, dt);
  drawFlyers(ctx, dt, now);
  drawWater(ctx, phase, now);
  drawGrassLine(ctx, phase, now);
  if (phase !== 'night') drawMotes(ctx, dt, phase);

  if (mode === 'choose'){ drawChoose(now); drawFronds(ctx, phase, now); return; }
  if (mode === 'egg'){ drawEgg(now); drawFronds(ctx, phase, now); return; }
  if (mode === 'game'){ drawGame(now, phase); return; }
  drawLive(now, dt);
  drawFronds(ctx, phase, now);
  const tint = SKY_SPECS[phase].tint;
  if (tint !== 'rgba(0,0,0,0)'){ ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H); }
}

function drawChoose(now){
  eggChoices().forEach((c, i) => {
    const bounce = Math.sin(now/420 + i*2) * 2;
    drawEggArt(ctx, c.x, GROUND - 16 + bounce, c.id, 0);
    ctx.fillStyle = 'rgba(16,26,24,.55)';
    ctx.beginPath(); ctx.ellipse(c.x, GROUND + 1, 11, 3, 0, 0, 7); ctx.fill();
  });
}
function drawEggArt(g, cx, cy, spId, cracks){
  const tint = SPECIES[spId].eggTint;
  g.fillStyle = '#221a12'; g.beginPath(); g.ellipse(cx, cy, 13, 17, 0, 0, 7); g.fill();
  g.fillStyle = '#efe3c4'; g.beginPath(); g.ellipse(cx, cy, 12, 16, 0, 0, 7); g.fill();
  g.fillStyle = '#faf4de'; g.beginPath(); g.ellipse(cx - 4, cy - 6, 3.5, 4, 0, 0, 7); g.fill();
  g.fillStyle = tint;
  [[-5,1],[4,-3],[0,7],[6,5],[-6,7],[2,-8]].forEach(p => g.fillRect(cx+p[0], cy+p[1], 3, 3));
  if (cracks > 0){
    g.strokeStyle = '#221a12'; g.lineWidth = 1; g.beginPath();
    let x = cx - 6, y = cy - 9;
    g.moveTo(x, y);
    for (let i = 0; i < cracks; i++){ x += (i%2 ? 5 : 4) * (i%2?1:-1) + 4; y += 4; g.lineTo(x, y); }
    g.stroke();
  }
}
function drawEgg(now){
  const wob = egg.wob > 0 ? Math.sin(now/40) * 2 : 0;
  egg.wob = Math.max(0, egg.wob - .06);
  ctx.fillStyle = 'rgba(16,26,24,.5)';
  ctx.beginPath(); ctx.ellipse(W/2, GROUND + 1, 12, 3, 0, 0, 7); ctx.fill();
  drawEggArt(ctx, W/2 + wob, GROUND - 16, S.sp, egg.cracks);
}

/* headgear rides the anchors the sprite hands back, so it sits on the skull or
   across the eyes rather than floating at a guessed offset */
function drawGear(g, f, x, y, flip){
  const place = (id, anchor, scale) => {
    if (!id || !HATS[id]) return;
    const art = HATS[id], w = art.width * scale, hgt = art.height * scale;
    const ax = flip ? x + (f.ox - anchor[0]) : x - f.ox + anchor[0];
    const ay = y - f.oy + anchor[1];
    g.save(); g.translate(Math.round(ax), Math.round(ay));
    if (flip) g.scale(-1, 1);
    g.drawImage(art, -w/2, -hgt, w, hgt);
    g.restore();
  };
  place(S.hat, f.hat, Math.max(.6, f.hs * 1.55));
  if (S.face && HATS[S.face]){
    const art = HATS[S.face], scale = Math.max(.5, f.eyeR * 3.6 / art.width);
    const w = art.width * scale, hgt = art.height * scale;
    const ax = flip ? x + (f.ox - f.eye[0]) : x - f.ox + f.eye[0];
    const ay = y - f.oy + f.eye[1];
    g.save(); g.translate(Math.round(ax), Math.round(ay));
    if (flip) g.scale(-1, 1);
    g.drawImage(art, -w*.42, -hgt*.55, w, hgt);
    g.restore();
  }
}

function drawLive(now, dt){
  for (const m of S.mess){
    drawMess(ctx, m.x|0, GROUND - 1);
    const fx = m.x + Math.sin(now/280 + m.x) * 5, fy = GROUND - 12 + Math.cos(now/430 + m.x) * 2;
    ctx.fillStyle = '#2f2f2f'; ctx.fillRect(fx|0, fy|0, 1, 1);
    if (Math.random() < .01) emit('stink', m.x, GROUND - 6, 1, {vy:-12, life:1000});
  }
  if (now > blinkAt){ blinking = true; blinkAt = now + rnd(2400, 5200); setTimeout(() => blinking = false, 150); }

  const st = stageIdx(), a = anim.pick(), sp = SPECIES[S.sp];
  // real elapsed time, not an assumed sixty frames a second. On a 120Hz phone
  // the hardcoded 16 ran eat and cheer at double speed.
  anim.t += dt;
  let fr;
  if (a === 'walk'){
    const cycle = Math.max(3, sp.strideBase * STAGE[st].limb * STAGE[st].s * sp.scale);
    fr = Math.floor((dino.dist / cycle) * POSES.walk.length);
  } else {
    const fps = a === 'eat' ? 220 : a === 'cheer' ? 200 : 700;
    fr = Math.floor(anim.t / fps);
  }
  const f = frameOf(S.sp, st, a, fr, blinking && a === 'idle', S.skin);

  const flip = dino.dir > 0;
  const x = Math.round(dino.x), y = GROUND;
  ctx.fillStyle = 'rgba(16,26,24,.32)';
  ctx.beginPath(); ctx.ellipse(x, y + 1, f.w * .38, 3, 0, 0, 7); ctx.fill();

  ctx.save(); ctx.translate(x, y);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(f.cv, -f.ox, -f.oy);
  ctx.restore();

  dinoTop = y - f.oy;
  dinoBox = flip ? [x - (f.w - f.ox), dinoTop, x + f.ox, y] : [x - f.ox, dinoTop, x - f.ox + f.w, y];
  drawGear(ctx, f, x, y, flip);

  const mouth = [flip ? x + (f.ox - f.mouth[0]) : x - f.ox + f.mouth[0], y - f.oy + f.mouth[1]];
  drawFeed(ctx, mouth);

  /* Zs on a clock rather than a two-percent chance per frame: at 120Hz that
     was twice as many as at 60, and either way it could go seconds without
     one, which is a poor signal for the state it is the signal for. */
  if (S.asleep && now > zAt){ zAt = now + 1100; emit('bubbleZ', x + 10*(flip?-1:1), dinoTop + 2, 1, {vy:-13, vx:3, life:2100}); }
  if (hasIll('chill') && Math.random() < .012){ emit('spark', x - 14*dino.dir, dinoTop + 8, 2, {col:'#cfe0e8'}); SFX.sneeze(); }
  if (hasIll('mites') && Math.random() < .02) emit('crumb', x + rnd(-10,10), dinoTop + 10, 1, {col:'#8a7350', vy:-6, g:40});
  if (dino.dig > 0){ ctx.fillStyle='#8f6f4c'; ctx.fillRect(x - 16*dino.dir, GROUND-2, 6, 2); }

  if (S.asleep){ ctx.fillStyle = 'rgba(14,16,44,.28)'; ctx.fillRect(0, 0, W, H); }
  drawParts(ctx);
  stateMark(ctx, x, dinoTop, now);
}

/* An unwell animal and a sleeping one used to be told apart only by their
   eyelids, and the sick pose kept the eyes shut for as long as the illness
   lasted — so the answer to "why are its eyes closed all day" was a bellyache
   nothing on the glass ever mentioned. The eyes differ now, and this puts the
   reason above the animal's head in the one place the player is already
   looking. Illness beats sleep, because a sick animal that is also asleep
   still needs a remedy. */
function stateMark(g, x, top, now){
  const ill = S.vet || S.ills.length;
  if (!ill && !S.asleep) return;
  const bob = Math.round(Math.sin(now/620) * 1.5);
  const px = Math.round(x) - 5, py = Math.round(top) - 15 + bob;
  if (ill){
    /* Eleven across, not nine. At nine the arms of the cross reached the
       edge of the plaque and the whole mark read as a red square. */
    g.fillStyle = '#231a16';                                  // hard edge, all round
    g.fillRect(px, py, 11, 11);
    g.fillStyle = '#f2e7cd';                                  // bone plaque
    g.fillRect(px+1, py+1, 9, 9);
    g.fillStyle = S.vet ? '#8f2f2a' : '#c2452f';              // the cross
    g.fillRect(px+4, py+2, 3, 7); g.fillRect(px+2, py+4, 7, 3);
    return;
  }
  // asleep: one steady Z over the head, with the drifting ones behind it
  g.fillStyle = '#1b2038';
  g.fillRect(px, py, 11, 11);
  g.fillStyle = '#2b3358';
  g.fillRect(px+1, py+1, 9, 9);
  g.fillStyle = '#dfe4f6';
  g.fillRect(px+2, py+2, 7, 2); g.fillRect(px+6, py+4, 2, 1);
  g.fillRect(px+5, py+5, 2, 1); g.fillRect(px+4, py+6, 2, 1);
  g.fillRect(px+2, py+7, 7, 2);
}

/* ============================== MINIGAMES ================================== */
const GAMES = {
  snack: { name:'Snack run',  blurb:'Thirty seconds. Catch the food, dodge the rocks. Five in a row and each catch counts double.', pay:2 },
  forage:{ name:'Forage',     blurb:'Food turns up around the pen and spoils where it lies. Tap to send your animal, and beat the compies to it.', pay:2 },
  leap:  { name:'River leap', blurb:'Your animal runs. Tap anywhere to jump the logs and boulders coming at it.', pay:3 }
};
function startGame(kind){
  if (S.asleep) return refuse(S.name + ' is asleep.');
  if (S.vet) return refuse(S.name + ' is in no state to play.');
  if (S.needs.energy < 12) return refuse('Too tired to run around.');
  closeSheet();
  mode = 'game'; feedFX = null;
  if (kind === 'snack') game = { kind, x:W/2, tx:W/2, dir:-1, items:[], score:0, combo:0, left:30, spawn:.5, stun:0, kL:false, kR:false };
  if (kind === 'forage') game = { kind, x:W/2, tx:W/2, dir:-1, dist:0, walking:false,
                                  snap:0, finds:[], thief:null, thiefAt:rnd(3,6),
                                  score:0, chain:0, missed:0, left:30, spawn:.4 };
  if (kind === 'leap')  game = { kind, obs:[], score:0, left:30, y:0, vy:0, spawn:1.1, speed:78, run:0, stun:0 };
  say(GAMES[kind].blurb.split('.')[0] + '.');
  paintChrome();
}
function endGame(){
  if (!game) return;
  const g = GAMES[game.kind], earned = game.score * g.pay;
  G.coins += earned;
  S.needs.joy = clamp(S.needs.joy + Math.min(34, game.score * 2.4), 0, 100);
  S.needs.energy = clamp(S.needs.energy - 7, 0, 100);
  S.bond = clamp(S.bond + (game.score > 8 ? 3 : 1), 0, 100);
  if (game.score > 8) logEvent('A good run at ' + g.name.toLowerCase() + ': ' + game.score + '.');
  say(game.score ? 'Scored ' + game.score + '. That is ' + earned + ' coins.' : 'Nothing scored. Next time.');
  if (game.score) SFX.coin();
  game = null; mode = 'live';
  paintChrome(); refresh();
}
function stepGame(dt, now){
  if (!game) return;
  game.left -= dt/1000;
  if (game.left <= 0) return endGame();
  if (game.kind === 'snack') return stepSnack(dt, now);
  if (game.kind === 'forage') return stepForage(dt, now);
  if (game.kind === 'leap')  return stepLeap(dt, now);
}
function drawGame(now, phase){
  if (game.kind === 'snack') drawSnack(now);
  if (game.kind === 'forage') drawForage(now);
  if (game.kind === 'leap')  drawLeap(now);
  drawParts(ctx);
  ctx.fillStyle = 'rgba(16,22,24,.78)'; ctx.fillRect(0, 0, W, 9);
  ctx.fillStyle = game.left < 6 ? '#c2603c' : '#7ea55f';
  ctx.fillRect(1, 2, Math.round((W-2) * game.left/30), 5);
}
function gameSprite(anim2, frame, scaleTo){
  const f = frameOf(S.sp, stageIdx(), anim2, frame, false, S.skin);
  return { f, sc: Math.min(1, scaleTo / f.h) };
}

/* ------ snack run ------ */
function stepSnack(dt, now){
  let vx = 0;
  if (game.kL) vx -= 110; if (game.kR) vx += 110;
  if (!vx) vx = clamp((game.tx - game.x) * 7, -135, 135);
  if (now < game.stun) vx = 0;
  /* Which way it is facing comes from which way it is actually moving. It used
     to come from `tx < x`, which is inverted — the sprite is drawn facing −x,
     so flipping it is what points it right — and which the arrow keys never
     touched at all, because they drive `vx` and leave `tx` where it was. Both
     together meant the animal moonwalked to the right and then kept facing
     the wrong way for the rest of the round. */
  if (vx) game.dir = vx > 0 ? 1 : -1;
  game.x = clamp(game.x + vx * dt/1000, 18, W-18);
  game.spawn -= dt/1000;
  if (game.spawn <= 0){
    game.spawn = rnd(.42, .72);
    const sp = SPECIES[S.sp], rock = Math.random() < .22;
    game.items.push({ x: rnd(16, W-16), y: 4, vy: rnd(44, 62), id: rock ? 'rock' : pick(sp.likes.concat(['berry','fern'])), rock });
  }
  const mouthY = GROUND - 34;
  for (const it of game.items){
    it.y += it.vy * dt/1000;
    if (it.y > mouthY - 6 && it.y < mouthY + 22 && Math.abs(it.x - game.x) < 15){
      it.dead = true;
      if (it.rock){ game.combo = 0; game.stun = now + 750; SFX.bonk(); emit('spark', game.x, mouthY, 4, {col:'#e8c352'}); }
      else { game.combo++; game.score += game.combo >= 5 ? 2 : 1; SFX.chomp(); emit('spark', it.x, it.y, 3); }
    }
    if (it.y > GROUND){ it.dead = true; if (!it.rock) game.combo = 0; }
  }
  game.items = game.items.filter(i => !i.dead);
}
function drawSnack(now){
  for (const it of game.items) drawItem(ctx, it.id, it.x - 3, it.y - 2, 1.5);
  const { f, sc } = gameSprite(now < game.stun ? 'sick' : 'walk', Math.floor(now/130), 44);
  const flip = game.dir > 0;                    // the sprite faces −x unflipped
  ctx.save(); ctx.translate(Math.round(game.x), GROUND);
  if (flip) ctx.scale(-1,1);
  ctx.drawImage(f.cv, -f.ox*sc, -f.oy*sc, f.w*sc, f.h*sc);
  ctx.restore();
  scoreTag('Caught ' + game.score + (game.combo >= 5 ? '  x2' : ''));
}

/* ------ forage ------

   This replaces Bug hunt, which had two faults and only one of them was a bug.

   The bug: critters spawned in two bands, one in the air and one on the
   ground *below* the grass line, and catching one meant bringing the animal's
   mouth anchor within eleven pixels of it in both axes. An adult's mouth sits
   around thirty pixels above the ground line, so nothing walking on the floor
   of the pen was ever reachable — half the quarry in the game could not be
   caught by any player at any skill.

   The design fault, which mattered more: the quarry was insects, and two of
   the three animals in this game are obligate herbivores. Nothing about
   Triceratops or Brachiosaurus makes chasing dragonflies across a pen a thing
   they would do, and no amount of fixing the hitbox was going to change that.

   So the quarry is food, and which food comes from the species' own `likes` —
   ferns and cycad cones for the ceratopsian, berries and cones for the
   sauropod, river fish and carrion for the tyrannosaur. Everything sits ON
   the ground line, where the animal's own feet are, so reach is a horizontal
   distance and nothing can spawn somewhere unreachable by construction.

   What makes it a game rather than a queue is the compsognathids. They come
   in from the edges and go for whatever has been sitting longest, and they
   are faster than any of the three animals you can raise. So it is not "walk
   to each thing in turn": it is a choice, every few seconds, between the
   close one and the one about to be stolen — and the walk cycle, the growth
   stage and the animal's own speed all decide whether you make it.
   -------------------------------------------------------------------------- */
const FORAGE_H = 50;                           // drawn sprite height in the pen
const FORAGE_LIFE = 4600;                      // how long a find sits before it spoils

function forageSprite(now){
  const snapping = now < game.snap;
  const sp = SPECIES[S.sp], st = stageIdx();
  if (snapping) return gameSprite('eat', Math.floor(now/150), FORAGE_H);
  if (!game.walking) return gameSprite('idle', Math.floor(now/700), FORAGE_H);
  // one sprite stride to one stride of ground, the same rule the habitat uses
  const probe = gameSprite('walk', 0, FORAGE_H);
  const cycle = Math.max(3, sp.strideBase * STAGE[st].limb * STAGE[st].s * sp.scale);
  const frame = Math.floor((game.dist / probe.sc) / cycle * POSES.walk.length);
  return gameSprite('walk', frame, FORAGE_H);
}

/* Somewhere to put a new find: on the ground, inside the pen, and not on top
   of one that is already there. */
function forageSlot(){
  for (let tries=0; tries<12; tries++){
    const x = rnd(18, W-18);
    if (game.finds.every(f => Math.abs(f.x - x) > 26)) return x;
  }
  return rnd(18, W-18);
}

function stepForage(dt, now){
  const sec = dt / 1000;

  // run toward the last place the player pointed
  const speed = 54 + stageIdx() * 11;
  const d = game.tx - game.x;
  if (Math.abs(d) > 1.5){
    const step = clamp(d, -speed*sec, speed*sec);
    game.x = clamp(game.x + step, 12, W - 12);
    game.dist += Math.abs(step);
    game.dir = step < 0 ? -1 : 1;
    game.walking = true;
  } else game.walking = false;

  // new finds
  game.spawn -= sec;
  if (game.spawn <= 0 && game.finds.length < 5){
    game.spawn = rnd(.95, 1.55);
    // what turns up is what this species eats, and nothing else
    game.finds.push({ x: forageSlot(), id: pick(SPECIES[S.sp].likes), age: 0 });
  }
  for (const f of game.finds){
    f.age += dt;
    if (f.age > FORAGE_LIFE){ f.dead = true; game.missed++; game.chain = 0; }
  }

  /* Thieves. One at a time, aimed at whatever has been down longest — the
     thing the player is most likely to have written off, which is what makes
     ignoring a find a decision rather than an oversight. */
  game.thiefAt -= sec;
  if (!game.thief && game.thiefAt <= 0 && game.finds.length){
    const mark = game.finds.reduce((a, b) => (b.age > a.age ? b : a));
    game.thief = { x: mark.x < W/2 ? -10 : W+10, mark, p:0, carry:false };
  }
  if (game.thief){
    const t = game.thief;
    t.p += dt;
    const goal = t.carry ? (t.x < W/2 ? -14 : W+14) : t.mark.x;
    const dir = goal > t.x ? 1 : -1;
    t.x += dir * 74 * sec;
    if (!t.carry && Math.abs(t.x - t.mark.x) < 3){
      if (t.mark.dead){ game.thief = null; game.thiefAt = rnd(2.2, 4.2); }
      else { t.mark.dead = true; t.carry = true; game.missed++; game.chain = 0; SFX.pop(); }
    } else if (t.carry && (t.x < -12 || t.x > W+12)){
      game.thief = null; game.thiefAt = rnd(2.2, 4.2);
    }
  }

  /* Reach. A horizontal distance along the ground, because everything here is
     on the ground — the old game measured to a mouth anchor thirty pixels up
     and then spawned half its quarry on the floor. */
  const reach = 12 + stageIdx() * 2;
  for (const f of game.finds){
    if (f.dead) continue;
    if (Math.abs(f.x - game.x) < reach){
      f.dead = true;
      game.chain++;
      game.score += game.chain >= 4 ? 2 : 1;
      game.snap = now + 260;
      if (game.thief && game.thief.mark === f && !game.thief.carry){
        game.thief = null; game.thiefAt = rnd(2.2, 4.2);    // beaten to it
      }
      SFX.chomp();
      emit('spark', f.x, GROUND - 4, 4, {col:'#cfe0a8'});
      emit('crumb', f.x, GROUND - 4, 3, {col:'#7d9c5a', vy:-14, g:110});
    }
  }
  game.finds = game.finds.filter(f => !f.dead);
  if (game.thief && game.thief.mark.dead && !game.thief.carry){
    game.thief = null; game.thiefAt = rnd(2.2, 4.2);
  }
}

/* A find: a scrape of turned earth with the item standing on it, over a bar
   that runs down as it spoils.

   Both parts have to fight the habitat for attention. Drawn small and flat on
   the grass line, among cycads and boulders and a watering hole, a fern frond
   is one more piece of scenery — so the earth is a mound in a colour nothing
   else in the pen uses, and the item stands clear above it at twice size.
   The bar is the only information the game gives, so it is under every find
   rather than only under the urgent one. */
function drawFind(g, f, now){
  const x = Math.round(f.x), u = clamp(f.age / FORAGE_LIFE, 0, 1);
  // the mound
  g.fillStyle = '#6b4a2a';
  g.fillRect(x-6, GROUND-1, 13, 4);
  g.fillRect(x-4, GROUND-3, 9, 2);
  g.fillStyle = '#8a6438';
  g.fillRect(x-4, GROUND-3, 9, 1);
  g.fillStyle = '#3a2716';
  g.fillRect(x-6, GROUND+2, 13, 1);
  /* The find itself, standing clear of the grass and bobbing once it starts
     to go over. It is drawn four more times underneath in near-black, one
     pixel out in each direction, which gives it the same hard outline every
     animal in this game has — a green fern frond on a green grass line is
     otherwise invisible, and the item is the thing the player is aiming at. */
  const bob = u > .70 ? Math.round(Math.sin(now/90)) : 0;
  const ix = x - 4 + bob, iy = GROUND - 12;   // standing on the mound, not over it
  for (const d of [[-1,0],[1,0],[0,-1],[0,1]])
    drawItem(g, f.id, ix + d[0], iy + d[1], 1.6, '#1c160e');
  drawItem(g, f.id, ix, iy, 1.6);
  // freshness
  const w = Math.max(1, Math.round(13 * (1 - u)));
  g.fillStyle = '#101a18'; g.fillRect(x - 8, GROUND + 4, 17, 5);
  g.fillStyle = '#2b3a3f'; g.fillRect(x - 7, GROUND + 5, 15, 3);
  g.fillStyle = u > .70 ? '#e2704a' : u > .45 ? '#e8bd4e' : '#8cc46a';
  g.fillRect(x - 7 + (13 - w), GROUND + 5, w + 2, 3);
}

/* Compsognathus: a metre of animal and mostly tail, which at this size is a
   body three pixels deep, a neck and a tail as long as the rest of it. It is
   painted light with a hard dark edge, because the one thing it must not do
   is disappear into the treeline it walks out of. */
function drawThief(g, t){
  const x = Math.round(t.x), y = GROUND - 8, run = Math.sin(t.p/70) > 0;
  const face = t.x < W/2 ? 1 : -1;                           // it faces where it is going
  g.fillStyle = '#241d13';                                   // the hard edge, drawn under
  g.fillRect(x - 6, y + 1, 11, 6);
  g.fillRect(x + face*3 - 1, y - 1, 5, 5);
  g.fillStyle = '#c9a355';
  g.fillRect(x - 4, y + 2, 8, 4);                            // body
  g.fillRect(x + face*3, y, 3, 3);                           // head
  g.fillStyle = '#e6cf94';
  g.fillRect(x - 4, y + 2, 8, 1);
  g.fillStyle = '#8a6c34';
  for (let i=0;i<6;i++) g.fillRect(x - 5 - face*i*2, y + 3 + (i>3?1:0), 2, 1);   // tail
  g.fillStyle = '#c9a355';
  g.fillRect(x - 2, y + 6, 2, run ? 3 : 2);                  // legs
  g.fillRect(x + 2, y + 6, 2, run ? 2 : 3);
  g.fillStyle = '#241d13'; g.fillRect(x + face*4, y + 1, 1, 1);
  if (t.carry){ g.fillStyle = '#cfe0a8'; g.fillRect(x + face*5, y + 3, 3, 3); }
}

function drawForage(now){
  for (const f of game.finds) drawFind(ctx, f, now);

  const { f, sc } = forageSprite(now);
  const flip = game.dir > 0;
  const x = Math.round(game.x);
  ctx.fillStyle = 'rgba(16,26,24,.32)';
  ctx.beginPath(); ctx.ellipse(x, GROUND + 1, f.w*sc*.38, 3, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(x, GROUND);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(f.cv, -f.ox*sc, -f.oy*sc, f.w*sc, f.h*sc);
  ctx.restore();

  if (game.thief) drawThief(ctx, game.thief);

  // a marker where the animal has been told to go, so the order reads
  if (game.walking){
    const tx = Math.round(game.tx);
    ctx.fillStyle = 'rgba(207,224,168,.5)';
    ctx.fillRect(tx-3, GROUND+3, 7, 1); ctx.fillRect(tx, GROUND+1, 1, 5);
  }
  scoreTag('Found ' + game.score + (game.chain >= 4 ? '  x2' : ''));
}

function tapForage(mx, my){
  // tapping a find aims at the find; tapping the pen aims at the pen
  let best = null, bd = 30;
  for (const f of game.finds){
    const d = Math.abs(f.x - mx) + Math.abs(GROUND - 6 - my) * .35;
    if (d < bd){ bd = d; best = f; }
  }
  game.tx = clamp(best ? best.x : mx, 12, W - 12);
}

/* ------ river leap ------
   Three faults: the obstacles were plain rectangles whose bases sat a pixel
   above the grass line, so they appeared to hover; the habitat props sat
   there unmoving behind an animal that was supposed to be running; and there
   were only two obstacles in the deck.

   The pen is now overdrawn from the grass line down with a ground that
   scrolls, silhouette scrub behind the runner and tufts in front of it, all
   at different rates, so the animal is running through somewhere rather than
   on the spot. Obstacles are bedded two pixels into the grass and carry a
   contact shadow, and the water hazard the game is named for now exists.
   -------------------------------------------------------------------------- */
const LEAP_OBS = {
  log:   { half:12, clear:14 },
  rock:  { half:9,  clear:18 },
  water: { half:20, clear:8  }
};
const LEAP_KINDS = ['log','rock','water','log','rock'];

function stepLeap(dt, now){
  game.run += dt/1000 * game.speed;
  game.speed = Math.min(140, game.speed + dt/1000 * 3);
  game.vy += 340 * dt/1000;
  game.y = Math.min(0, game.y + game.vy * dt/1000);
  if (game.y === 0) game.vy = 0;
  game.spawn -= dt/1000;
  if (game.spawn <= 0){
    game.spawn = rnd(.85, 1.5) * (110 / game.speed);
    game.obs.push({ x: W + 14, kind: pick(LEAP_KINDS), hit:false, past:false });
  }
  for (const o of game.obs){
    o.x -= game.speed * dt/1000;
    const cfg = LEAP_OBS[o.kind];
    if (!o.hit && Math.abs(o.x - 54) < cfg.half && game.y > -cfg.clear){
      o.hit = true; game.speed = Math.max(70, game.speed * .7);
      game.stun = now + 500; SFX.bonk();
      if (o.kind === 'water') emit('spark', 54, GROUND-2, 8, {col:'#9fd2e0', vy:-30, g:150});
      else emit('crumb', 54, GROUND-8, 6, {col:'#9b7a52', vy:-20, g:120});
    }
    if (!o.past && o.x < 40){
      o.past = true;
      if (!o.hit){ game.score++; SFX.coin(); emit('spark', 54, GROUND-26, 3, {col:'#f0d888'}); }
    }
    if (o.x < -24) o.dead = true;
  }
  game.obs = game.obs.filter(o => !o.dead);
}
function leapJump(){
  if (!game || game.kind !== 'leap') return;
  if (game.y < -1) return;
  game.vy = -136; SFX.purr();
}

/* The track, overdrawn so the habitat props do not sit still behind a running
   animal. Three scroll rates: scrub, ground, fringe. */
function drawLeapGround(){
  const S_ = SKY_SPECS[skyPhase(new Date())];
  const grass = S_.grass, grassLit = mixHex(S_.grass, S_.low, .40);
  const grassDark = mixHex(S_.grass, '#000000', .34);
  const d0 = S_.dirt, d1 = mixHex(S_.dirt,'#000000',.26), d2 = mixHex(S_.dirt, S_.low,.22);
  const scrub = mixHex(S_.tree, '#000000', .18), scrubLit = mixHex(S_.tree, S_.low, .30);

  /* Scrub on the far side of the track. As a rectangle with a wider rectangle
     across it, in a colour a third of the way to the sky, this read as broken
     masonry — the whole strip looked like a ruin the animal was running past.
     It is built as a clump of fronds off a short stem now, in a colour that
     stays on the vegetation side of the palette. */
  for (let i=0;i<10;i++){
    const x = Math.round(((((i*47.3) - game.run*.42) % (W+70)) + W+70) % (W+70) - 35);
    const h = 7 + (i % 4) * 4, spread = 4 + (i % 3) * 2;
    ctx.fillStyle = scrub;
    ctx.fillRect(x, GROUND-1-h, 1, h);                       // stem
    for (let k=-spread;k<=spread;k++){                       // fronds arching off it
      const t = Math.abs(k)/spread;
      const top = Math.round(GROUND-1-h + t*t*h*.62);
      ctx.fillRect(x+k, top, 1, Math.round(h*.42*(1-t*.5)));
    }
    ctx.fillStyle = scrubLit;
    ctx.fillRect(x-1, GROUND-1-h, 2, 2);
  }

  // the track itself
  for (let x=0;x<W;x++){
    const wx = x + game.run;
    const t = (Math.sin(wx*.7) > .3 ? 1 : 0) + (Math.sin(wx*.31 + 2) > .55 ? 1 : 0);
    ctx.fillStyle = grass;    ctx.fillRect(x, GROUND-1-t, 1, 5+t);
    ctx.fillStyle = grassLit; ctx.fillRect(x, GROUND-1-t, 1, 1);
  }
  ctx.fillStyle = grassDark; ctx.fillRect(0, GROUND+3, W, 1);
  ctx.fillStyle = d0;        ctx.fillRect(0, GROUND+4, W, H-GROUND-4);
  for (let i=0;i<34;i++){
    const x = ((((i*17.7) - game.run) % (W+26)) + W+26) % (W+26) - 13;
    const y = GROUND + 6 + ((i*11) % (H-GROUND-9));
    ctx.fillStyle = d1; ctx.fillRect(x|0, y, 2 + (i%2), 1);
    if (i % 3 === 0){ ctx.fillStyle = d2; ctx.fillRect(x|0, y-1, 1, 1); }
  }
}
/* The near fringe.

   This used to be fourteen one-pixel tufts scattered at random heights across
   the whole dirt band, which is not what a foreground is: they read as green
   specks sprinkled over bare earth, drifting past for no reason. Grass grows
   in a continuous mat, and a foreground is a band along the bottom edge that
   the animal runs behind. It is one unbroken fringe rooted off the bottom of
   the screen now, every blade a different height, scrolling fastest of the
   three layers — which is the layer that actually sells the speed. */
function drawLeapTufts(){
  const S_ = SKY_SPECS[skyPhase(new Date())];
  const near = mixHex(S_.grass, '#000000', .52);
  const nearLit = mixHex(S_.grass, '#000000', .34);
  for (let x=0;x<W;x++){
    const wx = x + game.run*1.45;
    // three offset waves, so no two blades next to each other are the same
    const h = 4 + Math.round(3.2*Math.abs(Math.sin(wx*.9))
                           + 2.6*Math.abs(Math.sin(wx*.31 + 1.7))
                           + 1.4*Math.abs(Math.sin(wx*2.3 + .4)));
    ctx.fillStyle = near;
    ctx.fillRect(x, H - h, 1, h);
    ctx.fillStyle = nearLit;
    ctx.fillRect(x, H - h, 1, 1);
  }
}
/* Obstacles are built column by column so they have a silhouette. Drawn as
   plain fillRects they came out as a wooden crate and a cardboard box; a log
   is a cylinder lying on its side, so it needs rounded ends, grain that runs
   along the trunk rather than across it, and top-to-bottom cylinder shading,
   and a boulder needs an irregular profile. */
const BOULDER_PROF = [3,7,11,14,16,17,17,16,15,13,10,6,3];

function drawObstacle(g, o){
  const x = Math.round(o.x), base = GROUND + 2;   // bedded into the grass

  if (o.kind === 'water'){
    /* A stream cut through the track, not a puddle laid on top of it.

       The old one was a cosine lens of flat blue starting a pixel under the
       grass line, so it read as a blue dish resting on the dirt — nothing was
       cut, nothing had a bank, and the thing the game is named for looked
       like spilled paint. It is a channel now: the grass stops at a lip on
       each side, the earth under the lip is exposed and darker, the water
       sits down inside it, and the far wall is in shadow. Depth is what makes
       a hazard read as something to jump rather than something to step in. */
    const S_ = SKY_SPECS[skyPhase(new Date())];
    const soil = mixHex(S_.dirt, '#000000', .52);            // the cut bank
    const deep = mixHex(S_.water, '#000000', .34);
    const body = S_.water;
    const lit  = mixHex(S_.water, S_.low, .50);
    const HW = 21;
    for (let i=-HW;i<=HW;i++){
      const t = Math.abs(i)/HW;
      const lip = Math.round(Math.pow(t, 4) * 4);            // steep banks, flat bed
      const top = GROUND - 1 + lip;
      const dep = Math.round((1 - Math.pow(t, 4)) * 8) + 2;
      g.fillStyle = soil; g.fillRect(x+i, top, 1, 2);        // exposed earth at the lip
      g.fillStyle = deep; g.fillRect(x+i, top+2, 1, dep);    // the channel
      g.fillStyle = body; g.fillRect(x+i, top+2, 1, Math.max(1, dep-3));
      g.fillStyle = lit;  g.fillRect(x+i, top+2, 1, 1);      // the surface, catching sky
    }
    // ripples riding the surface, sliding with the track
    g.fillStyle = mixHex(S_.water, '#ffffff', .55);
    for (let k=0;k<3;k++){
      const off = ((game.run*.6 + k*15) % 30) - 15;
      const rx = Math.round(x + off), t = Math.abs(off)/HW;
      if (t >= 1) continue;
      const top = GROUND - 1 + Math.round(Math.pow(t, 4) * 4);
      g.fillRect(rx - 2, top + 3 + (k % 2), 5, 1);
    }
    // grass overhanging both lips, so the cut has an edge rather than a border
    g.fillStyle = mixHex(S_.grass, '#000000', .30);
    g.fillRect(x-HW-1, GROUND-2, 3, 3); g.fillRect(x-HW-3, GROUND-1, 2, 2);
    g.fillRect(x+HW-1, GROUND-2, 3, 3); g.fillRect(x+HW+1, GROUND-1, 2, 2);
    return;
  }

  g.fillStyle = 'rgba(16,26,24,.34)';
  g.beginPath(); g.ellipse(x, base, o.kind === 'log' ? 15 : 10, 3, 0, 0, 7); g.fill();

  if (o.kind === 'log'){
    const HW = 12, H0 = 11;
    for (let i=-HW;i<=HW;i++){
      const t = Math.abs(i)/HW, cut = Math.round(t*t*t*4);
      const top = base - H0 + cut, hh = H0 - cut*2;
      for (let r=0;r<hh;r++){
        const v = hh > 1 ? r/(hh-1) : 0;                                // cylinder shading
        g.fillStyle = v < .20 ? '#8a6540' : v < .58 ? '#65482a' : '#3f2c19';
        g.fillRect(x+i, top+r, 1, 1);
      }
    }
    g.fillStyle = '#4d371f';                                            // grain along the trunk
    g.fillRect(x-9, base-8, 8, 1); g.fillRect(x-1, base-6, 9, 1);
    g.fillRect(x-10, base-4, 6, 1); g.fillRect(x+1, base-3, 7, 1);
    g.fillStyle = '#5c7a45';                                            // moss on the lit top
    g.fillRect(x-8, base-11, 5, 1); g.fillRect(x-1, base-11, 4, 1); g.fillRect(x+4, base-10, 3, 1);
    g.fillStyle = '#3f2c19'; g.fillRect(x+8, base-10, 5, 9);            // sawn end, facing out
    g.fillStyle = '#a8814c'; g.fillRect(x+9, base-9, 4, 7);
    g.fillStyle = '#8a6a3e'; g.fillRect(x+10, base-7, 2, 3);
    g.fillStyle = '#c8a06a'; g.fillRect(x+10, base-8, 1, 1);
    return;
  }

  for (let i=0;i<BOULDER_PROF.length;i++){
    const px = x - 6 + i, hh = BOULDER_PROF[i], lit = i < BOULDER_PROF.length * .45;
    for (let r=0;r<hh;r++){
      const v = r/hh;
      g.fillStyle = v < .18 ? (lit ? '#948d7c' : '#6b6558')
                  : v < .55 ? (lit ? '#6f6a5c' : '#514c42')
                            : '#3a372f';
      g.fillRect(px, base - hh + r, 1, 1);
    }
  }
  g.fillStyle = '#7b7566'; g.fillRect(x-4, base-14, 3, 2);              // facet
  g.fillStyle = '#33312b'; g.fillRect(x+2, base-9, 3, 1); g.fillRect(x+3, base-8, 2, 4);
  g.fillStyle = '#6d7d55'; g.fillRect(x-5, base-16, 2, 1);              // lichen
}
function drawLeap(now){
  drawLeapGround();
  for (const o of game.obs) drawObstacle(ctx, o);

  const airborne = game.y < -2;
  const { f, sc } = gameSprite(now < game.stun ? 'sick' : airborne ? 'cheer' : 'walk',
                               airborne ? 0 : Math.floor(game.run / 9), 42);
  const shrink = clamp(1 + game.y/70, .35, 1);               // the shadow shrinks as it rises
  ctx.fillStyle = 'rgba(16,26,24,.30)';
  ctx.beginPath(); ctx.ellipse(54, GROUND + 1, f.w*sc*.36*shrink, 3*shrink, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(54, GROUND + Math.round(game.y));
  ctx.scale(-1, 1);
  ctx.drawImage(f.cv, -f.ox*sc, -f.oy*sc, f.w*sc, f.h*sc);
  ctx.restore();

  drawLeapTufts();
  scoreTag('Cleared ' + game.score);
}

function scoreTag(text){
  ctx.font = '9px monospace';
  const w = ctx.measureText(text).width + 10;
  ctx.fillStyle = 'rgba(16,26,24,.82)'; ctx.fillRect(4, H - 17, w, 13);
  ctx.fillStyle = '#e9e1cb'; ctx.fillText(text, 9, H - 7);
}

/* ==========================================================================
   SCREENS
   The menus are drawn inside the 224x168 screen, not slid over the top of the
   case as web sheets. On the hardware this is copied from, the screen is the
   whole interface: the case never changes while you play, and everything you
   can do to the animal happens on the glass in front of it.

   A key on the case opens a screen; a tap on the screen picks something in it.
   The keys are direct jumps and nothing else, which is why there is no cursor
   here — the pointer is the cursor.

   Each screen is an entry in SCREENS with `draw`, which paints it, and `tap`,
   which is handed a canvas-space point and decides what was hit. Both are
   given a layout object built by `screenLayout`, so hit boxes are computed
   once and drawn and tested from the same numbers. Nothing here computes a
   rectangle twice.

   Long prose has nowhere to go at six pixels a character, so the dossier's
   field notes still open as a DOM panel. That is the only text left outside
   the glass.
   ========================================================================== */

/* the screen palette, and the one place any of it is named */
const SC = {
  ink:    '#0b1113',   // the recess behind a panel
  panel:  '#16211f',   // a panel face
  edge:   '#2f4640',   // panel border
  line:   '#24332f',   // rules and inactive cells
  bone:   '#e9e1cb',   // primary text
  dim:    '#8fa39a',   // secondary text
  gold:   '#e0ac48',   // coins and prices
  moss:   '#8cb765',   // affirmative, owned, worn
  rust:   '#cf6a44',   // refusals, warnings, costs you cannot meet
  sel:    '#3d5c4e'    // the selected cell's fill
};

/* one grid unit. Everything on a screen is a whole number of these, which is
   what keeps the interface on the same pixel grid as the world behind it. */
const U = 4;

let screen = null;          // null when the habitat is showing
let screenState = {};       // per-screen scratch: which item is selected, scroll

function openScreen(which){
  if (!SCREENS[which]) return;
  if (mode === 'game') return;
  if (mode !== 'live' && !SCREENS[which].preHatch) return;
  screen = which;
  screenState = { pick: 0, scroll: 0 };
  SFX.pop();
  paintChrome();
}
function closeScreen(){
  if (!screen) return;
  screen = null;
  paintChrome();
}
/* A key is a latch, not a one-way door. It stays pressed in while its screen
   is up, so pressing it again is the obvious way to let it out — the close tab
   in the corner of the screen was the only way back, and on a case with five
   physical keys under the glass that is the last place anyone looks. Pressing
   a different key still jumps straight to that screen. */
function toggleScreen(which){
  if (screen === which) return closeScreen();
  openScreen(which);
}
const screenOpen = () => screen !== null;

/* ------------------------------ chrome ------------------------------------
   Every screen wears the same frame: a title bar with the purse in it, a body,
   and a close tab. Drawing it in one place is what stops six screens drifting
   apart by two pixels each.
   -------------------------------------------------------------------------- */
const BAR_H = 13, PAD = 3;

function panel(g, x, y, w, h, fill){
  g.fillStyle = fill || SC.panel;
  g.fillRect(x, y, w, h);
  g.fillStyle = SC.edge;
  g.fillRect(x, y, w, 1); g.fillRect(x, y+h-1, w, 1);
  g.fillRect(x, y, 1, h); g.fillRect(x+w-1, y, 1, h);
}

function screenFrame(g, title){
  g.fillStyle = SC.ink;
  g.fillRect(0, 0, W, H);
  g.fillStyle = SC.panel;
  g.fillRect(0, 0, W, BAR_H);
  g.fillStyle = SC.edge;
  g.fillRect(0, BAR_H - 1, W, 1);
  text(g, title, PAD, 3, SC.bone);
  const purse = Math.floor(G.coins) + 'c';
  text(g, purse, W - PAD - 11, 3, SC.gold, 'right');
  // close tab, top right, always in the same place on every screen
  g.fillStyle = SC.line;
  g.fillRect(W - 11, 2, 9, 9);
  g.fillStyle = SC.dim;
  for (let i=0;i<5;i++){ g.fillRect(W - 9 + i, 4 + i, 1, 1); g.fillRect(W - 5 - i, 4 + i, 1, 1); }
  return { close: [W - 12, 1, 11, 11] };
}

/* The animal, small, on its own screen. A menu about the animal that does not
   show the animal is a form. */
function petOnScreen(g, cx, baseY, maxH){
  if (!hatched()) return null;
  const f = frameOf(S.sp, stageIdx(), 'idle', 0, false, S.skin);
  const sc = Math.min(1, maxH / f.h);
  const w = Math.round(f.w * sc), h = Math.round(f.h * sc);
  const x = Math.round(cx - w/2), y = Math.round(baseY - h);
  g.fillStyle = 'rgba(10,20,18,.45)';
  g.beginPath(); g.ellipse(cx, baseY + 1, w*.34, 2, 0, 0, 7); g.fill();
  g.drawImage(f.cv, x, y, w, h);
  return [x, y, w, h];
}

const hit = (box, mx, my) =>
  mx >= box[0] && mx < box[0] + box[2] && my >= box[1] && my < box[1] + box[3];

/* ------------------------------- item grid --------------------------------
   The shape almost every screen wants: a row of picture cells across the top
   of the body, and the selected one's name, price and note written out
   underneath. It replaced a vertical list of text rows, which is the shape a
   settings page has, not a shelf of things.
   -------------------------------------------------------------------------- */
const CELL = 30, CELL_GAP = 3;

function gridLayout(items, top, cols){
  cols = cols || Math.floor((W - PAD*2 + CELL_GAP) / (CELL + CELL_GAP));
  const rows = Math.ceil(items.length / cols);
  const wide = cols * CELL + (cols - 1) * CELL_GAP;
  const x0 = Math.round((W - wide) / 2);
  return {
    items, cols, rows, x0, top, cell: CELL,
    box(i){
      const r = Math.floor(i / cols), c = i % cols;
      return [x0 + c * (CELL + CELL_GAP), top + r * (CELL + CELL_GAP), CELL, CELL];
    },
    bottom: top + rows * CELL + (rows - 1) * CELL_GAP
  };
}

/* Draw one cell: a recessed square, a picture in it, and a price or state
   along the bottom edge. `art` is handed the centre of the cell. */
function gridCell(g, box, opts){
  const [x, y, w, h] = box;
  panel(g, x, y, w, h, opts.on ? SC.sel : SC.panel);
  if (opts.art) opts.art(g, x + w/2, y + h/2 - 2);
  if (opts.tag) text(g, opts.tag, x + w/2, y + h - 9, opts.tagCol || SC.dim, 'centre');
  if (opts.on){
    g.fillStyle = SC.moss;
    g.fillRect(x, y, w, 1); g.fillRect(x, y+h-1, w, 1);
    g.fillRect(x, y, 1, h); g.fillRect(x+w-1, y, 1, h);
  }
}

/* the caption block under a grid: name on the left, price on the right, then
   the note wrapped underneath */
function caption(g, y, name, right, rightCol, note){
  g.fillStyle = SC.line;
  g.fillRect(PAD, y, W - PAD*2, 1);
  y += 4;
  text(g, name, PAD, y, SC.bone);
  if (right) text(g, right, W - PAD, y, rightCol || SC.gold, 'right');
  if (note) textBlock(g, note, PAD, y + 10, W - PAD*2, SC.dim, 8);
  return y;
}

/* a full-width action strip at the foot of a screen */
function actionBar(g, label, col, dim){
  const y = H - 14, box = [PAD, y, W - PAD*2, 11];
  panel(g, box[0], box[1], box[2], box[3], dim ? SC.line : SC.panel);
  text(g, label, W/2, y + 2, dim ? SC.dim : (col || SC.moss), 'centre');
  return box;
}

/* ------------------------------ the screens ------------------------------- */
const SCREENS = {};

/* -------------------------------- feed ------------------------------------ */
SCREENS.feed = {
  layout(){
    const g = gridLayout(FOODS, BAR_H + 6);
    return { grid: g };
  },
  draw(g, L){
    const frame = screenFrame(g, 'FEED');
    const sp = SPECIES[S.sp];
    FOODS.forEach((f, i) => {
      const loved = sp.likes.includes(f.id), hated = sp.dislikes.includes(f.id);
      gridCell(g, L.grid.box(i), {
        on: i === screenState.pick,
        art: (gg, cx, cy) => drawItem(gg, f.id, Math.round(cx) - 4, Math.round(cy) - 4, 2),
        tag: loved ? 'love' : hated ? 'no' : '',
        tagCol: loved ? SC.moss : SC.rust
      });
    });
    const f = FOODS[screenState.pick];
    const afford = G.coins >= f.cost;
    caption(g, L.grid.bottom + 4, f.name, f.cost + 'c', afford ? SC.gold : SC.rust, f.note);
    petOnScreen(g, W/2, H - 18, 34);
    L.act = actionBar(g, afford ? 'FEED IT' : 'NOT ENOUGH COINS', SC.moss, !afford);
    L.close = frame.close;
  },
  tap(mx, my, L){
    if (hit(L.close, mx, my)) return closeScreen();
    for (let i = 0; i < FOODS.length; i++)
      if (hit(L.grid.box(i), mx, my)){ screenState.pick = i; SFX.pop(); return; }
    if (hit(L.act, mx, my)) feed(FOODS[screenState.pick].id);
  }
};

/* ------------------------------- list rows --------------------------------
   Not everything is a picture. A game or a remedy is a name and a price, and
   forcing those into a grid of blank squares would be a grid for its own sake.
   -------------------------------------------------------------------------- */
const ROW_H = 15;

function rowsLayout(items, top, h){
  const rh = h || ROW_H;
  return {
    items, top, rh,
    box(i){ return [PAD, top + i * (rh + 2), W - PAD*2, rh]; },
    bottom: top + items.length * (rh + 2)
  };
}
function listRow(g, box, label, right, opts){
  opts = opts || {};
  const [x, y, w, h] = box;
  panel(g, x, y, w, h, opts.on ? SC.sel : SC.panel);
  text(g, fit(label, w - 60), x + 4, y + 4, opts.dim ? SC.dim : SC.bone);
  if (right) text(g, right, x + w - 4, y + 4, opts.rightCol || SC.gold, 'right');
  if (opts.on){
    g.fillStyle = SC.moss;
    g.fillRect(x, y, w, 1); g.fillRect(x, y+h-1, w, 1);
    g.fillRect(x, y, 1, h); g.fillRect(x+w-1, y, 1, h);
  }
}

/* -------------------------------- play ------------------------------------ */
SCREENS.play = {
  layout(){
    const keys = Object.keys(GAMES);
    return { keys, rows: rowsLayout(keys.concat(['trick']), BAR_H + 5) };
  },
  draw(g, L){
    const frame = screenFrame(g, 'PLAY');
    L.keys.forEach((k, i) => listRow(g, L.rows.box(i), GAMES[k].name, GAMES[k].pay + 'c/pt',
                                     { on: i === screenState.pick }));
    const trickReady = bondPips() >= 3;
    listRow(g, L.rows.box(L.keys.length), 'Ask for a trick', trickReady ? 'free' : 'bond 3',
            { on: screenState.pick === L.keys.length, dim: !trickReady,
              rightCol: trickReady ? SC.moss : SC.dim });
    const pick = screenState.pick;
    const note = pick < L.keys.length ? GAMES[L.keys[pick]].blurb
               : trickReady ? 'A quick burst of joy, and it costs nothing.'
                            : 'Unlocks at three bond hearts. Petting is what builds them.';
    caption(g, L.rows.bottom + 3, '', '', null, note);
    L.act = actionBar(g, pick < L.keys.length ? 'START' : 'ASK',
                      SC.moss, pick === L.keys.length && !trickReady);
    L.close = frame.close;
  },
  tap(mx, my, L){
    if (hit(L.close, mx, my)) return closeScreen();
    for (let i = 0; i < L.rows.items.length; i++)
      if (hit(L.rows.box(i), mx, my)){ screenState.pick = i; SFX.pop(); return; }
    if (hit(L.act, mx, my)){
      if (screenState.pick < L.keys.length){ closeScreen(); startGame(L.keys[screenState.pick]); }
      else doTrick();
    }
  }
};

/* -------------------------------- care ------------------------------------
   Care is everything about the animal's condition, and sleep is part of that.
   `tuckIn()` had existed for sessions with nothing anywhere that called it,
   and there was no way to wake an animal at all — so an animal that put
   itself to bed hungry and filthy stayed hungry and filthy, because feeding
   and washing both refuse while it is asleep, and nothing on the case
   answered. Rest is the last row on this list now, next to the remedies,
   with the rule written underneath it.
   -------------------------------------------------------------------------- */

/* The rest row's label, its price column and the sentence explaining it, all
   from the one state, so the row and its caption cannot disagree. */
function restRow(){
  if (S.asleep) return {
    id:'wake', label:'Wake ' + S.name, right:'costs trust', col:SC.rust,
    note:'Sleep is how energy comes back. Waking early costs some of it, some '
       + 'trust, and after dark it risks a chill.'
  };
  const tooAwake = S.needs.energy > 70;
  return {
    id:'bed', label:'Settle ' + S.name + ' down', right: tooAwake ? 'not tired' : 'free',
    col: tooAwake ? SC.rust : SC.moss,
    note: tooAwake
      ? 'Too wide awake to settle. Below seventy energy it goes down willingly.'
      : 'Goes down early and wakes rested. A night in bed clears the late-hours '
      + 'count that brings on a chill.'
  };
}

/* The line at the top of the screen, and the only place it is written. The
   layout has to reserve room for exactly the lines the draw is going to put
   there — with the row list starting at a fixed offset instead, the first
   remedy was drawn straight over the sentence saying what was wrong. */
function careStatus(){
  if (S.ills.length) return S.ills.map(i => ILLS[i.id].symptom);
  if (S.asleep) return [S.name + ' is asleep, and will not eat, wash or play until it wakes.'];
  return ['Nothing to treat. ' + S.name + ' is well.'];
}

SCREENS.care = {
  layout(){
    const lines = careStatus().reduce((n, t) => n + wrapText(t, W - PAD*2).length, 0);
    const top = BAR_H + 4 + lines * 8 + 3;
    const ids = S.vet ? ['vet'] : REMEDIES.map(r => r.id).concat(['rest']);
    /* Twelve rather than the default fifteen: rest makes five rows, and at
       the default the caption under them ran into the action bar. Eleven is
       one too few — a row is a seven-pixel line drawn four pixels down, so
       below twelve the labels lose their last row of pixels to the border. */
    return { rows: rowsLayout(ids, top, 12), ids };
  },
  draw(g, L){
    const frame = screenFrame(g, 'CARE');
    L.close = frame.close;
    let y = BAR_H + 4;
    if (S.vet){
      textBlock(g, S.name + ' is on the ground and will not get up.', PAD, y, W - PAD*2, SC.rust, 8);
      listRow(g, L.rows.box(0), 'Call the vet', '30c', { on: true });
      caption(g, L.rows.bottom + 3, '', '', null,
              'Restores health and clears every illness. It costs some trust.');
      L.act = actionBar(g, G.coins >= 30 ? 'CALL' : 'NOT ENOUGH COINS', SC.moss, G.coins < 30);
      return;
    }
    /* The state line: asleep before well, because a sleeping animal is why
       someone opens this screen with nothing wrong with the animal. */
    const col = S.ills.length ? SC.rust : S.asleep ? SC.dim : SC.moss;
    careStatus().forEach(t => { y = textBlock(g, t, PAD, y, W - PAD*2, col, 8); });

    const rest = restRow();
    REMEDIES.forEach((r, i) => listRow(g, L.rows.box(i), r.name,
      r.cost ? r.cost + 'c' : (hasIll('blues') ? S.petBank + '/8' : 'free'),
      { on: i === screenState.pick, dim: !S.ills.length,
        rightCol: r.cost ? SC.gold : SC.moss }));
    const ri = REMEDIES.length;
    listRow(g, L.rows.box(ri), rest.label, rest.right,
            { on: screenState.pick === ri, rightCol: rest.col });

    const onRest = screenState.pick === ri;
    caption(g, L.rows.bottom + 3, '', '', null,
            onRest ? rest.note
          : S.ills.length ? REMEDIES[screenState.pick].note
          : 'Illness has causes, not luck. Treats upset the stomach, late '
          + 'nights bring a chill, a filthy pen invites mites, and joy at '
          + 'zero turns into the blues.');
    L.act = onRest
      ? actionBar(g, S.asleep ? 'WAKE' : 'SETTLE DOWN', rest.col, !S.asleep && S.needs.energy > 70)
      : actionBar(g, 'TREAT', SC.moss, !S.ills.length);
  },
  tap(mx, my, L){
    if (hit(L.close, mx, my)) return closeScreen();
    if (!L.act) return;
    if (S.vet){ if (hit(L.act, mx, my)) vetVisit(); return; }
    for (let i = 0; i < L.ids.length; i++)
      if (hit(L.rows.box(i), mx, my)){ screenState.pick = i; SFX.pop(); return; }
    if (!hit(L.act, mx, my)) return;
    if (screenState.pick === REMEDIES.length) return S.asleep ? wakeUp() : tuckIn();
    const r = REMEDIES[screenState.pick];
    if (r.id === 'company' && hasIll('blues')){
      closeScreen();
      say('Press and hold on ' + S.name + '. Eight times should do it.');
      return;
    }
    treat(r.id);
  }
};

/* -------------------------------- shop ------------------------------------
   Two shelves under one heading, because coats and headgear are bought the
   same way and splitting them across two screens would only add a step. A coat
   is shown as the animal wearing it, not as a swatch: the thing being sold is
   what your animal will look like.
   -------------------------------------------------------------------------- */
function thumb(g, cv, cx, cy, maxW, maxH){
  const sc = Math.min(maxW / cv.width, maxH / cv.height, 1);
  const w = Math.max(1, Math.round(cv.width * sc)), h = Math.max(1, Math.round(cv.height * sc));
  g.drawImage(cv, Math.round(cx - w/2), Math.round(cy - h/2), w, h);
}

SCREENS.shop = {
  layout(){
    const coats = SKINS[S.sp];
    const cg = gridLayout(coats, BAR_H + 11, 4);
    const hg = gridLayout(HAT_SHOP, cg.bottom + 15, 6);
    return { coats, coatGrid: cg, hatGrid: hg };
  },
  draw(g, L){
    const frame = screenFrame(g, 'SHOP');
    L.close = frame.close;
    // the shop keys its selection by shelf, not by index
    if (typeof screenState.pick !== 'string') screenState.pick = 'coat:0';
    text(g, 'COATS', PAD, BAR_H + 2, SC.dim);
    L.coats.forEach((k, i) => {
      const own = S.skinsOwned.includes(k.id), worn = S.skin === k.id;
      gridCell(g, L.coatGrid.box(i), {
        on: screenState.pick === 'coat:' + i,
        art: (gg, cx, cy) => thumb(gg, frameOf(S.sp, stageIdx(), 'idle', 0, false, k.id).cv, cx, cy, 24, 17),
        tag: worn ? 'worn' : own ? 'own' : k.cost + 'c',
        tagCol: worn ? SC.moss : own ? SC.dim : SC.gold
      });
    });
    text(g, 'HEADGEAR', PAD, L.coatGrid.bottom + 4, SC.dim);
    HAT_SHOP.forEach((item, i) => {
      const own = S.owned.includes(item.id), worn = S[item.slot] === item.id;
      gridCell(g, L.hatGrid.box(i), {
        on: screenState.pick === 'hat:' + i,
        art: (gg, cx, cy) => thumb(gg, HATS[item.id], cx, cy, 14, 13),
        tag: worn ? 'worn' : own ? 'own' : item.cost + 'c',
        tagCol: worn ? SC.moss : own ? SC.dim : SC.gold
      });
    });
    const sel = screenState.pick || 'coat:0';
    const isCoat = sel.slice(0, 5) === 'coat:', n = +sel.split(':')[1];
    const item = isCoat ? L.coats[n] : HAT_SHOP[n];
    const own = isCoat ? S.skinsOwned.includes(item.id) : S.owned.includes(item.id);
    const worn = isCoat ? S.skin === item.id : S[item.slot] === item.id;
    caption(g, L.hatGrid.bottom + 4, item.name, own ? (worn ? 'worn' : 'owned') : item.cost + 'c',
            own ? SC.moss : (G.coins >= item.cost ? SC.gold : SC.rust),
            isCoat ? item.note : (item.slot === 'face' ? 'Sits across the eyes.' : 'Sits on the head.'));
    /* An animal is always wearing a coat, so a worn coat has nothing to
       toggle off; headgear does. */
    L.act = actionBar(g,
      own ? (worn ? (isCoat ? 'ALREADY WORN' : 'TAKE IT OFF') : 'WEAR IT') : 'BUY IT',
      SC.moss, (!own && G.coins < item.cost) || (worn && isCoat));
  },
  tap(mx, my, L){
    if (hit(L.close, mx, my)) return closeScreen();
    for (let i = 0; i < L.coats.length; i++)
      if (hit(L.coatGrid.box(i), mx, my)){ screenState.pick = 'coat:' + i; SFX.pop(); return; }
    for (let i = 0; i < HAT_SHOP.length; i++)
      if (hit(L.hatGrid.box(i), mx, my)){ screenState.pick = 'hat:' + i; SFX.pop(); return; }
    if (hit(L.act, mx, my)){
      const sel = screenState.pick || 'coat:0', n = +sel.split(':')[1];
      if (sel.slice(0, 5) === 'coat:') buySkin(L.coats[n].id); else buyHat(HAT_SHOP[n].id);
    }
  }
};

/* -------------------------------- nest ------------------------------------ */
SCREENS.nest = {
  preHatch: true,
  layout(){
    const slots = G.pets.slice();
    if (G.pets.length < MAX_PETS) slots.push(null);          // the empty cup
    return { slots, grid: gridLayout(slots, BAR_H + 11, 6) };
  },
  draw(g, L){
    const frame = screenFrame(g, 'NEST');
    L.close = frame.close;
    text(g, numWord(G.pets.length) + ' in the nest', PAD, BAR_H + 2, SC.dim);
    L.slots.forEach((p, i) => {
      gridCell(g, L.grid.box(i), {
        on: i === screenState.pick,
        art: (gg, cx, cy) => {
          if (!p){ text(gg, '+', cx, cy - 3, SC.dim, 'centre'); return; }
          if (!p.sp || !p.born){
            gg.save(); gg.translate(cx, cy); gg.scale(.62, .62);
            drawEggArt(gg, 0, 0, p.sp || Object.keys(SPECIES)[0], 0);
            gg.restore(); return;
          }
          const prev = S; S = p;
          const f = frameOf(p.sp, stageIdx(), 'idle', 0, false, p.skin || 'wild');
          S = prev;
          thumb(gg, f.cv, cx, cy, 24, 17);
        },
        tag: p ? (i === G.active ? 'here' : '') : 'new',
        tagCol: p ? SC.moss : SC.gold
      });
    });
    const p = L.slots[screenState.pick];
    let name = 'Take a new egg', right = 'new';
    let note = 'Start another animal from scratch. Everything in the nest ages and gets hungry whether or not it is the one on screen. Coins are shared.';
    if (p){
      name = p.name || 'Unnamed';
      if (!p.sp){ note = 'An egg nobody has chosen yet.'; right = 'egg'; }
      else if (!p.born){ note = 'Still in the shell.'; right = 'egg'; }
      else {
        const prev = S; S = p;
        const worst = Math.min(p.needs.hunger, p.needs.energy, p.needs.hygiene, p.needs.joy);
        note = STAGE[stageIdx()].label + ' ' + SPECIES[p.sp].common + '. '
             + (p.vet ? 'Needs a vet.' : p.ills.length ? ILLS[p.ills[0].id].name + '.'
                : worst < 25 ? 'Needs attention.' : p.asleep ? 'Asleep.' : 'Doing fine.');
        S = prev;
        right = screenState.pick === G.active ? 'here' : 'visit';
      }
    }
    caption(g, L.grid.bottom + 4, name, right, SC.moss, note);
    L.act = actionBar(g, p ? (screenState.pick === G.active ? 'ALREADY HERE' : 'VISIT') : 'TAKE AN EGG',
                      SC.moss, !!p && screenState.pick === G.active);
  },
  tap(mx, my, L){
    if (hit(L.close, mx, my)) return closeScreen();
    for (let i = 0; i < L.slots.length; i++)
      if (hit(L.grid.box(i), mx, my)){ screenState.pick = i; SFX.pop(); return; }
    if (hit(L.act, mx, my)){
      const p = L.slots[screenState.pick];
      if (!p){ closeScreen(); newEgg(); }
      else if (screenState.pick !== G.active){ closeScreen(); switchPet(screenState.pick); }
    }
  }
};

/* ==========================================================================
   CASE CHROME
   What is left outside the screen: the meter strip, the identity line, the
   bond row, the five keys, and the prose panels the screen cannot carry.

   This file used to hold every menu in the game, on the rule that all text
   lived in the DOM. The menus have moved onto the glass — see 07-screens.js —
   because on the device this copies the screen is the whole interface and the
   case never changes while you play. What stays here is the printed panel
   around the screen and the long-form reading.
   ========================================================================== */

const NEED_META = [
  { k:'hunger',  label:'Hunger',  col:'#c98a4a' },
  { k:'energy',  label:'Energy',  col:'#d9c04a' },
  { k:'hygiene', label:'Clean',   col:'#7fb2c9' },
  { k:'joy',     label:'Joy',     col:'#c96f86' }
];
const ICON_ART = {
  feed: g => {
    g.fillStyle='#82382a'; g.fillRect(2,2,7,8);
    g.fillStyle='#a04a34'; g.fillRect(2,2,6,7);
    g.fillStyle='#c46a4c'; g.fillRect(3,3,3,2);

    g.fillRect(1,8,10,1); g.fillRect(2,9,8,1); g.fillRect(3,10,6,1); g.fillRect(4,11,4,1);

  },
  coin: g => {
    g.fillStyle='#8a6a1e'; g.fillRect(2,1,8,10); g.fillRect(1,2,10,8);

    g.fillStyle='#8a6a1e'; g.fillRect(5,3,2,6); g.fillRect(4,4,4,1); g.fillRect(4,7,4,1);
  },
  /* the meter strip: one glyph per need, the way the classic devices did it */

  },
  energy: g => {

    g.fillStyle='#8a6a1e'; for (const [x,y,w] of bolt) g.fillRect(x,y+1,w,1);
    g.fillStyle='#d9c04a'; for (const [x,y,w] of bolt) g.fillRect(x,y,w,1);

    g.fillStyle='#4b7f99'; for (const [x,y,w] of drop) g.fillRect(x,y,w,1);
    g.fillStyle='#7fb2c9'; g.fillRect(3,3,5,5); g.fillRect(4,2,3,1); g.fillRect(4,8,4,1);

  joy: g => {

    g.fillStyle='#8f3050'; for (const [x,y,w] of heart) g.fillRect(x,y,w,1);
    g.fillStyle='#c96f86'; g.fillRect(2,2,8,2); g.fillRect(2,1,2,1); g.fillRect(7,1,2,1);
    g.fillRect(2,4,7,1); g.fillRect(3,5,5,1); g.fillRect(4,6,3,1);

    g.fillStyle='#c2603c';
    for (let i=0;i<5;i++){ g.fillRect(7+i,3+i,1,1); g.fillRect(11-i,3+i,1,1); }
  },

    g.fillRect(3,5,6,3); g.fillRect(1,3,3,3); g.fillRect(1,7,3,3); g.fillRect(8,3,3,3); g.fillRect(8,7,3,3);
    g.fillStyle='#efe6cf';
    g.fillRect(3,5,6,2); g.fillRect(1,3,3,2); g.fillRect(8,3,3,2); g.fillRect(1,7,2,2); g.fillRect(8,7,2,2);
  },
  nest: g => {
    g.fillStyle='#6b5230'; g.fillRect(0,7,12,4); g.fillRect(1,6,10,1);
    g.fillStyle='#8a6a3c'; g.fillRect(1,7,10,1); g.fillRect(0,9,12,1);
    g.fillStyle='#efe3c4'; g.fillRect(3,3,3,4); g.fillRect(2,4,5,3);
    g.fillStyle='#cfc3a4'; g.fillRect(7,4,3,3); g.fillRect(6,5,5,2);

};
function pixelIcon(id, w, h){
  const c = makeCv(w,h), g = readCtx(c);
  ICON_ART[id](g);
  const d = g.getImageData(0,0,w,h), px = d.data, solid = new Uint8Array(w*h);
  for (let i=0;i<w*h;i++){ if (px[i*4+3] >= 118){ px[i*4+3]=255; solid[i]=1; } else px[i*4+3]=0; }
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const i=y*w+x; if (solid[i]) continue;
    if ((x>0&&solid[i-1])||(x<w-1&&solid[i+1])||(y>0&&solid[i-w])||(y<h-1&&solid[i+w])){
      px[i*4]=0x14; px[i*4+1]=0x1c; px[i*4+2]=0x1e; px[i*4+3]=255;
    }
  }
  g.putImageData(d,0,0);
  return c;
}

/* The bond row used to be five rotated CSS squares and the meters were CSS
   pills with rounded ends and a smooth gradient. Neither belonged next to a
   hard-edged pixel scene. The bond is now five pixel hearts baked the same way
   the particle hearts are, and the meters are ten hard cells behind a black
   grid — see .track in the stylesheet. */
const BOND_PIPS = 5, PIP_W = 9, PIP_H = 7;
function bondCanvas(on){
  const c = makeCv(BOND_PIPS*PIP_W, PIP_H), g = readCtx(c);
  for (let i=0;i<BOND_PIPS;i++){
    const x = i*PIP_W, lit = i < on;
    g.fillStyle = lit ? '#8f2f46' : '#232e31';
    g.fillRect(x+1,1,2,1); g.fillRect(x+4,1,2,1);
    g.fillRect(x,2,7,2); g.fillRect(x+1,4,5,1); g.fillRect(x+2,5,3,1); g.fillRect(x+3,6,1,1);
    if (lit){
      g.fillStyle = '#e2697c';
      g.fillRect(x+1,2,5,1); g.fillRect(x+2,3,3,1); g.fillRect(x+3,4,1,1);
      g.fillStyle = '#f6b3c0'; g.fillRect(x+1,2,2,1);
    }
  }
  c.style.cssText = 'width:' + (BOND_PIPS*PIP_W*2) + 'px;height:' + (PIP_H*2) +
                    'px;image-rendering:pixelated;display:block';
  return c;
}
