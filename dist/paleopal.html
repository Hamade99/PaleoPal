function actionBar(g, label, col, dim){
  const y = H - 14, box = [PAD, y, W - PAD*2, 11];
  panel(g, box[0], box[1], box[2], box[3], dim ? SC.line : SC.panel);
  text(g, label, W/2, y + 2, dim ? SC.dim : (col || SC.moss), 'centre');
  return box;
}

/* ------------------------------ the screens ------------------------------- */
const SCREENS = {};

/* -------------------------------- feed ------------------------------------ */
SCREENS.feed = {
  layout(){
    const g = gridLayout(FOODS, BAR_H + 6);
    return { grid: g };
  },
  draw(g, L){
    const frame = screenFrame(g, 'FEED');
    const sp = SPECIES[S.sp];
    FOODS.forEach((f, i) => {
      const loved = sp.likes.includes(f.id), hated = sp.dislikes.includes(f.id);
      gridCell(g, L.grid.box(i), {
        on: i === screenState.pick,
        /* No tag strip, so the picture has the whole cell: centred on it, and
           up to three times size, which brings a cycad painted in 4 x 5 cells
           up to the size of the rest instead of leaving it a speck in a
           square. */
        art: (gg, cx, cy) => drawItemFit(gg, f.id, cx, cy + 2, 24, 24, 3),
        badge: loved ? 'badge.love' : hated ? 'badge.no' : ''
      });
    });
    const f = FOODS[screenState.pick];
    const afford = G.coins >= f.cost;
    caption(g, L.grid.bottom + 4, f.name, f.cost + 'c', afford ? SC.gold : SC.rust, f.note);
    petOnScreen(g, W/2, H - 18, 34);
    L.act = actionBar(g, afford ? 'FEED IT' : 'NOT ENOUGH COINS', SC.moss, !afford);
    L.close = frame.close;
  },
  tap(mx, my, L){
    if (hit(L.close, mx, my)) return closeScreen();
    for (let i = 0; i < FOODS.length; i++)
      if (hit(L.grid.box(i), mx, my)){ screenState.pick = i; SFX.pop(); return; }
    if (hit(L.act, mx, my)) feed(FOODS[screenState.pick].id);
  }
};

/* ------------------------------- list rows --------------------------------
   Not everything is a picture. A game or a remedy is a name and a price, and
   forcing those into a grid of blank squares would be a grid for its own sake.
   -------------------------------------------------------------------------- */
const ROW_H = 15;

function rowsLayout(items, top, h){
  const rh = h || ROW_H;
  return {
    items, top, rh,
    box(i){ return [PAD, top + i * (rh + 2), W - PAD*2, rh]; },
    bottom: top + items.length * (rh + 2)
  };
}
function listRow(g, box, label, right, opts){
  opts = opts || {};
  const [x, y, w, h] = box;
  const ty = y + Math.floor((h - FONT_H) / 2);          // centred in whatever height the row is
  panel(g, x, y, w, h, opts.on ? SC.sel : SC.panel);
  text(g, fit(label, w - 60), x + 4, ty, opts.dim ? SC.dim : SC.bone);
  if (right) text(g, right, x + w - 4, ty, opts.rightCol || SC.gold, 'right');
  if (opts.on){
    g.fillStyle = SC.moss;
    g.fillRect(x, y, w, 1); g.fillRect(x, y+h-1, w, 1);
    g.fillRect(x, y, 1, h); g.fillRect(x+w-1, y, 1, h);
  }
}

/* -------------------------------- play ------------------------------------ */
SCREENS.play = {
  layout(){
    const keys = Object.keys(GAMES);
    /* Rows eleven high rather than fifteen. Six rows at fifteen left two lines
       between the list and the challenge bar, and a game's record plus its
       blurb is five, so the blurb ran on underneath the bar where nobody could
       read it — for every game, and not for the trick, whose note is short. */
    return { keys, rows: rowsLayout(keys.concat(['trick']), BAR_H + 4, 11) };
  },
  draw(g, L){
    const frame = screenFrame(g, 'PLAY');
    L.keys.forEach((k, i) => listRow(g, L.rows.box(i), GAMES[k].name, GAMES[k].pay + 'c/pt',
                                     { on: i === screenState.pick }));
    const trickReady = bondPips() >= 3;
    listRow(g, L.rows.box(L.keys.length), 'Ask for a trick', trickReady ? 'free' : 'bond 3',
            { on: screenState.pick === L.keys.length, dim: !trickReady,
              rightCol: trickReady ? SC.moss : SC.dim });
    const pick = screenState.pick, isGame = pick < L.keys.length;
    const record = isGame ? S.records[L.keys[pick]+':'+S.sp+':'+stageIdx()] : null;
    const note = isGame ? GAMES[L.keys[pick]].blurb
               : trickReady ? 'A quick burst of joy, and it costs nothing.'
                            : 'Unlocks at three bond hearts. Petting is what builds them.';
    L.act = actionBar(g, isGame ? 'WEEKLY CHALLENGE' : 'ASK',
                      SC.moss, pick === L.keys.length && !trickReady);
    /* The record goes on the caption's own line, name side and price side, so
       the blurb gets every line down to the bar — and stops above it. */
    caption(g, L.rows.bottom + 2,
            isGame ? 'Best ' + (record?.best || 0) : '',
            isGame ? 'This week ' + (record?.week === challengeWeek() ? record.weekly : 0) : '',
            SC.gold, note, L.act[1] - 2);
    L.close = frame.close;
  },
  tap(mx, my, L){
    if (hit(L.close, mx, my)) return closeScreen();
    for (let i = 0; i < L.rows.items.length; i++)
      if (hit(L.rows.box(i), mx, my)){ screenState.pick = i; SFX.pop(); return; }
    if (hit(L.act, mx, my)){
      if (screenState.pick < L.keys.length){ closeScreen(); startGame(L.keys[screenState.pick]); }
      else doTrick();
    }
  }
};

/* -------------------------------- care ------------------------------------
   Care is everything about the animal's condition, and sleep is part of that.
   `tuckIn()` had existed for sessions with nothing anywhere that called it,
   and there was no way to wake an animal at all — so an animal that put
   itself to bed hungry and filthy stayed hungry and filthy, because feeding
   and washing both refuse while it is asleep, and nothing on the case
   answered. Rest is the last row on this list now, next to the remedies,
   with the rule written underneath it.
   -------------------------------------------------------------------------- */

/* The rest row's label, its price column and the sentence explaining it, all
   from the one state, so the row and its caption cannot disagree. */
function restRow(){
  if (S.asleep) return {
    id:'wake', label:'Wake ' + S.name, right:'costs trust', col:SC.rust,
    note:'Sleep is how energy comes back. Waking early costs some of it, some '
       + 'trust, and after dark it risks a chill.'
  };
  const tooAwake = S.needs.energy > 70;
  return {
    id:'bed', label:'Settle ' + S.name + ' down', right: tooAwake ? 'not tired' : 'free',
    col: tooAwake ? SC.rust : SC.moss,
    note: tooAwake
      ? 'Too wide awake to settle. Below seventy energy it goes down willingly.'
      : 'Goes down early and wakes rested. A night in bed clears the late-hours '
      + 'count that brings on a chill.'
  };
}

/* The line at the top of the screen, and the only place it is written. The
   layout has to reserve room for exactly the lines the draw is going to put
   there — with the row list starting at a fixed offset instead, the first
   remedy was drawn straight over the sentence saying what was wrong. */
function careStatus(){
  /* The collapsed line belongs here and not in the draw. It used to be typed
     out at the top of `draw` instead, so `layout` measured the *asleep* line —
     collapse sets `asleep` too — reserved room for that, and the first row was
     drawn straight through the sentence above it. Exactly the fault this
     comment was written about, committed again by someone lengthening the
     sentence. One function, and both of them read it. */
  if (S.vet) return [S.name + ' is worn out and down. Only a vet puts this right.'];
  if (S.ills.length) return S.ills.map(i => ILLS[i.id].symptom);
  if (S.asleep) return [S.name + ' is asleep, and will not eat, wash or play until it wakes.'];
  return ['Nothing to treat. ' + S.name + ' is well.'];
}

SCREENS.care = {
  layout(){
    const lines = careStatus().reduce((n, t) => n + wrapText(t, W - PAD*2).length, 0);
    const top = BAR_H + 4 + lines * 8 + 3;
    const ids = S.vet ? ['vet'] : REMEDIES.map(r => r.id).concat(['rest']);
    /* Twelve rather than the default fifteen: rest makes five rows, and at
       the default the caption under them ran into the action bar. Eleven is
       one too few — a row is a seven-pixel line drawn four pixels down, so
       below twelve the labels lose their last row of pixels to the border. */
    return { rows: rowsLayout(ids, top, 12), ids };
  },
  draw(g, L){
    const frame = screenFrame(g, 'CARE');
    L.close = frame.close;
    let y = BAR_H + 4;
    if (S.vet){
      careStatus().forEach(t => { y = textBlock(g, t, PAD, y, W - PAD*2, SC.rust, 8); });
      listRow(g, L.rows.box(0), 'Call the vet', '30c', { on: true });
      /* With the purse short the note says how to fill it, because that is the
         only thing the player can act on from here. */
      caption(g, L.rows.bottom + 3, '', '', null, G.coins >= 30
              ? 'Restores health and clears every illness. It costs some trust.'
              : 'Short of coins? It will still rouse for a game. Win the fee and come back.',
              H - 16);
      L.act = actionBar(g, G.coins >= 30 ? 'CALL' : 'NOT ENOUGH COINS', SC.moss, G.coins < 30);
      return;
    }
    /* The state line: asleep before well, because a sleeping animal is why
       someone opens this screen with nothing wrong with the animal. */
    const col = S.ills.length ? SC.rust : S.asleep ? SC.dim : SC.moss;
    careStatus().forEach(t => { y = textBlock(g, t, PAD, y, W - PAD*2, col, 8); });

    /* Only the remedy that treats something the animal actually has is lit.
       All four used to be shown the same way, so the screen named the illness
       and then offered four equal answers to it — the wording hints at the
       right one now, and this says it without any words at all. */
    const rest = restRow();
    REMEDIES.forEach((r, i) => {
      const treats = hasIll(r.cures);
      listRow(g, L.rows.box(i), r.name,
        r.cost ? r.cost + 'c' : (hasIll('blues') ? S.petBank + '/8' : 'free'),
        { on: i === screenState.pick, dim: !treats,
          rightCol: !treats ? SC.dim : r.cost ? SC.gold : SC.moss });
    });
    const ri = REMEDIES.length;
    listRow(g, L.rows.box(ri), rest.label, rest.right,
            { on: screenState.pick === ri, rightCol: rest.col });

    const onRest = screenState.pick === ri;
    caption(g, L.rows.bottom + 3, '', '', null,
            onRest ? rest.note
          : S.ills.length ? REMEDIES[screenState.pick].note
          : 'Illness has causes, not luck. Treats upset the stomach, being '
          + 'kept up late brings a chill, a pen left filthy for hours invites '
          + 'mites, and joy left low turns into the blues.',
            H - 16);   // clipped above the action bar; five lines ran under it
    L.act = onRest
      ? actionBar(g, S.asleep ? 'WAKE' : 'SETTLE DOWN', rest.col, !S.asleep && S.needs.energy > 70)
      : actionBar(g, 'TREAT', SC.moss, !S.ills.length);
  },
  tap(mx, my, L){
    if (hit(L.close, mx, my)) return closeScreen();
    if (!L.act) return;
    if (S.vet){ if (hit(L.act, mx, my)) vetVisit(); return; }
    for (let i = 0; i < L.ids.length; i++)
      if (hit(L.rows.box(i), mx, my)){ screenState.pick = i; SFX.pop(); return; }
    if (!hit(L.act, mx, my)) return;
    if (screenState.pick === REMEDIES.length) return S.asleep ? wakeUp() : tuckIn();
    const r = REMEDIES[screenState.pick];
    if (r.id === 'company' && hasIll('blues')){
      closeScreen();
      say('Press and hold on ' + S.name + '. Eight times should do it.');
      return;
    }
    treat(r.id);
  }
};

/* -------------------------------- shop ------------------------------------
   Three shelves — coats, headgear, habitats — one at a time behind a row of
   tabs.

   Two shelves stacked used most of the screen and left the caption running
   into the action bar; a third would not have fitted at all. One shelf at a
   time is also how a shop with a counter works: you look at the coats, or you
   look at the hats. The tabs are the only navigation in this game that is not
   a physical key, and they are here because the alternative is four keys for
   one screen.

   A habitat is shown as the view itself rather than as a swatch or a name,
   for the same reason a coat is shown as the animal wearing it: the thing
   being sold is what you will be looking at.
   -------------------------------------------------------------------------- */
const SHELVES = ['coat', 'hat', 'land'];
const SHELF_NAME = { coat:'COATS', hat:'HEADGEAR', land:'HABITAT' };

function shelfTabs(g, active){
  const w = Math.floor((W - PAD*2 - 4) / SHELVES.length), y = BAR_H + 2, h = 11;
  const boxes = [];
  SHELVES.forEach((k, i) => {
    const box = [PAD + i*(w+2), y, w, h];
    boxes.push(box);
    const on = k === active;
    panel(g, box[0], box[1], box[2], box[3], on ? SC.sel : SC.ink);
    text(g, SHELF_NAME[k], box[0] + box[2]/2, y + 2, on ? SC.bone : SC.dim, 'centre');
    if (on){
      g.fillStyle = SC.moss;
      g.fillRect(box[0], y, box[2], 1); g.fillRect(box[0], y+h-1, box[2], 1);
      g.fillRect(box[0], y, 1, h); g.fillRect(box[0]+box[2]-1, y, 1, h);
    }
  });
  return boxes;
}

/* One row per shelf: what is on it, how wide the row is, and the three
   questions the caption and the action bar both need answered. Keeping them
   in one place is what stops the label saying "owned" over a button that
   says "buy it". */
function shelfItems(which){
  if (which === 'coat'){
    const items = SKINS[S.sp];
    return { items, cols:4, cell:[24,17],
      art: (g, it, cx, cy) => thumb(g, frameOf(S.sp, stageIdx(), 'idle', 0, false, it.id).cv, cx, cy, 24, 17),
      own: it => S.skinsOwned.includes(it.id), worn: it => S.skin === it.id,
      note: it => it.note, take:false, here:'worn' };
  }
  if (which === 'hat'){
    return { items: HAT_SHOP, cols:6, cell:[14,13],
      art: (g, it, cx, cy) => thumb(g, hatArt(it.id), cx, cy, 14, 13),
      own: it => S.owned.includes(it.id), worn: it => S[GEAR_FIELD[it.slot]] === it.id,
      note: () => 'Sits on the head.',
      take:true, here:'worn' };
  }
  return { items: BIOME_IDS.map(id => BIOMES[id]), cols:5, cell:[26,20],
    art: (g, it, cx, cy) => thumb(g, biomeThumb(it.id), cx, cy, 26, 20),
    own: it => G.biomesOwned.includes(it.id), worn: it => S.biome === it.id,
    note: it => it.note, take:false, here:'here' };
}

SCREENS.shop = {
  layout(){
    if (!SHELVES.includes(screenState.shelf)) screenState.shelf = 'coat';
    const sh = shelfItems(screenState.shelf);
    /* A shelf opens on what the animal already has on, not on whatever happens
       to be first: the first thing anyone wants to know in a shop is what they
       are wearing now. Only when the shelf changes, so a tap elsewhere sticks. */
    if (screenState.pickShelf !== screenState.shelf){
      screenState.pickShelf = screenState.shelf;
      screenState.pick = Math.max(0, sh.items.findIndex(it => sh.worn(it)));
    }
    if (typeof screenState.pick !== 'number' || screenState.pick >= sh.items.length) screenState.pick = 0;
    return { sh, grid: gridLayout(sh.items, BAR_H + 16, sh.cols) };
  },
  draw(g, L){
    const frame = screenFrame(g, 'SHOP');
    L.close = frame.close;
    L.tabs = shelfTabs(g, screenState.shelf);
    const sh = L.sh;
    sh.items.forEach((it, i) => {
      const own = sh.own(it), worn = sh.worn(it);
      gridCell(g, L.grid.box(i), {
        on: i === screenState.pick,
        art: (gg, cx, cy) => sh.art(gg, it, cx, cy),
        tag: worn ? sh.here : own ? 'own' : it.cost + 'c',
        tagCol: worn ? SC.moss : own ? SC.dim : SC.gold
      });
    });
    const item = sh.items[screenState.pick];
    const own = sh.own(item), worn = sh.worn(item);
    caption(g, L.grid.bottom + 4, item.name, own ? (worn ? 'in use' : 'owned') : item.cost + 'c',
            own ? SC.moss : (G.coins >= item.cost ? SC.gold : SC.rust), sh.note(item));
    /* An animal is always wearing a coat and always standing somewhere, so a
       coat and a habitat in use have nothing to toggle off; headgear does. */
    L.act = actionBar(g,
      own ? (worn ? (sh.take ? 'TAKE IT OFF' : 'IN USE') : (screenState.shelf === 'land' ? 'MOVE HERE' : 'WEAR IT'))
          : 'BUY IT',
      SC.moss, (!own && G.coins < item.cost) || (worn && !sh.take));
  },
  tap(mx, my, L){
    if (hit(L.close, mx, my)) return closeScreen();
    for (let i = 0; i < L.tabs.length; i++)
      if (hit(L.tabs[i], mx, my)){
        if (screenState.shelf !== SHELVES[i]){ screenState.shelf = SHELVES[i]; SFX.pop(); }   // layout() picks what is worn
        return;
      }
    for (let i = 0; i < L.sh.items.length; i++)
      if (hit(L.grid.box(i), mx, my)){ screenState.pick = i; SFX.pop(); return; }
    if (!hit(L.act, mx, my)) return;
    const item = L.sh.items[screenState.pick];
    if (screenState.shelf === 'coat') buySkin(item.id);
    else if (screenState.shelf === 'hat') buyHat(item.id);
    else buyHabitat(item.id);
  }
};

function thumb(g, cv, cx, cy, maxW, maxH){
  const sc = Math.min(maxW / cv.width, maxH / cv.height, 1);
  const w = Math.max(1, Math.round(cv.width * sc)), h = Math.max(1, Math.round(cv.height * sc));
  g.drawImage(cv, Math.round(cx - w/2), Math.round(cy - h/2), w, h);
}

/* -------------------------------- nest ------------------------------------ */
SCREENS.nest = {
  preHatch: true,
  layout(){
    const slots = G.pets.slice();
    if (G.pets.length < MAX_PETS) slots.push(null);          // the empty cup
    return { slots, grid: gridLayout(slots, BAR_H + 11, 6) };
  },
  draw(g, L){
    const frame = screenFrame(g, 'NEST');
    L.close = frame.close;
    text(g, numWord(G.pets.length) + ' in the nest', PAD, BAR_H + 2, SC.dim);
    L.slots.forEach((p, i) => {
      gridCell(g, L.grid.box(i), {
        on: i === screenState.pick,
        art: (gg, cx, cy) => {
          if (!p){ text(gg, '+', cx, cy - 3, SC.dim, 'centre'); return; }
          if (!p.sp || !p.born){
            gg.save(); gg.translate(cx, cy); gg.scale(.62, .62);
            drawEggArt(gg, 0, 0, p.sp || Object.keys(SPECIES)[0], 0);
            gg.restore(); return;
          }
          const prev = S; S = p;
          const f = frameOf(p.sp, stageIdx(), 'idle', 0, false, p.skin || 'wild');
          S = prev;
          thumb(gg, f.cv, cx, cy, 24, 17);
        },
        tag: p ? (i === G.active ? 'here' : '') : 'new',
        tagCol: p ? SC.moss : SC.gold
      });
    });
    const p = L.slots[screenState.pick];
    let name = 'Take a new egg', right = 'new';
    let note = 'Start another animal from scratch. Everything in the nest ages and gets hungry whether or not it is the one on screen. Coins are shared.';
    if (p){
      name = p.name || 'Unnamed';
      if (!p.sp){ note = 'An egg nobody has chosen yet.'; right = 'egg'; }
      else if (!p.born){ note = 'Still in the shell.'; right = 'egg'; }
      else {
        const prev = S; S = p;
        const worst = Math.min(p.needs.hunger, p.needs.energy, p.needs.hygiene, p.needs.joy);
        note = STAGE[stageIdx()].label + ' ' + SPECIES[p.sp].common + ', ' + ageLabel(p) + '. '
             + (p.vet ? 'Needs a vet.' : p.ills.length ? ILLS[p.ills[0].id].name + '.'
                : worst < 25 ? 'Needs attention.' : p.asleep ? 'Asleep.' : 'Doing fine.');
        S = prev;
        right = screenState.pick === G.active ? 'here' : 'visit';
      }
    }
    caption(g, L.grid.bottom + 4, name, right, SC.moss, note);
    L.act = actionBar(g, p ? (screenState.pick === G.active ? 'ALREADY HERE' : 'VISIT') : 'TAKE AN EGG',
                      SC.moss, !!p && screenState.pick === G.active);
  },
  tap(mx, my, L){
    if (hit(L.close, mx, my)) return closeScreen();
    for (let i = 0; i < L.slots.length; i++)
      if (hit(L.grid.box(i), mx, my)){ screenState.pick = i; SFX.pop(); return; }
    if (hit(L.act, mx, my)){
      const p = L.slots[screenState.pick];
      if (!p){ closeScreen(); newEgg(); }
      else if (screenState.pick !== G.active){ closeScreen(); switchPet(screenState.pick); }
    }
  }
};

/* ==========================================================================
   CASE CHROME
   What is left outside the screen: the meter strip, the identity line, the
   bond row, the five keys, and the prose panels the screen cannot carry.

   This file used to hold every menu in the game, on the rule that all text
   lived in the DOM. The menus have moved onto the glass — see 07-screens.js —
   because on the device this copies the screen is the whole interface and the
   case never changes while you play. What stays here is the printed panel
   around the screen and the long-form reading.
   ========================================================================== */

const NEED_META = [
  { k:'hunger',  label:'Hunger',  col:'#c98a4a' },
  { k:'energy',  label:'Energy',  col:'#d9c04a' },
  { k:'hygiene', label:'Clean',   col:'#7fb2c9' },
  { k:'joy',     label:'Joy',     col:'#c96f86' }
];
/* The icon art is in PIX in 00-art.js and the outline pass is in pixCanvas,
   so what is left here is the call. It used to be fourteen hand-written
   fillRect functions and a private copy of the dilation loop. The `w`/`h`
   arguments are kept because two callers pass sizes; a stored sprite has its
   own, and anything else is scaled by CSS. */
function pixelIcon(id){ return pixCanvas('icon.' + id, '#141c1e'); }

/* The bond row used to be five rotated CSS squares and the meters were CSS
   pills with rounded ends and a smooth gradient. Neither belonged next to a
   hard-edged pixel scene. The bond is now five pixel hearts baked the same way
   the particle hearts are, and the meters are ten hard cells behind a black
   grid — see .track in the stylesheet. */
const BOND_PIPS = 5, PIP_W = 9, PIP_H = 7;
function bondCanvas(on){
  const c = makeCv(BOND_PIPS*PIP_W, PIP_H), g = readCtx(c);
  for (let i=0;i<BOND_PIPS;i++){
    /* One heart, drawn twice: in its own colours when the pip is earned and
       flat grey when it is not. It used to be a second hand-written copy of
       the same seven-by-six heart that the particles use. */
    pixDrawBoxed(g, 'heart', i*PIP_W, 1, 1, i < on ? null : '#232e31');   // a finer heart shrinks into its pip
  }
  c.style.cssText = 'width:' + (BOND_PIPS*PIP_W*2) + 'px;height:' + (PIP_H*2) +
                    'px;image-rendering:pixelated;display:block';
  return c;
}

function buildChrome(){
  $('needs').innerHTML = NEED_META.map(n =>
    `<div class="need" id="need-${n.k}">
       <div class="cap"><span data-nico="${n.k}"></span><b>${n.label}</b></div>
       <div class="track"><div class="fill" id="fill-${n.k}" style="background:${n.col}"></div><i class="seg"></i></div>
     </div>`).join('');
  $('needs').onclick = () => { if (hatched()) openSheet('vitals'); };
  $('picks').innerHTML = eggChoices().map(c => {
    const sp = SPECIES[c.id];
    return `<span style="left:${(c.x / W * 100).toFixed(1)}%"><b>${sp.common}</b>${sp.lure}</span>`;
  }).join('');
  $('actions').innerHTML = [
    ['feed','Feed'],['play','Play'],['wash','Wash'],['care','Care'],['shop','Shop']
  ].map(([k,l]) => `<button class="act" id="act-${k}"><span class="ico" data-ico="${k}"></span>${l}</button>`).join('');
  document.querySelectorAll('[data-ico]').forEach(sl => {
    const c = pixelIcon(sl.getAttribute('data-ico'));
    c.style.imageRendering = 'pixelated';
    sl.appendChild(c);
  });
  document.querySelectorAll('[data-nico]').forEach(sl => {
    const c = pixelIcon(sl.getAttribute('data-nico'));
    c.style.imageRendering = 'pixelated';
    sl.appendChild(c);
  });
  const coin = pixelIcon('coin');
  coin.style.cssText = 'width:14px;height:14px;image-rendering:pixelated';
  $('coinArt').appendChild(coin);
  const nest = pixelIcon('nest');
  nest.style.cssText = 'width:20px;height:20px;image-rendering:pixelated';
  $('btnNest').appendChild(nest);
  const bone = pixelIcon('bone');
  bone.style.cssText = 'width:20px;height:20px;image-rendering:pixelated';
  $('btnDev').appendChild(bone);
  paintSound();
  /* The keys latch: one press opens the screen, the same press again closes
     it, and any other key jumps straight across. Wash is the one action with
     nothing to choose, so its key does the thing. */
  $('act-feed').onclick = () => toggleScreen('feed');
  $('act-play').onclick = () => toggleScreen('play');
  $('act-wash').onclick = () => { closeScreen(); scrub(); };
  $('act-care').onclick = () => toggleScreen('care');
  $('act-shop').onclick = () => toggleScreen('shop');
  $('btnNest').onclick = () => toggleScreen('nest');
  $('btnDossier').onclick = () => openSheet('dossier');
  $('btnSound').onclick = toggleSound;
  $('btnDev').onclick = () => openSheet('dev');
  $('dName').onclick = beginRename;
  $('dName').onkeydown = e => { if (e.key === 'Enter') beginRename(); };
  $('scrim').onclick = closeSheet;
  armBrandHold();
}

/* The screen is 224 device pixels across. Displayed at an arbitrary fraction
   of that, its pixel grid lands unevenly against the grid the case is built
   on, and every one-pixel line in the interface shows it. Whole and half steps
   keep the ratio regular, and the case is sized so that a phone gets 1.5x and
   a desktop 2x. */
/* Quarter steps, not halves. The glass takes the largest step that fits the
   recess, so whatever is left over between one step and the next is dead black
   panel around the picture — and on a 360-wide phone that was ten cells a side,
   the game sitting at 1x inside a recess with room for a third more. A quarter
   step puts a four-pixel beat in the scaling where a half step puts a two-pixel
   one; at the pixel densities a phone has, neither is visible, and the choice is
   between a beat nobody can see and a border everybody can. Eighths for the same
   reason again — the ladder is only worth climbing in rungs small enough that
   the last one does not leave a band of dead panel round the picture. */
const LCD_STEPS = Array.from({length:17}, (_, i) => 1 + i/8);

/* The case is a fixed 96x160 grid and `--px` is how big one cell of it is, so
   fitting the case to the window is one number. Both axes matter now: the old
   layout grew downward for as long as its contents needed and only ever checked
   the width, which is why a phone left a third of its height empty under the
   case while the glass stayed at 1x.

   `--px` is deliberately not snapped to whole pixels. The case art is a sprite
   scaled to the box and a fractional scale only softens it slightly, whereas
   the game canvas must not be scaled fractionally at all — so the canvas takes
   the largest whole or half multiple of 224 that fits inside the recess drawn
   for it and is centred there, the way an LCD sits in a moulded opening. */
const CASE_W = 96, CASE_H = 155;          // the grid the artwork is drawn on
const RECESS_W = 88, RECESS_H = 67;       // where the canvas floats, in cells
/* The floor is not a matter of taste: below it the recess is smaller than the
   224x168 canvas, and the canvas would either be clipped by the moulding or
   take a fractional scale to fit. 224/84 is 2.67 and 168/61 is 2.76, so 2.8 is
   the smallest case that can still show the game at 1:1 — lower than it was,
   because the glass took the room the meters were using. */
const PX_MIN = 2.8, PX_MAX = 9;

/* The mood line is pinned to one line, so a long name and a long mood ran off
   its right end — "Norbert is fast asl…". Rather than clip, the type steps
   down a quarter of a cell at a time until the line fits, to no smaller than
   two cells; only past that does the ellipsis in the stylesheet take over.
   Measured, not estimated: the box has already been laid out and knows. */
/* Past the smallest size the name gives way to "It": the name is written in
   full in the header right above the glass, so it is the one part of the line
   that can go without losing anything. "is too weak to stand. Take it to the
   vet." after a fourteen-letter name did not fit a phone at any size. */
const MOOD_SIZES = [3.25, 3, 2.75, 2.5, 2.25, 2];
function fitMood(){
  const el = $('mood');
  if (!el) return;
  const fits = () => el.scrollWidth <= el.clientWidth + 1;
  const shrink = floor => {
    for (const s of MOOD_SIZES){
      if (s < floor) break;
      el.style.fontSize = 'calc(var(--px)*' + s + ')';
      if (fits()) return true;
    }
    return false;
  };
  /* The name keeps its place only down to two and a half cells; below that
     "It" at a readable size beats a name in type too small to read. */
  if (shrink(2.5)) return;
  const name = el.firstChild;
  if (name && name.nodeType === 3 && el.querySelector('em')){ name.textContent = 'It '; shrink(0); }
  else shrink(0);
}
function fitScreen(){
  const app = $('app');
  if (!app) return;
  const cs = getComputedStyle(app);
  const availW = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH = window.innerHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const px = clamp(Math.min(availW / CASE_W, availH / CASE_H), PX_MIN, PX_MAX);
  document.documentElement.style.setProperty('--px', px + 'px');

  /* Measure the opening rather than compute it. `RECESS_W`/`RECESS_H` are the
     cells the stylesheet is supposed to draw, and the moment the two disagree
     the glass is sized for an opening it does not have — it was handed 364 into
     a 358-wide box, where `max-width` clamped it to a scale of 1.598 and put the
     world's pixel grid on a fraction, which is the one thing the steps exist to
     prevent. The box knows how big it is. */
  const stage = document.querySelector('.stage');
  const box = stage ? stage.getBoundingClientRect() : { width: RECESS_W*px, height: RECESS_H*px };
  let best = W;
  for (const k of LCD_STEPS)
    if (W * k <= box.width && H * k <= box.height) best = W * k;
  document.documentElement.style.setProperty('--lcd-w', best + 'px');
}

/* Which face the case wears.

   `moulded` is the CSS one and the default — it is the case this game has always
   had, and no pixel grid that would fit in a source file can reproduce a vector
   curve rendered at device resolution. `art` is a picture: the sprite in
   `PIX.case`, which the Pixels tab edits, or a file the owner imported. The box
   is the same 96x155 grid either way, so everything live stays where it is.

   Precedence, here and in the editor: an imported skin on this machine, then one
   promoted into the project, then the drawing if it has been asked for, then the
   moulding. */
let caseSkin = null;                      // an imported image, when there is one
let caseMode = 'moulded';                 // or 'drawn', if the sprite was chosen

function caseArtURL(){
  if (caseSkin) return caseSkin;
  if (CASE_SKIN) return CASE_SKIN;
  if (caseMode === 'drawn') return pixCanvas('case').toDataURL();
  return null;
}
function paintCase(){
  const url = caseArtURL();
  if (url){
    document.documentElement.style.setProperty('--case-art', 'url("' + url + '")');
    document.documentElement.dataset.case = 'art';
  } else {
    document.documentElement.style.removeProperty('--case-art');
    document.documentElement.dataset.case = 'moulded';
  }
  fitCrown();
}
/* An imported case is the owner's own and lives on their machine, so it has to
   be fetched before the case is first painted. A failure here is not worth
   stopping the game for: the moulding underneath is always there. */
async function loadCaseSkin(){
  try {
    caseSkin = await Store.get(CASE_KEY);
    caseMode = (await Store.get(CASE_MODE_KEY)) === 'drawn' ? 'drawn' : 'moulded';
  } catch (e){ caseSkin = null; caseMode = 'moulded'; }
  paintCase();
}

/* The crown ridge.

   `border-radius: 50% 50% ... / 20% 20% ...` makes the top of the moulding one
   ellipse arc running the full width, with rx = width/2 and ry = 20% of the
   height. Both move with the case, so a plate's height above the base line at a
   given x is not something style.css can express — it has no square root and no
   way to read its own box. Hand-fitted offsets are how the ridge ended up ten
   pixels left of the crown, on an arc twice as steep as the real one.

   So the plates declare --x, --w and --h in the stylesheet and this puts them on
   the real curve: base tucked TUCK px inside the moulding so each one is rooted
   rather than balanced on the edge, and rotated to the surface normal so they
   fan the way a dorsal ridge does instead of all leaning one way. */
/* How far a plate's base is buried in the shell, in cells, so it stays buried
   by the same amount whatever size the case is. */
const CROWN_TUCK = 1.25;
function fitCrown(){
  const face = document.querySelector('.moulding');
  const row = document.querySelector('.scutes');
  if (!face || !row) return;
  const rx = face.offsetWidth / 2, ry = face.offsetHeight * 0.20;
  if (!rx || !ry) return;
  const px = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--px')) || 4;
  const mid = row.offsetWidth / 2;
  for (const el of row.children){
    /* Measured off the element's own resolved box, not read out of its custom
       properties. `getPropertyValue('--h')` hands back the calc() as written —
       "calc(4.16px*5)" — and parseFloat of that is NaN, which fell through to a
       height of zero and put the whole ridge twenty pixels down inside the
       shell. The box is already resolved and cannot lie about itself. */
    const h = el.offsetHeight;
    const x = el.offsetLeft + el.offsetWidth / 2 - mid;
    const u = clamp(x / rx, -.999, .999);
    const c = Math.sqrt(1 - u*u);
    const drop = ry * (1 - c);                    // how far the crown has fallen at x
    const slope = ry * u / (rx * c);              // d(drop)/dx, so the surface normal
    el.style.top = Math.round(drop + CROWN_TUCK*px - h) + 'px';
    el.style.transform = 'rotate(' + (Math.atan(slope) * 180 / Math.PI).toFixed(2) + 'deg)';
  }
}

/* Refit on anything that changes the box. The window resize is debounced; the
   observer on #app is not, because between a resize landing and the debounce
   firing `--px` is the size the last window wanted. With the boxes written as
   fractions that is only a typography problem, but it is still wrong for a
   frame or two and the observer closes it. */
if (window.ResizeObserver){
  const app = document.getElementById('app');
  if (app) new ResizeObserver(() => { fitScreen(); fitCrown(); fitMood(); }).observe(app);
}
let fitTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(() => { fitScreen(); fitCrown(); }, 120);
});

/* The sound switch lives on the case, not three taps deep in the dossier. It
   swaps its own glyph so the state is readable without opening anything. */
let soundIcon = null, soundShown = null;
function toggleSound(){
  G.sound = !G.sound;
  if (G.sound) SFX.pop();
  paintSound(); save();
  if (openPanel === 'dossier' || openPanel === 'dev') renderSheet(openPanel);
}
/* paintChrome runs about once a second, so the glyph is only rebuilt on a flip */
function paintSound(){
  const btn = $('btnSound'), on = !G || !!G.sound;
  if (on === soundShown) return;
  soundShown = on;
  if (soundIcon) soundIcon.remove();
  soundIcon = pixelIcon(on ? 'sound' : 'mute');
  soundIcon.style.cssText = 'width:20px;height:20px;image-rendering:pixelated';
  btn.appendChild(soundIcon);
  btn.classList.toggle('off', !on);
  btn.setAttribute('aria-pressed', String(!on));
  btn.title = on ? 'Sound on' : 'Sound off';
}

/* Long-press the brand plate to show or hide the developer button. The flag
   lives on the save, so the choice survives a reload. */
function armBrandHold(){
  const brand = document.querySelector('.brand');
  if (!brand) return;
  let timer = 0;
  const start = () => { timer = setTimeout(() => {
    G.dev = !G.dev; save(); paintChrome();
    say(G.dev ? 'Developer tools on.' : 'Developer tools off.');
  }, 700); };
  const stop = () => clearTimeout(timer);
  brand.addEventListener('pointerdown', start);
  ['pointerup','pointerleave','pointercancel'].forEach(e => brand.addEventListener(e, stop));
}
function paintChrome(){
  const busy = mode !== 'live';
  document.querySelectorAll('.act').forEach(b => b.classList.remove('down'));
  if (screenOpen()){
    const k = $('act-' + screen);
    if (k) k.classList.add('down');           // the key that opened it stays in
  }
  /* The status badges float over the glass. A screen is the glass, and so is a
     round of a game, so they have to get out of the way or they sit on top of
     the title bar or the clock. */
  $('badges').style.display = screenOpen() || mode === 'game' ? 'none' : '';
  ['feed','play','wash','care','shop'].forEach(k => { $('act-'+k).disabled = busy; });
  const careBtn = $('act-care');
  const old = careBtn.querySelector('.nub'); if (old) old.remove();
  if (hatched() && (S.ills.length || S.vet)){
    const n = document.createElement('i'); n.className = 'nub'; careBtn.appendChild(n);
  }
  $('nestCount').textContent = G.pets.length > 1 ? G.pets.length : '';
  $('btnDev').hidden = !G.dev && !devMode;     // never hide the way out of developer mode
  // a copy has to look like one, or a test run gets mistaken for the real animal
  document.body.classList.toggle('devmode', devMode);
  paintSound();
}

/* ------------------------------- refresh ---------------------------------- */
function refreshLight(){
  if (!G) return;
  $('coins').textContent = Math.floor(G.coins);
  if (!hatched()) return;
  for (const n of NEED_META){
    const v = S.needs[n.k];
    $('fill-'+n.k).style.width = v + '%';
    $('fill-'+n.k).style.background = v < 22 ? '#c2603c' : v < 45 ? '#d9a441' : n.col;
    $('need-'+n.k).classList.toggle('low', v < 22);
  }
}
function refresh(){
  refreshLight();
  $('picks').hidden = !(mode === 'choose');
  $('needs').style.display = hatched() ? '' : 'none';
  const lamp = $('lamp');
  if (!hatched()){
    $('dName').textContent = S && S.sp ? 'Nearly out' : 'A warm egg';
    $('dSub').textContent = S && S.sp ? 'Keep tapping the shell' : 'Pick one to begin';
    $('mood').textContent = S && S.sp ? 'Something is moving in there.'
      : numWord(eggChoices().length) + ' eggs are waiting in the nest.';
    $('bond').innerHTML = ''; delete $('bond').dataset.pips; $('badges').innerHTML = '';
    lamp.className = 'lamp rest';
    paintChrome();
    return;
  }
  const sp = SPECIES[S.sp], st = STAGE[stageIdx()];
  $('dName').textContent = S.name;
  /* The age has moved to the chip on the glass, so it is not written here as
     well: two places saying how old the animal is is two places that can
     disagree, and the subtitle is the one nobody was reading. */
  $('dSub').textContent = st.label + ' ' + sp.common;
  $('mood').innerHTML = escapeHTML(S.name) + ' <em>' + escapeHTML(moodOf().line) + '</em>';
  fitMood();
  const bondEl = $('bond');
  const pips = bondPips();
  if (bondEl.dataset.pips !== String(pips)){
    bondEl.dataset.pips = String(pips);
    bondEl.innerHTML = '';                     // the hearts say what they are; the word took the mood line's room
    bondEl.appendChild(bondCanvas(pips));
  }
  const tags = [];
  if (S.vet) tags.push(['warn','At their limit']);
  S.ills.forEach(i => tags.push(['warn', ILLS[i.id].name]));
  if (S.asleep && !S.vet) tags.push(['', 'Asleep']);
  if (S.mess.length) tags.push(['warn', S.mess.length + ' to clean']);
  if (G.streak > 1) tags.push(['', G.streak + '-day streak']);
  /* The age leads the row and is always there; the status tags flow after it.
     It is this animal's own counter — every pet in the nest has its own — and
     it is the one number on the glass that only ever goes up. */
  $('badges').innerHTML = `<span class="age">${ageLabel()}</span>`
    + tags.slice(0,3).map(([c,t]) => `<span class="tag ${c}"><i class="dot"></i>${t}</span>`).join('');
  lamp.className = 'lamp' + (S.vet || S.ills.length ? ' bad' : S.asleep ? ' rest' : '');
  paintChrome();
  /* The developer panel is repainted, not rebuilt: this runs every second, and
     rebuilding it removed the slider under the pointer mid-drag. */
  if (openPanel === 'dev') paintDev();
  else if (openPanel) renderSheet(openPanel);
}

/* -------------------------------- sheets ---------------------------------- */
let openPanel = null;
/* What is left in the DOM. Feed, Play, Care, Shop and the Nest are screens on
   the glass now; these are the panels that are all prose, plus the developer
   harness, and at six pixels a character prose is the one thing the screen
   cannot carry. */
const SHEETS_PRE_HATCH = ['dossier', 'trouble', 'dev'];
/* The developer panel docks rather than covering the screen: on a wide window
   it slides in at the right, on a narrow one it takes the bottom half. It
   raises no scrim either way, so the game stays visible and clickable while a
   sprite is being stepped through its stages — which is the entire point of
   having it. */
const DOCKED = ['dev'];
function openSheet(which){
  if (mode === 'game' && which !== 'dev') return;
  if (mode !== 'live' && !SHEETS_PRE_HATCH.includes(which)) return;
  const dock = DOCKED.includes(which);
  openPanel = which;
  renderSheet(which);
  $('sheet').classList.toggle('dock', dock);
  $('sheet').classList.add('on');
  $('scrim').classList.toggle('on', !dock);
}
function closeSheet(){
  openPanel = null;
  $('sheet').classList.remove('on'); $('scrim').classList.remove('on');
  closeScreen();
}

function escapeHTML(value){
  return String(value ?? '').replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
}
function rowHTML(art, title, sub, right, attrs){
  const slot = art ? `<span class="art" data-art="${art}"></span>` : '';
  return `<button class="row" ${attrs||''}>${slot}
    <span class="t"><b>${escapeHTML(title)}</b><small>${escapeHTML(sub)}</small></span><span class="px">${escapeHTML(right)}</span></button>`;
}
function mountArt(root){
  root.querySelectorAll('[data-art]').forEach(slot => {
    const id = slot.getAttribute('data-art');
    if (!id) return;
    if (PIX['hat.' + id]){
      const c = makeCv(30,28), g = readCtx(c);
      g.imageSmoothingEnabled = false;
      g.drawImage(hatArt(id), 3, 2, 24, 22);
      slot.appendChild(c);
    } else {
      const c = makeCv(30,30), g = readCtx(c);
      g.imageSmoothingEnabled = false; drawItemFit(g, id, 15, 15, 26, 26, 3);
      slot.appendChild(c);
    }
  });
}
/* One entry per sheet, each handed the body element and the active species.
   This was a single if/else chain that every new panel had to be threaded
   into; a sheet is now self-contained, the way GAMES already works in
   06-render.js. Each one builds its own HTML, mounts it, then binds. */
const SHEETS = {

  vitals(b, sp){
    let html = '';
    const petName = escapeHTML(S.name);
    const n = S.needs, hr = new Date().getHours();
    const untilBed = ((SIM.bedHour - hr) + 24) % 24;
    const hoursLeft = (n.energy / Math.max(.01, SIM.energyAwake * trait('tempo').energy)).toFixed(1);
    const hoursFull = ((100 - n.energy) / Math.max(.01, SIM.energyAsleep)).toFixed(1);
    html = `<h2>Vitals</h2><p class="lede">What each meter does, and how fast it moves for this animal.</p>
      <div class="stats">
        <div class="stat"><b>Hunger</b><span>${Math.round(n.hunger)}%</span></div>
        <div class="stat"><b>Energy</b><span>${Math.round(n.energy)}%</span></div>
        <div class="stat"><b>Clean</b><span>${Math.round(n.hygiene)}%</span></div>
        <div class="stat"><b>Joy</b><span>${Math.round(n.joy)}%</span></div>
      </div>
      <div class="log"><time>Energy</time>Falls about ${(SIM.energyAwake * trait('tempo').energy).toFixed(1)} points an hour awake, and comes back at ${SIM.energyAsleep} an hour asleep. At this level ${petName} has roughly ${hoursLeft} waking hours left, and a full night takes about ${hoursFull} hours.</div>
      <div class="log"><time>Sleep</time>${petName} settles itself between ${SIM.bedHour}:00 and ${SIM.wakeHour}:00, or any time energy drops under 6. It wakes on its own once rested. Bedtime is in about ${untilBed} hours. Keeping it up more than ${SIM.chillAfter + SIM.chillHours} hours past bedtime brings on a chill.</div>
      <div class="log"><time>Hunger</time>Falls about ${(SIM.hunger*trait('appetite').hunger).toFixed(1)} an hour. Under 22 it starts nosing at the dirt; at zero, health follows it down.</div>
      <div class="log"><time>Clean</time>Falls ${SIM.hygiene} an hour, and drops 11 more with every mess. Left under ${SIM.mitesBelow} for ${SIM.mitesHours} hours, it brings on mites.</div>
      <div class="log"><time>Joy</time>Falls about ${(SIM.joy*trait('tempo').joy*trait('social').lonely).toFixed(1)} an hour. Games, tricks and petting bring it back. Left under ${SIM.bluesBelow} for ${SIM.bluesHours} hours, it turns into the blues.</div>
      <div class="hr"></div>`;
    html += rowHTML('', 'Tuck it in', S.asleep ? S.name + ' is already asleep.' :
      n.energy > 70 ? 'Available once energy drops below 70.' : 'Settle it early and skip the late night. Builds a little trust.',
      S.asleep || n.energy > 70 ? '—' : 'free', S.asleep || n.energy > 70 ? 'disabled' : '');
    b.innerHTML = html; mountArt(b);
    const r = b.querySelector('.row'); if (r) r.onclick = tuckIn;
  },

  dossier(b, sp){
    let html = '';
    if (!hatched()){
      b.innerHTML = `<h2>Field dossier</h2><p class="lede">Choose an egg first. Each species is drawn from its own skeleton, so the sprite shows what the notes claim.</p>`;
    } else {
      const t = ['appetite','tempo','social'].map(k => `<span class="trait">${trait(k).name}</span>`).join('');
      html = `<h2>${escapeHTML(S.name)}</h2><p class="lede">${sp.name} · ${sp.era}</p>
        <div class="stats">
          <div class="stat"><b>Stage</b><span>${STAGE[stageIdx()].label}</span></div>
          <div class="stat"><b>Well-kept time</b><span>${Math.floor(S.growth)} min</span></div>
        </div>
        <p class="note" style="margin-bottom:8px">Temperament</p>${t}
        <p class="note">${['appetite','tempo','social'].map(k => trait(k).note).join(' ')}</p>
        <div class="hr"></div>
        <p class="note" style="margin-bottom:6px">Field notes</p>
        ${sp.facts.map(f => `<div class="log">${f}</div>`).join('')}
        <p class="note" style="margin:10px 0 6px">Drawn on the sprite</p>
        ${sp.checks.map(c => `<div class="log">${c}</div>`).join('')}
        <div class="hr"></div>
        <p class="note">Field journal · ${S.journal.length}/${journalEntries().length}</p>
        ${journalEntries().map(entry => `<div class="log">${S.journal.includes(entry.id) ? 'Recorded' : 'Not yet observed'} · ${entry.title}</div>`).join('')}
        <p class="note">Four studies: Fern sprig. Ten studies: Field cap.</p>
        <p class="note" style="margin-bottom:6px">Diary</p>
        ${S.log.length ? S.log.slice(0,10).map(l => `<div class="log"><time>${new Date(l.t).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}</time>${escapeHTML(l.txt)}</div>`).join('') : '<p class="note">Nothing has happened yet.</p>'}
        <div class="hr"></div>
        ${rowHTML('', G.sound ? 'Sound on' : 'Sound off', 'Beeps, chomps and roars.', G.sound ? 'on' : 'off')}
        ${rowHTML('', 'Release ' + S.name, G.pets.length > 1 ? 'Removes this animal from the nest for good.' : 'You cannot release your only animal.', 'release', G.pets.length > 1 ? '' : 'disabled')}
        ${rowHTML('', 'Wipe everything', 'Deletes the whole nest and starts over.', 'reset')}`;
      b.innerHTML = html; mountArt(b);
      const rows = b.querySelectorAll('.row');
      rows[0].onclick = toggleSound;
      let armedR = false, armedW = false;
      rows[1].onclick = () => {
        if (G.pets.length <= 1) return;
        if (!armedR){ armedR = true; rows[1].querySelector('.px').textContent = 'sure?'; setTimeout(()=>{armedR=false; if(openPanel==='dossier') renderSheet('dossier');}, 3000); return; }
        releasePet(G.active);
      };
      rows[2].onclick = () => {
        if (devMode) return refuse('Leave developer mode before wiping the nest.');
        if (!armedW){ armedW = true; rows[2].querySelector('.px').textContent = 'sure?'; setTimeout(()=>{armedW=false; if(openPanel==='dossier') renderSheet('dossier');}, 3000); return; }
        // a deliberate wipe clears the safety net too, which is what the row promises
        saveBlocked = true;
        saveQueue.then(() => Promise.all([Store.del(SAVE_KEY), Store.del(BACKUP_KEY)]))
          .then(() => location.reload()).catch(() => { saveBlocked = false; storageNotice('Reset failed. Your nest was not reset.'); });
      };
    }
    const backup = document.createElement('div');
    backup.innerHTML = rowHTML('', 'Export nest', 'Download a backup of this nest.', 'export') +
      rowHTML('', 'Import nest', 'Replace this nest with a validated backup.', 'import') +
      rowHTML('', 'Export recovery copy', 'The nest preserved before an import or unreadable-save recovery.', 'export');
    const buttons = backup.querySelectorAll('button');
    buttons[0].onclick = exportNest;
    buttons[1].onclick = importNest;
    buttons[2].onclick = async () => {
      try {
        const raw = await Store.get(saveBlocked ? SAVE_KEY : BACKUP_KEY);
        if (!raw) return storageNotice('No recovery copy is stored on this device.');
        exportText(raw, 'paleopal-recovery.json');
      } catch(error){ storageNotice('The recovery copy could not be read. The stored data has not been changed.'); }
    };
    b.appendChild(backup);
  },

  /* Developer tools, as folding sections under a status strip. Chips are
     switches; sliders are values. The panel is built here once per chip press
     and otherwise only repainted by paintDev(), because a slider rebuilt while
     it is being dragged loses the pointer after one step. */
  dev(b, sp){
    const scroller = $('sheet'), scroll = scroller.scrollTop;
    const chips = rows => `<div class="chips">` + rows.map(([label, act, cls]) =>
      `<button class="chip ${cls||''}" data-dev="${act}">${label}</button>`).join('') + `</div>`;
    const pick = (items, on, act, label) => `<div class="chips">` + items.map(it =>
      `<button class="chip${on(it) ? ' on' : ''}" data-dev="${act(it)}">${label(it)}</button>`).join('') + `</div>`;
    const slider = (label, key, min, max, step) => {
      const v = devValue(key);
      return `<label class="devrow"><span>${label}</span>` +
        `<input type="range" min="${min}" max="${max}" step="${step}" value="${v}" data-set="${key}">` +
        `<output>${devFmt(key, v)}</output></label>`;
    };
    const sec = (id, title, hint, body) =>
      `<details class="devsec" data-sec="${id}"${devOpen.has(id) ? ' open' : ''}>` +
      `<summary>${title}<small>${hint}</small></summary><div class="devbody">${body}</div></details>`;
    const alive = hatched(), st = alive ? stageIdx() : -1;

    /* Off: the switch, and what it does. Nothing else, because nothing else
       here is safe to press on the real nest. */
    if (!devMode){
      b.innerHTML = `<h2>Developer tools</h2>
        <p class="lede">Developer mode plays a copy of your nest. Waking, bedtime, the

        chips([['Start developer mode', 'enter'], ['Close panel', 'close']]) +

      b.querySelectorAll('[data-dev]').forEach(c => c.onclick = () => devAction(c.getAttribute('data-dev')));
      return;
    }

    let html = `<h2>Developer mode</h2>
      <p class="lede">You are playing a copy. Nothing here reaches your real nest, and
      leaving throws the copy away.</p>` +
      chips([['Leave developer mode', 'exit', 'warn'], ['Copy my real nest in again', 'restart']]) +
      `<div class="devstrip" id="devstrip"></div>`;

    const held = alive && devSleepHold && devSleepHold.pet === S;
    html += sec('time', 'Time and sleep', held ? 'sleep held' : 'sky clock, bedtime',
      pick([['Real', null], ['Dawn', 6.5], ['Day', 12], ['Dusk', 19.5], ['Night', 23]],
           ([, h]) => devHour === h, ([, h]) => 'clock:' + h, ([l]) => l) +
      slider('Clock', 'clock', 0, 23.75, .25) +
      `<p class="tiny">Moves the sky, and decides whether it is bedtime. Real time still

      `<div class="devsub">Sleep window</div>` +
      slider('Bedtime', 'tune:bedHour', 0, 23, 1) +
      slider('Wakes at', 'tune:wakeHour', 0, 23, 1) +
      (alive ? chips([[S.asleep ? 'Wake it up' : 'Put it to sleep', 'toggleSleep']].concat(
                     held ? [['Let the rules decide', 'releaseSleep']] : [])) +
               `<p class="tiny">${held ? 'Held ' + devSleepHold.state + ': bedtime, tiredness and the wake grace are ignored until you let go.'
                                       : 'Waking or settling it here, or from Care, holds until you let the rules decide.'}</p>` : ''));

    if (alive){
      html += sec('meters', 'Meters', 'drag to set',
        DEV_NEEDS.map(([k, l]) => slider(l, 'need:' + k, 0, 100, 1)).join('') +
        slider('Health', 'health', 0, 100, 1) + slider('Bond', 'bond', 0, 100, 1) +
        chips([['Fill all', 'fillNeeds'], ['Drain to 8', 'drainNeeds', 'warn'], ['Collapse', 'collapse', 'warn']]));

      html += sec('growth', 'Growth', STAGE[st].label.toLowerCase(),
        pick(STAGE.map((s2, i) => i), i => i === st, i => 'stage' + i, i => STAGE[i].label) +
        slider('Minutes kept', 'growth', 0, GROWTH_GATES[GROWTH_GATES.length-1] + 60, 1) +
        `<p class="tiny">Stages turn at ${GROWTH_GATES.join(', ')} well-kept minutes.</p>`);
    }

    html += sec('rates', 'Rates', 'per hour, every animal',
      slider('Hunger', 'tune:hunger', 0, 60, .5) +
      slider('Energy awake', 'tune:energyAwake', 0, 60, .5) +
      slider('Energy asleep', 'tune:energyAsleep', 0, 120, 1) +
      slider('Clean', 'tune:hygiene', 0, 40, .5) +
      slider('Joy', 'tune:joy', 0, 40, .5) +
      slider('Growth speed', 'tune:growth', 0, 20, .5) +
      `<div class="devsub">Illness onset</div>` +
      slider('Mites: clean <', 'tune:mitesBelow', 0, 50, 1) +
      slider('Mites after (h)', 'tune:mitesHours', 0, 12, .25) +
      slider('Blues: joy <', 'tune:bluesBelow', 0, 50, 1) +
      slider('Blues after (h)', 'tune:bluesHours', 0, 12, .25) +
      slider('Chill: late (h)', 'tune:chillAfter', 0, 8, .25) +
      slider('Chill after (h)', 'tune:chillHours', 0, 6, .25) +
      slider('Belly: treats', 'tune:bellyTreats', 1, 10, 1) +
      slider('Belly after (h)', 'tune:bellyHours', 0, 3, .25) +
      chips([['Reset to shipped values', 'resetTune']]) +
      `<p class="tiny">Kept on this device, never in the nest's save.</p>`);

    if (alive){
      html += sec('illness', 'Illness', S.ills.length ? S.ills.length + ' active' : 'well',
        pick(Object.keys(ILLS), id => hasIll(id), id => 'ill:' + id, id => ILLS[id].name) +
        chips([['Cure all', 'cureAll']]));

      html += sec('pen', 'Pen and habitat', BIOMES[biomeId()].name.toLowerCase(),
        `<div class="devsub">Mess on the ground</div>` +
        pick([0, 1, 2, 3, 4], n => S.mess.length === n, n => 'mess:' + n, n => String(n)) +
        `<div class="devsub">Habitat</div>` +
        pick(BIOME_IDS, id => biomeId() === id, id => 'biome:' + id, id => BIOMES[id].name) +
        chips([['Unlock every coat, hat and habitat', 'unlockAll']]));
    }

    html += sec('species', 'Species', alive ? SPECIES[S.sp].common : 'no animal yet',
      pick(Object.keys(SPECIES), id => alive && S.sp === id, id => 'sp:' + id, id => SPECIES[id].common) +
      (S && S.sp && !S.born ? chips([['Hatch now', 'hatchNow']]) : ''));

    html += sec('keeper', 'Purse and keeper', 'day ' + G.streak,
      chips([['+100', 'add100'], ['+1000', 'add1000'], ['Fill purse', 'fillPurse'], ['Empty', 'emptyPurse', 'warn']]) +
      chips([[G.sound ? 'Sound on' : 'Sound off', 'sound'], ['Bump streak', 'bumpStreak']]));

    html += chips([['Close panel', 'close']]);
    b.innerHTML = html;

    b.querySelectorAll('[data-dev]').forEach(c => c.onclick = () => devAction(c.getAttribute('data-dev')));
    b.querySelectorAll('details.devsec').forEach(d => d.addEventListener('toggle', () => {
      if (d.open) devOpen.add(d.dataset.sec); else devOpen.delete(d.dataset.sec);
    }));
    b.querySelectorAll('input[data-set]').forEach(inp => {
      inp.addEventListener('pointerdown', () => { devDragging = inp; });
      inp.addEventListener('input', () => devSet(inp.dataset.set, +inp.value, inp));
      inp.addEventListener('change', () => { devDragging = null; DEV.commit(); });
    });
    paintDev();
    scroller.scrollTop = scroll;
  },

  away(b, sp){
    b.innerHTML = `<h2>While you were gone</h2><p class="lede">${escapeHTML(G.awayText)}</p>
      ${rowHTML('', 'Back to the habitat', 'Pick up where you left off.', '')}`;
    b.querySelector('.row').onclick = closeSheet;
  },

  trouble(b, sp){
    b.innerHTML = `<h2>Could not open your nest</h2><p class="lede">${escapeHTML(G.loadWarning)}</p>
      <p class="note">${saveBlocked ? 'The original remains at the main save key. Automatic saving is disabled.' : 'A copy of the original is stored at '+BACKUP_KEY+'.'}</p>
      ${rowHTML('', 'Start fresh', 'Choose a new egg and begin again.', '')}`;

};

/* --------------------------- developer panel state -------------------------
   Which sections are open and which slider is held survive a rebuild; they are
   the panel's memory of what the person using it was doing. */
const devOpen = new Set(['time', 'meters']);
let devDragging = null;
const DEV_NEEDS = [['hunger', 'Hunger'], ['energy', 'Energy'], ['hygiene', 'Clean'], ['joy', 'Joy']];
const fmtHour = h => String(Math.floor(h)).padStart(2, '0') + ':' + String(Math.round((h % 1) * 60)).padStart(2, '0');

/* The live value behind a slider key, as the slider should show it. */
function devValue(key){
  if (key === 'clock'){ const d = viewDate(); return devHour !== null ? devHour : d.getHours() + Math.floor(d.getMinutes()/15)*.25; }
  if (key.startsWith('tune:')) return SIM[key.slice(5)];
  if (!hatched()) return 0;
  if (key.startsWith('need:')) return Math.round(S.needs[key.slice(5)]);
  if (key === 'health') return Math.round(S.health);
  if (key === 'bond')   return Math.round(S.bond);
  if (key === 'growth') return Math.round(S.growth);
  return 0;
}
function devFmt(key, v){
  if (key === 'clock' || key === 'tune:bedHour' || key === 'tune:wakeHour') return fmtHour(+v);
  if (key === 'tune:growth') return '×' + (+v).toFixed(1);
  if (key.startsWith('tune:')) return (+v).toFixed(1);
  return String(Math.round(v));
}
/* A slider moved: write the one field, update its own number, repaint the
   game. No rebuild and no save — the save happens on `change`. */
function devSet(key, v, inp){
  if (key === 'clock') DEV.setClock(v);
  else if (key.startsWith('need:')) DEV.setNeed(key.slice(5), v);
  else if (key === 'health') DEV.setHealth(v);
  else if (key === 'bond') DEV.setBondTo(v);
  else if (key === 'growth') DEV.setGrowth(v);
  else if (key.startsWith('tune:')) DEV.setTune(key.slice(5), v);
  const row = inp.closest('.devrow');
  row.querySelector('output').textContent = devFmt(key, v);
  row.classList.remove('off');
  refresh();
}
/* The every-second repaint: the status strip, and every slider except the one
   in the hand moves to its live value — meters drain while you watch. */
function paintDev(){
  const body = $('sheetBody');
  if (openPanel !== 'dev' || !body) return;
  const strip = $('devstrip');
  if (strip){
    const d = viewDate(), alive = hatched();
    const cells = [
      ['Stage', alive ? STAGE[stageIdx()].label : 'egg'],
      [devHour === null ? 'Sky' : 'Sky · pinned', fmtHour(d.getHours() + d.getMinutes()/60) + ' ' + skyPhase(d)],
      ['Sleep', !alive ? '—' : S.vet ? 'collapsed' : (S.asleep ? 'asleep' : isNight() ? 'up late' : 'awake')
                + (devSleepHold && devSleepHold.pet === S ? ' · held' : '')],
      ['Health', alive ? Math.round(S.health) : '—'],
      ['Growth', alive ? Math.round(S.growth) + ' min' : '—'],
      ['Coins', Math.floor(G.coins)]
    ];
    strip.innerHTML = cells.map(([k, v]) => `<div>${k}<b>${v}</b></div>`).join('');
  }
  body.querySelectorAll('input[data-set]').forEach(inp => {
    if (inp === devDragging) return;
    const key = inp.dataset.set, v = devValue(key);
    inp.value = v;
    const row = inp.closest('.devrow');
    row.querySelector('output').textContent = devFmt(key, v);
    row.classList.toggle('off', key === 'clock' && devHour === null);
  });
}
/* A drag can end off the control, where `change` never fires on some
   browsers; letting go anywhere ends it. */
window.addEventListener('pointerup', () => { if (devDragging){ devDragging = null; DEV.commit(); } });

/* One switch per chip. Kept out of the sheet body so the panel stays a view. */
function devAction(a){
  if (a.startsWith('stage')) return DEV.setStage(+a.slice(5));
  if (a.startsWith('ill:'))  return DEV.toggleIll(a.slice(4));
  if (a.startsWith('sp:'))   return DEV.becomeSpecies(a.slice(3));
  if (a.startsWith('mess:')) return DEV.setMess(+a.slice(5));
  if (a.startsWith('biome:')) return DEV.setBiome(a.slice(6));
  if (a.startsWith('clock:')){
    const h = a.slice(6) === 'null' ? null : +a.slice(6);
    DEV.setClock(h);
    return DEV.done(h === null ? 'The sky follows the real clock again.' : 'The sky is pinned at ' + fmtHour(h) + '.');
  }
  switch (a){
    case 'add100':  return DEV.addCoins(100);
    case 'add1000': return DEV.addCoins(1000);
    case 'maxBond': return DEV.setBond(100);
    case 'zeroBond':return DEV.setBond(0);
    case 'sound':   return toggleSound();
    case 'close':   return closeSheet();
    default:        if (DEV[a]) DEV[a]();
  }
}

function renderSheet(which){
  const sheet = SHEETS[which];
  if (!sheet) return;
  sheet($('sheetBody'), hatched() ? SPECIES[S.sp] : null);
}

/* -------------------------------- naming ---------------------------------- */
function beginRename(){
  if (!hatched()) return;
  const inp = $('nameEdit');
  inp.hidden = false; $('dName').style.display = 'none';
  inp.value = S.name; inp.focus(); inp.select();
}
$('nameEdit').addEventListener('blur', () => {
  const inp = $('nameEdit');
  S.name = (inp.value.trim() || S.name || 'Pip').slice(0,14);
  inp.hidden = true; $('dName').style.display = '';
  document.title = S.name + ' — Paleopal';
  save(); refresh();
});
$('nameEdit').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); e.stopPropagation(); });

/* -------------------------------- input ----------------------------------- */
function canvasPos(e){
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
}
let holding = false, holdPos = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  const [mx, my] = canvasPos(e);
  holdPos = [mx, my];
  if (AC && AC.state === 'suspended') AC.resume();

  if (mode === 'choose'){
    for (const c of eggChoices()){
      if (Math.abs(mx - c.x) < c.hit && my > GROUND - 40 && my < GROUND + 6){ chooseEgg(c.id); return; }
    }
    return;
  }
  if (mode === 'egg'){
    egg.cracks++; egg.wob = 1; SFX.crack();
    if (egg.cracks >= 6) hatch();
    return;
  }
  if (mode === 'game'){
    gameInput({type:'point',x:mx,y:my});
    return;
  }
  /* A screen owns every tap while it is up: it is the whole display, so
     there is nothing else on the glass to hit. */
  if (screenOpen()){
    const sc = SCREENS[screen];
    if (sc.tap && screenLayout) sc.tap(mx, my, screenLayout);
    return;
  }
  if (mode === 'live'){
    const slot = HABITAT_ART[biomeId()].slot;
    if (Math.abs(mx-slot[0]) < 14 && my > slot[1]-20 && my < slot[1]+8 && !S.asleep && !S.vet){
      if (S.habitatAt && Date.now()-S.habitatAt < 30*MIN){ say('A quiet spot. More to discover later.'); return; }
      habitatTarget = {pet:S,biome:biomeId()};
      return;
    }
    if (mx >= dinoBox[0] - 4 && mx <= dinoBox[2] + 4 && my >= dinoBox[1] - 4){ holding = true; pet([mx, my]); return; }
    if (bondPips() >= 2 && !S.asleep && !S.vet){
      dino.tx = clamp(mx, 22, W-22);
      dino.until = performance.now() + 4000;
    }
  }
});
cv.addEventListener('pointermove', e => {
  const p = canvasPos(e); holdPos = p;
  if (mode === 'game' && game && e.buttons){
    gameInput({type:'point',x:p[0],y:p[1],move:true});
  }
});
window.addEventListener('pointerup', () => { holding = false; });
window.addEventListener('pointercancel', () => { holding = false; });
window.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (screenOpen()) closeScreen();
    else if (openPanel) closeSheet();
    else if (mode === 'game') endGame();
    return;
  }
  if (mode === 'game' && game){
    if (['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key)) e.preventDefault();
    gameInput({type:'key',key:e.key,down:true});
  }
});
window.addEventListener('keyup', e => {
  gameInput({type:'key',key:e.key,down:false});
});

/* ------------------------------ lifecycle --------------------------------- */
function chooseEgg(id){
  S.sp = id; S.name = pick(NAMES.filter(n => !G.pets.some(p => p.name === n))) || pick(NAMES);
  S.traits = { appetite:(Math.random()*2)|0, tempo:(Math.random()*2)|0, social:(Math.random()*2)|0 };
  mode = 'egg'; egg.cracks = 0;
  SFX.pop(); say('Tap the egg until it opens.');
  refresh(); save();
}
function hatch(){
  S.born = Date.now();
  mode = 'live';
  dino.digAt = performance.now() + 40e3;
  SFX.hatch(); emit('heart', W/2, GROUND-24, 8);
  logEvent(S.name + ' hatched.');
  observePet();
  document.title = S.name + ' — Paleopal';
  say('Hello. Tap the name above to rename it.', 4200);
  refresh(); paintChrome(); save();
}

let saveAt = 0, saveBlocked = false, saveQueue = Promise.resolve();
function storageNotice(message){
  $('storageStatus').textContent = message;
  $('storageStatus').hidden = !message;
}
function save(){
  if (!G || saveBlocked) return saveQueue;
  G.lastSeen = Date.now();
  const snapshot = JSON.stringify(G);
  const key = saveKey();                       // the copy, in developer mode
  saveQueue = saveQueue.then(() => Store.set(key, snapshot)).then(() => storageNotice(''))
    .catch(() => storageNotice('Saving failed. Export your nest from the dossier before closing.'));
  return saveQueue;
}
function exportNest(){
  exportText(JSON.stringify(G, null, 2), 'paleopal-nest.json');
}
function exportText(raw, filename){
  const link = document.createElement('a');
  const url = URL.createObjectURL(new Blob([raw], {type:'application/json'}));
  link.href = url; link.download = filename; link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function importNest(){
  // an import replaces the real save, which developer mode promises not to touch
  if (devMode) return refuse('Leave developer mode before importing a nest.');
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json,application/json';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    const wasBlocked = saveBlocked;
    if (file.size > 1024*1024) return storageNotice('Backup is too large (maximum 1 MB).');
    try {
      const loaded = loadSave(await file.text());
      if (!loaded.game) return storageNotice('Import rejected: the backup ' + loaded.why + '.');
      if (!confirm('Replace this nest with ' + loaded.game.pets.length + ' animal(s)? The current nest will be backed up.')) return;
      saveBlocked = true;
      await saveQueue;
      await Store.set(BACKUP_KEY, JSON.stringify(G));
      await Store.set(SAVE_KEY, JSON.stringify(loaded.game));
      location.reload();
    } catch(error){ saveBlocked = wasBlocked; storageNotice('Import could not be saved. The current nest remains open.'); }
  };
  input.click();
}

function awayReport(gapMs){
  const mins = Math.round(gapMs / MIN), bits = [];
  if (mins < 90) bits.push('You were away about ' + mins + ' minutes.');
  else if (mins < 60*30) bits.push('You were away about ' + Math.round(mins/60) + ' hours.');
  else bits.push('You were away ' + Math.round(mins/1440) + ' days.');
  const trouble = G.pets.filter(p => p.born && (p.vet || p.ills.length || Math.min(p.needs.hunger, p.needs.joy, p.needs.hygiene) < 25));
  if (!trouble.length) bits.push(G.pets.length > 1 ? 'Everyone held up fine.' : 'It held up fine.');
  else bits.push(trouble.map(p => p.name + ' ' + (p.vet ? 'collapsed and needs a vet' :
      p.ills.length ? 'has ' + ILLS[p.ills[0].id].name.toLowerCase() : 'needs attention')).join(', ') + '.');
  const mess = G.pets.reduce((a,p) => a + p.mess.length, 0);
  if (mess) bits.push('There are ' + mess + ' messes to clean.');
  G.awayText = bits.join(' ');
}
function dailyCheck(){
  const today = new Date().toDateString();
  if (G.lastDay === today) return;
  const yest = new Date(Date.now() - 86400e3).toDateString();
  G.streak = G.lastDay === yest ? G.streak + 1 : 1;
  G.lastDay = today;
  if (hatched()){
    const bonus = 5 + Math.min(20, G.streak * 3);
    G.coins += bonus;
    logEvent('Day ' + G.streak + ' together. +' + bonus + ' coins.');
    setTimeout(() => say('Day ' + G.streak + ' together. +' + bonus + ' coins.'), 1400);
  }
}

/* ------------------------------- main loop -------------------------------- */
let lastFrame = performance.now(), accum = 0;
function frame(now){
  const dt = clamp(now - lastFrame, 0, 120);
  lastFrame = now;

  if (G){
    const real = Date.now();
    if (real - G.lastTick > 500){
      advanceSimulation(real, !document.hidden);
    }
  }

  if (G && hatched()) warmFrames(S.sp, stageIdx(), S.skin);
  stepBehaviour(dt, now);
  stepFeed(dt);
  stepPresentation(dt, now);
  stepWorld(dt, now);
  if (mode === 'game') stepGame(dt, now);
  stepParts(dt);
  if (holding && holdPos && mode === 'live' &&
      holdPos[0] >= dinoBox[0]-4 && holdPos[0] <= dinoBox[2]+4 && holdPos[1] >= dinoBox[1]-4) pet(holdPos);

  if (G) drawScene(now);
  accum += dt;
  if (accum > 1000){ accum = 0; refresh(); }
  if (now - saveAt > 6000){ saveAt = now; save(); }
  requestAnimationFrame(frame);
}

async function boot(){
  buildChrome();
  fitScreen();
  paintCase();
  loadCaseSkin();
  G = freshGame();
  try { devMode = (await Store.get(DEV_MODE_KEY)) === '1'; } catch (error){ devMode = false; }
  /* Tuned rates are a developer-mode thing: the real nest always runs at the
     shipped ones, so a slider left moved while testing cannot quietly change
     how the animal someone is raising gets hungry. Loaded before the save, so
     the catch-up tick runs at the rates that apply. */
  if (devMode) await loadTuning();
  let loaded;
  try {
    let raw = await Store.get(saveKey());
    if (devMode && !raw) raw = await Store.get(SAVE_KEY);   // a copy that went missing: take a new one
    loaded = loadSave(raw);
  }
  catch(error){
    saveBlocked = true;
    storageNotice('Storage is unavailable. Existing saves are protected. Export this session before closing, then reload to retry.');
    loaded = {game:null};
  }
  if (loaded.game){
    G = loaded.game;
    // an upgraded save is written back at once, so a crash before the next
    // autosave cannot leave the old shape sitting on disk
    if (loaded.from !== SAVE_VERSION) {
      try { await Store.set(saveKey(), JSON.stringify(G)); }
      catch(error){ storageNotice('Upgraded nest could not be saved. Export a backup.'); }
    }
  } else if (loaded.keep && !devMode){         // an unreadable copy is not worth the real backup slot
    // A save we cannot read is still the player's. Park it under the backup
    // key and tell them, rather than starting over in silence.
    try { await Store.set(BACKUP_KEY, loaded.keep); }
    catch(error){ saveBlocked = true; storageNotice('The unreadable save could not be backed up. Automatic saving is disabled.'); }
    G.loadWarning = 'Your saved nest ' + loaded.why + ', so this is a fresh start. ' +
                    'The old save has not been deleted.';
    console.warn('paleopal: save ' + loaded.why + '; kept a copy at ' + BACKUP_KEY);
  }
  S = G.pets[G.active];
  const gap = clamp(Date.now() - G.lastTick, 0, 14*86400e3);
  advanceSimulation(Date.now(), false);
  if (hatched()){
    mode = 'live';
    if (gap > 60e3){
      awayReport(gap);
      setTimeout(() => openSheet('away'), 500);
    }
    document.title = S.name + ' — Paleopal';
  } else mode = S.sp ? 'egg' : 'choose';
  G.lastTick = Date.now();
  dailyCheck();
  if (G.loadWarning) setTimeout(() => openSheet('trouble'), 500);
  refresh(); paintChrome();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  holding = false;
  if (document.hidden) save();
  else { advanceSimulation(Date.now(), false); lastFrame = performance.now(); }
});
window.addEventListener('pagehide', save);
boot();

</script>
</body>
</html>
