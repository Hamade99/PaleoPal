function freshGame(){
  return { v:SAVE_VERSION, pets:[freshPet()], active:0, coins:24, sound:true, lastDay:'', streak:0,
           lastTick:Date.now(), lastSeen:Date.now() };
}

/* --------------------------- loading a save --------------------------------
   Adding a field needs no migration: Object.assign over freshGame/freshPet
   already fills in anything a older save is missing. A migration is only for
   a change that reshapes or reinterprets existing data.

   Each entry is keyed by the version it reads and must return the save one
   version further on, with o.v updated:

     MIGRATIONS[2] = o => { o.pets.forEach(p => p.joy = p.happy); o.v = 3; return o; };

   Nothing is registered yet; version 2 is the first schema that shipped.
   -------------------------------------------------------------------------- */
const MIGRATIONS = {};

/* Returns { game, why, keep, from }. `game` is null when the save could not be
   used, and then `why` completes the sentence "Your saved nest ..." and `keep`
   holds the original text so the caller can park it somewhere safe. */
function loadSave(raw){
  const fail = why => ({ game:null, why, keep:raw, from:null });
  if (!raw) return { game:null, why:null, keep:null, from:null };

  let o;
  try { o = JSON.parse(raw); } catch(e){ return fail('could not be read'); }
  if (!o || typeof o !== 'object') return fail('was not in a shape the game understands');

  const from = o.v | 0;
  if (from > SAVE_VERSION) return fail('was written by a newer version of the game');

  let v = from;
  while (v < SAVE_VERSION){
    const step = MIGRATIONS[v];
    if (!step) return fail('is version ' + v + ', which this build cannot upgrade');
    o = step(o);
    if (!o || (o.v | 0) <= v) return fail('stalled while upgrading from version ' + v);
    v = o.v | 0;
  }

  if (!Array.isArray(o.pets) || !o.pets.length) return fail('had no animals in it');

  const g = Object.assign(freshGame(), o);
  g.pets = o.pets.map(p => Object.assign(freshPet(), p));
  g.active = clamp(o.active | 0, 0, g.pets.length - 1);
  g.v = SAVE_VERSION;
  return { game:g, why:null, keep:null, from };
}
const trait = k => TRAITS[k][S.traits[k]];
const hatched = () => !!S && !!S.sp && !!S.born;
const stageIdx = () => S.growth < GROWTH_GATES[0] ? 0 : S.growth < GROWTH_GATES[1] ? 1 : S.growth < GROWTH_GATES[2] ? 2 : 3;
const bondPips = () => clamp(Math.floor(S.bond/20), 0, 5);
const ageDays  = () => (Date.now()-S.born)/86400e3;
const hasIll   = id => S.ills.some(i => i.id === id);
const isNight  = () => { const h = new Date().getHours(); return h >= BED_HOUR || h < WAKE_HOUR; };

function logEvent(txt){
  S.log.unshift({ t:Date.now(), txt });
  if (S.log.length > 60) S.log.length = 60;
}
function careScore(){
  const n = S.needs;
  return clamp((n.hunger + n.energy + n.hygiene + n.joy) / 400, 0, 1);
}
function moodOf(){
  if (!hatched()) return { key:'egg', line:'The egg is warm.' };
  if (S.vet) return { key:'ill', line:'is too weak to stand. Take it to the vet.' };
  if (S.asleep) return { key:'sleep', line:'is fast asleep.' };
  const ill = S.ills[0];
  if (ill) return { key:'ill', line:'is unwell. ' + ILLS[ill.id].symptom };
  const n = S.needs;
  if (n.hunger < 22) return { key:'hungry', line:'is hungry enough to nose at the dirt.' };
  if (n.energy < 20) return { key:'tired',  line:'keeps blinking slowly. It needs sleep.' };
  if (n.hygiene < 25)return { key:'dirty',  line:'smells, honestly. The flies agree.' };
  if (n.joy < 25)    return { key:'bored',  line:'is bored and keeps looking at you.' };
  if (careScore() > .82 && S.bond > 55) return { key:'happy', line:'is delighted with everything.' };
  if (careScore() > .6) return { key:'content', line:'is content.' };
  return { key:'meh', line:'is getting by.' };
}

/* ------------------------------ the tick ---------------------------------- */
function simulateAll(ms, online){
  const keep = G.active;
  for (let i=0;i<G.pets.length;i++){ S = G.pets[i]; simulate(ms, online && i === keep); }
  S = G.pets[keep];
}
function simulate(ms, online){
  if (!hatched() || ms <= 0) return;
  const h = ms / HOUR, n = S.needs;
  const tA = trait('appetite'), tT = trait('tempo'), tS = trait('social');
  const asleep = S.asleep;

  n.hunger  = clamp(n.hunger  - 7.5 * tA.hunger * h * (asleep ? .45 : 1), 0, 100);
  n.hygiene = clamp(n.hygiene - 4.0 * h * (asleep ? .5 : 1), 0, 100);
  n.joy     = clamp(n.joy     - 6.0 * tT.joy * h * (asleep ? .3 : 1) * tS.lonely, 0, 100);
  n.energy  = asleep ? clamp(n.energy + ENERGY_ASLEEP * h, 0, 100)
                     : clamp(n.energy - ENERGY_AWAKE * tT.energy * h, 0, 100);

  if (!asleep && isNight()) S.nightAwake += h; else S.nightAwake = Math.max(0, S.nightAwake - h*.5);

  const roll = perHour => Math.random() < 1 - Math.pow(1 - clamp(perHour,0,.95), h);
  S.treats = S.treats.filter(t => Date.now() - t < HOUR);
  if (!hasIll('bellyache') && S.treats.length >= 3 && roll(.6)) fallIll('bellyache');
  if (!hasIll('chill')     && S.nightAwake > 2   && roll(.35)) fallIll('chill');
  if (!hasIll('mites')     && n.hygiene < 20     && roll(.5))  fallIll('mites');
  if (!hasIll('blues')     && n.joy < 15         && roll(.4))  fallIll('blues');

  const ill = S.ills.length;
  if (ill) S.health = clamp(S.health - 7 * ill * h, 0, 100);
  else if (careScore() > .55) S.health = clamp(S.health + 9 * h, 0, 100);
  else if (careScore() < .3)  S.health = clamp(S.health - 5 * h, 0, 100);
  if (S.health <= 0 && !S.vet){ S.vet = true; S.asleep = true; logEvent(S.name + ' collapsed. It needs a vet.'); }

  const worst = Math.min(n.hunger, n.energy, n.hygiene, n.joy);
  if (worst < 15) S.bond = clamp(S.bond - 3 * h, 0, 100);
  else if (careScore() > .75) S.bond = clamp(S.bond + 1.2 * tS.bond * h, 0, 100);

  const cs = careScore();
  const rate = S.vet ? 0 : cs > .6 ? 1 : cs > .35 ? .5 : .12;
  S.growth += (ms/MIN) * rate * (online ? 1 : .55);

  if (!asleep && !S.vet){
    S.messTimer = (S.messTimer || rnd(18,32)*MIN) - ms;
    if (S.messTimer <= 0 && S.mess.length < 4){
      S.mess.push({ x: rnd(28, W-28) });
      n.hygiene = clamp(n.hygiene - 11, 0, 100);
      S.messTimer = rnd(22,40)*MIN;
      if (online){ say('Oops.'); SFX.pop(); }
    }
  }

  const sleepy = isNight();
  if (!asleep && (n.energy <= 6 || (sleepy && n.energy < 30))) setSleep(true, online);
  if (asleep && !S.vet && n.energy >= 99) setSleep(false, online);
  if (asleep && !S.vet && !sleepy && n.energy > 72) setSleep(false, online);

  const st = stageIdx();
  if (st !== S.stageSeen){
    S.stageSeen = st;
    logEvent(S.name + ' is now ' + article(STAGE[st].label) + STAGE[st].label.toLowerCase() + '.');
    if (online){ say(S.name + ' grew into ' + article(STAGE[st].label) + STAGE[st].label.toLowerCase() + '!'); SFX.roar(); emit('heart', dino.x, GROUND-40, 8); }
  }
}
function fallIll(id){
  S.ills.push({ id, since: Date.now() });
  logEvent(S.name + ' came down with ' + ILLS[id].name.toLowerCase() + '.');
}
function setSleep(v, online){
  if (S.asleep === v) return;
  S.asleep = v;
  if (v){ if (online){ say('Yawn.'); SFX.yawn(); } }
  else   { if (online){ say('Morning.'); } }
}

/* --------------------------- player actions -------------------------------- */
function feed(id){
  const f = FOODS.find(x => x.id === id), sp = SPECIES[S.sp];
  if (G.coins < f.cost) return refuse('Not enough coins. Dig, or win it at the games.');
  if (S.asleep) return refuse(S.name + ' is asleep.');
  if (hasIll('bellyache')) return refuse(S.name + ' turns away from it. Settle the stomach first.');
  if (S.needs.hunger > 94) return refuse(S.name + ' is full.');
  G.coins -= f.cost;
  closeSheet();
  tossFood(id);                                   // the food arcs in; effects land on the bite
  refreshLight();
}
function swallow(id){
  const f = FOODS.find(x => x.id === id), sp = SPECIES[S.sp];
  const loved = sp.likes.includes(id), hated = sp.dislikes.includes(id);
  const tA = trait('appetite');
  S.needs.hunger = clamp(S.needs.hunger + f.fill * (hated ? .5 : 1), 0, 100);
  S.needs.joy = clamp(S.needs.joy + (f.joy + (loved ? 9 : hated ? -6 : 0)) * tA.foodJoy, 0, 100);
  if (loved){ S.bond = clamp(S.bond + 1.5, 0, 100); emit('heart', dino.x, dinoTop - 4, 3, {vy:-16}); }
  if (f.treat) S.treats.push(Date.now());
  S.tally = S.tally || {};
  S.tally.meals = (S.tally.meals || 0) + 1;
  say(loved ? 'Its favourite. Gone in one gulp.' : hated ? 'It eats it. Slowly. Resentfully.' : 'Nom.');
  refresh();
}
function scrub(){
  if (S.asleep) return refuse(S.name + ' is asleep.');
  const n = S.mess.length;
  S.mess.forEach(m => emit('spark', m.x, GROUND-6, 4));
  S.mess = [];
  G.coins += n;
  S.needs.hygiene = clamp(S.needs.hygiene + 22 + n*10, 0, 100);
  S.needs.joy = clamp(S.needs.joy + 4, 0, 100);
  SFX.wash();
  say(n ? 'Scrubbed clean. Found ' + n + ' coin' + (n>1?'s':'') + ' in the muck.' : 'A good rinse.');
  emit('spark', dino.x, GROUND-30, 8);
  refresh();
}
function pet(){
  if (!hatched() || S.asleep || S.vet) return;
  const now = performance.now();
  if (now - (S.lastPetAt||0) < 320) return;
  S.lastPetAt = now;
  S.petBank++;
  const gain = clamp(1.1 - S.bond/160, .25, 1.1) * trait('social').bond;
  S.bond = clamp(S.bond + gain, 0, 100);
  S.needs.joy = clamp(S.needs.joy + 1.6, 0, 100);
  emit('heart', dino.x + rnd(-8,8), dinoTop - 4, 1, {vy:-16, life:900});
  SFX.purr();
  if (hasIll('blues') && S.petBank >= 8) cure('company', true);
  refreshLight();
}
function tuckIn(){
  if (!hatched()) return;
  if (S.vet) return refuse(S.name + ' is already down.');
  if (S.asleep) return refuse(S.name + ' is already asleep.');
  if (S.needs.energy > 70) return refuse('Too wide awake to settle. Try below 70 energy.');
  setSleep(true, true);
  S.bond = clamp(S.bond + 1.5, 0, 100);
  S.nightAwake = 0;
  closeSheet();
  say(S.name + ' curls up and goes out like a light.');
  refresh();
}
function treat(remedyId){
  const r = REMEDIES.find(x => x.id === remedyId);
  if (G.coins < r.cost) return refuse('Not enough coins.');
  if (!S.ills.length) return refuse('Nothing to treat. ' + S.name + ' is well.');
  if (hasIll(r.cures)) return cure(remedyId);
  G.coins -= r.cost;
  S.bond = clamp(S.bond - 2, 0, 100);
  SFX.bonk();
  say('That was not it. ' + S.name + ' looks no better.');
  logEvent('Tried ' + r.name.toLowerCase() + '. Wrong call.');
  refresh();
}
function cure(remedyId, free){
  const r = REMEDIES.find(x => x.id === remedyId);
  if (!free) G.coins -= r.cost;
  S.ills = S.ills.filter(i => i.id !== r.cures);
  S.health = clamp(S.health + 30, 0, 100);
  S.bond = clamp(S.bond + 4, 0, 100);
  S.petBank = 0;
  if (r.cures === 'chill') S.nightAwake = 0;
  if (r.cures === 'mites') S.needs.hygiene = clamp(S.needs.hygiene + 30, 0, 100);
  if (r.cures === 'blues') S.needs.joy = clamp(S.needs.joy + 25, 0, 100);
  SFX.hatch();
  anim.play('cheer', 1400);
  emit('heart', dino.x, GROUND-40, 6);
  say(S.name + ' shakes it off. That was the right call.');
  logEvent('Cured ' + ILLS[r.cures].name.toLowerCase() + '.');
  refresh();
}
function vetVisit(){
  if (G.coins < 30) return refuse('The vet costs 30 coins.');
  G.coins -= 30; S.vet = false; S.health = 60; S.ills = [];
  S.needs.hunger = Math.max(S.needs.hunger, 50);
  S.needs.joy = Math.max(S.needs.joy, 40);
  S.bond = clamp(S.bond - 5, 0, 100);
  setSleep(false, true);
  logEvent('Came home from the vet.');
  say(S.name + ' is home and steady again.');
  refresh();
}
function buyHat(id){
  const h = HAT_SHOP.find(x => x.id === id), slot = h.slot;
  if (S.owned.includes(id)){ S[slot] = S[slot] === id ? null : id; SFX.pop(); refresh(); return; }
  if (G.coins < h.cost) return refuse('Not enough coins.');
  G.coins -= h.cost; S.owned.push(id); S[slot] = id;
  SFX.coin(); say('Suits it.');
  refresh();
}
function buySkin(id){
  const k = skinOf(S.sp, id);
  if (S.skinsOwned.includes(id)){
    S.skin = id; SFX.pop(); say(S.name + ' tries on ' + k.name.toLowerCase() + '.');
    refresh(); return;
  }
  if (G.coins < k.cost) return refuse('Not enough coins.');
  G.coins -= k.cost; S.skinsOwned.push(id); S.skin = id;
  SFX.coin(); say('A whole new coat.');
  logEvent('Unlocked the ' + k.name.toLowerCase() + ' coat.');
  refresh();
}
function doTrick(){
  if (bondPips() < 3) return refuse(S.name + ' does not know you well enough yet.');
  if (S.asleep) return refuse(S.name + ' is asleep.');
  S.needs.joy = clamp(S.needs.joy + 12, 0, 100);
  S.needs.energy = clamp(S.needs.energy - 3, 0, 100);
  S.bond = clamp(S.bond + .8, 0, 100);
  anim.play('cheer', 1600); SFX.roar();
  emit('note', dino.x, dinoTop, 5, {vy:-18, life:1100});
  say(pick(['It spins on the spot.','A short, proud roar.','It stamps twice and looks at you.']));
  closeSheet(); refresh();
}
function refuse(msg){ SFX.bonk(); say(msg); }

/* ------------------------------- the nest ---------------------------------- */
function switchPet(i){
  if (i === G.active || !G.pets[i]) return;
  G.active = i; S = G.pets[i];
  dino.x = W/2; dino.tx = W/2; dino.dist = 0; dino.dig = 0;
  feedFX = null;
  mode = hatched() ? 'live' : (S.sp ? 'egg' : 'choose');
  anim.play('idle', 0);
  closeSheet();
  document.title = (S.name || 'Paleopal') + ' — Paleopal';
  if (hatched()) say(S.name + ' trots over.');
  refresh(); paintChrome(); save();
}
function newEgg(){
  if (G.pets.length >= MAX_PETS) return refuse('The nest is full at ' + MAX_PETS + '.');
  G.pets.push(freshPet());
  G.active = G.pets.length - 1;
  S = G.pets[G.active];
  mode = 'choose';
  closeSheet(); refresh(); paintChrome(); save();
}
function releasePet(i){
  if (G.pets.length <= 1) return refuse('That is your only animal.');
  G.pets.splice(i, 1);
  G.active = clamp(G.active >= i ? G.active - 1 : G.active, 0, G.pets.length - 1);
  S = G.pets[G.active];
  mode = hatched() ? 'live' : (S.sp ? 'egg' : 'choose');
  closeSheet(); refresh(); paintChrome(); save();
}

/* ==========================================================================
   BEHAVIOUR + RENDER
   ========================================================================== */

const cv = $('scene'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

let mode = 'boot';            // boot | choose | egg | live | game
let dino = { x: W/2, dir: -1, tx: W/2, until: 0, walking:false, dig:0, digAt: 0, dist: 0 };
let dinoTop = GROUND - 40, dinoBox = [0,0,0,0];
let egg = { cracks: 0, wob: 0 };
let game = null, feedFX = null;
let blinkAt = 0, blinking = false;

const anim = {
  name:'idle', frame:0, t:0, until:0,
  play(n, ms){ this.name = n; this.frame = 0; this.t = 0; this.until = performance.now() + ms; },
  pick(){
    if (performance.now() < this.until) return this.name;
    if (S.vet || S.asleep) return 'sleep';
    if (S.ills.length) return 'sick';
    return dino.walking ? 'walk' : 'idle';
  }
};

let sayTimer = 0;
function say(text, ms){
  const b = $('bubble');
  b.textContent = text; b.classList.add('on');
  clearTimeout(sayTimer);
  sayTimer = setTimeout(() => b.classList.remove('on'), ms || 2800);
}

/* ------------------------------ feeding ----------------------------------- */
function tossFood(id){
  feedFX = { id, t: 0, phase: 'fly', from: [dino.x - dino.dir*46, 8], id2: id };
  SFX.pop();
}
function stepFeed(dt){
  if (!feedFX) return;
  feedFX.t += dt;
  if (feedFX.phase === 'fly' && feedFX.t > 620){
    feedFX.phase = 'bite'; feedFX.t = 0;
    anim.play('eat', 1500); SFX.chomp();
    emit('crumb', dino.x - 12*dino.dir, GROUND-26, 8, {vy:12, g:90, life:600});
    swallow(feedFX.id);
  } else if (feedFX.phase === 'bite' && feedFX.t > 900){
    feedFX = null;
  }
}
function drawFeed(g, mouth){
  if (!feedFX || feedFX.phase !== 'fly') return;
  const u = clamp(feedFX.t / 620, 0, 1);
  const x = lerp(feedFX.from[0], mouth[0], u);
  const y = lerp(feedFX.from[1], mouth[1], u) - Math.sin(u*Math.PI) * 22;
  drawItem(g, feedFX.id, Math.round(x) - 3, Math.round(y) - 2, 1.6);
}

/* ------------------------------ behaviour --------------------------------- */
function stepBehaviour(dt, now){
  if (mode !== 'live') return;
  const busy = feedFX || performance.now() < anim.until;
  const canMove = !S.asleep && !S.vet && !S.ills.length && !busy;

  if (dino.dig > 0){
    dino.dig -= dt;
    if (Math.random() < .35) emit('crumb', dino.x - 12*dino.dir, GROUND-2, 1, {vy:-18, g:120, life:520});
    if (dino.dig <= 0){
      const found = 3 + ((Math.random()*4)|0) + (bondPips() >= 4 ? 3 : 0);
      G.coins += found;
      SFX.coin(); emit('spark', dino.x - 12*dino.dir, GROUND-8, 6);
      say('Dug up a fossil chip. +' + found + ' coins.');
      dino.digAt = now + rnd(6,11)*MIN;
      refreshLight();
    }
    dino.walking = false;
    return;
  }
  if (!canMove){ dino.walking = false; return; }

  if (now > dino.until){ dino.tx = rnd(26, W-26); dino.until = now + rnd(2600, 6500) / trait('tempo').speed; }
  const d = dino.tx - dino.x;
  if (Math.abs(d) > 3){
    dino.walking = true; dino.dir = d > 0 ? 1 : -1;
    const step = SPECIES[S.sp].speed * trait('tempo').speed * (0.6 + stageIdx()*0.14) * dt/1000;
    dino.x += dino.dir * step;
    dino.dist += step;
  } else dino.walking = false;

  if (now > dino.digAt && !dino.walking && S.needs.energy > 30){ dino.dig = 1800; say('Sniff, sniff...'); }
}

/* ------------------------------- draw ------------------------------------- */
let lastSceneAt = 0;
function drawScene(now){
  const dt = clamp(now - lastSceneAt, 0, 120); lastSceneAt = now;
  const phase = skyPhase(new Date());
  ctx.drawImage(bakeBg(phase), 0, 0);

  if (phase === 'night'){
    for (const s of STARS){
      const tw = Math.sin(now/520 + s.p);
      if (tw > .15){ ctx.fillStyle = tw > .8 ? '#ffffff' : 'rgba(232,228,200,.8)'; ctx.fillRect(s.x|0, s.y|0, 1, 1); }
    }
  }
  drawSkyBody(ctx, phase, now);
  drawClouds(ctx, phase, dt);
  drawFlyers(ctx, dt, now);
  drawWater(ctx, phase, now);
  if (phase !== 'night') drawMotes(ctx, dt, phase);

  if (mode === 'choose'){ drawChoose(now); drawFronds(ctx, phase, now); return; }
  if (mode === 'egg'){ drawEgg(now); drawFronds(ctx, phase, now); return; }
  if (mode === 'game'){ drawGame(now, phase); return; }
  drawLive(now);
  drawFronds(ctx, phase, now);
  const tint = SKY_SPECS[phase].tint;
  if (tint !== 'rgba(0,0,0,0)'){ ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H); }
}

function drawChoose(now){
  eggChoices().forEach((c, i) => {
    const bounce = Math.sin(now/420 + i*2) * 2;
    drawEggArt(ctx, c.x, GROUND - 16 + bounce, c.id, 0);
    ctx.fillStyle = 'rgba(16,26,24,.55)';
    ctx.beginPath(); ctx.ellipse(c.x, GROUND + 1, 11, 3, 0, 0, 7); ctx.fill();
  });
}
function drawEggArt(g, cx, cy, spId, cracks){
  const tint = SPECIES[spId].eggTint;
  g.fillStyle = '#221a12'; g.beginPath(); g.ellipse(cx, cy, 13, 17, 0, 0, 7); g.fill();
  g.fillStyle = '#efe3c4'; g.beginPath(); g.ellipse(cx, cy, 12, 16, 0, 0, 7); g.fill();
  g.fillStyle = '#faf4de'; g.beginPath(); g.ellipse(cx - 4, cy - 6, 3.5, 4, 0, 0, 7); g.fill();
  g.fillStyle = tint;
  [[-5,1],[4,-3],[0,7],[6,5],[-6,7],[2,-8]].forEach(p => g.fillRect(cx+p[0], cy+p[1], 3, 3));
  if (cracks > 0){
    g.strokeStyle = '#221a12'; g.lineWidth = 1; g.beginPath();
    let x = cx - 6, y = cy - 9;
    g.moveTo(x, y);
    for (let i = 0; i < cracks; i++){ x += (i%2 ? 5 : 4) * (i%2?1:-1) + 4; y += 4; g.lineTo(x, y); }
    g.stroke();
  }
}
function drawEgg(now){
  const wob = egg.wob > 0 ? Math.sin(now/40) * 2 : 0;
  egg.wob = Math.max(0, egg.wob - .06);
  ctx.fillStyle = 'rgba(16,26,24,.5)';
  ctx.beginPath(); ctx.ellipse(W/2, GROUND + 1, 12, 3, 0, 0, 7); ctx.fill();
  drawEggArt(ctx, W/2 + wob, GROUND - 16, S.sp, egg.cracks);
}

/* headgear rides the anchors the sprite hands back, so it sits on the skull or
   across the eyes rather than floating at a guessed offset */
function drawGear(g, f, x, y, flip){
  const place = (id, anchor, scale) => {
    if (!id || !HATS[id]) return;
    const art = HATS[id], w = art.width * scale, hgt = art.height * scale;
    const ax = flip ? x + (f.ox - anchor[0]) : x - f.ox + anchor[0];
    const ay = y - f.oy + anchor[1];
    g.save(); g.translate(Math.round(ax), Math.round(ay));
    if (flip) g.scale(-1, 1);
    g.drawImage(art, -w/2, -hgt, w, hgt);
    g.restore();
  };
  place(S.hat, f.hat, Math.max(.6, f.hs * 1.55));
  if (S.face && HATS[S.face]){
    const art = HATS[S.face], scale = Math.max(.5, f.eyeR * 3.6 / art.width);
    const w = art.width * scale, hgt = art.height * scale;
    const ax = flip ? x + (f.ox - f.eye[0]) : x - f.ox + f.eye[0];
    const ay = y - f.oy + f.eye[1];
    g.save(); g.translate(Math.round(ax), Math.round(ay));
    if (flip) g.scale(-1, 1);
    g.drawImage(art, -w*.42, -hgt*.55, w, hgt);
    g.restore();
  }
}

function drawLive(now){
  for (const m of S.mess){
    drawMess(ctx, m.x|0, GROUND - 1);
    const fx = m.x + Math.sin(now/280 + m.x) * 5, fy = GROUND - 12 + Math.cos(now/430 + m.x) * 2;
    ctx.fillStyle = '#2f2f2f'; ctx.fillRect(fx|0, fy|0, 1, 1);
    if (Math.random() < .01) emit('stink', m.x, GROUND - 6, 1, {vy:-12, life:1000});
  }
  if (now > blinkAt){ blinking = true; blinkAt = now + rnd(2400, 5200); setTimeout(() => blinking = false, 150); }

  const st = stageIdx(), a = anim.pick(), sp = SPECIES[S.sp];
  anim.t += 16;
  let fr;
  if (a === 'walk'){
    const cycle = Math.max(3, sp.strideBase * STAGE[st].limb * STAGE[st].s * sp.scale);
    fr = Math.floor((dino.dist / cycle) * POSES.walk.length);
  } else {
    const fps = a === 'eat' ? 220 : a === 'cheer' ? 200 : 900;
    fr = Math.floor(anim.t / fps);
  }
  const f = frameOf(S.sp, st, a, fr, blinking && a === 'idle', S.skin);

  const flip = dino.dir > 0;
  const x = Math.round(dino.x), y = GROUND;
  ctx.fillStyle = 'rgba(16,26,24,.32)';
  ctx.beginPath(); ctx.ellipse(x, y + 1, f.w * .38, 3, 0, 0, 7); ctx.fill();

  ctx.save(); ctx.translate(x, y);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(f.cv, -f.ox, -f.oy);
  ctx.restore();

  dinoTop = y - f.oy;
  dinoBox = flip ? [x - (f.w - f.ox), dinoTop, x + f.ox, y] : [x - f.ox, dinoTop, x - f.ox + f.w, y];
  drawGear(ctx, f, x, y, flip);

  const mouth = [flip ? x + (f.ox - f.mouth[0]) : x - f.ox + f.mouth[0], y - f.oy + f.mouth[1]];
  drawFeed(ctx, mouth);

  if (S.asleep && Math.random() < .02) emit('bubbleZ', x + 10*(flip?-1:1), dinoTop + 4, 1, {vy:-14, vx:4, life:1500});
  if (hasIll('chill') && Math.random() < .012){ emit('spark', x - 14*dino.dir, dinoTop + 8, 2, {col:'#cfe0e8'}); SFX.sneeze(); }
  if (hasIll('mites') && Math.random() < .02) emit('crumb', x + rnd(-10,10), dinoTop + 10, 1, {col:'#8a7350', vy:-6, g:40});
  if (dino.dig > 0){ ctx.fillStyle='#8f6f4c'; ctx.fillRect(x - 16*dino.dir, GROUND-2, 6, 2); }

  if (S.asleep){ ctx.fillStyle = 'rgba(14,16,44,.28)'; ctx.fillRect(0, 0, W, H); }
  drawParts(ctx);
}

/* ============================== MINIGAMES ================================== */
const GAMES = {
  snack: { name:'Snack run',  blurb:'Thirty seconds. Catch the food, dodge the rocks. Five in a row and each catch counts double.', pay:2 },
  stomp: { name:'Bug hunt',   blurb:'Critters scurry across the pen. Tap each one before it reaches the edge.', pay:2 },
  leap:  { name:'River leap', blurb:'Your animal runs. Tap anywhere to jump the logs and boulders coming at it.', pay:3 }
};
function startGame(kind){
  if (S.asleep) return refuse(S.name + ' is asleep.');
  if (S.vet) return refuse(S.name + ' is in no state to play.');
  if (S.needs.energy < 12) return refuse('Too tired to run around.');
  closeSheet();
  mode = 'game'; feedFX = null;
  if (kind === 'snack') game = { kind, x:W/2, tx:W/2, items:[], score:0, combo:0, left:30, spawn:.5, stun:0, kL:false, kR:false };
  if (kind === 'stomp') game = { kind, bugs:[], score:0, missed:0, left:30, spawn:.6 };
  if (kind === 'leap')  game = { kind, obs:[], score:0, left:30, y:0, vy:0, spawn:1.1, speed:78, run:0, stun:0 };
  say(GAMES[kind].blurb.split('.')[0] + '.');
  paintChrome();
}
function endGame(){
  if (!game) return;
  const g = GAMES[game.kind], earned = game.score * g.pay;
  G.coins += earned;
  S.needs.joy = clamp(S.needs.joy + Math.min(34, game.score * 2.4), 0, 100);
  S.needs.energy = clamp(S.needs.energy - 7, 0, 100);
  S.bond = clamp(S.bond + (game.score > 8 ? 3 : 1), 0, 100);
  if (game.score > 8) logEvent('A good run at ' + g.name.toLowerCase() + ': ' + game.score + '.');
  say(game.score ? 'Scored ' + game.score + '. That is ' + earned + ' coins.' : 'Nothing scored. Next time.');
  if (game.score) SFX.coin();
  game = null; mode = 'live';
  paintChrome(); refresh();
}
function stepGame(dt, now){
  if (!game) return;
  game.left -= dt/1000;
  if (game.left <= 0) return endGame();
  if (game.kind === 'snack') return stepSnack(dt, now);
  if (game.kind === 'stomp') return stepStomp(dt, now);
  if (game.kind === 'leap')  return stepLeap(dt, now);
}
function drawGame(now, phase){
  if (game.kind === 'snack') drawSnack(now);
  if (game.kind === 'stomp') drawStomp(now);
  if (game.kind === 'leap')  drawLeap(now);
  drawParts(ctx);
  ctx.fillStyle = 'rgba(16,22,24,.78)'; ctx.fillRect(0, 0, W, 9);
  ctx.fillStyle = game.left < 6 ? '#c2603c' : '#7ea55f';
  ctx.fillRect(1, 2, Math.round((W-2) * game.left/30), 5);
}
function gameSprite(anim2, frame, scaleTo){
  const f = frameOf(S.sp, stageIdx(), anim2, frame, false, S.skin);
  return { f, sc: Math.min(1, scaleTo / f.h) };
}

/* ------ snack run ------ */
function stepSnack(dt, now){
  let vx = 0;
  if (game.kL) vx -= 110; if (game.kR) vx += 110;
  if (!vx) vx = clamp((game.tx - game.x) * 7, -135, 135);
  if (now < game.stun) vx = 0;
  game.x = clamp(game.x + vx * dt/1000, 18, W-18);
  game.spawn -= dt/1000;
  if (game.spawn <= 0){
    game.spawn = rnd(.42, .72);
    const sp = SPECIES[S.sp], rock = Math.random() < .22;
    game.items.push({ x: rnd(16, W-16), y: 4, vy: rnd(44, 62), id: rock ? 'rock' : pick(sp.likes.concat(['berry','fern'])), rock });
  }
  const mouthY = GROUND - 34;
  for (const it of game.items){
    it.y += it.vy * dt/1000;
    if (it.y > mouthY - 6 && it.y < mouthY + 22 && Math.abs(it.x - game.x) < 15){
      it.dead = true;
      if (it.rock){ game.combo = 0; game.stun = now + 750; SFX.bonk(); emit('spark', game.x, mouthY, 4, {col:'#e8c352'}); }
      else { game.combo++; game.score += game.combo >= 5 ? 2 : 1; SFX.chomp(); emit('spark', it.x, it.y, 3); }
    }
    if (it.y > GROUND){ it.dead = true; if (!it.rock) game.combo = 0; }
  }
  game.items = game.items.filter(i => !i.dead);
}
function drawSnack(now){
  for (const it of game.items) drawItem(ctx, it.id, it.x - 3, it.y - 2, 1.5);
  const { f, sc } = gameSprite(now < game.stun ? 'sick' : 'walk', Math.floor(now/130), 44);
  const flip = game.tx < game.x;
  ctx.save(); ctx.translate(Math.round(game.x), GROUND);
  if (flip) ctx.scale(-1,1);
  ctx.drawImage(f.cv, -f.ox*sc, -f.oy*sc, f.w*sc, f.h*sc);
  ctx.restore();
  scoreTag('Caught ' + game.score + (game.combo >= 5 ? '  x2' : ''));
}

/* ------ bug hunt ------ */
function drawBug(g, b, now){
  const wig = Math.sin(now/90 + b.x) * 1;
  if (b.type === 0){                            // millipede
    g.fillStyle = '#4a3a24';
    for (let i=0;i<5;i++) g.fillRect(b.x - i*3, b.y + (i%2?0:1) + wig, 3, 3);
    g.fillStyle = '#6f5836'; g.fillRect(b.x, b.y + wig, 3, 2);
    g.fillStyle = '#2a2118'; g.fillRect(b.x+3, b.y + wig, 1, 1);
  } else {                                      // dragonfly
    g.fillStyle = '#3a5c52'; g.fillRect(b.x - 6, b.y + wig, 9, 2);
    g.fillStyle = '#8fc4b8'; g.fillRect(b.x - 1, b.y + wig, 3, 2);
    const up = Math.sin(now/60) > 0;
    g.fillStyle = 'rgba(200,230,235,.75)';
    g.fillRect(b.x - 4, b.y - (up?3:-2) + wig, 6, 2);
  }
}
function stepStomp(dt, now){
  game.spawn -= dt/1000;
  if (game.spawn <= 0){
    game.spawn = rnd(.35, .7);
    const type = Math.random() < .5 ? 0 : 1;
    const dir = Math.random() < .5 ? 1 : -1;
    game.bugs.push({ x: dir > 0 ? -8 : W+8, y: type ? rnd(GROUND-38, GROUND-14) : rnd(GROUND+2, H-8),
                     vx: dir * rnd(28, 52) * (type ? 1.35 : 1), type });
  }
  for (const b of game.bugs){ b.x += b.vx * dt/1000; if (b.x < -14 || b.x > W+14) b.dead = true; }
  game.bugs = game.bugs.filter(b => !b.dead);
}
function drawStomp(now){
  const { f, sc } = gameSprite('idle', Math.floor(now/700), 44);
  ctx.save(); ctx.translate(34, GROUND); ctx.scale(-1, 1);
  ctx.drawImage(f.cv, -f.ox*sc, -f.oy*sc, f.w*sc, f.h*sc); ctx.restore();
  for (const b of game.bugs) drawBug(ctx, b, now);
  scoreTag('Caught ' + game.score);
}
function tapStomp(mx, my){
  for (const b of game.bugs){
    if (Math.abs(b.x - mx) < 11 && Math.abs(b.y - my) < 11){
      b.dead = true; game.score++; SFX.chomp();
      emit('spark', b.x, b.y, 4, {col:'#cfe0a8'});
      return;
    }
  }
  SFX.bonk();
}

/* ------ river leap ------ */
function stepLeap(dt, now){
  game.run += dt/1000 * game.speed;
  game.speed = Math.min(140, game.speed + dt/1000 * 3);
  game.vy += 340 * dt/1000;
  game.y = Math.min(0, game.y + game.vy * dt/1000);
  if (game.y === 0) game.vy = 0;
  game.spawn -= dt/1000;
  if (game.spawn <= 0){
    game.spawn = rnd(.85, 1.5) * (110 / game.speed);
    game.obs.push({ x: W + 12, kind: Math.random() < .5 ? 'log' : 'rock', hit:false, past:false });
  }
  for (const o of game.obs){
    o.x -= game.speed * dt/1000;
    if (!o.hit && Math.abs(o.x - 54) < 13 && game.y > -14){
      o.hit = true; game.speed = Math.max(70, game.speed * .7);
      game.stun = now + 500; SFX.bonk(); emit('crumb', 54, GROUND-8, 6, {col:'#9b7a52', vy:-20, g:120});
    }
    if (!o.past && o.x < 40){ o.past = true; if (!o.hit){ game.score++; SFX.coin(); } }
    if (o.x < -20) o.dead = true;
  }
  game.obs = game.obs.filter(o => !o.dead);
}
function leapJump(){
  if (!game || game.kind !== 'leap') return;
  if (game.y < -1) return;
  game.vy = -132; SFX.purr();
}
function drawLeap(now){
  // scrolling ground streaks sell the speed
  ctx.fillStyle = 'rgba(60,44,28,.5)';
  for (let i=0;i<14;i++){
    const x = ((i*22 - game.run) % (W+30) + W+30) % (W+30) - 15;
    ctx.fillRect(x, GROUND + 6 + (i%3)*6, 9, 2);
  }
  for (const o of game.obs){
    const x = Math.round(o.x);
    if (o.kind === 'log'){
      ctx.fillStyle = '#5d4426'; ctx.fillRect(x-11, GROUND-7, 22, 7);
      ctx.fillStyle = '#7b5c33'; ctx.fillRect(x-11, GROUND-7, 22, 2);
      ctx.fillStyle = '#3d2c18'; ctx.fillRect(x+8, GROUND-7, 3, 7);
    } else {
      ctx.fillStyle = '#5f5a4e'; ctx.fillRect(x-8, GROUND-11, 16, 11);
      ctx.fillStyle = '#7b7566'; ctx.fillRect(x-6, GROUND-11, 11, 3);
      ctx.fillStyle = '#3c382f'; ctx.fillRect(x+4, GROUND-8, 4, 8);
    }
  }
  const airborne = game.y < -2;
  const { f, sc } = gameSprite(now < game.stun ? 'sick' : airborne ? 'cheer' : 'walk',
                               airborne ? 0 : Math.floor(game.run / 9), 42);
  ctx.save(); ctx.translate(54, GROUND + Math.round(game.y));
  ctx.scale(-1, 1);
  ctx.drawImage(f.cv, -f.ox*sc, -f.oy*sc, f.w*sc, f.h*sc);
  ctx.restore();
  scoreTag('Cleared ' + game.score);
}

function scoreTag(text){
  ctx.font = '9px monospace';
  const w = ctx.measureText(text).width + 10;
  ctx.fillStyle = 'rgba(16,26,24,.82)'; ctx.fillRect(4, H - 17, w, 13);
  ctx.fillStyle = '#e9e1cb'; ctx.fillText(text, 9, H - 7);
}

const NEED_META = [

  { k:'hygiene', label:'Clean',   col:'#7fb2c9' },
  { k:'joy',     label:'Joy',     col:'#c96f86' }
];
const ICON_ART = {
  feed: g => {
    g.fillStyle='#82382a'; g.fillRect(2,2,7,8);
    g.fillStyle='#a04a34'; g.fillRect(2,2,6,7);
    g.fillStyle='#c46a4c'; g.fillRect(3,3,3,2);
    g.fillStyle='#d8d0b4'; g.fillRect(8,5,3,2); g.fillRect(10,3,2,2); g.fillRect(10,7,2,2);
  },
  play: g => {
    for (let y=0;y<12;y++) for (let x=0;x<12;x++){
      const dx=x-5.5, dy=y-5.5, d=Math.hypot(dx,dy);
      if (d > 5.4) continue;
      g.fillStyle = d > 4.3 ? '#2f6f6a' : (dx+dy < -3.2 ? '#a7dbd3' : '#5fb0a5');
      g.fillRect(x,y,1,1);
    }
    g.fillStyle='#2f6f6a'; g.fillRect(1,5,10,1); g.fillRect(5,1,1,10);
  },
  wash: g => {
    g.fillStyle='#4b7f99'; g.fillRect(4,1,3,2); g.fillRect(3,3,5,2); g.fillRect(2,5,7,4); g.fillRect(3,9,5,2);
    g.fillStyle='#7fb2c9'; g.fillRect(4,2,2,2); g.fillRect(3,4,4,4); g.fillRect(4,8,3,2);
    g.fillStyle='#d6ecf4'; g.fillRect(4,4,2,2);
    g.fillStyle='#e8f4fa'; g.fillRect(10,2,1,1); g.fillRect(11,5,1,1); g.fillRect(9,7,1,1);
  },
  care: g => {
    g.fillStyle='#8f3f26'; g.fillRect(1,3,4,1); g.fillRect(7,3,4,1); g.fillRect(0,4,12,4);
    g.fillRect(1,8,10,1); g.fillRect(2,9,8,1); g.fillRect(3,10,6,1); g.fillRect(4,11,4,1);
    g.fillStyle='#c2603c'; g.fillRect(1,4,10,3); g.fillRect(2,7,8,1); g.fillRect(3,8,6,1);

  },
  shop: g => {

    g.fillStyle='#8a6a36'; g.fillRect(1,4,9,7);
    g.fillStyle='#b08a4a'; g.fillRect(1,4,9,2);

    g.fillStyle='#d9a83f'; g.fillRect(5,7,2,2);
  },
  coin: g => {
    g.fillStyle='#8a6a1e'; g.fillRect(2,1,8,10); g.fillRect(1,2,10,8);
    g.fillStyle='#d9a83f'; g.fillRect(2,2,7,8); g.fillRect(3,1,5,10);

    g.fillStyle='#8a6a1e'; g.fillRect(5,3,2,6); g.fillRect(4,4,4,1); g.fillRect(4,7,4,1);
  },
  nest: g => {
    g.fillStyle='#6b5230'; g.fillRect(0,7,12,4); g.fillRect(1,6,10,1);
    g.fillStyle='#8a6a3c'; g.fillRect(1,7,10,1); g.fillRect(0,9,12,1);
    g.fillStyle='#efe3c4'; g.fillRect(3,3,3,4); g.fillRect(2,4,5,3);
    g.fillStyle='#cfc3a4'; g.fillRect(7,4,3,3); g.fillRect(6,5,5,2);
  }
};
function pixelIcon(id, w, h){
  const c = makeCv(w,h), g = readCtx(c);
  ICON_ART[id](g);
  const d = g.getImageData(0,0,w,h), px = d.data, solid = new Uint8Array(w*h);
  for (let i=0;i<w*h;i++){ if (px[i*4+3] >= 118){ px[i*4+3]=255; solid[i]=1; } else px[i*4+3]=0; }
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const i=y*w+x; if (solid[i]) continue;
    if ((x>0&&solid[i-1])||(x<w-1&&solid[i+1])||(y>0&&solid[i-w])||(y<h-1&&solid[i+w])){
      px[i*4]=0x14; px[i*4+1]=0x1c; px[i*4+2]=0x1e; px[i*4+3]=255;
    }
  }
  g.putImageData(d,0,0);
  return c;
}

function buildChrome(){
  $('needs').innerHTML = NEED_META.map(n =>
    `<div class="need" id="need-${n.k}"><b>${n.label}</b>
       <div class="track"><div class="fill" id="fill-${n.k}" style="background:${n.col}"></div><i class="seg"></i></div>
     </div>`).join('');
  $('needs').onclick = () => { if (hatched()) openSheet('vitals'); };
  $('picks').innerHTML = eggChoices().map(c => {
    const sp = SPECIES[c.id];
    return `<span style="left:${(c.x / W * 100).toFixed(1)}%"><b>${sp.common}</b>${sp.lure}</span>`;
  }).join('');
  $('actions').innerHTML = [
    ['feed','Feed'],['play','Play'],['wash','Wash'],['care','Care'],['shop','Shop']
  ].map(([k,l]) => `<button class="act" id="act-${k}"><span class="ico" data-ico="${k}"></span>${l}</button>`).join('');
  document.querySelectorAll('[data-ico]').forEach(sl => {
    const c = pixelIcon(sl.getAttribute('data-ico'), 12, 12);
    c.style.width = '24px'; c.style.height = '24px'; c.style.imageRendering = 'pixelated';
    sl.appendChild(c);
  });
  const coin = pixelIcon('coin', 12, 12);
  coin.style.cssText = 'width:13px;height:13px;image-rendering:pixelated';
  $('coinArt').appendChild(coin);
  const nest = pixelIcon('nest', 12, 12);
  nest.style.cssText = 'width:18px;height:18px;image-rendering:pixelated';
  $('btnNest').appendChild(nest);
  $('act-feed').onclick = () => openSheet('feed');
  $('act-play').onclick = () => openSheet('play');
  $('act-wash').onclick = () => { scrub(); };
  $('act-care').onclick = () => openSheet('care');
  $('act-shop').onclick = () => openSheet('shop');
  $('btnNest').onclick = () => openSheet('nest');
  $('btnDossier').onclick = () => openSheet('dossier');
  $('dName').onclick = beginRename;
  $('dName').onkeydown = e => { if (e.key === 'Enter') beginRename(); };
  $('scrim').onclick = closeSheet;
}
function paintChrome(){
  const busy = mode !== 'live';
  ['feed','play','wash','care','shop'].forEach(k => { $('act-'+k).disabled = busy; });
  const careBtn = $('act-care');
  const old = careBtn.querySelector('.nub'); if (old) old.remove();
  if (hatched() && (S.ills.length || S.vet)){
    const n = document.createElement('i'); n.className = 'nub'; careBtn.appendChild(n);
  }
  $('nestCount').textContent = G.pets.length > 1 ? G.pets.length : '';
}

/* ------------------------------- refresh ---------------------------------- */
function refreshLight(){
  if (!G) return;
  $('coins').textContent = Math.floor(G.coins);
  if (!hatched()) return;
  for (const n of NEED_META){
    const v = S.needs[n.k];
    $('fill-'+n.k).style.width = v + '%';
    $('fill-'+n.k).style.background = v < 22 ? '#c2603c' : v < 45 ? '#d9a441' : n.col;
    $('need-'+n.k).classList.toggle('low', v < 22);
  }
}
function refresh(){
  refreshLight();
  $('picks').hidden = !(mode === 'choose');
  $('needs').style.display = hatched() ? '' : 'none';
  const lamp = $('lamp');
  if (!hatched()){
    $('dName').textContent = S && S.sp ? 'Nearly out' : 'A warm egg';
    $('dSub').textContent = S && S.sp ? 'Keep tapping the shell' : 'Pick one to begin';
    $('mood').textContent = S && S.sp ? 'Something is moving in there.'
      : numWord(eggChoices().length) + ' eggs are waiting in the nest.';
    $('bond').innerHTML = ''; $('badges').innerHTML = '';
    lamp.className = 'lamp rest';
    paintChrome();
    return;
  }
  const sp = SPECIES[S.sp], st = STAGE[stageIdx()];
  $('dName').textContent = S.name;
  const d = ageDays();
  const age = d < 1 ? Math.max(1, Math.round(d*24)) + 'h old' : Math.floor(d) + (Math.floor(d) === 1 ? ' day old' : ' days old');
  $('dSub').textContent = st.label + ' ' + sp.common + ' · ' + age;
  $('mood').innerHTML = S.name + ' <em>' + moodOf().line + '</em>';
  $('bond').innerHTML = 'Bond ' + Array.from({length:5}, (_,i) => `<i class="pip${i < bondPips() ? ' on' : ''}"></i>`).join('');
  const tags = [];
  if (S.vet) tags.push(['warn','At their limit']);
  S.ills.forEach(i => tags.push(['warn', ILLS[i.id].name]));
  if (S.asleep && !S.vet) tags.push(['', 'Asleep']);
  if (S.mess.length) tags.push(['warn', S.mess.length + ' to clean']);
  if (G.streak > 1) tags.push(['', G.streak + '-day streak']);
  $('badges').innerHTML = tags.slice(0,3).map(([c,t]) => `<span class="tag ${c}"><i class="dot"></i>${t}</span>`).join('');
  lamp.className = 'lamp' + (S.vet || S.ills.length ? ' bad' : S.asleep ? ' rest' : '');
  paintChrome();
  if (openPanel) renderSheet(openPanel);
}

/* -------------------------------- sheets ---------------------------------- */
let openPanel = null;
/* the only sheets that mean anything before there is a hatched animal */
const SHEETS_PRE_HATCH = ['dossier', 'nest', 'trouble'];
function openSheet(which){
  if (mode === 'game') return;
  if (mode !== 'live' && !SHEETS_PRE_HATCH.includes(which)) return;
  openPanel = which;
  renderSheet(which);
  $('sheet').classList.add('on'); $('scrim').classList.add('on');
}
function closeSheet(){ openPanel = null; $('sheet').classList.remove('on'); $('scrim').classList.remove('on'); }

function rowHTML(art, title, sub, right, attrs){
  const slot = art ? `<span class="art" data-art="${art}"></span>` : '';
  return `<button class="row" ${attrs||''}>${slot}
    <span class="t"><b>${title}</b><small>${sub}</small></span><span class="px">${right||''}</span></button>`;
}
function mountArt(root){
  root.querySelectorAll('[data-art]').forEach(slot => {
    const id = slot.getAttribute('data-art');
    if (!id) return;
    if (HATS[id]){
      const c = makeCv(30,28), g = readCtx(c);
      g.imageSmoothingEnabled = false;
      g.drawImage(HATS[id], 3, 2, 24, 22);
      slot.appendChild(c);
    } else {
      const c = makeCv(30,30), g = readCtx(c);
      g.imageSmoothingEnabled = false; drawItem(g, id, 5, 9, 3);
      slot.appendChild(c);
    }
  });
}
function portrait(pet, size){
  const c = makeCv(size, size), g = readCtx(c);
  g.imageSmoothingEnabled = false;
  if (!pet.sp){ g.fillStyle = '#3a4a44'; g.fillRect(size/2-5, size/2-7, 10, 14); return c; }
  const prev = S; S = pet;
  const st = pet.born ? stageIdx() : 0;
  S = prev;
  const f = frameOf(pet.sp, st, 'idle', 0, false, pet.skin || 'wild');
  const sc = Math.min(size / f.w, size / f.h) * .92;
  g.drawImage(f.cv, (size - f.w*sc)/2, size - f.h*sc - 1, f.w*sc, f.h*sc);
  return c;
}

/* One entry per sheet, each handed the body element and the active species.

   into; a sheet is now self-contained, the way GAMES already works in
   06-render.js. Each one builds its own HTML, mounts it, then binds. */

  feed(b, sp){

  },

  vitals(b, sp){
    let html = '';
    const n = S.needs, hr = new Date().getHours();
    const untilBed = ((BED_HOUR - hr) + 24) % 24;
    const hoursLeft = (n.energy / (ENERGY_AWAKE * trait('tempo').energy)).toFixed(1);

    html = `<h2>Vitals</h2><p class="lede">What each meter does, and how fast it moves for this animal.</p>
      <div class="stats">
        <div class="stat"><b>Hunger</b><span>${Math.round(n.hunger)}%</span></div>

      </div>
      <div class="log"><time>Energy</time>Falls about ${(ENERGY_AWAKE * trait('tempo').energy).toFixed(1)} points an hour awake, and comes back at ${ENERGY_ASLEEP} an hour asleep. At this level ${S.name} has roughly ${hoursLeft} waking hours left, and a full night takes about ${hoursFull} hours.</div>
      <div class="log"><time>Sleep</time>${S.name} settles itself between ${BED_HOUR}:00 and ${WAKE_HOUR}:00, or any time energy drops under 6. It wakes on its own once rested. Bedtime is in about ${untilBed} hours. Keeping it up more than two hours past bedtime brings on a chill.</div>
      <div class="log"><time>Hunger</time>Falls about ${(7.5*trait('appetite').hunger).toFixed(1)} an hour. Under 22 it starts nosing at the dirt; at zero, health follows it down.</div>
      <div class="log"><time>Clean</time>Falls 4 an hour, and drops 11 more with every mess. Under 20 invites mites.</div>
      <div class="log"><time>Joy</time>Falls about ${(6*trait('tempo').joy*trait('social').lonely).toFixed(1)} an hour. Games, tricks and petting bring it back. Under 15 for long enough turns into the blues.</div>
      <div class="hr"></div>`;
    html += rowHTML('', 'Tuck it in', S.asleep ? S.name + ' is already asleep.' :
      n.energy > 70 ? 'Available once energy drops below 70.' : 'Settle it early and skip the late night. Builds a little trust.',
      S.asleep || n.energy > 70 ? '—' : 'free', S.asleep || n.energy > 70 ? 'disabled' : '');
    b.innerHTML = html; mountArt(b);

  care(b, sp){
    let html = '';
    if (S.vet){
      html = `<h2>Care</h2><p class="lede">${S.name} is on the ground and will not get up. A vet can bring it back.</p>`;

    } else {

      html += '<div class="hr"></div>';

      }

    html += rowHTML('', 'Take a new egg', G.pets.length >= MAX_PETS ? 'The nest holds ' + MAX_PETS + '.' : 'Start another animal from scratch.',

  dossier(b, sp){
    let html = '';
    if (!hatched()){
      b.innerHTML = `<h2>Field dossier</h2><p class="lede">Choose an egg first. Each species is drawn from its own skeleton, so the sprite shows what the notes claim.</p>`;
    } else {

        <div class="hr"></div>

        ${rowHTML('', 'Release ' + S.name, G.pets.length > 1 ? 'Removes this animal from the nest for good.' : 'You cannot release your only animal.', 'release', G.pets.length > 1 ? '' : 'disabled')}

        if (!armedR){ armedR = true; rows[1].querySelector('.px').textContent = 'sure?'; setTimeout(()=>{armedR=false; if(openPanel==='dossier') renderSheet('dossier');}, 3000); return; }

function renderSheet(which){
  const sheet = SHEETS[which];
  if (!sheet) return;

}

/* -------------------------------- naming ---------------------------------- */
function beginRename(){
  if (!hatched()) return;
  const inp = $('nameEdit');
  inp.hidden = false; $('dName').style.display = 'none';
  inp.value = S.name; inp.focus(); inp.select();
}
$('nameEdit').addEventListener('blur', () => {
  const inp = $('nameEdit');
  S.name = (inp.value.trim() || S.name || 'Pip').slice(0,14);
  inp.hidden = true; $('dName').style.display = '';
  document.title = S.name + ' — Paleopal';
  save(); refresh();
});
$('nameEdit').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); e.stopPropagation(); });

/* -------------------------------- input ----------------------------------- */
function canvasPos(e){
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
}
let holding = false, holdPos = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  const [mx, my] = canvasPos(e);
  holdPos = [mx, my];
  if (AC && AC.state === 'suspended') AC.resume();

  if (mode === 'choose'){
    for (const c of eggChoices()){
      if (Math.abs(mx - c.x) < c.hit && my > GROUND - 40 && my < GROUND + 6){ chooseEgg(c.id); return; }
    }
    return;
  }
  if (mode === 'egg'){
    egg.cracks++; egg.wob = 1; SFX.crack();
    if (egg.cracks >= 6) hatch();
    return;
  }
  if (mode === 'game'){
    if (game.kind === 'snack') game.tx = mx;
    if (game.kind === 'stomp') tapStomp(mx, my);
    if (game.kind === 'leap')  leapJump();
    return;
  }
  if (mode === 'live'){
    if (mx >= dinoBox[0] - 4 && mx <= dinoBox[2] + 4 && my >= dinoBox[1] - 4){ holding = true; pet(); return; }
    if (bondPips() >= 2 && !S.asleep && !S.vet){
      dino.tx = clamp(mx, 22, W-22);
      dino.until = performance.now() + 4000;
    }
  }
});
cv.addEventListener('pointermove', e => {
  const p = canvasPos(e); holdPos = p;
  if (mode === 'game' && game && game.kind === 'snack' && e.buttons) game.tx = p[0];
});
window.addEventListener('pointerup', () => { holding = false; });
window.addEventListener('pointercancel', () => { holding = false; });
window.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (openPanel) closeSheet(); else if (mode === 'game') endGame(); return; }
  if (mode === 'game' && game){
    if (game.kind === 'snack'){
      if (e.key === 'ArrowLeft' || e.key === 'a') game.kL = true;
      if (e.key === 'ArrowRight'|| e.key === 'd') game.kR = true;
    }
    if (game.kind === 'leap' && (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w')) leapJump();
  }
});
window.addEventListener('keyup', e => {
  if (mode === 'game' && game && game.kind === 'snack'){
    if (e.key === 'ArrowLeft' || e.key === 'a') game.kL = false;
    if (e.key === 'ArrowRight'|| e.key === 'd') game.kR = false;
  }
});

/* ------------------------------ lifecycle --------------------------------- */
function chooseEgg(id){
  S.sp = id; S.name = pick(NAMES.filter(n => !G.pets.some(p => p.name === n))) || pick(NAMES);
  S.traits = { appetite:(Math.random()*2)|0, tempo:(Math.random()*2)|0, social:(Math.random()*2)|0 };
  mode = 'egg'; egg.cracks = 0;
  SFX.pop(); say('Tap the egg until it opens.');
  refresh(); save();
}
function hatch(){
  S.born = Date.now();
  mode = 'live';
  dino.digAt = performance.now() + 40e3;
  SFX.hatch(); emit('heart', W/2, GROUND-24, 8);
  logEvent(S.name + ' hatched.');
  document.title = S.name + ' — Paleopal';
  say('Hello. Tap the name above to rename it.', 4200);
  refresh(); paintChrome(); save();
}

let saveAt = 0;
function save(){ if (!G) return; G.lastSeen = Date.now(); Store.set(SAVE_KEY, JSON.stringify(G)); }

function awayReport(gapMs){
  const mins = Math.round(gapMs / MIN), bits = [];
  if (mins < 90) bits.push('You were away about ' + mins + ' minutes.');
  else if (mins < 60*30) bits.push('You were away about ' + Math.round(mins/60) + ' hours.');
  else bits.push('You were away ' + Math.round(mins/1440) + ' days.');
  const trouble = G.pets.filter(p => p.born && (p.vet || p.ills.length || Math.min(p.needs.hunger, p.needs.joy, p.needs.hygiene) < 25));
  if (!trouble.length) bits.push(G.pets.length > 1 ? 'Everyone held up fine.' : 'It held up fine.');
  else bits.push(trouble.map(p => p.name + ' ' + (p.vet ? 'collapsed and needs a vet' :
      p.ills.length ? 'has ' + ILLS[p.ills[0].id].name.toLowerCase() : 'needs attention')).join(', ') + '.');
  const mess = G.pets.reduce((a,p) => a + p.mess.length, 0);
  if (mess) bits.push('There are ' + mess + ' messes to clean.');
  G.awayText = bits.join(' ');
}
function dailyCheck(){
  const today = new Date().toDateString();
  if (G.lastDay === today) return;
  const yest = new Date(Date.now() - 86400e3).toDateString();
  G.streak = G.lastDay === yest ? G.streak + 1 : 1;
  G.lastDay = today;
  if (hatched()){
    const bonus = 5 + Math.min(20, G.streak * 3);
    G.coins += bonus;
    logEvent('Day ' + G.streak + ' together. +' + bonus + ' coins.');
    setTimeout(() => say('Day ' + G.streak + ' together. +' + bonus + ' coins.'), 1400);
  }
}

/* ------------------------------- main loop -------------------------------- */
let lastFrame = performance.now(), accum = 0;
function frame(now){
  const dt = clamp(now - lastFrame, 0, 120);
  lastFrame = now;

  if (G){
    const real = Date.now();
    if (real - G.lastTick > 500){
      let left = Math.min(real - G.lastTick, 12*HOUR);
      G.lastTick = real;
      while (left > 0){ const chunk = Math.min(left, 5*MIN); simulateAll(chunk, true); left -= chunk; }
    }
  }

  stepBehaviour(dt, now);
  stepFeed(dt);
  if (mode === 'game') stepGame(dt, now);
  stepParts(dt);
  if (holding && holdPos && mode === 'live' &&
      holdPos[0] >= dinoBox[0]-4 && holdPos[0] <= dinoBox[2]+4 && holdPos[1] >= dinoBox[1]-4) pet();

  if (G) drawScene(now);
  accum += dt;
  if (accum > 1000){ accum = 0; refresh(); }
  if (now - saveAt > 6000){ saveAt = now; save(); }
  requestAnimationFrame(frame);
}

async function boot(){
  buildChrome();
  G = freshGame();
  const loaded = loadSave(await Store.get(SAVE_KEY));
  if (loaded.game){
    G = loaded.game;
    // an upgraded save is written back at once, so a crash before the next
    // autosave cannot leave the old shape sitting on disk
    if (loaded.from !== SAVE_VERSION) await Store.set(SAVE_KEY, JSON.stringify(G));
  } else if (loaded.keep){
    // A save we cannot read is still the player's. Park it under the backup
    // key and tell them, rather than starting over in silence.
    await Store.set(BACKUP_KEY, loaded.keep);
    G.loadWarning = 'Your saved nest ' + loaded.why + ', so this is a fresh start. ' +
                    'The old save has not been deleted.';
    console.warn('paleopal: save ' + loaded.why + '; kept a copy at ' + BACKUP_KEY);
  }
  S = G.pets[G.active];
  if (hatched()){
    mode = 'live';
    const gap = clamp(Date.now() - (G.lastTick || Date.now()), 0, 14*86400e3);
    if (gap > 60e3){
      let left = Math.min(gap, 3*86400e3);
      while (left > 0){ const chunk = Math.min(left, 10*MIN); simulateAll(chunk, false); left -= chunk; }
      awayReport(gap);
      setTimeout(() => openSheet('away'), 500);
    }
    document.title = S.name + ' — Paleopal';
  } else mode = S.sp ? 'egg' : 'choose';
  G.lastTick = Date.now();
  dailyCheck();
  if (G.loadWarning) setTimeout(() => openSheet('trouble'), 500);
  refresh(); paintChrome();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);
boot();

</script>
