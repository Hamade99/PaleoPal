/* cursor and scroll marks, addressed by name so the screen code does not have
   to carry literal box-drawing characters around */
const GL_RIGHT = '▶', GL_LEFT = '◀', GL_UP = '▲', GL_DOWN = '▼';
const GL_DOT = '·';

const fontStrips = new Map();
function fontStrip(col){
  let strip = fontStrips.get(col);
  if (strip) return strip;
  const keys = Object.keys(GLYPHS);
  const cv = makeCv(keys.length * FONT_W, FONT_H), g = readCtx(cv);
  g.fillStyle = col;
  const index = new Map();
  keys.forEach((ch, n) => {
    const code = GLYPHS[ch], ox = n * FONT_W;
    index.set(ch, ox);
    for (let row=0; row<FONT_H; row++){
      const bits = B32.indexOf(code[row]);
      for (let bit=0; bit<FONT_W; bit++)
        if (bits & (1 << (FONT_W - 1 - bit))) g.fillRect(ox + bit, row, 1, 1);
    }
  });
  strip = { cv, index };
  fontStrips.set(col, strip);
  return strip;
}

const textW = s => s.length ? s.length * FONT_ADV - 1 : 0;

/* Draw a single line. `align` is 'left' (default), 'right' or 'centre', and x
   is the edge the alignment refers to. Returns the x the line ended at. */
function text(g, str, x, y, col, align){
  str = String(str);
  const strip = fontStrip(col || '#e9e1cb');
  let px = Math.round(align === 'right'  ? x - textW(str)
                    : align === 'centre' ? x - textW(str)/2 : x);
  const py = Math.round(y);
  for (let i=0; i<str.length; i++){
    const ox = strip.index.get(str[i]);
    if (ox !== undefined) g.drawImage(strip.cv, ox, 0, FONT_W, FONT_H, px, py, FONT_W, FONT_H);
    px += FONT_ADV;
  }
  return px;
}

/* Greedy wrap to a pixel width. Long words are broken rather than allowed to
   run off the screen, because at this size one over-long word is the whole
   line. */
function wrapText(str, maxW){
  const cols = Math.max(1, Math.floor((maxW + 1) / FONT_ADV));
  const out = [];
  for (const para of String(str).split('\n')){
    let line = '';
    for (const word of para.split(' ')){
      let w = word;
      while (w.length > cols){                     // break a word too long to fit
        if (line) { out.push(line); line = ''; }
        out.push(w.slice(0, cols));
        w = w.slice(cols);
      }
      if (!line) line = w;
      else if (line.length + 1 + w.length <= cols) line += ' ' + w;
      else { out.push(line); line = w; }
    }
    out.push(line);
  }
  return out;
}

/* Wrapped paragraph. Returns the y it finished at, so callers can stack. */
function textBlock(g, str, x, y, maxW, col, lineH){
  const step = lineH || FONT_LINE;
  for (const line of wrapText(str, maxW)){ text(g, line, x, y, col); y += step; }
  return y;
}

/* Cut a string to fit, with a trailing dot rather than three: at six pixels a
   character an ellipsis costs three characters of the thing being named. */
function fit(str, maxW){
  const cols = Math.max(1, Math.floor((maxW + 1) / FONT_ADV));
  str = String(str);
  return str.length <= cols ? str : str.slice(0, cols - 1) + '.';
}

/* Tyrannosaurus rex sprite
   Part of Paleopal. Load order matters; see build.py. */

const REX_SPEC = { skin:'#7e9c54', belly:'#b8bd80', crest:'#5b7940', horn:'#e9dfba',
                   mouth:'#8e4a45', outline:'#241d13' };
const REX_GAIT = { stride:.46, lift:.17, duty:.56, mt:.22, back:.34, bend:1, thigh:false, foot:'bird' };
function drawRex(M, P){
  const st = STAGE[P.stage];
  const hM = st.head, nM = st.neck, lM = st.limb, tM = st.tail;
  const bob = P.body, jaw = P.jaw||0, sw = P.tail||0, dr = P.droop||0;

  // skeleton landmarks. Hip is the acetabulum; everything else hangs off it.
  const hipX = 16,  hipY = -46*lM - bob;
  const backY = hipY - 24*lM, withX = -18, withY = hipY - 25*lM;
  const bellyY = hipY + 9*lM, throatY = hipY + 3*lM;
  const hx = withX - 26*nM - 4*hM, hy = withY - 10*nM - 2 + dr*9;
  const sM = st.snout;
  const sn = 23*hM*sM, hh = 15.5*hM;      // shorter and deeper than it was
  const T = d => hipX + d*tM;

  // far limb first, behind everything
  blob(M.far, [[hipX+9*lM, hipY-11*lM],[hipX+12*lM, hipY+4*lM],[hipX+2*lM, hipY+15*lM],
               [hipX-9*lM, hipY+13*lM],[hipX-13*lM, hipY-1*lM],[hipX-8*lM, hipY-11*lM]]);
  legStep(M.far, hipX-6, hipY+2, (P.legPhase+.5)%1, 14*lM, REX_GAIT);

  // one continuous mass from nape to tail tip: neck, ribcage, hips and tail
  const topLine = [[hx+11, hy-hh*.35],[withX, withY],[0, backY-1],[hipX+7, backY+1],[T(23), hipY-18*lM+sw*2]];
  blob(M.skin, [
    [hx+11, hy-hh*.35],                     // nape at the skull
    [withX, withY],                         // withers
    [0, backY-1],                           // back
    [hipX+7, backY+1],                      // over the hips
    [T(23), hipY-18*lM+sw*2],               // deep tail base
    [T(48), hipY-13*lM+sw*4],
    [T(72), hipY-7*lM+sw*6],                // tail tip
    [T(70), hipY-4*lM+sw*6],
    [T(43), hipY-1*lM+sw*4],
    [T(17), hipY+4*lM],
    [hipX-6, bellyY],                       // belly
    [-8, bellyY-1],
    [withX-7, throatY-2],                   // chest and throat
    [hx+9, hy+hh*.58]
  ]);

  /* Skull.

     The first version made every horizontal line straight: a flat roof from
     nape to muzzle, a ruler-straight oral margin under it, and a squared
     premaxilla at the end. Three straight lines and a right angle is a box
     with an eye on it, which is most of what made the face read as goofy.

     Three curves replace them, and none of them costs an anatomical claim:

       - the braincase domes over the orbit and falls away behind it. A
         tyrannosaur skull is deep and vaulted through the postorbital, and a
         big rounded braincase over a big eye is also the whole of what makes
         an animal read as young.
       - the oral margin is sinuous rather than level: high at the cheek,
         bowed down through the tooth row, lifting again at the tip. That is
         the shape the maxilla actually has, and read as a face it is a
         slight smile.
       - the muzzle keeps its squared-off front — a near-vertical premaxilla
         is the quickest way to read tyrannosaur rather than generic theropod
         at this size — but it is shorter and deeper than it was, so the head
         is a head rather than a snout with a skull behind it. */
  const lipBack = hy + hh*.26, lipMid = hy + hh*.44, lipTip = hy + hh*.30;
  blob(M.head, [
    [hx+14, hy-hh*.06],                     // occiput, meeting the nape
    [hx+12, hy-hh*.90],
    [hx+2,  hy-hh*1.18],                    // vaulted braincase, over the orbit
    [hx-sn*.34, hy-hh*1.06],
    [hx-sn*.66, hy-hh*.84],
    [hx-sn*.88, hy-hh*.56],
    // three near-vertical stations across the front, so the curve through
    // them stays flat instead of rounding the premaxilla off
    [hx-sn*1.00, hy-hh*.30],
    [hx-sn*1.05, hy+hh*.02],
    [hx-sn*1.02, lipTip-hh*.06],
    [hx-sn*.92, lipTip],                    // the oral margin, and its curve
    [hx-sn*.46, lipMid],
    [hx+14, lipBack]
  ]);

  /* Hinged mandible, on its own material. It was always drawn and always
     hinged, but it was painted onto `head`, and the compositor only draws an
     edge where two different materials meet — so the whole lower jaw merged
     into the skull and the animal had no mouth. It hangs below the upper
     jaw's oral margin, and that boundary is the lip line. The ventral profile
     is what shows, so it carries a rounded chin rather than the flat slab it
     had, which is the other half of the goofy face.

     −x is forward, so the jaw opens on a negative rotation. */
  const hinge = [hx + 12, hy + hh*.18], jawA = -jaw * .34;
  M.jaw.save(); M.jaw.translate(hinge[0], hinge[1]); M.jaw.rotate(jawA);
  blob(M.jaw, [[2,-hh*.12],[-sn*.42,-hh*.10],[-sn*.90,hh*.06],
               [-sn*.94,hh*.32],[-sn*.66,hh*.52],[-sn*.24,hh*.58],[2,hh*.46]]);
  M.jaw.restore();
  // pale chin, carried by the jaw rather than left floating under it
  M.belly.save(); M.belly.translate(hinge[0], hinge[1]); M.belly.rotate(jawA);
  oval(M.belly, -sn*.54, hh*.42, sn*.24, hh*.10);
  M.belly.restore();

  const about = (p, a, o) => [o[0] + (p[0]-o[0])*Math.cos(a) - (p[1]-o[1])*Math.sin(a),
                              o[1] + (p[0]-o[0])*Math.sin(a) + (p[1]-o[1])*Math.cos(a)];
  if (jaw > .06){
    /* The gape is the wedge between the two oral margins, anchored at the
       hinge. Drawing it as a slab carried around by the mandible put mouth
       lining outside the head; drawing it through `blob` bowed the curves
       outward and swallowed the whole face. Straight edges, because the two
       margins it runs between are straight. */
    const uTip = [hx - sn*.91, lipTip - hh*.02];
    const lTip = about([hx - sn*.88, hy + hh*.30], jawA, hinge);
    const gape = [hinge, uTip, lTip];
    M.mouth.beginPath();
    M.mouth.moveTo(gape[0][0], gape[0][1]);
    for (let i=1;i<gape.length;i++) M.mouth.lineTo(gape[i][0], gape[i][1]);
    M.mouth.closePath(); M.mouth.fill();
    /* Teeth. The large ones are maxillary; the dentary shows tips only, which
       is both what the animal had and what reads at this size. */
    const tw = Math.max(.9, 1.25*hM);
    for (let i=0;i<5;i++){
      const u = .18 + i*.17;
      oval(M.horn, lerp(hinge[0],uTip[0],u), lerp(hinge[1],uTip[1],u) + hh*.10,
           tw, Math.max(1.3, (2.4 - i*.22)*hM));
    }
    for (let i=0;i<4;i++){
      const u = .26 + i*.18;
      oval(M.horn, lerp(hinge[0],lTip[0],u), lerp(hinge[1],lTip[1],u) - hh*.08,
           tw*.8, Math.max(1.0, 1.5*hM));
    }
  } else {
    // shut: lips cover the teeth, so all that shows is the oral margin itself
    tube(M.mouth, [[hx+10, lipBack+hh*.02],[hx-sn*.46, lipMid],[hx-sn*.91, lipTip-hh*.02]],
         [Math.max(.9,1.5*hM), Math.max(.8,1.25*hM), Math.max(.6,.8*hM)]);
  }

  const ex = hx - sn*.40, ey = hy - hh*.34;
  /* Brow over the orbit, and the keratin row along the neck and back. The
     brow is a rounded hood rather than the flat plate it was — a straight bar
     over a round eye reads as a scowl, and there is a lacrimal boss there in
     any case. */
  blob(M.crest, [[ex+7.5*hM, ey-hh*.30],[ex+2*hM, ey-hh*.74],[ex-6*hM, ey-hh*.60],
                 [ex-7.5*hM, ey-hh*.30],[ex-4*hM, ey-hh*.22],[ex+3*hM, ey-hh*.24]]);
  for (let i=0;i<10;i++){
    const q = samplePath(topLine, .04 + i*.088);          // ride the actual back line
    oval(M.crest, q[0], q[1] + 1.6*lM, 2.3*lM, 1.4*lM);
  }
  // the ventral countershading is painted from the spine by paintBelly

  // two-fingered hand, palm turned inward the way a theropod wrist actually sits
  const ax = withX + 9, ay = withY + 22*lM;
  tube(M.limb, [[ax,ay],[ax-11*lM,ay+11*lM],[ax-20*lM,ay+7*lM]], [10*lM, 7.2*lM, 5.4*lM]);
  toes(M.horn, ax-23*lM, ay+6*lM, 2, -1, Math.max(1.3, 2.3*lM));

  // near limb: a heavy drumstick over the femur, then shank and bird foot
  blob(M.limb, [[hipX+14*lM, hipY-12*lM],[hipX+16*lM, hipY+5*lM],[hipX+5*lM, hipY+18*lM],
                [hipX-8*lM, hipY+15*lM],[hipX-14*lM, hipY-1*lM],[hipX-9*lM, hipY-13*lM]]);
  const foot = legStep(M.limb, hipX, hipY, P.legPhase, 15*lM, REX_GAIT);
  toes(M.horn, foot[0]-9*lM, foot[1]-1, 3, -1, Math.max(1.2, 2.1*lM));

  /* A larger eye set lower and further forward. Both eyes face forward, which
     the dossier promises, and a low, large orbit under a domed braincase is
     also the proportion that reads as young rather than as lizard. */
  eyeAt(M, ex, ey, 4.0*hM, P.eye);
  // naris: a slot well back from the tip, in the upper half of the muzzle
  oval(M.mouth, hx - sn*.78, hy - hh*.26, Math.max(.9,1.5*hM), Math.max(.7,.9*hM));

  /* Centreline for the coat painter: nape to tail tip, carrying the body's
     half-depth at each station so a band knows how far to run. */
  const spine = [
    [hx + 13,   hy + hh*.06,  hh*.52],   // nape
    [withX - 4, withY + 12*lM, 12*lM],   // withers
    [-4,        hipY - 7*lM,   16*lM],   // ribcage
    [hipX + 4,  hipY - 7*lM,   16*lM],   // hips
    [T(24),     hipY - 9*lM,    9*lM],   // tail base
    [T(48),     hipY - 7*lM,    5.5*lM],
    [T(72),     hipY - 6*lM,    2.0*lM]  // tail tip
  ];

  return { eye:[ex,ey], eyeR:4.0*hM, mouth:[hx - sn*.82, hy + hh*.14],
           hat:[hx - sn*.10, hy - hh*1.14], top: hy - hh*1.18, spine };
}


/* Triceratops horridus sprite
   Part of Paleopal. Load order matters; see build.py.

   Proportions follow the modern skeletals: a deep barrel torso, a tail about
   one and a half times the length of the torso and deep at its base, and a
   skull-and-frill unit carried forward of the shoulder rather than sitting on
   top of it.

   That last point is the whole of this rewrite. The frill used to be built
   around a point just in front of the withers, tipped back forty degrees, and
   the body outline was run forward to meet it — so its lower half was buried
   in the shoulder hump, its rim never cleared the back line, and the skull
   appeared to be extruded out of the front of a lump. In side view a
   ceratopsian is a head with an animal behind it: the shield stands clear
   against the sky, there is a short thick neck under it, and the shoulder
   starts behind that. The frill is anchored to the back of the skull now, the
   skull is carried forward of the shoulder, and the body's nape stops short
   so that neck is something you can see.

   Growth follows Horner and Goodwin's series of ten skulls:
     - the frill is present and deeply scalloped from the start, and lengthens
       with positive allometry (STAGE.frill)
     - the epoccipitals along the rim start as deep deltoid scallops and
       flatten to low spindles that fuse into the margin (EPI_DEPTH)
     - the brow horns are straight stubs, curve backward in juveniles,
       straighten in subadults and recurve forward in adults (STAGE.hornBend)
   -------------------------------------------------------------------------- */
const TRI_SPEC = { skin:'#a06635', belly:'#c8975e', crest:'#7d4a22', horn:'#efe6c8',
                   /* The frill carries its own colour, pulled further from the
                      body ramp than it was: on the flank colours the shield
                      was separated from the neck by nothing but the outline,
                      and a shield that does not read as a shield is most of
                      this animal's silhouette thrown away. */
                   shield:'#cfa068',
                   mouth:'#7e3a30', outline:'#26190f' };
const TRI_HIND = { stride:.34, lift:.11, duty:.66, mt:.15, back:.2,  bend:1,  thigh:true,  foot:'column' };
const TRI_FORE = { stride:.32, lift:.10, duty:.66, mt:.15, back:-.1, bend:-1, thigh:false, foot:'column' };
/* how far the rim scallops bite in, per growth stage: deltoid when young,
   low spindles fused to the margin when adult */
const EPI_DEPTH = [.22, .17, .12, .08];

function drawTrike(M, P){
  const st = STAGE[P.stage];
  const hM = st.head, nM = st.neck, lM = st.limb, tM = st.tail;
  const hF = st.horn, sM = st.snout, fM = st.frill, bend = st.hornBend;
  const bob = P.body, jaw = P.jaw||0, sw = P.tail||0, dr = P.droop||0;

  const hipX = 26, hipY = -41*lM - bob;
  const shX = -16, shY = -38*lM - bob;         // glenoid
  const withY = hipY - 25*lM;                  // tall neural spines: a shoulder hump
  const backY = hipY - 20*lM, bellyY = hipY + 14*lM;
  const T = d => hipX + d*tM;

  legStep(M.far, hipX-7, hipY+2, (P.legPhase+.5)%1, 16*lM, TRI_HIND);
  legStep(M.far, shX-7,  shY+3,  (P.legPhase+.25)%1, 14.5*lM, TRI_FORE);

  /* One closed mass: nape, ribcage, hips and tail. The nape stops at the base
     of the neck instead of running forward into the frill, so the neck is a
     column with sky either side of it rather than a filled wedge. The tail
     leaves the hips nearly as deep as the pelvis and tapers the whole way
     out, which is what stops it reading as a stub bolted on the back. */
  blob(M.skin, [
    [shX-9,  withY+8*lM],                      // base of the neck
    [shX-2,  withY],                           // shoulder hump
    [8,      backY-1],                         // back
    [hipX+4, backY+2],                         // hips
    [T(14),  hipY-17*lM+sw*1.5],               // tail base, still deep
    [T(30),  hipY-13*lM+sw*3],
    [T(46),  hipY-8.5*lM+sw*5],
    [T(62),  hipY-3*lM+sw*7],                  // tail tip
    [T(60),  hipY-0.5*lM+sw*7],
    [T(42),  hipY+2*lM+sw*4],
    [T(22),  hipY+6*lM+sw*1.5],
    [T(5),   hipY+10*lM],
    [hipX-6, bellyY],                          // belly
    [2,      bellyY+2*lM],
    [shX+3,  bellyY-1*lM],
    [shX-8,  hipY+2*lM]                        // throat
  ]);

  /* The neck: short, thick and near horizontal, carrying the head forward of
     the shoulder. Drawn on `skin`, so it merges with the body the way a neck
     should — the boundary that has to read is the one behind the frill, and
     the frill has a material of its own for exactly that. */
  const nkX = shX - 7*nM, nkY = withY + 9*lM;
  const hx = nkX - 20*nM - 9*hM*sM, hy = nkY + 7*lM + dr*5;   // the jaw joint
  const sn = 24*hM*sM, hh = 10.5*hM;
  tube(M.skin, [[shX-2, nkY-2*lM],[nkX-4, nkY+1*lM],[hx+14*hM, hy-hh*.10]],
       [15*lM, 13.5*lM, 12*hM]);

  /* Frill: a solid bone shield, anchored to the back of the skull roof and
     opening up and back over the neck. Its rim stands clear of the back line
     the whole way round — that separation is the entire silhouette of the
     animal, and burying it in the shoulder is what made the old one read as a
     hump of neck.

     It rides STAGE.frill, not the horn column: a baby already has an obvious,
     deeply scalloped frill and almost no horns. */
  const fx = hx + 15*hM, fy = hy - hh*1.16;    // the base, on the skull roof
  const fRx = 17.0*hM*fM, fRy = 22.0*hM*fM;
  const fTilt = -0.24;                          // tipped back, but standing up
  const fc = Math.cos(fTilt), fs = Math.sin(fTilt);
  const rot = (px,py) => [fx + px*fc - py*fs, fy + px*fs + py*fc];
  const epi = EPI_DEPTH[P.stage];
  const rim = [];
  const A0 = Math.PI*1.10, A1 = Math.PI*2.02;   // front edge, over the crown, down the back
  /* The epoccipitals scallop the rim itself. Sixteen of them came out as a
     one-pixel sawtooth that read as fur; an adult shows five or six knobs in
     side profile, so the rim is stepped at that count instead. */
  const EPI_N = 8;
  for (let i=0;i<=EPI_N;i++){
    const a = A0 + (A1-A0)*i/EPI_N;
    const r = (i % 2) ? 1.0 : (1 - epi);
    rim.push(rot(Math.cos(a)*fRx*r, Math.sin(a)*fRy*r));
  }
  rim.push(rot(fRx*.74, fRy*.34));              // rear-bottom corner, clear of the neck
  rim.push(rot(fRx*.10, fRy*.44));              // bottom margin, behind the cheek
  rim.push(rot(-fRx*.72, fRy*.30));             // front-bottom, where the skull joins
  blob(M.shield, rim);
  /* The epoccipitals as bone, not only as a step in the outline. They are
     separate ossifications that fuse to the margin, so they are the colour of
     the horns rather than of the shield, and at this size a scalloped edge on
     its own is invisible — a row of pale knobs is what makes the rim read as
     a rim. They shrink with age on the same schedule as the scallops. */
  for (let i=1;i<EPI_N;i+=2){
    const a = A0 + (A1-A0)*i/EPI_N;
    const q = rot(Math.cos(a)*fRx, Math.sin(a)*fRy);
    oval(M.horn, q[0], q[1], (1.1 + epi*7)*hM*fM, (1.0 + epi*5.5)*hM*fM);
  }

  /* Skull: deep, boxy, and carried forward and below the frill base. It stops
     at the oral margin, because the mandible has to live somewhere. The old
     one was a long thin wedge — about half of this animal's head is frill,
     and giving the skull the other half made it a snout on a stalk. */
  const lipY = hy + hh*.38;
  blob(M.head, [
    [hx+15*hM,   hy-hh*1.02],                   // back of the skull roof
    [hx+2*hM,    hy-hh*1.20],                   // roof over the orbit
    [hx-sn*.32,  hy-hh*1.08],
    [hx-sn*.66,  hy-hh*.84],                    // sloping to the beak
    [hx-sn*.90,  hy-hh*.46],
    [hx-sn*1.00, hy-hh*.06],
    [hx-sn*.88,  lipY-hh*.02],                  // oral margin
    [hx-sn*.38,  lipY+hh*.06],
    [hx+4*hM,    hy+hh*.86],                    // deep cheek, down to the jugal
    [hx+16*hM,   hy+hh*.36]
  ]);

  /* Jaw. A ceratopsian bites with two beaks — the rostral above, the
     predentary below — and the gap between them is the mouth. The old sprite
     drew one cream mass across the whole snout, which read as a bald face and
     left the eat animation with nothing to move. */
  const jHinge = [hx + 8*hM, hy + hh*.44], jawA = -jaw*.26;
  M.jaw.save(); M.jaw.translate(jHinge[0], jHinge[1]); M.jaw.rotate(jawA);
  blob(M.jaw, [[4,-hh*.06],[-sn*.36,-hh*.12],[-sn*.78,hh*.06],
               [-sn*.72,hh*.42],[-sn*.24,hh*.56],[5,hh*.44]]);
  M.jaw.restore();

  // rostral: a parrot hook, not a rounded snout cap
  blob(M.horn, [[hx-sn*.92, hy-hh*.40],[hx-sn*1.16, hy-hh*.04],[hx-sn*1.22, hy+hh*.24],
                [hx-sn*1.04, hy+hh*.42],[hx-sn*.88, lipY-hh*.04]]);
  // predentary, riding the jaw so it opens with it
  M.horn.save(); M.horn.translate(jHinge[0], jHinge[1]); M.horn.rotate(jawA);
  blob(M.horn, [[-sn*.56, hh*.00],[-sn*.88, hh*.12],[-sn*.82, hh*.44],[-sn*.52, hh*.42]]);
  M.horn.restore();

  if (jaw > .06){
    const uTip = [hx - sn*.86, lipY - hh*.04];
    const lTip = [jHinge[0] + (-sn*.78)*Math.cos(jawA) - (hh*.06)*Math.sin(jawA),
                  jHinge[1] + (-sn*.78)*Math.sin(jawA) + (hh*.06)*Math.cos(jawA)];
    M.mouth.beginPath();
    M.mouth.moveTo(jHinge[0], jHinge[1]);
    M.mouth.lineTo(uTip[0], uTip[1]);
    M.mouth.lineTo(lTip[0], lTip[1]);
    M.mouth.closePath(); M.mouth.fill();
  } else {
    tube(M.mouth, [[hx+6*hM, lipY+hh*.06],[hx-sn*.38, lipY+hh*.04],[hx-sn*.80, lipY-hh*.04]],
         [Math.max(.9,1.4*hM), Math.max(.8,1.2*hM), Math.max(.6,.9*hM)]);
  }
  const ex = hx - sn*.30, ey = hy - hh*.34;

  /* Brow horns. The keratin sheath ran well past the bone core, so an adult's
     are long; the curvature is the ontogenetic sequence — straight stubs, then
     backward, then straightening, then recurved forward. The mid control point
     bows against the tip, which is what makes a recurve read as a recurve
     rather than as a bent stick.

     They spring from above the orbit, which is where a postorbital horn is,
     and they are rooted low enough on the skull to read as growing out of the
     face rather than off the front of the frill.

     Width tracks the sheath as well as the skull. Scaling thickness on head
     bulk alone gave hatchlings two fat cones where they should have stubs. */
  const hl = hh*(.50 + 1.85*hF);
  const hw = hM * (.40 + .60*hF);
  const browHorn = (dx, dy, len, w) => {
    const bx = ex + dx*hM, by = ey + dy;
    const tip = [bx - len*(.34 + .58*bend), by - len*.82];
    const mid = [(bx + tip[0])/2 + len*.20*bend, (by + tip[1])/2 + len*.06];
    tube(M.horn, [[bx,by], mid, tip], [w*hw, w*.52*hw, w*.12*hw]);
  };
  browHorn( 5, -hh*.52, hl,     9.6);
  browHorn(-4, -hh*.62, hl*.88, 7.8);
  // nasal horn: small in T. horridus, and small at every age
  tube(M.horn, [[hx-sn*.72, hy-hh*.30],[hx-sn*.86, hy-hh*(.50+.5*hF)]], [4.0*hM, 1.2*hM]);
  // jugal horn: a short cheek point aimed down and back, not a hanging tusk
  blob(M.horn, [[hx-sn*.06, hy+hh*.66],[hx-sn*.32, hy+hh*.60],[hx-sn*.10, hy+hh*1.14]]);

  // low nubbin feature scales over the flank and tail base
  for (const q of [[-2,-11],[10,-14],[22,-12],[15,-6],[32,-9],[2,-5],[41,-7]])
    oval(M.crest, q[0], hipY + q[1]*lM, 1.7*lM, 1.2*lM);

  // the ventral countershading is painted from the spine by paintBelly

  legStep(M.limb, hipX+2, hipY, P.legPhase, 18*lM, TRI_HIND, M.horn);
  legStep(M.limb, shX+4, shY+1, (P.legPhase+.75)%1, 16.5*lM, TRI_FORE, M.horn);

  eyeAt(M, ex, ey, 3.4*hM, P.eye);

  /* Centreline for the coat painter: nape to tail tip, with the body's
     half-depth at each station so a band knows how far to run. */
  const spine = [
    [shX-6,   withY+11*lM,  8*lM],   // base of the neck
    [shX+4,   hipY-6*lM,   17*lM],   // shoulder
    [10,      hipY-4*lM,   17*lM],
    [hipX+2,  hipY-3*lM,   16*lM],   // hips
    [T(15),   hipY-7*lM,   10*lM],   // tail base
    [T(32),   hipY-6*lM,    7*lM],
    [T(48),   hipY-4*lM,    4.5*lM],
    [T(62),   hipY-2*lM,    2.0*lM]  // tail tip
  ];

  // headgear sits on the crown of the frill, which the tilt moves forward as
  // well as up — the old anchor was still using the untilted top of the arc
  const crown = rot(fRx*.10, -fRy*.96);
  return { eye:[ex,ey], eyeR:3.4*hM, mouth:[hx - sn*1.12, hy + hh*.22],
           hat:crown, top: crown[1], spine };
}

/* Brachiosaurus altithorax sprite
   Part of Paleopal. Load order matters; see build.py. */

/* ---------------------------- Brachiosaurus -------------------------------- */
const BRA_SPEC = { skin:'#71958a', belly:'#a9ba8e', crest:'#88a894', horn:'#e2e3bc',
                   mouth:'#4c3a35', outline:'#1b2422' };
const BRA_FORE = { stride:.30, lift:.06, duty:.74, mt:.07, back:0,   bend:-1, thigh:false, foot:'hoof' };
const BRA_HIND = { stride:.30, lift:.06, duty:.74, mt:.15, back:.30, bend:1,  thigh:true,  foot:'pad' };
function drawBrachio(M, P){
  const st = STAGE[P.stage];
  const hM = st.head, nM = st.neck, lM = st.limb, tM = st.tail;
  const bob = P.body, jaw = P.jaw||0, sw = P.tail||0, dr = P.droop||0;
  // forelimbs about 1.2 times the hindlimbs: the trait the animal is named for
  const foreLen = 56*lM, hindLen = 46*lM;
  const shX = -14, shY = -foreLen - bob, hipX = 30, hipY = -hindLen - bob;

  legStep(M.far, shX-7,  shY+4, (P.legPhase+.25)%1, 14*lM, BRA_FORE);
  legStep(M.far, hipX-7, hipY+3,(P.legPhase+.5)%1,  14*lM, BRA_HIND);

  // short tail for a sauropod, carried clear of the ground
  tube(M.skin, [[hipX,hipY],[hipX+22*tM,hipY+1+sw*3],[hipX+44*tM,hipY+3+sw*5],
                [hipX+66*tM,hipY+6+sw*7],[hipX+86*tM,hipY+10+sw*9]],
       [31*lM, 22*lM, 14*lM, 7*lM, 2.5*lM]);
  // the back slopes down from the shoulders to the hips
  tube(M.skin, [[shX,shY],[8,shY+8],[hipX,hipY]], [39*lM, 44*lM, 34*lM]);
  oval(M.skin, shX + 2, shY - 6*lM, 18*lM, 12*lM);          // shoulder hump

  // neck near sixty degrees, S-curved, drooping slightly at the head end
  const nl = 58*nM;
  const n1 = [shX - 9,  shY - nl*.30];
  const n2 = [shX - 19, shY - nl*.63];
  const n3 = [shX - 23, shY - nl*.94 + dr*10];
  tube(M.head, [[shX-3, shY-9],n1,n2,n3], [26*lM, 18*lM, 13*lM, 11*lM]);

  const sM = st.snout;
  const hx = n3[0] - 7*hM, hy = n3[1] - 4*hM, sn = 16*hM*sM, hh = 8*hM;

  /* The skull is about ten pixels long, so only three things can read on it:
     the crest silhouette, the eye, and the jaw line. It had two. The muzzle is
     squared off in front, where the spatulate teeth sat, rather than rounded
     to a lump. */
  const lipY = hy + hh*.34;
  blob(M.head, [[hx+10*hM,hy-hh*.8],[hx-sn*.35,hy-hh*1.15],[hx-sn*.94,hy-hh*.52],
                [hx-sn*1.04,hy-hh*.06],[hx-sn*.98,lipY-hh*.06],
                [hx-sn*.30,lipY+hh*.06],[hx+10*hM,hy+hh*.72]]);

  /* Mandible. The sauropod jaw line is long and close to straight, running
     back to below the eye. */
  const jHinge = [hx + 6*hM, hy + hh*.30], jawA = -jaw*.30;
  M.jaw.save(); M.jaw.translate(jHinge[0], jHinge[1]); M.jaw.rotate(jawA);
  blob(M.jaw, [[2,-hh*.06],[-sn*.42,-hh*.12],[-sn*.94,hh*.02],
               [-sn*.88,hh*.34],[-sn*.30,hh*.46],[3,hh*.36]]);
  M.jaw.restore();
  if (jaw > .06){
    const uTip = [hx - sn*.96, lipY - hh*.08];
    const lTip = [jHinge[0] + (-sn*.90)*Math.cos(jawA) - (hh*.04)*Math.sin(jawA),
                  jHinge[1] + (-sn*.90)*Math.sin(jawA) + (hh*.04)*Math.cos(jawA)];
    M.mouth.beginPath();
    M.mouth.moveTo(jHinge[0], jHinge[1]);
    M.mouth.lineTo(uTip[0], uTip[1]);
    M.mouth.lineTo(lTip[0], lTip[1]);
    M.mouth.closePath(); M.mouth.fill();
  } else {
    tube(M.mouth, [[hx+4*hM, hy+hh*.30],[hx-sn*.44, lipY+hh*.02],[hx-sn*.92, lipY-hh*.08]],
         [Math.max(.9,1.3*hM), Math.max(.8,1.1*hM), Math.max(.6,.8*hM)]);
  }

  // tall nasal chamber sitting on the roof of a very small skull
  blob(M.crest, [[hx+2*hM,hy-hh*1.0],[hx-sn*.16,hy-hh*2.05],[hx-sn*.62,hy-hh*1.8],[hx-sn*.6,hy-hh*.85]]);
  /* Nares on the crest. As a filled block this read as a hole punched in a
     tuft of hair; a notch bitten out of the crest's front edge reads as a
     nostril. */
  oval(M.mouth, hx - sn*.54, hy - hh*1.62, Math.max(.7,.9*hM), Math.max(.6,.7*hM));

  // the ventral countershading is painted from the spine by paintBelly

  const nf = legStep(M.limb, shX+4, shY+2, (P.legPhase+.75)%1, 17*lM, BRA_FORE);
  legStep(M.limb, hipX+2, hipY, P.legPhase, 17*lM, BRA_HIND, M.horn);
  oval(M.horn, nf[0] - 5.4*lM, nf[1] - 2.6*lM, 1.9*lM, 2.2*lM);   // short brachiosaurid thumb claw

  eyeAt(M, hx - sn*.48, hy - hh*.3, 2.9*hM, P.eye);

  /* Centreline for the coat painter. It runs the whole animal, neck included,
     so banding comes down the neck and resolves into rings out the tail —
     which is the one place a sauropod coat has somewhere to go. */
  const spine = [
    [n3[0], n3[1] + 4,   9*lM],          // base of the skull
    [n2[0], n2[1],      10*lM],
    [n1[0], n1[1],      13*lM],
    [shX - 2, shY + 2,  19*lM],          // shoulder hump
    [8,       shY + 8,  22*lM],          // deepest, over the ribs
    [hipX,    hipY,     17*lM],          // hips
    [hipX + 22*tM, hipY + 1,  11*lM],    // tail
    [hipX + 44*tM, hipY + 3,   7*lM],
    [hipX + 66*tM, hipY + 6,   3.5*lM],
    [hipX + 86*tM, hipY + 10,  1.5*lM]
  ];

  return { eye:[hx - sn*.48, hy - hh*.3], eyeR:2.9*hM, mouth:[hx - sn*.9, hy + hh*.5],
           hat:[hx - sn*.3, hy - hh*2.05], top: hy - hh*2.05, spine };
}

/* ------------------------------ the egg choice -----------------------------
   Three places need the same row of eggs: the renderer draws it, the pointer
   handler hit-tests it, and the label strip under the stage names it. All
   three derive from SPECIES here, so adding a species is a registry edit and
   nothing else.

   Slots are centred on the canvas and spaced EGG_GAP apart, tightening once
   the row would otherwise run off the edges. The hit radius follows the gap so
   neighbouring eggs can never claim the same tap.
   -------------------------------------------------------------------------- */
const EGG_GAP = 66, EGG_MARGIN = 24, EGG_HIT = 20;
function eggChoices(){
  const ids = Object.keys(SPECIES), n = ids.length;
  const gap = n < 2 ? 0 : Math.min(EGG_GAP, (W - EGG_MARGIN*2) / (n - 1));
  const hit = n < 2 ? EGG_HIT : Math.min(EGG_HIT, gap/2);
  return ids.map((id, i) => ({ id, x: W/2 + (i - (n-1)/2) * gap, hit }));
}

/* ------------------------------ coat patterns ------------------------------
   A pattern used to be laid down as a field of shapes in fixed sprite-local
   coordinates: seventeen near-vertical tubes marching across the bake box
   regardless of where the animal was inside it. On a long-bodied animal that
   reads as a barcode painted over a dinosaur — it cut across the frill, the
   neck and the legs at the same angle and the same spacing, and the effect on
   the sauropod in particular was that the coat did not appear to be on the
   animal at all.

   The rule the surface detail already follows applies here too: ride the
   body. Each species draw function now returns `spine`, its centreline from
   nape to tail tip with the body's half-depth at each station, and every
   pattern is placed against that. Bands run perpendicular to the spine and
   tighten toward the tail, so they read as flank banding resolving into tail
   rings — which is both what the Sinosauropteryx melanosome work supports and
   what reads as an animal.

   Everything is a deterministic function of the loop index, so a coat does
   not crawl between animation frames.
   -------------------------------------------------------------------------- */
function sampleSpine(spine, t){
  let total = 0; const seg = [];
  for (let i=0;i<spine.length-1;i++){
    const d = Math.hypot(spine[i+1][0]-spine[i][0], spine[i+1][1]-spine[i][1]);
    seg.push(d); total += d;
  }
  let want = clamp(t,0,1) * total;
  for (let i=0;i<seg.length;i++){
    if (want <= seg[i] || i === seg.length-1){
      const u = seg[i] ? clamp(want/seg[i],0,1) : 0;
      const a = spine[i], b = spine[i+1];
      return { x:lerp(a[0],b[0],u), y:lerp(a[1],b[1],u), half:lerp(a[2],b[2],u),
               ang:Math.atan2(b[1]-a[1], b[0]-a[0]) };
    }
    want -= seg[i];
  }
  const last = spine[spine.length-1];
  return { x:last[0], y:last[1], half:last[2], ang:0 };
}
/* the unit normal to the spine. +normal points at the belly, because sprite
   local units put the ground at y = 0 and the animal above it. */
const spineNormal = q => [-Math.sin(q.ang), Math.cos(q.ang)];

/* ----------------------------- countershading -----------------------------
   Dark above, pale below is the one colour pattern with direct fossil support
   — melanosomes in Psittacosaurus and Sinosauropteryx — and it is also the
   cheapest way to stop a flat-coloured animal reading as a cut-out.

   It used to be a hand-placed ellipse under the ribcage on each species, which
   at sprite scale was invisible. It now rides the spine, like the coats, and
   `belly` is masked to body pixels in the compositor, so the band can be drawn
   far outside the outline and let the mask trim it.

   `hi` is where the pale starts, as a fraction of the body's half-depth at
   that station: three stops read as throat, mid-body and tail. The throat sits
   highest because that is where countershading reaches furthest up a living
   animal, and the tail lowest.
   -------------------------------------------------------------------------- */
const BELLY_DEFAULT = { hi:[.45, .58, .70], t0:.02, t1:.99, steps:26 };
function paintBelly(g, spine, cfg){
  if (!spine || spine.length < 2) return;
  cfg = Object.assign({}, BELLY_DEFAULT, cfg || {});
  const hi = cfg.hi, N = cfg.steps;
  const top = [], bot = [];
  for (let i=0;i<=N;i++){
    const u = i/N, t = lerp(cfg.t0, cfg.t1, u);
    const q = sampleSpine(spine, t), [nx,ny] = spineNormal(q);
    const k = u < .5 ? lerp(hi[0], hi[1], u*2) : lerp(hi[1], hi[2], u*2-1);
    top.push([q.x + nx*q.half*k, q.y + ny*q.half*k]);
    bot.push([q.x + nx*q.half*2.8, q.y + ny*q.half*2.8]);   // well past the outline
  }
  g.beginPath();
  g.moveTo(top[0][0], top[0][1]);
  for (let i=1;i<top.length;i++) g.lineTo(top[i][0], top[i][1]);
  for (let i=bot.length-1;i>=0;i--) g.lineTo(bot[i][0], bot[i][1]);
  g.closePath(); g.fill();
}

/* Total arc length of a spine, so pattern density can be specified as a real
   distance rather than as a count. A count gives the short-bodied Triceratops
   the same sixteen bands as the long-necked Brachiosaurus, which on the
   Triceratops closed up into a striped mattress. */
function spineLen(spine){
  let total = 0;
  for (let i=0;i<spine.length-1;i++)
    total += Math.hypot(spine[i+1][0]-spine[i][0], spine[i+1][1]-spine[i][1]);
  return total;
}
/* a deterministic 0..1 from an index, so a coat never crawls between frames */
const jit = (i, m) => ((i * 2654435761) % m) / m;

function paintPattern(g, kind, spine){
  if (!kind || kind === 'none' || !spine || spine.length < 2) return;
  const L = spineLen(spine);
  const count = (perUnit, min) => Math.max(min, Math.round(L * perUnit));

  if (kind === 'bands'){
    const N = count(1/14, 5);                    // one band every ~14 units
    for (let i=0;i<N;i++){
      const t = .10 + (i/Math.max(1,N-1)) * .87;
      const q = sampleSpine(spine, t), [nx,ny] = spineNormal(q);
      const reach = q.half * 1.4;
      const w = lerp(4.6, 1.9, t) * (.82 + jit(i+3, 13)*.4);
      // the belly side is cut short: banding fades into the countershading
      tube(g, [[q.x - nx*reach, q.y - ny*reach], [q.x, q.y],
               [q.x + nx*reach*.62, q.y + ny*reach*.62]], [w*.5, w, w*.44]);
    }
    return;
  }
  if (kind === 'spots'){
    const N = count(1/5.2, 10);
    for (let i=0;i<N;i++){
      const t = .06 + ((i*0.6180339887) % 1) * .90;
      const q = sampleSpine(spine, t), [nx,ny] = spineNormal(q);
      const v = (jit(i+7, 61) - .55) * 1.7;      // across the body, biased upward
      const r = lerp(4.4, 1.6, t) * (.68 + jit(i+11, 17)*.62) * (1 - Math.abs(v)*.3);
      oval(g, q.x + nx*q.half*v, q.y + ny*q.half*v, r, r*.82);
    }
    return;
  }
  if (kind === 'speckle'){
    const N = count(1/1.1, 40);
    for (let i=0;i<N;i++){
      const t = .04 + ((i*0.6180339887) % 1) * .94;
      const q = sampleSpine(spine, t), [nx,ny] = spineNormal(q);
      const v = (jit(i+5, 53) - .58) * 1.8;
      const r = 1.1 + jit(i+13, 7)*.8;
      oval(g, q.x + nx*q.half*v, q.y + ny*q.half*v, r, r*.9);
    }
    return;
  }
  if (kind === 'patches'){
    const N = count(1/17, 5);
    for (let i=0;i<N;i++){
      const t = .07 + ((i*0.6180339887) % 1) * .84;
      const q = sampleSpine(spine, t), [nx,ny] = spineNormal(q);
      const v = (jit(i+3, 43) - .74) * 1.5;      // sit high on the flank
      const r = lerp(12, 5, t) * (.75 + jit(i+9, 11)*.5);
      oval(g, q.x + nx*q.half*v, q.y + ny*q.half*v, r, r*(.58 + jit(i+2,5)*.34), q.ang);
    }
  }
}

/* ==========================================================================
   WORLD
   The habitat is built the same way as the animals: flat colour blocked into
   integer columns, dithered gradients instead of smooth ones, one light from
   the upper left, and depth carried by parallax rather than by blur.
   ========================================================================== */

const SKY_SPECS = {
  night: { top:'#0a1124', low:'#28374f', far:'#1c2942', mid:'#151f2d', tree:'#111d20',
           grass:'#2b4331', dirt:'#382f27', water:'#22405a', tint:'rgba(16,24,54,.44)' },
  dawn:  { top:'#2c3f70', low:'#e39a6c', far:'#5d5b7c', mid:'#44465d', tree:'#2e4038',
           grass:'#5b7949', dirt:'#7b6046', water:'#7d6f86', tint:'rgba(196,124,84,.13)' },
  day:   { top:'#4d9dc9', low:'#c3e2d8', far:'#8fa79d', mid:'#6c8b6f', tree:'#3e5a44',
           grass:'#78a051', dirt:'#a5825a', water:'#6fa6b8', tint:'rgba(0,0,0,0)' },
  dusk:  { top:'#2b2854', low:'#da834b', far:'#504563', mid:'#3a3347', tree:'#2b3934',
           grass:'#597047', dirt:'#6f553f', water:'#6b5570', tint:'rgba(96,62,116,.20)' }
};
function skyPhase(d){
  const h = d.getHours() + d.getMinutes()/60;
  if (h < 5 || h >= 21) return 'night';
  if (h < 7.5) return 'dawn';
  if (h < 18)  return 'day';
  return 'dusk';
}
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
const mixHex = (a,b,t) => {
  const A = [1,3,5].map(i=>parseInt(a.slice(i,i+2),16)), B = [1,3,5].map(i=>parseInt(b.slice(i,i+2),16));
  return '#' + A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('');
};
const STARS = Array.from({length:54}, () => ({x:rnd(2,W-2), y:rnd(3,92), p:rnd(0,6.3), b:rnd(.4,1)}));
const MOTES = Array.from({length:14}, () => ({x:rnd(0,W), y:rnd(40,GROUND-6), vx:rnd(2,7), vy:rnd(-3,3), p:rnd(0,6.3)}));

/* --------------------------- baked backdrop -------------------------------- */
const bgCache = new Map();
function ridge(g, cfg){
  // integer-column heightfield: no antialiasing, so the silhouette stays crisp
  for (let x=0;x<W;x++){
    let h = cfg.base;
    for (const w of cfg.waves) h += Math.sin(x*w[0] + w[1]) * w[2];
    h = Math.round(h);
    g.fillStyle = cfg.col; g.fillRect(x, h, 1, GROUND - h + 2);
    g.fillStyle = cfg.lit; g.fillRect(x, h, 1, 1);
    let hn = cfg.base;
    for (const w of cfg.waves) hn += Math.sin((x+1)*w[0] + w[1]) * w[2];
    if (Math.round(hn) > h) g.fillRect(x, h, 1, 2);          // catch light on left faces
  }
}
function conifer(g, x, base, h, body, litc){
  g.fillStyle = '#2f2822';
  g.fillRect(x, base - Math.round(h*.2), 2, Math.round(h*.2));
  for (let k=0;k<3;k++){                                    // three tiers, each wider than the last
    const topY = Math.round(base - h + k*h*.26);
    const botY = Math.round(base - h + k*h*.26 + h*.40);
    const maxW = Math.round(h*.26 + k*h*.11);
    const rows = Math.max(2, botY - topY);
    for (let r=0;r<rows;r++){
      const wd = Math.max(1, Math.round(maxW * (r+1)/rows));
      g.fillStyle = body; g.fillRect(x - (wd>>1), topY + r, wd, 1);
      g.fillStyle = litc; g.fillRect(x - (wd>>1), topY + r, Math.max(1, wd*.4|0), 1);
    }
  }
}

/* Araucaria: a straight bare trunk carrying a deep domed crown, the
   monkey-puzzle silhouette that says Mesozoic on sight. It is a completely
   different shape from a conifer, which is the point of having it — a skyline
   of one shape repeated is a hedge.

   The first attempt gave it a one-pixel trunk under a crown four pixels deep,
   which is a street lamp. The crown has to be a mass with depth to it, and
   the trunk has to be thick enough to hold it up. */
function araucaria(g, x, base, h, body, litc){
  /* Two thirds crown, one third trunk. At the first proportions — a long thin
     trunk under a shallow cap — twenty-five pixels of tree came out as a
     street lamp. */
  const crownH = Math.round(h*.72), trunkH = h - crownH + 3;
  g.fillStyle = mixHex(body, '#000000', .34);
  g.fillRect(x, base - trunkH, 3, trunkH);
  const maxW = Math.round(h*.62);
  for (let r=0;r<crownH;r++){
    const u = r/Math.max(1, crownH-1);                 // 0 at the top of the crown
    // deep dome: wide through the middle, tucked at the top, ragged underneath
    const wd = Math.max(3, Math.round(maxW * Math.sin(Math.pow(u, .78) * Math.PI * .5)));
    const jag = (r % 3 === 2) ? 1 : 0;                 // the whorls break the edge
    g.fillStyle = body;
    g.fillRect(x + 1 - (wd>>1) - jag, base - h + r, wd + jag*2, 1);
    if (u < .34){ g.fillStyle = litc; g.fillRect(x + 2 - (wd>>1), base - h + r, Math.max(1, wd-3), 1); }
  }
}
/* Tree fern: a fibrous trunk under a full rosette. Fills the storey between
   the treeline and the grass, which was open sky. */
function treeFern(g, x, base, h, body, litc){
  const trunk = Math.round(h*.52);
  g.fillStyle = mixHex(body, '#000000', .35);
  g.fillRect(x, base - trunk, 2, trunk);
  const crown = base - trunk;
  for (let a=0;a<7;a++){
    const ang = .18 + a*.46, len = h*(.62 - Math.abs(a-3)*.05);
    const dir = a < 3 ? -1 : a > 3 ? 1 : 0;
    for (let t=1;t<=7;t++){
      const u = t/7;
      const px2 = Math.round(x + dir*Math.cos(ang)*len*u);
      const py  = Math.round(crown - Math.sin(ang)*len*u + u*u*3);
      const lf  = Math.max(1, Math.round(lerp(2.4, 1, u)));
      g.fillStyle = (t & 1) ? body : mixHex(body, '#000000', .22);
      g.fillRect(px2, py - lf, 2, lf*2);
    }
  }
  g.fillStyle = litc; g.fillRect(x - 1, crown - 2, 4, 2);
}

/* --------------------------------- volcano ---------------------------------
   The old one was a cone of one flat colour with a two-pixel orange bar laid
   across the top and a translucent rectangle standing over it: a dark hill
   with a small red pool on it, which is exactly what it looked like.

   Four things make a volcano read, and it had none of them:

     1. A CONCAVE PROFILE. A straight-sided triangle is a slag heap. A
        stratovolcano is steep at the summit and flares out at the base, and
        that curve is most of the silhouette.
     2. A TRUNCATED SUMMIT WITH A CRATER. It does not come to a point; it
        stops at a rim with a notch bitten out of it, and the two sides of
        the notch are different heights.
     3. TWO FACES WITH A HARD EDGE. Light from the upper left, the same as
        everything else in this game, so the left flank is lit and the right
        is in shade with one crisp ridge between them. Flat fill made it a
        cardboard cutout.
     4. STRUCTURE ON THE FLANKS. Radiating gullies and a couple of old lava
        runnels running down from the rim, so the slope has a direction.

   The plume is not baked with the cone. Smoke that never moves is scenery
   painted on a wall; it is drawn per frame in drawPlume, along with the
   crater glow, which is brightest at night. */
const VOLC = { x:172, half:66, top:20, base:GROUND - 4 };

/* Where the flank stands at horizontal distance |dx| from the axis, as a
   height above the base.

   The profile has to be CONCAVE — steep at the summit, flaring at the foot.
   The first attempt used H0 * (1 - t^1.55), whose slope is zero on the axis
   and steepest at the base: that is a butte, flat on top with sheer sides,
   and it is what the cone looked like. Raising (1 - t) to a power above one
   gives the opposite and correct shape.

   The crater is cut into the profile rather than painted on afterwards, and
   it has to be cut deeper than the cone falls across its own width or there
   is no notch at all, only a slightly rounder summit. */
const CRATER_T = 0.20, CRATER_D = 6;
/* The inverse: how wide the cone is at a given screen row. A runnel drawn as
   a straight diagonal walks off the silhouette within a few pixels, because
   the flank near the summit is far steeper than any fixed step — the two of
   them came out as guy-ropes staked into the sky. Asking the profile where
   the edge is keeps them on the mountain. */
function volcSpan(y){
  const H0 = VOLC.base - VOLC.top, h = VOLC.base - y;
  if (h <= 0) return VOLC.half;
  if (h >= H0) return 0;
  return (1 - Math.pow(h / H0, 1/1.85)) * VOLC.half;
}
function volcHeight(t){
  const H0 = VOLC.base - VOLC.top;
  if (t >= CRATER_T) return H0 * Math.pow(1 - t, 1.85);
  const lip = H0 * Math.pow(1 - CRATER_T, 1.85);
  const u = t / CRATER_T;                       // 1 at the lip, 0 on the axis
  return lip - (1 - u*u) * CRATER_D;
}
function drawVolcano(g, S_){
  const { x:px, half, base } = VOLC;
  const rock     = mixHex(S_.far, '#000000', .36);
  const rockLit  = mixHex(S_.far, S_.low,    .26);
  const rockShd  = mixHex(S_.far, '#000000', .60);
  const ridgeCol = mixHex(S_.far, '#000000', .72);
  const ashLit   = mixHex(S_.far, S_.low,    .44);

  for (let i=-half;i<=half;i++){
    const t = Math.abs(i)/half;
    const y = Math.round(base - volcHeight(t));
    const lit = i < -2;                                   // light from the upper left
    g.fillStyle = lit ? rock : rockShd;
    g.fillRect(px+i, y, 1, base - y + 2);
    g.fillStyle = lit ? rockLit : ridgeCol;               // the crisp top edge
    g.fillRect(px+i, y, 1, 1);
    /* Gullies: radiating streaks that get further apart down the slope, so
       the flank has a direction instead of being a flat field. */
    if (Math.sin(i*1.7) > .78){
      g.fillStyle = lit ? mixHex(S_.far, S_.low, .34) : mixHex(S_.far, '#000000', .52);
      g.fillRect(px+i, y+3, 1, Math.round((base - y) * .42));
    }
  }

  /* The crater floor, three rows deep inside the notch the profile already
     cuts. The left lip is left a pixel lower than the right: a crater that is
     symmetrical is a funnel. */
  const rimY = Math.round(base - volcHeight(0));
  const cw = Math.round(half*CRATER_T);
  for (let i=-cw+1;i<cw;i++){
    const y = Math.round(base - volcHeight(Math.abs(i)/half));
    g.fillStyle = mixHex(S_.far, '#000000', .66);
    g.fillRect(px+i, y, 1, 3);
  }
  /* No hand-drawn lips. Two bars laid across the summit read as girders on a
     mesa; the notch in the profile is the crater, and one pixel of catch
     light on the windward lip is all it needs. */
  g.fillStyle = rockLit;  g.fillRect(px-cw-2, Math.round(base - volcHeight(CRATER_T)) - 1, 2, 1);

  /* Two old lava runnels down the lit flank, cold and dark. The live glow in
     them belongs to drawPlume, because at night it pulses. */
  /* Two old lava channels down the flanks. They hold a fixed fraction of the
     way out from the axis and drift by a fraction of a pixel a row: given a
     wobble of any size they swing across a cone that widens this fast and
     come out as lightning bolts painted on the mountain. */
  const runnel = mixHex(S_.far, '#000000', .58);
  const lipY = Math.round(base - volcHeight(CRATER_T));
  for (const dir of [-1, 1]){
    const seat = dir < 0 ? 0.40 : 0.52;
    for (let k=0;k<38;k++){
      const y = lipY + 2 + k;
      if (y > base - 2) break;
      const rx = px + dir * volcSpan(y) * (seat + 0.05*Math.sin(k*.22));
      g.fillStyle = runnel;
      g.fillRect(Math.round(rx), y, 1, 1);
    }
  }
  // an apron of old ash at the foot, spreading wider than the cone
  g.fillStyle = mixHex(S_.far, '#000000', .18);
  for (let i=-half-9;i<=half+9;i++){
    const t = Math.abs(i)/(half+9);
    const h = Math.round((1 - t*t) * 4);
    if (h > 0) g.fillRect(px+i, base - h + 2, 1, h);
  }
}

function boulder(g, x, base, w, h, col, lit, shd){
  for (let i=0;i<h;i++){
    const t = i/h, wd = Math.round(w * (0.55 + 0.45*Math.sin((1-t)*Math.PI*0.5)));
    g.fillStyle = col; g.fillRect(x - (wd>>1), base - h + i, wd, 1);
    g.fillStyle = shd; g.fillRect(x + (wd>>1) - 2, base - h + i, 2, 1);
    if (i < 2){ g.fillStyle = lit; g.fillRect(x - (wd>>1) + 1, base - h + i, Math.max(1,wd-3), 1); }
  }
}
function fallenLog(g, x, base, len, col, lit, shd){
  g.fillStyle = col; g.fillRect(x, base - 5, len, 5);
  g.fillStyle = lit; g.fillRect(x, base - 5, len, 1);
  g.fillStyle = shd; g.fillRect(x, base - 1, len, 1);
  g.fillStyle = shd; g.fillRect(x + len - 3, base - 5, 3, 5);
  g.fillStyle = lit; g.fillRect(x + len - 2, base - 4, 1, 3);
  for (let i=6;i<len-6;i+=7){ g.fillStyle = shd; g.fillRect(x+i, base-4, 1, 3); }
}
function cycadPlant(g, x, base, h, col, lit, shd){
  g.fillStyle = shd; g.fillRect(x-2, base - h*.35, 5, h*.35);
  g.fillStyle = col; g.fillRect(x-1, base - h*.35, 3, h*.35);
  for (let a=0;a<5;a++){
    const ang = 0.35 + a*0.52, len = h * (0.72 - Math.abs(a-2)*0.08);
    const dir = a < 2 ? -1 : a > 2 ? 1 : 0;
    const dx = dir === 0 ? 0 : dir;
    for (let t=1;t<=7;t++){
      const u = t/7;
      const px = Math.round(x + dx * Math.cos(ang) * len * u * (dir?1:0));
      const py = Math.round(base - h*.35 - Math.sin(ang) * len * u + u*u*3);
      const lf = Math.max(1, Math.round(lerp(3.2, 1, u)));
      g.fillStyle = (t & 1) ? col : shd; g.fillRect(px - 1, py - lf, 2, lf*2);
      if (t < 3){ g.fillStyle = lit; g.fillRect(px - 1, py - lf, 2, 1); }
    }
  }
}
function reeds(g, x, base, n, col, lit){
  for (let i=0;i<n;i++){
    const rx = x + i*3, h = 6 + ((i*7)%5);
    g.fillStyle = col; g.fillRect(rx, base - h, 1, h);
    g.fillStyle = lit; g.fillRect(rx, base - h, 1, 2);
    g.fillStyle = col; g.fillRect(rx + (i&1?1:-1), base - h + 2, 1, 2);
  }
}
function bakeBg(phase){
  if (bgCache.has(phase)) return bgCache.get(phase);
  const S_ = SKY_SPECS[phase], c = makeCv(W,H), g = readCtx(c);
  const horizon = 108;

  // dithered sky: five steps with a 4x4 ordered dither across each boundary
  for (let y=0;y<horizon;y++){
    const f = (y/horizon) * 4, i = Math.floor(f), fr = f - i;
    const a = mixHex(S_.top, S_.low, clamp(i/4,0,1)), b = mixHex(S_.top, S_.low, clamp((i+1)/4,0,1));
    for (let x=0;x<W;x++){ g.fillStyle = (BAYER[y&3][x&3]/16 < fr) ? b : a; g.fillRect(x,y,1,1); }
  }
  g.fillStyle = S_.low; g.fillRect(0, horizon, W, GROUND - horizon + 2);

  /* Four depth planes now, each flatter and lighter than the one in front.
     The furthest is nearly the colour of the sky it stands against: without a
     plane that close to the haze, the range began abruptly at a hard edge and
     the distance behind it read as painted card. */
  ridge(g, { base:66, col: mixHex(S_.far, S_.low, .86), lit: mixHex(S_.far, S_.low, .92),
             waves:[[.013,1.9,15],[.037,.8,7],[.006,3.1,9]] });
  ridge(g, { base:74, col: mixHex(S_.far, S_.low, .68), lit: mixHex(S_.far, S_.low, .78),
             waves:[[.019,.3,13],[.044,2.6,6]] });
  ridge(g, { base:84, col: mixHex(S_.far, S_.low, .42), lit: mixHex(S_.far, S_.low, .62),
             waves:[[.031,1.1,11],[.071,.4,5],[.013,2.2,7]] });
  /* A river out on the valley floor, between the far range and the near one.
     One flat band of sky colour lying down is the cheapest depth cue there
     is: everything above it is read as far away because the water proves
     there is ground between here and there. */
  const riv = mixHex(S_.water, S_.low, .62);
  for (let x=0;x<W;x++){
    const top = 92 + Math.round(Math.sin(x*.021 + 1.4)*2.5 + Math.sin(x*.055)*1.2);
    const dep = 3 + Math.round(Math.sin(x*.03 + 2.2)*1.4);
    g.fillStyle = riv; g.fillRect(x, top, 1, dep);
    g.fillStyle = mixHex(S_.water, '#ffffff', .30); g.fillRect(x, top, 1, 1);
  }
  drawVolcano(g, S_);
  ridge(g, { base:100, col: mixHex(S_.mid, S_.low, .2), lit: mixHex(S_.mid, S_.low, .45),
             waves:[[.048,3.4,8],[.11,1.7,3]] });

  /* Treeline on the middle plane. Eight identical conifers in two clumps was
     a hedge; a Late Cretaceous skyline has araucaria with domed crowns on
     bare trunks and tree ferns under them, and three silhouettes instead of
     one is most of what turns a hedge into a wood. */
  const treeBody = mixHex(S_.tree, S_.low, .18), treeLit = mixHex(S_.tree, S_.low, .38);
  const farBody  = mixHex(S_.tree, S_.low, .32), farLit  = mixHex(S_.tree, S_.low, .46);
  [[52,15],[62,11],[150,13],[162,17],[172,12],[100,10]]
    .forEach(t => conifer(g, t[0], GROUND-4, t[1], farBody, farLit));   // back rank, hazed
  [[14,26],[26,19],[38,23],[196,24],[208,17],[184,20],[120,15],[132,21]]
    .forEach(t => conifer(g, t[0], GROUND-2, t[1], treeBody, treeLit));
  [[8,26],[46,21],[142,23],[216,19]]
    .forEach(t => araucaria(g, t[0], GROUND-2, t[1], treeBody, treeLit));
  [[33,12],[128,10],[203,11],[70,9]]
    .forEach(t => treeFern(g, t[0], GROUND-1, t[1], treeBody, treeLit));

  // ground: lit grass edge, then dithered dirt
  const grassLit = mixHex(S_.grass, S_.low, .40), grassDark = mixHex(S_.grass, '#000000', .32);
  for (let x=0;x<W;x++){                                    // tufted, not a ruled line
    const t = (Math.sin(x*.7) > .3 ? 1 : 0) + (Math.sin(x*.31 + 2) > .55 ? 1 : 0) + (Math.sin(x*1.3+1) > .8 ? 1 : 0);
    g.fillStyle = S_.grass; g.fillRect(x, GROUND-1-t, 1, 5+t);
    g.fillStyle = grassLit; g.fillRect(x, GROUND-1-t, 1, 1);
  }
  g.fillStyle = grassDark; g.fillRect(0, GROUND+3, W, 1);
  const d0 = S_.dirt, d1 = mixHex(S_.dirt,'#000000',.22), d2 = mixHex(S_.dirt,S_.low,.22);
  for (let y=GROUND+4;y<H;y++) for (let x=0;x<W;x++){
    const t = (y-GROUND-4)/(H-GROUND-4);
    g.fillStyle = (BAYER[y&3][x&3]/16 < t*.75) ? d1 : d0; g.fillRect(x,y,1,1);
  }
  for (let i=0;i<26;i++){                                   // pebbles
    const x = (rnd(2,W-4))|0, y = (GROUND+6+rnd(0,H-GROUND-9))|0;
    g.fillStyle = d1; g.fillRect(x,y,2,2); g.fillStyle = d2; g.fillRect(x,y,1,1);
  }
  for (let i=0;i<16;i++){                                   // grass tufts
    const x = (rnd(4,W-4))|0, y = (GROUND+5+rnd(0,H-GROUND-10))|0;
    g.fillStyle = mixHex(S_.grass,'#000000',.15); g.fillRect(x,y,1,3);
    g.fillRect(x-1,y+1,1,2); g.fillRect(x+1,y+1,1,2);
  }
  // scenery on the ground line, behind where the animal walks
  const rockCol = mixHex(S_.mid,'#000000',.12), rockLit = mixHex(S_.mid, S_.low,.42), rockShd = mixHex(S_.mid,'#000000',.38);
  boulder(g, 68, GROUND+2, 17, 10, rockCol, rockLit, rockShd);
  boulder(g, 78, GROUND+2, 9, 6, rockCol, rockLit, rockShd);
  boulder(g, 133, GROUND+1, 12, 7, rockCol, rockLit, rockShd);
  const logCol = mixHex(S_.dirt,'#000000',.18), logLit = mixHex(S_.dirt, S_.low,.34), logShd = mixHex(S_.dirt,'#000000',.44);
  fallenLog(g, 92, GROUND+2, 34, logCol, logLit, logShd);
  const plCol = mixHex(S_.tree, S_.low, .22), plLit = mixHex(S_.tree, S_.low, .5), plShd = mixHex(S_.tree,'#000000',.35);
  cycadPlant(g, 32, GROUND+2, 22, plCol, plLit, plShd);
  cycadPlant(g, 116, GROUND+1, 15, plCol, plLit, plShd);
  cycadPlant(g, 190, GROUND+3, 19, plCol, plLit, plShd);
  // watering hole, cut into the dirt on the right
  const px0 = 142, px1 = 212;
  for (let x=px0;x<px1;x++){
    const t = (x-px0)/(px1-px0), dep = Math.round(Math.sin(t*Math.PI)*11);
    if (dep <= 1) continue;
    g.fillStyle = mixHex(S_.dirt,'#000000',.45); g.fillRect(x, GROUND+6, 1, 2);
    g.fillStyle = mixHex(S_.water,'#000000',.25); g.fillRect(x, GROUND+8, 1, dep);
    g.fillStyle = S_.water; g.fillRect(x, GROUND+8, 1, Math.max(1, dep-3));
    g.fillStyle = mixHex(S_.water,S_.low,.45); g.fillRect(x, GROUND+8, 1, 1);
  }
  reeds(g, 138, GROUND+8, 5, plShd, plLit);
  reeds(g, 205, GROUND+8, 4, plShd, plLit);
  bgCache.set(phase,c);
  return c;
}

/* --------------------------- moving backdrop ------------------------------- */
const CLOUDS = [
  { x:30,  y:16, v:1.9, w:26, h:5, near:1 }, { x:140, y:10, v:2.6, w:34, h:6, near:1 },
  { x:88,  y:32, v:1.1, w:20, h:4, near:0 }, { x:196, y:26, v:1.4, w:24, h:4, near:0 }
];
let flyer = null, flyerAt = 4000;
function drawSkyBody(g, phase, now){
  // the sun and moon ride an arc keyed to the player's actual clock
  const d = new Date(), h = d.getHours() + d.getMinutes()/60;
  const night = phase === 'night';
  const t = clamp(night ? ((h + 3) % 24) / 12 : (h - 6) / 13, 0, 1);
  const cx = 18 + t*(W-36), cy = 62 - Math.sin(clamp(t,0,1)*Math.PI) * 44;
  if (night){
    g.fillStyle = '#e8e6d2'; g.beginPath(); g.arc(cx, cy, 7, 0, 7); g.fill();
    g.fillStyle = SKY_SPECS[phase].top; g.beginPath(); g.arc(cx-3.5, cy-2.5, 6, 0, 7); g.fill();
  } else {
    g.fillStyle = phase === 'day' ? 'rgba(250,238,170,.35)' : 'rgba(250,200,140,.3)';
    g.beginPath(); g.arc(cx, cy, 12, 0, 7); g.fill();
    g.fillStyle = phase === 'day' ? '#f7ecac' : '#f6c887';
    g.beginPath(); g.arc(cx, cy, 7, 0, 7); g.fill();
  }
}
function drawClouds(g, phase, dt){
  const lit = phase === 'night' ? 'rgba(196,206,232,.30)' : 'rgba(248,246,234,.92)';
  const shd = phase === 'night' ? 'rgba(150,162,192,.26)' : 'rgba(214,214,204,.85)';
  for (const c of CLOUDS){
    c.x += c.v * dt/1000 * 4; if (c.x > W + c.w) c.x = -c.w;
    const x = Math.round(c.x), y = c.y, w = c.near ? c.w : c.w*.7, hh = c.near ? c.h : c.h-1;
    g.fillStyle = lit;
    g.fillRect(x - w/2, y, w, hh);
    g.fillRect(x - w/4, y - 3, w/2, 3);
    g.fillRect(x + w/6, y - 5, w/4, 2);
    g.fillStyle = shd; g.fillRect(x - w/2, y + hh - 1, w, 1);
  }
}
function drawFlyers(g, dt, now){
  if (!flyer && now > flyerAt){ flyer = { x:-14, y: rnd(18,54), v: rnd(26,40), p:0 }; }
  if (!flyer) return;
  flyer.x += flyer.v * dt/1000; flyer.p += dt;
  if (flyer.x > W + 14){ flyer = null; flyerAt = now + rnd(25,60)*1000; return; }
  const up = Math.sin(flyer.p/130) > 0;
  g.fillStyle = 'rgba(40,48,54,.7)';
  const x = Math.round(flyer.x), y = Math.round(flyer.y);
  g.fillRect(x-1, y, 3, 1);
  if (up){ g.fillRect(x-5, y-2, 4, 1); g.fillRect(x+2, y-2, 4, 1); }
  else   { g.fillRect(x-5, y+2, 4, 1); g.fillRect(x+2, y+2, 4, 1); }
}
/* The plume, and the light in the crater.

   Neither is baked with the cone. A backdrop is cached per sky phase and
   redrawn perhaps four times a day, so anything baked into it is a painting
   on a wall — the old smoke was a translucent rectangle that had never moved
   in the history of the game. Smoke is the one thing on a volcano that is
   always moving, and it is most of what says the mountain is alive.

   Eight puffs share one rising cycle, each a third of a turn behind the last.
   A puff widens and fades as it climbs and leans downwind with height, which
   is wind shear and is why a real plume bends. */
const PLUME_N = 14, PLUME_MS = 5600;
function drawPlume(g, phase, now){
  /* The vent, not the apex. VOLC.top is where a pointed cone of this profile
     would come to a point, and the summit is truncated well below it — using
     it here drew the smoke, the lava and the runnel glow in clear sky above
     the mountain, with the glow reading as two arcs bridging the summit. */
  const px = VOLC.x, rimY = Math.round(VOLC.base - volcHeight(0));
  const night = phase === 'night';

  /* The crater. At night it is the only warm light in the scene, so it
     carries a slow pulse; by day it is mostly washed out and reads as heat
     rather than as fire. */
  const pulse = .72 + .28*Math.sin(now/1450) + .08*Math.sin(now/430);
  const glow = night ? .95 : phase === 'day' ? .34 : .62;
  const cw = Math.round(VOLC.half*CRATER_T);
  /* The haze over the vent stays inside the notch. Spread wide enough to
     stand against the sky it read as a pale arch bridging the summit. */
  g.fillStyle = 'rgba(226,104,44,' + (0.16*glow*pulse).toFixed(3) + ')';
  g.beginPath(); g.ellipse(px, rimY + 4, cw + 1, 5, 0, 0, 7); g.fill();
  /* The lava lies on the crater floor, which means asking the profile where
     the floor is rather than inventing a second curve for it — the first
     version bowed the pool the wrong way and put the deepest lava against
     the lips, which drew an orange arch over the notch. */
  for (let i=-cw+2;i<=cw-2;i++){
    const t = Math.abs(i)/cw;
    const y = Math.round(VOLC.base - volcHeight(Math.abs(i)/VOLC.half));
    g.fillStyle = 'rgba(206,66,28,' + (0.92*glow).toFixed(3) + ')';
    g.fillRect(px+i, y, 1, 2);
    if (t < .66){
      g.fillStyle = 'rgba(240,150,54,' + (0.92*glow*pulse).toFixed(3) + ')';
      g.fillRect(px+i, y, 1, 1);
    }
    if (t < .30){
      g.fillStyle = 'rgba(252,226,150,' + (0.88*glow*pulse).toFixed(3) + ')';
      g.fillRect(px+i, y, 1, 1);
    }
  }

  // the runnels, lit from inside the mountain
  /* The upper reach of each channel, lit from inside the mountain. Barely
     there by day; at night it is the only other warm thing in the frame. */
  g.fillStyle = 'rgba(200,74,30,' + ((night ? .70 : .30)*glow*pulse).toFixed(3) + ')';
  const lipY = Math.round(VOLC.base - volcHeight(CRATER_T));
  for (const dir of [-1, 1]){
    const seat = dir < 0 ? 0.40 : 0.52;
    for (let k=0;k<12;k++){
      const y = lipY + 2 + k;
      const rx = px + dir * volcSpan(y) * (seat + 0.05*Math.sin(k*.22));
      g.fillRect(Math.round(rx), y, 1, 1);
    }
  }

  // the column
  for (let i=0;i<PLUME_N;i++){
    const u = ((now/PLUME_MS + i/PLUME_N) % 1);
    const y = rimY + 1 - u * (rimY + 3);                  // vent to the top of the sky
    const r = 3 + u*u*13;
    const drift = u*u*22 + Math.sin(now/2200 + i)*2.5;    // leaning downwind as it climbs
    /* Fourteen thin puffs rather than eight fat ones. At eight the alpha had
       to be high enough that each ellipse showed its own rim, and a column of
       visible rims is a string of bubbles, not smoke. */
    const a = (1 - u) * (night ? .20 : .30);
    if (a <= .02) continue;
    // by night smoke is a dark body against the sky, lit warm only at the vent
    const col = night ? (u < .22 ? 'rgba(150,104,78,' : 'rgba(28,34,56,')
                      : 'rgba(206,200,196,';
    g.fillStyle = col + a.toFixed(3) + ')';
    g.beginPath(); g.ellipse(px + drift, y, r, r*.78, 0, 0, 7); g.fill();
    if (u < .35 && !night){                                // hot, dark core at the vent
      g.fillStyle = 'rgba(96,80,72,' + (a*.8).toFixed(3) + ')';
      g.beginPath(); g.ellipse(px + drift*.6, y + 1, r*.55, r*.45, 0, 0, 7); g.fill();
    }
  }

  // embers, only when they would be visible
  if (night || phase === 'dusk'){
    for (let i=0;i<5;i++){
      const u = ((now/2600 + i*.2) % 1);
      const y = rimY + 1 - u*26;
      const x = px + Math.sin(now/700 + i*2.1) * (2 + u*7) + u*u*6;
      g.fillStyle = 'rgba(246,164,72,' + ((1-u)*.85).toFixed(3) + ')';
      g.fillRect(x|0, y|0, 1, 1);
    }
  }
}

/* A live rank of grass along the ground line, leaning on a slow breeze. The
   baked backdrop cannot move, so the boundary the animal stands on was the
   one hard line in the scene that never did anything. */
const BLADES = Array.from({length:34}, (_, i) => ({
  x: 3 + i*6.6 + (i%3)*1.7, h: 4 + (i%4)*2, p: (i*1.7) % 6.3
}));
function drawGrassLine(g, phase, now){
  const S_ = SKY_SPECS[phase];
  const col = mixHex(S_.grass, '#000000', .20), lit = mixHex(S_.grass, S_.low, .34);
  for (const b of BLADES){
    const lean = Math.sin(now/1600 + b.p) * 1.6 + Math.sin(now/430 + b.p*2) * .4;
    const x = b.x | 0;
    for (let k=0;k<b.h;k++){
      const t = k/b.h;
      g.fillStyle = k === b.h-1 ? lit : col;
      g.fillRect(Math.round(x + lean*t*t), GROUND - 1 - k, 1, 1);
    }
  }
}

function drawMotes(g, dt, phase){
  g.fillStyle = phase === 'night' ? 'rgba(190,205,235,.30)' : 'rgba(255,248,208,.45)';
  for (const m of MOTES){
    m.x += m.vx * dt/1000; m.y += Math.sin(m.p + performance.now()/1400) * .08;
    if (m.x > W+2) m.x = -2;
    g.fillRect(m.x|0, m.y|0, 1, 1);
  }
}
function drawWater(g, phase, now){
  const S_ = SKY_SPECS[phase];
  g.fillStyle = mixHex(S_.water, S_.low, .55);
  for (let i=0;i<4;i++){
    const y = GROUND + 10 + i*2;
    const span = Math.sin(((y - GROUND - 8)/11)) ;
    const half = Math.round(Math.sqrt(Math.max(0, 1 - Math.pow((y-GROUND-8)/12, 2))) * 30);
    if (half < 4) continue;
    const w = Math.round(6 + Math.abs(Math.sin(now/760 + i*1.7)) * (half - 4));
    const cx = 177 + Math.round(Math.sin(now/1100 + i*2.2) * (half - w) * .5);
    g.fillRect(cx - (w>>1), y, w, 1);
  }
}

/* ---------------------- foreground, drawn over the animal ------------------ */
const FRONDS = [ {x:-3, s:1.15, p:0, dir:1}, {x:W+3, s:1.0, p:2.4, dir:-1} ];
function drawFronds(g, phase, now){
  const S_ = SKY_SPECS[phase];
  const dark = mixHex(S_.tree,'#000000',.40), body = S_.tree, lit = mixHex(S_.tree,S_.low,.32);
  for (const f of FRONDS){
    for (let a=0;a<4;a++){
      const ang = 0.44 + a*0.36 + Math.sin(now/1300 + f.p + a*.7) * 0.05;
      const len = (44 - a*5) * f.s;
      const bx = f.x, by = H + 3;
      for (let t=1;t<=13;t++){
        const u = t/13;
        const x = Math.round(bx + f.dir * Math.cos(ang) * len * u);
        const y = Math.round(by - Math.sin(ang) * len * u + u*u*5);
        const lf = Math.max(1, Math.round(lerp(7, 1.5, u) * f.s));
        g.fillStyle = (t & 1) ? body : dark;
        g.fillRect(x - 1, y - lf, 2, lf*2);                  // leaflets across the spine
        g.fillStyle = dark; g.fillRect(x - 1, y - 1, 2, 2);  // spine
        if (t < 5){ g.fillStyle = lit; g.fillRect(x - 1, y - lf, 2, 2); }
      }
    }
  }
}

/* ------------------------------ particles --------------------------------- */
let parts = [];
function emit(type, x, y, n, opt){
  opt = opt || {};
  for (let i=0;i<n;i++) parts.push({
    type, x: x + rnd(-4,4), y: y + rnd(-3,3),
    vx: opt.vx !== undefined ? rnd(-opt.vx,opt.vx) : rnd(-9,9),
    vy: opt.vy !== undefined ? opt.vy + rnd(-6,6) : rnd(-26,-10),
    g: opt.g || 0, life: opt.life || rnd(700,1200), age: 0, col: opt.col
  });
}
function stepParts(dt){
  for (const p of parts){ p.age += dt; p.vy += p.g*dt/1000; p.x += p.vx*dt/1000; p.y += p.vy*dt/1000; }
  parts = parts.filter(p => p.age < p.life);
}
/* Seven across rather than five, with a rim and a highlight. The old one was
   a 5x5 blob that vanished against the animal. */
function heartPx(g,x,y){
  g.fillStyle = '#8f2f46';
  g.fillRect(x+1,y-1,2,1); g.fillRect(x+4,y-1,2,1);
  g.fillRect(x,y,7,3); g.fillRect(x+1,y+3,5,1); g.fillRect(x+2,y+4,3,1); g.fillRect(x+3,y+5,1,1);
  g.fillStyle = '#e2697c';
  g.fillRect(x+1,y,5,2); g.fillRect(x+2,y+2,3,1); g.fillRect(x+3,y+3,1,1);
  g.fillStyle = '#f6b3c0';
  g.fillRect(x+1,y,2,1); g.fillRect(x+1,y+1,1,1);
}
function drawParts(g){
  for (const p of parts){
    const x = Math.round(p.x), y = Math.round(p.y), fade = p.age/p.life;
    if (p.type==='heart'){ heartPx(g,x,y); }
    else if (p.type==='spark'){ g.fillStyle = p.col||'#fff6d8'; g.fillRect(x,y,2,2); g.fillStyle='#ffffff'; g.fillRect(x,y,1,1); }
    else if (p.type==='crumb'){ g.fillStyle = p.col||'#9b7a52'; g.fillRect(x,y,1,1); }
    else if (p.type==='bubbleZ'){                       // an actual Z, not two squares
      g.fillStyle = fade < .6 ? '#dfe4f6' : '#9aa6c4';
      g.fillRect(x,y,5,1); g.fillRect(x+3,y+1,1,1); g.fillRect(x+2,y+2,1,1);
      g.fillRect(x+1,y+3,1,1); g.fillRect(x,y+4,5,1);
    }
    else if (p.type==='stink'){ g.fillStyle = fade<.5?'#7d9c5a':'#5d7a44'; g.fillRect(x,y,2,2); }
    else if (p.type==='note'){ g.fillStyle='#e8dcbf'; g.fillRect(x,y,2,4); g.fillRect(x+2,y-1,2,2); }
  }
}

/* --------------------------- props: food & mess ---------------------------- */
/* `flat` paints every part of the item in one colour. Stamped four times a
   pixel out in each direction under the real thing, that gives a food item
   the same hard outline every animal in this game has — which is what a green
   fern frond needs before it can be picked out against a green grass line.
   A bounding rectangle will not do it: it comes out as a black plaque. */
function drawItem(g, id, x, y, s, flat){
  s = s || 1; g.save(); g.translate(x,y); g.scale(s,s);
  const px = (c,a,b,w,h)=>{ g.fillStyle=flat||c; g.fillRect(a,b,w||1,h||1); };
  if (id==='berry'){ px('#4e7a4a',2,-2,1,2); px('#8f2b36',0,0,5,4); px('#b83b45',0,0,4,3); px('#e08a92',1,1,1,1); }
  if (id==='fish'){ px('#5b7c90',0,0,6,3); px('#7fa3b8',0,0,6,2); px('#c9dde6',1,1,2,1); px('#5b7c90',6,0,2,3); px('#1a140e',1,0,1,1); }
  if (id==='fern'){ px('#3f6440',2,0,1,5); for(let i=0;i<3;i++){ px('#6f9c55',1,1+i,1,1); px('#8fb763',3,1+i,1,1);} px('#8fb763',0,2,1,1); px('#6f9c55',4,2,1,1); }
  if (id==='cycad'){ px('#5a4a2a',2,3,2,2); px('#8a6b2c',1,0,4,4); px('#a8863c',1,0,3,3); px('#d0ae5c',2,1,1,1); }
  if (id==='meat'){ px('#82382a',0,0,5,4); px('#a04a34',0,0,5,3); px('#c46a4c',1,1,2,1); px('#efe9d8',5,2,2,2); }
  if (id==='cake'){ px('#b8823f',0,1,6,4); px('#d1a05e',0,1,6,3); px('#f0dcae',0,0,6,1); px('#b83b45',2,-1,2,2); }
  if (id==='rock'){ px('#6e6a5e',0,0,6,4); px('#8b8578',0,0,5,3); px('#a8a294',3,0,2,1); }
  g.restore();
}
function drawMess(g, x, y){
  g.fillStyle='#513218'; g.fillRect(x-3,y-2,7,3);
  g.fillStyle='#6b4322'; g.fillRect(x-3,y-2,6,2); g.fillRect(x-2,y-4,5,2); g.fillRect(x-1,y-6,3,2);
  g.fillStyle='#8a5c33'; g.fillRect(x-1,y-5,2,1); g.fillRect(x-2,y-2,2,1);
}

];
const TRAITS = {
  appetite:[ {id:'greedy', name:'Bottomless', note:'Gets hungry fast and never says no.', hunger:1.35, foodJoy:1.0},
             {id:'picky',  name:'Particular', note:'Eats slowly, and only really enjoys its favourites.', hunger:.78, foodJoy:.7} ],
  tempo:   [ {id:'spirited',name:'Spirited',  note:'Never stops moving. Burns energy quickly.', energy:1.3, speed:1.35, joy:1.15},
             {id:'placid',  name:'Placid',    note:'Content to stand and watch the clouds.',    energy:.75, speed:.7,  joy:.85} ],
  social:  [ {id:'bold',   name:'Bold',       note:'Comes straight over when you reach in.',    bond:1.25, lonely:.8},
             {id:'shy',    name:'Cautious',   note:'Takes longer to trust, then never lets go.',bond:.75, lonely:1.3} ]
};
const NAMES = ['Pebble','Norbert','Tiny','Bonk','Fern','Cleo','Spike','Dot','Pip','Tank','Mochi','Juniper','Rust','Marrow','Basil','Willow','Grub','Tuck'];
const GROWTH_GATES = [20, 90, 240];      // minutes of well-cared-for time

/* sleep window, in local hours */
const BED_HOUR = 21, WAKE_HOUR = 6;
const ENERGY_AWAKE = 8.5, ENERGY_ASLEEP = 20;   // points per hour
/* How long an animal woken by hand stays up before the night rule may put it
   back under. Without it, waking a tired animal at night was undone by the
   very next tick half a second later, which is what made sleep feel like a
   state the player had no handle on at all: a starving, filthy animal could
   not be fed or washed, and nothing you pressed changed that. */
const WAKE_GRACE = 20 * MIN;

let G = null, S = null;

function freshPet(){
  return {
    sp:null, name:'', born:0, growth:0, hat:null, face:null, owned:[], skin:'wild', skinsOwned:['wild'],
    needs:{ hunger:78, energy:88, hygiene:100, joy:70 },
    health:100, bond:6, vet:false,
    traits:{ appetite:0, tempo:0, social:0 },
    asleep:false, ills:[], treats:[], mess:[], log:[],
    nightAwake:0, petBank:0, stageSeen:0, messTimer:0, wokeAt:0
  };
}
function freshGame(){
  return { v:SAVE_VERSION, pets:[freshPet()], active:0, coins:24, sound:true, dev:true, lastDay:'', streak:0,
           lastTick:Date.now(), lastSeen:Date.now() };
}

/* --------------------------- loading a save --------------------------------
   Adding a field needs no migration: Object.assign over freshGame/freshPet
   already fills in anything a older save is missing. A migration is only for
   a change that reshapes or reinterprets existing data.

   Each entry is keyed by the version it reads and must return the save one
   version further on, with o.v updated:

     MIGRATIONS[2] = o => { o.pets.forEach(p => p.joy = p.happy); o.v = 3; return o; };

   Nothing is registered yet; version 2 is the first schema that shipped.
   -------------------------------------------------------------------------- */
const MIGRATIONS = {};

/* Returns { game, why, keep, from }. `game` is null when the save could not be
   used, and then `why` completes the sentence "Your saved nest ..." and `keep`
   holds the original text so the caller can park it somewhere safe. */
function loadSave(raw){
  const fail = why => ({ game:null, why, keep:raw, from:null });
  if (!raw) return { game:null, why:null, keep:null, from:null };

  let o;
  try { o = JSON.parse(raw); } catch(e){ return fail('could not be read'); }
  if (!o || typeof o !== 'object') return fail('was not in a shape the game understands');

  const from = o.v | 0;
  if (from > SAVE_VERSION) return fail('was written by a newer version of the game');

  let v = from;
  while (v < SAVE_VERSION){
    const step = MIGRATIONS[v];
    if (!step) return fail('is version ' + v + ', which this build cannot upgrade');
    o = step(o);
    if (!o || (o.v | 0) <= v) return fail('stalled while upgrading from version ' + v);
    v = o.v | 0;
  }

  if (!Array.isArray(o.pets) || !o.pets.length) return fail('had no animals in it');

  const g = Object.assign(freshGame(), o);
  g.pets = o.pets.map(p => Object.assign(freshPet(), p));
  g.active = clamp(o.active | 0, 0, g.pets.length - 1);
  g.v = SAVE_VERSION;
  return { game:g, why:null, keep:null, from };
}
const trait = k => TRAITS[k][S.traits[k]];
const hatched = () => !!S && !!S.sp && !!S.born;
const stageIdx = () => S.growth < GROWTH_GATES[0] ? 0 : S.growth < GROWTH_GATES[1] ? 1 : S.growth < GROWTH_GATES[2] ? 2 : 3;
const bondPips = () => clamp(Math.floor(S.bond/20), 0, 5);
const ageDays  = () => (Date.now()-S.born)/86400e3;
const hasIll   = id => S.ills.some(i => i.id === id);
const isNight  = () => { const h = new Date().getHours(); return h >= BED_HOUR || h < WAKE_HOUR; };

function logEvent(txt){
  S.log.unshift({ t:Date.now(), txt });
  if (S.log.length > 60) S.log.length = 60;
}
function careScore(){
  const n = S.needs;
  return clamp((n.hunger + n.energy + n.hygiene + n.joy) / 400, 0, 1);
}
function moodOf(){
  if (!hatched()) return { key:'egg', line:'The egg is warm.' };
  if (S.vet) return { key:'ill', line:'is too weak to stand. Take it to the vet.' };
  if (S.asleep) return { key:'sleep', line:'is fast asleep.' };
  const ill = S.ills[0];
  if (ill) return { key:'ill', line:'is unwell. ' + ILLS[ill.id].symptom };
  const n = S.needs;
  if (n.hunger < 22) return { key:'hungry', line:'is hungry enough to nose at the dirt.' };
  if (n.energy < 20) return { key:'tired',  line:'keeps blinking slowly. It needs sleep.' };
  if (n.hygiene < 25)return { key:'dirty',  line:'smells, honestly. The flies agree.' };
  if (n.joy < 25)    return { key:'bored',  line:'is bored and keeps looking at you.' };
  if (careScore() > .82 && S.bond > 55) return { key:'happy', line:'is delighted with everything.' };
  if (careScore() > .6) return { key:'content', line:'is content.' };
  return { key:'meh', line:'is getting by.' };
}

/* ------------------------------ the tick ---------------------------------- */
function simulateAll(ms, online){
  const keep = G.active;
  for (let i=0;i<G.pets.length;i++){ S = G.pets[i]; simulate(ms, online && i === keep); }
  S = G.pets[keep];
}
function simulate(ms, online){
  if (!hatched() || ms <= 0) return;
  const h = ms / HOUR, n = S.needs;
  const tA = trait('appetite'), tT = trait('tempo'), tS = trait('social');
  const asleep = S.asleep;

  n.hunger  = clamp(n.hunger  - 7.5 * tA.hunger * h * (asleep ? .45 : 1), 0, 100);
  n.hygiene = clamp(n.hygiene - 4.0 * h * (asleep ? .5 : 1), 0, 100);
  n.joy     = clamp(n.joy     - 6.0 * tT.joy * h * (asleep ? .3 : 1) * tS.lonely, 0, 100);
  n.energy  = asleep ? clamp(n.energy + ENERGY_ASLEEP * h, 0, 100)
                     : clamp(n.energy - ENERGY_AWAKE * tT.energy * h, 0, 100);

  if (!asleep && isNight()) S.nightAwake += h; else S.nightAwake = Math.max(0, S.nightAwake - h*.5);

  const roll = perHour => Math.random() < 1 - Math.pow(1 - clamp(perHour,0,.95), h);
  S.treats = S.treats.filter(t => Date.now() - t < HOUR);
  if (!hasIll('bellyache') && S.treats.length >= 3 && roll(.6)) fallIll('bellyache');
  if (!hasIll('chill')     && S.nightAwake > 2   && roll(.35)) fallIll('chill');
  if (!hasIll('mites')     && n.hygiene < 20     && roll(.5))  fallIll('mites');
  if (!hasIll('blues')     && n.joy < 15         && roll(.4))  fallIll('blues');

  const ill = S.ills.length;
  if (ill) S.health = clamp(S.health - 7 * ill * h, 0, 100);
  else if (careScore() > .55) S.health = clamp(S.health + 9 * h, 0, 100);
  else if (careScore() < .3)  S.health = clamp(S.health - 5 * h, 0, 100);
  if (S.health <= 0 && !S.vet){ S.vet = true; S.asleep = true; logEvent(S.name + ' collapsed. It needs a vet.'); }

  const worst = Math.min(n.hunger, n.energy, n.hygiene, n.joy);
  if (worst < 15) S.bond = clamp(S.bond - 3 * h, 0, 100);
  else if (careScore() > .75) S.bond = clamp(S.bond + 1.2 * tS.bond * h, 0, 100);

  const cs = careScore();
  const rate = S.vet ? 0 : cs > .6 ? 1 : cs > .35 ? .5 : .12;
  S.growth += (ms/MIN) * rate * (online ? 1 : .55);

  if (!asleep && !S.vet){
    S.messTimer = (S.messTimer || rnd(18,32)*MIN) - ms;
    if (S.messTimer <= 0 && S.mess.length < 4){
      S.mess.push({ x: rnd(28, W-28) });
      n.hygiene = clamp(n.hygiene - 11, 0, 100);
      S.messTimer = rnd(22,40)*MIN;
      if (online){ say('Oops.'); SFX.pop(); }
    }
  }

  /* Bedtime. An animal woken by hand gets WAKE_GRACE before the night rule
     may take it back, so there is time to feed, wash and play — which is the
     only reason anyone wakes one. Running the tank right down still overrules
     that: at six energy it drops wherever it stands, grace or no grace. */
  const sleepy = isNight();
  const justWoken = Date.now() - (S.wokeAt || 0) < WAKE_GRACE;
  if (!asleep && (n.energy <= 6 || (sleepy && n.energy < 30 && !justWoken))) setSleep(true, online);
  if (asleep && !S.vet && n.energy >= 99) setSleep(false, online);
  if (asleep && !S.vet && !sleepy && n.energy > 72) setSleep(false, online);

  const st = stageIdx();
  if (st !== S.stageSeen){
    S.stageSeen = st;
    logEvent(S.name + ' is now ' + article(STAGE[st].label) + STAGE[st].label.toLowerCase() + '.');
    if (online){ say(S.name + ' grew into ' + article(STAGE[st].label) + STAGE[st].label.toLowerCase() + '!'); SFX.roar(); emit('heart', dino.x, GROUND-40, 8); }
  }
}
function fallIll(id){
  S.ills.push({ id, since: Date.now() });
  logEvent(S.name + ' came down with ' + ILLS[id].name.toLowerCase() + '.');
}
function setSleep(v, online){
  if (S.asleep === v) return;
  S.asleep = v;
  if (v){ if (online){ say('Yawn.'); SFX.yawn(); } }
  else   { if (online){ say('Morning.'); } }
}

/* --------------------------- player actions -------------------------------- */
function feed(id){
  const f = FOODS.find(x => x.id === id), sp = SPECIES[S.sp];
  if (G.coins < f.cost) return refuse('Not enough coins. Dig, or win it at the games.');
  if (S.asleep) return refuse(S.name + ' is asleep.');
  if (hasIll('bellyache')) return refuse(S.name + ' turns away from it. Settle the stomach first.');
  if (S.needs.hunger > 94) return refuse(S.name + ' is full.');
  G.coins -= f.cost;
  closeScreen();                                  // back to the habitat to watch it land
