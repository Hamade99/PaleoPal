<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#1a1208">
<title>Paleopal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   PALEOPAL — the case
   The game lives inside one moulded, speckled dinosaur egg: a shell, a bone
   bezel, a recessed screen and five keys. All of it is CSS. The project ships
   no image assets and this file does not add any.

   Three rules hold the look together, and they are the whole difference
   between a designed object and a rendered one:

   1. ONE GRID. Every size, pad, radius and offset is a whole number of --px.
      The screen is 224 device pixels wide and snaps to a whole or half
      multiple of that, so the case and the world it contains share a grid.

   2. ONE SURFACE, ONE EDGE. Each material is a flat fill with a single hard
      edge and at most one highlight line. The first pass had gradients,
      inset highlights, drop shadows, a glare sheet and a page vignette all
      running at once at similar strength, which is what makes a thing read as
      rendered rather than moulded.

   3. NOTHING PERFECTLY SYMMETRICAL. Moulded plastic has a seam, a gate mark
      and a maker's stamp, and its decoration is cast, not laid out. The
      osteoderms are irregular, the brand sits off centre against the seam,
      and the four screws are not four of the same screw.
   ========================================================================== */
:root{
  /* the grid. Everything in the case is a multiple of this. */
  --px:4px;
  --lcd-w:448px;                     /* set by JS to a whole or half multiple of 224 */

  /* Screen side. The canvas art is tuned to these, so they do not move. */
  --bg:#0e1417; --deep:#141d21; --panel:#1b262a; --line:#2b3a3f;
  --bone:#e9e1cb; --dim:#8fa39a; --ink:#101a18;
  --moss:#8cb765; --ochre:#e0ac48; --rust:#cf6a44; --sky:#7fb2c9;

  /* Case side. Two families and no more: a warm sandstone plastic for the
     shell and a cool grey-green for everything that is not the shell. The
     first pass ran one saturated amber through the shell, the wallet, the
     buttons and the bezel, so nothing had anything to sit against. */
  --shell:#c08f43;                   /* the moulding */
  --shell-hi:#dcb060;                /* the one highlight line, top edges */
  --shell-lo:#8d6527;                /* the one shade, bottom edges */
  --shell-edge:#42290a;              /* the hard outline, used everywhere */
  --scute:#a9782f;
  --bezel:#d8ccac;                   /* bone */
  --bezel-lo:#a08e69;
  --bezel-edge:#5d5138;
  --key:#2f6b49;                     /* jungle green, the one accent */
  --key-hi:#448a60;
  --key-lo:#1b432e;
  --key-edge:#0c2419;
  --stamp:rgba(52,32,6,.55);         /* moulded lettering */

  --safe:env(safe-area-inset-bottom,0px);

  /* Cast-in speckle. Irregular on purpose: an even field of dots reads as
     noise, a cast one reads as material. */
  --speckles:
    radial-gradient(2px 2px at 17px 23px,rgba(74,44,10,.55) 98%,transparent),
    radial-gradient(1px 1px at 61px 70px,rgba(74,44,10,.45) 98%,transparent),
    radial-gradient(3px 3px at 40px 11px,rgba(120,80,30,.40) 98%,transparent),
    radial-gradient(1px 1px at 88px 47px,rgba(74,44,10,.50) 98%,transparent),
    radial-gradient(2px 2px at 12px 96px,rgba(120,80,30,.38) 98%,transparent),
    radial-gradient(1px 1px at 71px 33px,rgba(74,44,10,.42) 98%,transparent),
    radial-gradient(2px 2px at 34px 58px,rgba(120,80,30,.44) 98%,transparent);
  --speckle-size:97px 97px,97px 97px,131px 131px,131px 131px,73px 73px,73px 73px,113px 113px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  /* One flat ground. The radial vignette was doing the work a photograph does,
     not the work a background does. */
  background:#1a1208;
  color:var(--bone);
  font-family:'Pixelify Sans',ui-monospace,monospace;
  display:flex;align-items:flex-start;justify-content:center;
  overscroll-behavior:none;
}
/* Every pixel of padding here comes straight off the case, and the cap is what
   the case is allowed to grow to. 520 was set when the case was a flow layout
   that got taller as it filled; now that it is a fixed 96x160 box scaled to
   fit, that cap was holding it to about a third of a desktop window while the
   window had room for twice as much. */
#app{width:100%;max-width:820px;margin:auto 0;
  padding:calc(var(--px)*3) calc(var(--px)*1.5) calc(var(--px)*3 + var(--safe));position:relative}

/* ---------- the shell ----------

   The case has two possible faces and one box.

   The box is a fixed 96x155 grid, one cell per --px, and everything live is
   placed on it as a fraction. That is what lets a drawn or imported faceplate
   line up: the screen and the keys are at cells a picture can be drawn against.

   The face is either this — the moulding, in CSS, exactly as it was before the
   grid existed — or a picture, which is `PIX.case` from the Pixels tab or a file
   the owner imported. `[data-case="art"]` on the root switches between them.

   Both, rather than one: no pixel grid small enough to keep in a source file can
   match a vector curve rendered at device resolution. The moulding has 2px
   borders, a 1px seam and a smooth silhouette, and at 96 cells across one cell
   is four screen pixels. A grid fine enough would be 384x620 — a quarter of a
   megabyte of pixel rows. So the default stays the real thing, and the grid is
   there for when you want your own. */
.shell{
  position:relative;
  width:min(calc(var(--px)*96), 100%);aspect-ratio:96 / 155;
  margin:0 auto;
}
[data-case="art"] .shell{
  background-image:var(--case-art);
  background-size:100% 100%;background-repeat:no-repeat;
  image-rendering:pixelated;
}
/* The moulding fills the box below the crown, which is where the ridge stands.
   Cells 0,4 96x149. */
.moulding{
  position:absolute;left:0;top:2.5806%;width:100%;height:96.129%;
  border-radius:50% 50% 44% 44% / 20% 20% 15% 15%;
  background-image:var(--speckles),linear-gradient(var(--shell) 0 100%);
  background-size:var(--speckle-size),100% 100%;
  border:2px solid var(--shell-edge);
  /* one highlight along the crown, one shade along the base, one shadow under
     the whole thing. Nothing else. */
  box-shadow:
    inset 0 3px 0 var(--shell-hi),
    inset 0 -5px 0 var(--shell-lo),
    0 calc(var(--px)*2) 0 #33200a;
  pointer-events:none;
}
/* The gate mark, where the moulding was filled. There was a seam running the
   full height beside it, which is a real feature of a moulded shell and read on
   the glass as a scratch down the middle of the case. */
.moulding::after{
  content:"";position:absolute;right:calc(var(--px)*7);bottom:calc(var(--px)*3);
  width:calc(var(--px)*2);height:calc(var(--px)*2);border-radius:50%;
  background:rgba(66,41,10,.22);box-shadow:0 1px 0 rgba(255,236,196,.25);
}
[data-case="art"] .moulding,[data-case="art"] .scutes{display:none}

/* Osteoderms over the crown. The look is here and the arithmetic is in
   fitCrown(): each plate says where it sits along the ridge and how big it is,
   and the function puts it on the real curve and turns it normal to the
   surface. Nothing is mirrored and no two are the same width. */
.scutes{position:absolute;left:0;right:0;top:2.5806%;height:0;pointer-events:none}
.scutes i{position:absolute;
  left:calc(50% + var(--x));width:var(--w);height:var(--h);
  margin-left:calc(var(--w) / -2);
  transform-origin:50% 100%;
  /* A spine, not a row of bumps. Two clipped triangles, one inside the other:
     the outer is the hard edge every surface on this case has and the inner is
     the plate, split down the middle so one facet takes the light. Domes read as
     thumbs standing on the shell; a point reads as an animal. */
  background:var(--shell-edge);
  clip-path:polygon(50% 0, 100% 100%, 0 100%);
}
.scutes i::before{
  content:"";position:absolute;left:2px;right:2px;top:3px;bottom:0;
  clip-path:polygon(50% 0, 100% 100%, 0 100%);
  background:linear-gradient(100deg,var(--shell-hi) 0 38%,var(--scute) 38%);
}
/* Mirrored, and a ridge rather than a scatter: tallest over the crown, tapering
   to either side. The house rule elsewhere is that nothing decorative is
   mirrored — this one is, on the owner's call, because a dorsal ridge down the
   centre line of an animal is the one thing on the case that has a centre line
   of its own. */
/* As tall as they can be — the moulding starts at cell 4 and a plate is rooted a
   cell and a quarter inside it, so five cells is the tallest the middle one can
   stand without leaving the case — and no wider than they are tall, which is
   what makes them spines rather than shark fins. */
.scutes i:nth-child(1){--x:calc(var(--px)*-25); --w:calc(var(--px)*3); --h:calc(var(--px)*2)}
.scutes i:nth-child(2){--x:calc(var(--px)*-17); --w:calc(var(--px)*4); --h:calc(var(--px)*3)}
.scutes i:nth-child(3){--x:calc(var(--px)*-9);  --w:calc(var(--px)*4); --h:calc(var(--px)*4)}
.scutes i:nth-child(4){--x:calc(var(--px)*0);   --w:calc(var(--px)*5); --h:calc(var(--px)*5)}
.scutes i:nth-child(5){--x:calc(var(--px)*9);   --w:calc(var(--px)*4); --h:calc(var(--px)*4)}
.scutes i:nth-child(6){--x:calc(var(--px)*17);  --w:calc(var(--px)*4); --h:calc(var(--px)*3)}
.scutes i:nth-child(7){--x:calc(var(--px)*25);  --w:calc(var(--px)*3); --h:calc(var(--px)*2)}

/* Boxes are placed in grid cells, written as fractions of the case rather than
   as multiples of --px. Both say the same thing when --px is right; only the
   fraction is still right when it is not — --px is set by JS, and there is
   always a moment after a resize when it is stale. The case overflowed the
   window in exactly that gap.

   Cells, for reading against a drawn faceplate: head 5,14 86x19; bone bezel
   4,35 88x86; keys 7,121 82 wide. */
.shell > *{position:absolute}
.shellhead{left:5.2083%;  top:6.4516%;  width:89.5833%}
.bezel    {left:2.0833%;  top:20%;      width:95.8333%;  height:56.7742%}
.keys     {left:7.2917%;  top:78.0645%; width:85.4167%}

/* ---------- faceplate ---------- */
.shellhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:calc(var(--px)*2);padding:0 calc(var(--px)*2)}
/* the brand is moulded lettering, and it sits against the seam rather than in
   the middle of the shell */
.brand{
  flex:0 0 100%;text-align:center;position:relative;
  font-weight:700;font-size:calc(var(--px)*5);letter-spacing:2px;
  color:var(--stamp);text-shadow:0 1px 0 rgba(255,236,196,.45);
}
.brand span{color:#22503a}
.brand .rivet{position:absolute;left:50%;bottom:calc(var(--px)*-2);
  transform:translateX(calc(-50% + var(--px)*4.5));
  width:calc(var(--px)*11);height:2px;background:rgba(66,41,10,.30);
  box-shadow:0 1px 0 rgba(255,236,196,.35)}
.tools{display:flex;align-items:center;gap:calc(var(--px)*2);margin-top:calc(var(--px)*2)}
.wallet{
  display:flex;align-items:center;gap:calc(var(--px)*1.5);
  font-size:calc(var(--px)*4);color:var(--ochre);
  background:#141d21;border:2px solid var(--shell-edge);
  border-radius:calc(var(--px)*2);
  padding:calc(var(--px)*1) calc(var(--px)*2.5) calc(var(--px)*0.75);
  box-shadow:inset 0 2px 0 #0a1013
}
#coinArt{display:flex}

/* Small keys on the faceplate. Same moulding as the big ones underneath, so
   there is one button in this design rather than three. */
.iconbtn{
  background:var(--shell);
  border:2px solid var(--shell-edge);color:var(--stamp);
  width:calc(var(--px)*9);height:calc(var(--px)*9);
  border-radius:calc(var(--px)*2);cursor:pointer;
  font-size:calc(var(--px)*4);font-family:inherit;display:grid;place-items:center;
  box-shadow:inset 0 2px 0 var(--shell-hi),inset 0 -2px 0 var(--shell-lo),
             0 calc(var(--px)*1) 0 var(--shell-edge)
}
.iconbtn:hover{background:var(--shell-hi)}
.iconbtn:active,.iconbtn.down{transform:translateY(calc(var(--px)*1));
  box-shadow:inset 0 2px 0 var(--shell-lo)}
.iconbtn.off{filter:saturate(.35) brightness(.85)}
.iconbtn.dev{background:var(--key);border-color:var(--key-edge);color:#dff0e4;
  box-shadow:inset 0 2px 0 var(--key-hi),inset 0 -2px 0 var(--key-lo),
             0 calc(var(--px)*1) 0 var(--key-edge)}
.iconbtn.dev:hover{background:var(--key-hi)}
/* Developer mode plays a copy of the nest, and says so on the case itself.
   The tag hangs off the end of the lettering, not the plate: `.brand` spans
   the full width of the head, so its own right edge is the edge of the case. */
.devmode .brand span{position:relative}
.devmode .brand span::after{content:'DEV';position:absolute;left:100%;top:50%;transform:translateY(-50%);
  margin-left:calc(var(--px)*1.5);padding:0 calc(var(--px)*1);background:var(--rust);color:#fff;
  font-size:calc(var(--px)*2.5);line-height:calc(var(--px)*4);border-radius:calc(var(--px)*1);
  letter-spacing:0;pointer-events:none}
.devmode .iconbtn.dev{background:var(--rust);border-color:#5e2413}
#btnNest{position:relative}
#nestCount{position:absolute;right:calc(var(--px)*-1);top:calc(var(--px)*-1);
  min-width:calc(var(--px)*4);height:calc(var(--px)*4);border-radius:calc(var(--px)*2);
  background:var(--rust);color:#fff;font-size:calc(var(--px)*2.5);
  line-height:calc(var(--px)*3.5);text-align:center;font-style:normal;
  border:1.5px solid var(--shell-edge)}
#nestCount:empty{display:none}

/* ---------- bone bezel ----------
   Painted here when the moulding is, hidden when a picture is. The dark panel
   inside it is placed as a fraction of it rather than by padding, so it holds
   still when --px is momentarily stale: cells 8,39 80x78 of the case, which is
   4,4 80x78 of this. */
.bezel{
  border-radius:calc(var(--px)*5);
  background:var(--bezel);
  border:2px solid var(--bezel-edge);
  box-shadow:inset 0 2px 0 #f2ead2,inset 0 -3px 0 var(--bezel-lo),
             0 calc(var(--px)*1) 0 rgba(66,41,10,.5)
}
[data-case="art"] .bezel{background:none;border:0;box-shadow:none;border-radius:0}
/* Four fixings, not four of the same screw: two slotted, one cross, one plug.
   Nobody reads them individually and everybody reads the difference. */
.screw{position:absolute;width:calc(var(--px)*2);height:calc(var(--px)*2);border-radius:50%;
  background:#b9aa85;box-shadow:inset 0 0 0 1px rgba(80,66,38,.7)}
.screw::after{content:"";position:absolute;left:1px;top:calc(50% - .5px);
  width:calc(100% - 2px);height:1px;background:rgba(70,58,32,.85)}
.screw.tr::before{content:"";position:absolute;top:1px;left:calc(50% - .5px);
  width:1px;height:calc(100% - 2px);background:rgba(70,58,32,.85)}
.screw.br::after{display:none}
.screw.tl{left:calc(var(--px)*1.5);top:calc(var(--px)*1.5)}
.screw.tr{right:calc(var(--px)*1.5);top:calc(var(--px)*1.5)}
.screw.bl{left:calc(var(--px)*1.5);bottom:calc(var(--px)*1.5)}
.screw.br{right:calc(var(--px)*1.5);bottom:calc(var(--px)*1.5)}
[data-case="art"] .screw{display:none}

.screen{
  position:absolute;left:1.5217%;top:1.5909%;width:96.9565%;height:96.8182%;
  border-radius:calc(var(--px)*3);padding:1.2%;
  background:var(--bg);
  border:1px solid #05090a;
  box-shadow:inset 0 2px 0 #05090a
}
[data-case="art"] .screen{background:none;border:0;box-shadow:none;border-radius:0}
.ident,.needs{position:static}
/* The glass sits at cells 6,49 84x61 of the case — the full width of the dark
   panel, and everything above it moved up to give it the room. A drawn faceplate
   can rely on those numbers; the canvas is centred in there at whatever whole or
   half multiple of 224 fits, which on a phone is now one and a half rather than
   one. */
.stage{position:absolute;left:0;top:14.7887%;width:100%;height:78.6385%}
/* Never in the way. This is one line of prose and a row of pips, none of it
   interactive, and it is drawn after the canvas — so when the line wrapped it
   grew upward over the glass and swallowed taps meant for the row underneath.
   In the shop that was the buy bar. It cannot wrap now, and it could not take a
   tap even if it did. */
.moodrow{position:absolute;left:3.5%;right:3.5%;bottom:0.5%;pointer-events:none}

/* ---------- identity ---------- */
.ident{display:flex;align-items:baseline;gap:calc(var(--px)*2);flex-wrap:nowrap;
  margin-bottom:calc(var(--px)*0.5);overflow:hidden}
.dname{font-size:calc(var(--px)*5);line-height:1;cursor:pointer;
  border-bottom:1px dashed transparent;color:var(--bone);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.dname:hover{border-bottom-color:var(--line)}
.dsub{font-size:calc(var(--px)*3);color:var(--dim);white-space:nowrap;flex:0 0 auto}
#nameEdit{font:inherit;font-size:calc(var(--px)*5);background:var(--panel);color:var(--bone);
  border:1px solid var(--line);border-radius:calc(var(--px)*1);
  padding:1px calc(var(--px)*1.5);width:calc(var(--px)*38)}

/* ---------- needs: four meters in one strip ----------
   These were four cards — an icon, a written label and a ten-cell track,
   stacked — eleven and a half cells tall, which was most of the room above the
   glass spent on four numbers. The icon says which and the bar says how much;
   the word said nothing the icon did not. The cards, the borders and the labels
   are gone and the space went to the game. */
.needs{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--px)*2.5);
  margin-bottom:0}
.need{display:flex;align-items:center;gap:calc(var(--px)*1.25)}
.need .cap{display:flex;align-items:center;flex:0 0 auto}
.need .cap canvas{image-rendering:pixelated;object-fit:contain;
  width:calc(var(--px)*3.5);height:calc(var(--px)*3.5);flex:0 0 calc(var(--px)*3.5)}
.need b{display:none}                       /* the icon is the label */
/* ten hard cells behind a black grid, square corners */
.track{position:relative;flex:1;height:calc(var(--px)*3);background:#05090a;border:1px solid #000;
  overflow:hidden}
.fill{height:100%;width:50%;transition:width .45s linear,background .4s}
.seg{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#05090a calc(10% - 2px) 10%)}
/* Running low is the fill turning rust, which refreshLight already does. There
   is no label left to redden and no card left to outline. */

/* ---------- the glass ----------
   Placed by the block above; this only says how the canvas sits inside it. */
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center}
/* The screen is 224 device pixels across and only ever shown at a whole or
   half multiple of that, set by fitScreen(). At an arbitrary fraction the
   pixel grid of the world came out uneven against the grid of the case, which
   is visible on everything with a one-pixel line in it. */
.lcd{position:relative;width:var(--lcd-w);max-width:100%;
  box-shadow:0 0 0 2px #05090a,0 0 0 3px rgba(140,183,101,.14)}
canvas#scene{display:block;width:100%;height:auto;image-rendering:pixelated;
  touch-action:none;cursor:pointer}
/* The power lamp, top right of the panel above the meters — a status light on
   the case, not a mark on the picture. In the bottom corner of the glass it read
   as something happening in the game. */
.lamp{position:absolute;right:calc(var(--px)*1.5);top:calc(var(--px)*1.5);
  width:calc(var(--px)*1.75);height:calc(var(--px)*1.75);border-radius:50%;
  background:var(--moss);z-index:1}
.lamp.rest{background:var(--sky)}
.lamp.bad{background:var(--rust)}

.bubble{
  position:absolute;left:50%;top:calc(var(--px)*8);transform:translate(-50%,-4px);
  background:var(--bone);color:var(--ink);font-size:calc(var(--px)*3);
  padding:calc(var(--px)*1.5) calc(var(--px)*2.5);max-width:86%;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;line-height:1.3;
  border:2px solid var(--ink);z-index:2
}
.bubble.on{opacity:1;transform:translate(-50%,0)}
.bubble.bad{background:#f0d3c6;border-color:#8a3a22;color:#3a1710}
.picks span{position:absolute;bottom:calc(var(--px)*3.5);transform:translateX(-50%);
  text-align:center;font-size:calc(var(--px)*2.75);color:#b9c4bd;line-height:1.35;
  white-space:nowrap;background:rgba(10,18,16,.85);border:1px solid rgba(90,116,104,.55);
  padding:calc(var(--px)*0.75) calc(var(--px)*1.75)}
.picks b{display:block;font-size:calc(var(--px)*3);color:var(--bone);letter-spacing:.3px}
.badge{position:absolute;left:calc(var(--px)*1);top:calc(var(--px)*1);right:calc(var(--px)*1);
  display:flex;gap:calc(var(--px)*1);flex-wrap:wrap;pointer-events:none}
.tag{background:rgba(10,18,16,.88);border:1px solid #3a4d45;color:var(--bone);
  font-size:calc(var(--px)*2.5);padding:1px calc(var(--px)*1.5);
  display:flex;align-items:center;gap:calc(var(--px)*1);line-height:1.5}
.tag.warn{border-color:#8a4130;color:#f5c3ad;background:rgba(48,17,9,.88)}
/* The animal's own age, leading the badge row. Ochre because that is already
   the colour of something earned, and a size up from the status tags because
   it is a counter rather than one more warning — every other badge is a thing
   to deal with and this is the only one that is a reward for having been
   here. */
.age{background:rgba(10,18,16,.9);border:1px solid #6a5a2c;color:var(--ochre);
  font-size:calc(var(--px)*3.25);font-weight:700;letter-spacing:.5px;
  padding:0 calc(var(--px)*1.5);line-height:1.55;display:flex;align-items:center}
.dot{width:calc(var(--px)*1.25);height:calc(var(--px)*1.25);border-radius:50%;background:var(--moss)}
.tag.warn .dot{background:var(--rust)}

/* ---------- mood strip ---------- */
.moodrow{display:flex;align-items:center;justify-content:space-between;
  gap:calc(var(--px)*2.5)}
.mood{font-size:calc(var(--px)*3.25);color:var(--bone);line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mood em{font-style:normal;color:var(--dim)}
.bondwrap{display:flex;align-items:center;gap:calc(var(--px)*1.5);font-size:calc(var(--px)*2.75);
  color:var(--dim);flex:0 0 auto}
.bondwrap canvas{image-rendering:pixelated}

/* ---------- the five keys ---------- */
/* The keys are moulded, not printed. They sit at cells x5..92 in steps of 18,
   y130..152, and the case art draws the shadow each one casts while the key
   itself is painted here — a flat fill with one highlight along the top edge,
   one shade along the bottom and a hard drop onto the shell. Drawn flat into
   the art instead they read as green rectangles laid on the case rather than as
   something standing proud of it. */
.keys{padding-top:calc(var(--px)*2)}
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--px)*3)}
.act{
  background:var(--key);
  border:2px solid var(--key-edge);color:#dff0e4;
  border-radius:calc(var(--px)*3);height:calc(var(--px)*16);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--px)*1);
  font-family:inherit;font-size:calc(var(--px)*3);letter-spacing:.4px;cursor:pointer;
  position:relative;padding:calc(var(--px)*1) calc(var(--px)*0.5);
  box-shadow:inset 0 3px 0 var(--key-hi),inset 0 -3px 0 var(--key-lo),
             0 calc(var(--px)*1.5) 0 var(--key-edge)
}
.act:hover{background:var(--key-hi)}
/* A key that opened a screen stays pressed, the way a latching key does. */
/* The press: the key drops onto its own shadow and loses the top highlight. */
.act:active,.act.down{transform:translateY(calc(var(--px)*1.5));
  box-shadow:inset 0 3px 0 var(--key-lo)}
/* A fixed square slot, and the sprite is fitted inside it whatever its shape.
   Two earlier versions of this rule each handled one axis and ignored the
   other: `width` and `height` both set squashed anything that was not square,
   and driving the height alone let a wide sprite grow sideways out of the
   button. `contain` scales by whichever axis runs out first and centres what
   is left over, so an icon can be drawn any size or shape and lands in the
   same box as the other four.

   Seven rather than six because pixCanvas returns a canvas two pixels larger
   than the art, and 14 into 28 is a clean doubling where 14 into 24 is not.
   The button has the room: its min-height is 16 and its contents come to
   about 14. */
.act .ico{display:flex;width:calc(var(--px)*7);height:calc(var(--px)*7);
  align-items:center;justify-content:center}
.act .ico canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.act[disabled]{opacity:.35;cursor:default;transform:none;filter:grayscale(.5);
  box-shadow:0 calc(var(--px)*1.5) 0 var(--key-edge)}
.act .nub{position:absolute;top:calc(var(--px)*1);right:calc(var(--px)*1.5);
  width:calc(var(--px)*2);height:calc(var(--px)*2);border-radius:50%;
  background:var(--rust);border:1px solid #40140a}

/* moulded nameplate and speaker slots */
/* Three and a half cells under the keys' drop shadow rather than one: at one
   the nameplate and its grilles sat hard against the bottom of the green keys
   and read as a label stuck to them rather than moulded into the shell. */
.plate{display:flex;align-items:center;justify-content:center;gap:calc(var(--px)*2);
  margin-top:calc(var(--px)*3.5);
  font-size:calc(var(--px)*2.75);letter-spacing:2.4px;color:var(--stamp);
  text-shadow:0 1px 0 rgba(255,240,204,.5)}
.grille{width:calc(var(--px)*8);height:calc(var(--px)*2);
  background:repeating-linear-gradient(90deg,rgba(66,41,10,.34) 0 2px,transparent 2px 5px);
  box-shadow:0 1px 0 rgba(255,236,196,.4)}

/* ---------- the panels that stayed in the DOM ----------
   Only the dossier, the developer harness and the two notices. Everything a
   player does to the animal happens on the glass; these are for reading. */
.scrim{position:fixed;inset:0;background:rgba(10,6,2,.75);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,102%);
  width:100%;max-width:520px;background:var(--deep);
  border:2px solid var(--bezel-edge);border-bottom:0;
  border-radius:calc(var(--px)*4) calc(var(--px)*4) 0 0;
  padding:calc(var(--px)*3) calc(var(--px)*3) calc(var(--px)*4 + var(--safe));z-index:6;
  transition:transform .26s cubic-bezier(.2,.9,.3,1);max-height:84vh;overflow-y:auto;
  /* the face joins "fi" into one glyph that reads as an A: "Aelds" */
  font-variant-ligatures:none
}
.sheet.on{transform:translate(-50%,0)}
.sheet.dock{max-height:52vh}
@media (min-width:860px){
  .sheet.dock{
    left:auto;right:0;top:0;bottom:0;width:calc(var(--px)*90);max-width:38vw;
    max-height:100vh;transform:translateX(104%);
    border-radius:calc(var(--px)*4) 0 0 calc(var(--px)*4);
    border:2px solid var(--bezel-edge);border-right:0;padding-top:calc(var(--px)*4)
  }
  .sheet.dock.on{transform:translateX(0)}
  .sheet.dock .grip{display:none}
}
.sheet h2{font-size:calc(var(--px)*5);font-weight:700;margin-bottom:2px;color:var(--bone)}
.sheet p.lede{font-size:calc(var(--px)*3.25);color:var(--dim);margin-bottom:calc(var(--px)*3);
  line-height:1.5}
.grip{width:calc(var(--px)*11);height:calc(var(--px)*1.25);background:var(--bezel-lo);
  margin:0 auto calc(var(--px)*3)}
.row{
  display:flex;align-items:center;gap:calc(var(--px)*3);width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);color:var(--bone);
  border-radius:calc(var(--px)*2);padding:calc(var(--px)*2.5) calc(var(--px)*3);
  margin-bottom:calc(var(--px)*1.75);cursor:pointer;font:inherit;
  box-shadow:0 calc(var(--px)*0.75) 0 #0b1214
}
.row:hover{border-color:#3d5158}
.row:active{transform:translateY(calc(var(--px)*0.75));box-shadow:none}
.row[disabled]{opacity:.4;cursor:default;box-shadow:none;transform:none}
.row .art{width:calc(var(--px)*7);height:calc(var(--px)*7);flex:0 0 calc(var(--px)*7);
  display:grid;place-items:center;overflow:hidden}
.row .art canvas{image-rendering:pixelated;object-fit:contain;
  max-width:100%;max-height:100%}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:calc(var(--px)*3.5);font-weight:600}
.row .t small{display:block;font-size:calc(var(--px)*3);color:var(--dim);margin-top:1px;
  line-height:1.4}
.row .px{font-size:calc(var(--px)*4);color:var(--ochre);flex:0 0 auto}
.row .px.own{color:var(--moss)}

.chips{display:flex;flex-wrap:wrap;gap:calc(var(--px)*1.5);margin:0 0 calc(var(--px)*2.5)}
.chip{font:inherit;font-size:calc(var(--px)*3.25);letter-spacing:.3px;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);color:var(--bone);
  border-radius:calc(var(--px)*2);padding:calc(var(--px)*1.75) calc(var(--px)*2.75);
  box-shadow:0 calc(var(--px)*0.75) 0 #0b1214}
.chip:hover{border-color:#3d5158}
.chip:active{transform:translateY(calc(var(--px)*0.75));box-shadow:none}
.chip.on{background:var(--key);border-color:var(--key-edge);color:#dff0e4}
.chip.warn{color:#f0b7a3;border-color:#7a3a2b}

/* ---------- developer panel ----------
   Sections fold, so the one being worked in is the only one taking room; the
   strip at the top is the state at a glance and repaints every second; a
   slider row is name, track, number, and the track is the key colour so it
   reads as part of the case rather than a browser control. */
.devstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--px)*1.5);
  margin:0 0 calc(var(--px)*3)}
.devstrip div{background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--px)*2);
  padding:calc(var(--px)*1.25) calc(var(--px)*2);font-size:calc(var(--px)*2.75);color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.devstrip b{display:block;font-size:calc(var(--px)*3.5);color:var(--bone);font-weight:700}
.devsec{border:1px solid var(--line);border-radius:calc(var(--px)*2.5);margin:0 0 calc(var(--px)*2);
  background:rgba(255,255,255,.015)}
.devsec>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:calc(var(--px)*2);
  padding:calc(var(--px)*2) calc(var(--px)*2.75);font-size:calc(var(--px)*3.5);color:var(--bone);font-weight:700}
.devsec>summary::-webkit-details-marker{display:none}
.devsec>summary::before{content:"▸";color:var(--dim);font-size:calc(var(--px)*3);transition:transform .15s}
.devsec[open]>summary::before{transform:rotate(90deg)}
.devsec>summary small{font-weight:400;font-size:calc(var(--px)*2.75);color:var(--dim);margin-left:auto}
.devbody{padding:0 calc(var(--px)*2.75) calc(var(--px)*1.5)}
.devsub{font-size:calc(var(--px)*2.75);color:var(--dim);letter-spacing:.4px;text-transform:uppercase;
  margin:calc(var(--px)*1.5) 0 calc(var(--px)*1.5)}
.devrow{display:grid;grid-template-columns:calc(var(--px)*24) 1fr calc(var(--px)*11);align-items:center;
  gap:calc(var(--px)*2);margin:0 0 calc(var(--px)*1.75);font-size:calc(var(--px)*3.25);color:var(--bone)}
.devrow input[type=range]{width:100%;accent-color:var(--key);cursor:pointer;margin:0}
.devrow output{text-align:right;color:var(--gold, #e3b95c);font-variant-numeric:tabular-nums}
.devrow.off output{color:var(--dim)}
.devsec .chips{margin-bottom:calc(var(--px)*1.75)}
.devsec .tiny{margin:0 0 calc(var(--px)*1.5)}

.log{font-size:calc(var(--px)*3.25);line-height:1.6;color:var(--bone);
  border-left:2px solid var(--line);padding:2px 0 2px calc(var(--px)*2.5);
  margin-bottom:calc(var(--px)*2.25)}
.log time{display:block;font-size:calc(var(--px)*2.75);color:var(--dim);margin-bottom:1px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--px)*2);
  margin-bottom:calc(var(--px)*3)}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--px)*2);
  padding:calc(var(--px)*2) calc(var(--px)*2.5)}
.stat b{display:block;font-size:calc(var(--px)*2.75);color:var(--dim);font-weight:500}
.stat span{font-size:calc(var(--px)*4)}
.note{font-size:calc(var(--px)*3);color:var(--dim);line-height:1.6;margin-top:calc(var(--px)*1)}
.trait{display:inline-block;background:var(--panel);border:1px solid var(--line);
  border-radius:calc(var(--px)*5);padding:calc(var(--px)*0.75) calc(var(--px)*2.25);
  font-size:calc(var(--px)*3);margin:0 calc(var(--px)*1.25) calc(var(--px)*1.25) 0}
.hr{height:1px;background:var(--line);margin:calc(var(--px)*3) 0}
.tiny{font-size:calc(var(--px)*2.75);color:var(--dim);text-align:center;
  margin-top:calc(var(--px)*2.5);line-height:1.6}
button:focus-visible,.dname:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

/* Thumbs, not pointers.

   The five keys under the glass are 62x64 and fine. The four small keys in the
   head are `--px*9`, which is 36 CSS pixels — under the 44 iOS asks for and the
   48 Android asks for, and on a phone that is the difference between pressing
   the sound key and pressing the nest key next to it.

   Making them bigger would mean redrawing the head of the case, so instead the
   painted key stays exactly the size it is and the area a thumb has to hit is
   extended past it by a transparent overlay.

   The gap is then whatever keeps two of those targets from overlapping — which
   is 48 less the width of the key, and never less than the gap the case wants
   anyway. Hardcoding the gap instead works at one `--px` and fails at the
   other: at 3.4px the keys are 30.6 wide, the pitch came out at 40.8, and two
   48-pixel targets overlapped by seven — which makes which key you pressed a
   question of paint order rather than of where your thumb was. */
@media (pointer:coarse){
  .tools{gap:max(calc(var(--px)*3), calc(48px - var(--px)*9))}
  .iconbtn{position:relative}
  .iconbtn::after{content:'';position:absolute;left:50%;top:50%;
    width:48px;height:48px;transform:translate(-50%,-50%)}
}

/* No width breakpoint for `--px`: fitScreen() computes it from both axes, and
   a media query fighting it would only be right at one window size. */
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>

<body>
<div id="storageStatus" role="alert" hidden></div>
<div id="app">
  <!-- The whole game sits inside one speckled egg-shaped case, the way a
       Tamagotchi does: a moulded shell, a bone bezel, a recessed screen, and
       physical keys along the bottom. Everything is CSS; the project has no
       image assets and this does not change that. -->
  <div class="shell">
    <!-- The moulding itself. A separate layer because the case has two possible
         faces: this one, drawn in CSS the way it always was, and a picture — a
         sprite from the Pixels tab or an imported file — which replaces it. The
         box they both fill is the same fixed grid either way. -->
    <i class="moulding" aria-hidden="true"></i>
    <!-- The crown ridge. fitCrown() sits each plate on the moulding's own top
         curve; see the note there for why that cannot be done in CSS. -->
    <div class="scutes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="shellhead">
      <div class="brand">PALEO<span>PAL</span><i class="rivet"></i></div>
      <div class="tools">
        <div class="wallet"><i id="coinArt"></i><span id="coins">0</span></div>
        <button class="iconbtn" id="btnSound" aria-label="Sound on or off"></button>
        <button class="iconbtn" id="btnNest" aria-label="Open the nest"><i id="nestCount"></i></button>
        <button class="iconbtn" id="btnDossier" aria-label="Open dossier">i</button>
        <button class="iconbtn dev" id="btnDev" aria-label="Developer tools" hidden></button>
      </div>
    </div>

    <div class="bezel">
      <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
      <div class="screen">
        <i class="lamp" id="lamp"></i>
        <div class="ident">
          <div class="dname" id="dName" tabindex="0" role="button">…</div>
          <div class="dsub" id="dSub"></div>
          <input id="nameEdit" hidden maxlength="14" aria-label="Rename">
        </div>

        <div class="needs" id="needs"></div>

        <div class="stage">
          <div class="lcd">
            <canvas id="scene" width="224" height="168"></canvas>
            <div class="badge" id="badges"></div>
            <!-- filled by buildChrome() from SPECIES, so it stays in step with the eggs -->
            <div class="picks" id="picks" hidden></div>
            <div class="bubble" id="bubble"></div>
          </div>
        </div>

        <div class="moodrow">
          <div class="mood" id="mood"></div>
          <div class="bondwrap" id="bond"></div>
        </div>
      </div>
    </div>

    <div class="keys">
      <div class="actions" id="actions"></div>
      <div class="plate"><i class="grille"></i><span>PALEOPAL · MK I</span><i class="grille"></i></div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grip"></div>
  <div id="sheetBody"></div>
</div>
<script>
'use strict';
/* ==========================================================================
   PALEOPAL — a pocket dinosaur care sim
   Sections: core → sprites → species → world → sim → render → ui
   ========================================================================== */

const W = 224, H = 168, GROUND = 140;

/* The world is bigger than the screen, and growing up reveals it.

   Not a magnification of the old backdrop — an extension of it. Today's
   picture sits inside the larger one unmoved, at its old coordinates, with
   more scenery drawn around the outside; the view starts cropped to it and
   pulls back a notch at each growth spurt until the whole world is on screen
   at adult.

   The ground line is what fixes every number here. It has to land at the same
   fraction of the height in the world as it does on the screen, or the animal
   — which is drawn in screen space and never moves — would leave the grass as
   the view pulled back. 140/168 is 280/336, and that single constraint gives
   the padding: 112 columns each side, 140 rows of sky above, 28 of ground below.

   The world was 280x210 first, and adult saw it at 0.8 — four steps so close
   together that growing up hardly changed the view. It is twice the screen
   each way now, and each growth spurt pulls back about a quarter. That much
   new ground is not the old picture carried on: every habitat's margins and
   sky were painted for what should be there, and a new habitat has to be
   painted to the full world, not to the screen.

   The painters keep working in the old coordinates. bakeBg translates by the
   padding once and every literal position in 04-world.js stays exactly as it
   was written — the volcano, the falls, every boulder, every skyline point.
   Only the loops that run the full width have to widen, and since they are all
   functions of x, including their hash1 detail, the extra width generates
   itself and matches what is already there.

   Scaling the painters instead was tried on paper and does not survive this
   file: the sky dither, the grass, the dirt and the cliffs are per-pixel
   fillRect(x, y, 1, 1) loops, and at a fractional scale those become
   fractional rects that antialias into mush. */
const BG_W = 448, BG_H = 336;                    // the world, 4:3 like the screen
const BG_PAD_X = 112, BG_PAD_Y = 140;            // where the hatchling's view sits in it
const BG_G = GROUND + BG_PAD_Y;                  // 280 — the ground line, in world space
/* The world's edges in the painters' own coordinates, where the hatchling's
   view is still 0..W and 0..H. */
const BG_L = -BG_PAD_X, BG_R = W + BG_PAD_X;     // -112 … 336
const BG_T = -BG_PAD_Y, BG_B = BG_H - BG_PAD_Y;  // -140 … 196
const BG_SPAN = BG_R - BG_L;                     // 448, for the full-width fills

/* How much of the world is on screen, one crop per growth stage.

   Every crop is 4:3, so nothing stretches, and every one is anchored on the
   ground line instead of being centred: the animal is drawn in screen space
   and never moves, so the grass has to stay under its feet at all four. That
   is what fixes `sy` — (BG_G - sy) * H/sh has to come out at GROUND — and the
   widths were then picked so that every number here is a whole pixel. `sh`
   divisible by six makes `sy` integral and by three makes `sw` integral; miss
   that and the crop samples on half-pixels, which softens the whole backdrop
   instead of only reducing it.

   The widths step by about 1.26 each time — 224, 280, 352, 448 — so the three
   growth spurts are three equal-looking pulls back rather than two nudges and
   a jump.

   The reduction is real and was accepted for the sake of seeing the world:
   with smoothing off this drops rows and columns, one in five at juvenile and
   one in two at adult, and what suffers is the one-pixel detail — the lit top
   edge of the grass, the specular on the river, the ordered dither in the sky.
   The hatchling crop is scale 1.0, so a newly hatched animal sees its world
   pixel for pixel.

   Here rather than in the renderer because the editor draws these as guides
   over a backdrop being painted, and the editor does not load the renderer. */
const BG_CROP = [
  [112, 140, 224, 168],      // hatchling  1.000 — pixel for pixel
  [ 84, 105, 280, 210],      // juvenile   0.800
  [ 48,  60, 352, 264],      // subadult   0.636
  [  0,   0, 448, 336]       // adult      0.500 — the whole world
];
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;
const rnd   = (a,b) => a + Math.random()*(b-a);
const pick  = a => a[(Math.random()*a.length)|0];
const $     = id => document.getElementById(id);
const HOUR  = 3600e3, MIN = 60e3;
/* The clock the picture is drawn at: the sky phase, the sun and the moon.
   Normally the real one. The developer panel can pin it to an hour so night
   can be looked at by day. For the real nest it is a view and nothing else —
   the simulation, ages and sleep keep reading the real clock, because anything
   that persists runs on wall time. In developer mode, which plays a copy, the
   pinned hour also decides bedtime (see isNight); needs, growth and age still
   run on wall time there. Not saved: a reload shows the real sky again. */
let devHour = null;
function viewDate(){
  const d = new Date();
  if (devHour !== null) d.setHours(Math.floor(devHour), Math.round((devHour % 1) * 60), 0, 0);
  return d;
}

/* ---------- storage: works as artifact, as a file, and inside a webview ---- */
const Store = {
  async get(k){
    if (window.storage) { const result = await window.storage.get(k); return result ? result.value : null; }
    return localStorage.getItem(k);
  },
  async set(k,v){
    if (window.storage) return window.storage.set(k,v);
    localStorage.setItem(k,v);
  },
  async del(k){
    if (window.storage) return window.storage.delete(k);
    localStorage.removeItem(k);
  }
};

/* ---------- audio ---------- */
let AC = null;
function tone(f, dur, type, vol, delay, slide){
  if (!G || !G.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime + (delay||0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(28, f + slide), t + dur);
    g.gain.setValueAtTime(vol || .06, t);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + .04);
  }catch(e){}
}
const SFX = {
  chomp:()=>{tone(200,.06,'square',.07);tone(140,.08,'square',.07,.06);},
  coin :()=>{tone(880,.06,'square',.05);tone(1320,.09,'square',.05,.06);},
  purr :()=>{tone(300,.14,'sine',.05,0,90);},
  crack:()=>tone(130,.07,'sawtooth',.09,0,-45),
  hatch:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.13,'square',.06,i*.1)),
  bonk :()=>tone(95,.15,'square',.09,0,-45),
  wash :()=>tone(420,.14,'triangle',.06,0,520),
  yawn :()=>tone(480,.42,'sine',.05,0,-300),
  roar :()=>{tone(72,.5,'sawtooth',.11,0,-32);tone(54,.55,'square',.08,.05,-22);},
  pop  :()=>tone(340,.05,'triangle',.07),
  sneeze:()=>{tone(700,.05,'square',.05);tone(240,.16,'sawtooth',.08,.05,-120);}
};

/* ==========================================================================
   SPRITE PIPELINE
   Shapes are drawn as smooth paths on an offscreen canvas, then hard-quantised
   (alpha threshold + palette snap) and given a dilated outline. That gives real
   pixel art with correct anatomy instead of hand-typed ASCII blobs.
   ========================================================================== */

function makeCv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function readCtx(c){ return c.getContext('2d', { willReadFrequently:true }); }
const article = w => /^[aeiou]/i.test(w) ? 'an ' : 'a ';
/* the copy is written out in words, so counts that appear in a sentence are too */
const NUM_WORD = ['No','One','Two','Three','Four','Five','Six','Seven','Eight'];
const numWord = n => NUM_WORD[n] || String(n);

/* tapered tube through a centreline — the workhorse for necks, tails, limbs */
function tube(g, pts, widths, col){
  const n = pts.length;
  const left = [], right = [];
  for (let i=0;i<n;i++){
    const p = pts[i];
    const a = pts[Math.max(0,i-1)], b = pts[Math.min(n-1,i+1)];
    let dx = b[0]-a[0], dy = b[1]-a[1];
    const L = Math.hypot(dx,dy) || 1; dx/=L; dy/=L;
    const w = widths[i]/2;
    left.push([p[0]-dy*w, p[1]+dx*w]);
    right.push([p[0]+dy*w, p[1]-dx*w]);
  }
  if (col) g.fillStyle = col;
  g.beginPath();
  curveThrough(g, left, true);
  const rr = right.slice().reverse();
  for (let i=0;i<rr.length;i++) g.lineTo(rr[i][0], rr[i][1]);
  g.closePath(); g.fill();
  // round the caps so tips read as tips, not chisels
  g.beginPath(); g.arc(pts[0][0],pts[0][1],Math.max(.5,widths[0]/2),0,7); g.fill();
  g.beginPath(); g.arc(pts[n-1][0],pts[n-1][1],Math.max(.5,widths[n-1]/2),0,7); g.fill();
}
function curveThrough(g, p, start){
  if (start) g.moveTo(p[0][0], p[0][1]);
  for (let i=0;i<p.length-1;i++){
    const a=p[i], b=p[i+1];
    const prev=p[Math.max(0,i-1)], next=p[Math.min(p.length-1,i+2)];
    const c1=[a[0]+(b[0]-prev[0])/6, a[1]+(b[1]-prev[1])/6];
    const c2=[b[0]-(next[0]-a[0])/6, b[1]-(next[1]-a[1])/6];
    g.bezierCurveTo(c1[0],c1[1],c2[0],c2[1],b[0],b[1]);
  }
}
function blob(g, pts, col){
  if (col) g.fillStyle = col;
  g.beginPath();
  const p = pts.concat([pts[0],pts[1]]);
  g.moveTo(p[0][0],p[0][1]);
  for (let i=0;i<p.length-1;i++){
    const a=p[i], b=p[i+1];
    const prev=p[(i-1+p.length)%p.length], next=p[(i+2)%p.length];
    g.bezierCurveTo(a[0]+(b[0]-prev[0])/6, a[1]+(b[1]-prev[1])/6,
                    b[0]-(next[0]-a[0])/6, b[1]-(next[1]-a[1])/6, b[0],b[1]);
  }
  g.closePath(); g.fill();
}
/* A closed polygon with hard corners. `blob` rounds everything it is given,
   which is right for a ribcage and wrong for anything that has to meet the
   ground flat or come to a point: a sole drawn as a blob bulges into a ball
   and a claw drawn as one is a pebble. Straight edges, and the quantiser gives
   them the same hard pixel edge as everything else. */
function poly(g, pts, col){
  if (col) g.fillStyle = col;
  g.beginPath();
  g.moveTo(pts[0][0], pts[0][1]);
  for (let i=1;i<pts.length;i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath(); g.fill();
}

function oval(g,x,y,rx,ry,col,rot){
  if (col) g.fillStyle=col; g.beginPath(); g.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot||0,0,7); g.fill();
}

/* trim transparent margins so anchors and ground contact stay exact */
function trim(src){
  const w=src.width,h=src.height,g=readCtx(src);
  const d=g.getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(d[(y*w+x)*4+3]){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  }
  if (x1<0) return {cv:src,ox:0,oy:0,w,h};
  const nw=x1-x0+1, nh=y1-y0+1, out=makeCv(nw,nh);
  out.getContext('2d').drawImage(src,x0,y0,nw,nh,0,0,nw,nh);
  return {cv:out, ox:x0, oy:y0, w:nw, h:nh};
}

   All of it used to be hand-written fillRect calls buried in three different
   modules — a hundred and forty lines of `g.fillRect(3,4,2,1)` that could only
   be changed by someone who could read them as a picture in their head. As
   rows of characters it is editable by eye in a text editor, and by hand in

   transparent, and 0-9 then a-z index into `pal`. `ox`/`oy` mark where the
   drawing origin sits inside the grid, for the sprites that are drawn around
   a point rather than from a corner.

   The outline every icon and hat wears is NOT stored here. It is a pass over

/* Per-stage multipliers. Every feature that grows on its own schedule gets its
   own column — merging any two of them has produced a bad sprite at least once.

   A scale column and a set of ratios is not growth. With `s` doing most of the
   work the juvenile, subadult and adult were one animal at three sizes with a
   slightly smaller head each time, and the only stage that read as its own
   thing was the hatchling. Growing up changes what an animal *has*, not only
   how big the parts are, so four of these columns turn features on and off
   rather than scaling them:

   `muzzle` is snout DEPTH, and it is separate from `snout`, which is snout
   length. A young tyrannosaur has a shallow, narrow muzzle in front of a large
   braincase; the deep boxy skull is an adult feature and arrives late. Driving
   both off one number gives a hatchling either an adult's slab of a face or a
   pinched adult.

   `bulk` is how deep the trunk and neck are for a given length. Juveniles are
   slab-sided and leggy, adults are barrel-chested with a thick neck. It is the
   difference you actually see across a room.

   `torso` is trunk LENGTH. Young animals are short-bodied and big-headed; the
   body catches up last.

   `fuzz` is protofeather coverage. Juvenile tyrannosaurs are reconstructed
   with a substantial coat that reduces with age, which is both well supported
   and the single most visible thing that can change between two stages of the
   same animal.

   `frill` is separate from `horn` for the reason `snout` is separate from
   `head`: a baby Triceratops already has a frill, deeply scalloped and
   obvious, while its horns are barely stubs.

   `hornBend` is the ontogenetic sequence Horner and Goodwin read off a series
   of ten skulls: the postorbital horns start as straight stubs, curve
   backward in juveniles, straighten out in subadults, then recurve forward in

/* The growth row and the proportions a species draws with at a given stage,

   than reading STAGE and its TUNE table directly.

   Cached, because it is called once per bake and a bake happens for every
   frame of every animation — and dropped by artChanged(), like everything
   else the game has worked out in advance. */
const stageCache = new Map();
function artFor(spId, stage){
  const key = spId + '|' + stage;
  if (stageCache.has(key)) return stageCache.get(key);
  const st = Object.assign({}, STAGE[stage]);
  const tune = Object.assign({}, (SPECIES[spId] && SPECIES[spId].tune) || {});
  const adj = (SPECIES_STAGE[spId] || [])[stage] || {};
  for (const k in adj){
    if (k in st) st[k] = adj[k];
    else tune[k] = adj[k];
  }
  const out = { st, tune };
  stageCache.set(key, out);

/* ---------------------------- drawing from PIX ----------------------------
   Three ways a stored sprite is used, and none of them wants the others'
   behaviour, so they are three functions rather than one with flags.
   -------------------------------------------------------------------------- */

/* Straight onto a context, at a scale, optionally in one flat colour. `flat`
   is what gives a food item the hard outline every animal in this game has:
   stamped four times a pixel out in each direction under the real thing. A
   bounding rectangle will not do it — that comes out as a black plaque. */
function pixDraw(g, id, x, y, s, flat){
  const p = PIX[id];
  if (!p) return;
  s = s || 1;
  const ox = (p.ox || 0), oy = (p.oy || 0);
  for (let r=0;r<p.rows.length;r++){
    const row = p.rows[r];
    for (let c=0;c<row.length;c++){
      const ch = row[c];
      if (ch === ' ') continue;
      g.fillStyle = flat || p.pal[PIX_CH.indexOf(ch)];
      g.fillRect(x + (c-ox)*s, y + (r-oy)*s, s, s);
    }
  }
}
const PIX_CH = '0123456789abcdefghijklmnopqrstuvwxyz';

/* Onto its own canvas, with a hard outline dilated around it. Icons and
   headgear both want this and both used to carry their own copy of the loop.
   Cached, because paintChrome runs about once a second and the shop redraws
   every frame it is open.

   The canvas is a pixel bigger than the sprite on every side. The outline is
   dilated *outward*, so a canvas cut to the sprite's exact size has nowhere to
   put it, and any art pixel touching the edge silently lost its outline on
   that side — eleven of the twenty-nine sprites did, and `icon.play`, which
   fills its box, had none at all on any side. A sprite is art, not a box: it
   should not have to keep a spare row clear to be drawn correctly.

   The pad is published on the canvas because headgear places itself from the
   canvas size and would otherwise ride a pixel high. */
const PIX_PAD = 1;
const pixCache = new Map();
/* `outline` is optional. A sprite that wants its own edges drawn in the pixel
   editor asks for none: the dilation pass is a convenience for art that was
   drawn without an edge, not a tax on art that has one. */
function pixCanvas(id, outline){
  const key = id + '|' + (outline || '');
  if (pixCache.has(key)) return pixCache.get(key);
  const p = PIX[id];
  if (!p) return makeCv(1,1);
  const w = p.w + PIX_PAD*2, h = p.h + PIX_PAD*2;
  const c = makeCv(w, h), g = readCtx(c);
  c.pad = PIX_PAD;
  pixDraw(g, id, (p.ox || 0) + PIX_PAD, (p.oy || 0) + PIX_PAD, 1);
  const d = g.getImageData(0,0,w,h), px = d.data, solid = new Uint8Array(w*h);
  for (let i=0;i<w*h;i++){ if (px[i*4+3] >= 118){ px[i*4+3] = 255; solid[i] = 1; } else px[i*4+3] = 0; }
  if (outline){
    const [orr, og, ob] = [1,3,5].map(i => parseInt(outline.slice(i,i+2), 16));
    for (let y=0;y<h;y++) for (let x=0;x<w;x++){
      const i = y*w+x; if (solid[i]) continue;
      if ((x>0&&solid[i-1])||(x<w-1&&solid[i+1])||(y>0&&solid[i-w])||(y<h-1&&solid[i+w])){
        px[i*4]=orr; px[i*4+1]=og; px[i*4+2]=ob; px[i*4+3]=255;
      }
    }
  }
  g.putImageData(d,0,0);
  pixCache.set(key, c);
  return c;
}
/* ------------------------------ boxed sprites -------------------------------
   Some sprites are drawn into a place that was laid out for them: a food item
   into a cell of the Feed menu, a shop row, a spot on the ground; a heart into a
   nine-pixel pip of the bond row. Those places were sized for the grid the art
   happened to be drawn on, and the art was drawn at a fixed scale, so drawing
   the fern again on a finer grid for more detail made it bigger — 14 x 23 cells
   came out twice the height of its cell and ran over the menu around it.

   A grid is resolution, not size. Each kind of boxed sprite has the box its
   callers were laid out for, as [w, h, ox, oy] in cells: the size and the origin
   of the sprites that were there when the layouts were made. Anything that fits
   is drawn exactly as it always was, by its own origin. Anything bigger is
   scaled down to fit that box at the caller's scale, centred in it — or, for the
   mess, standing on its foot, because the mess sits on the ground line — and
   drawn from a baked canvas with no smoothing, so it stays hard-edged. Sprites
   are never scaled up: a small sprite is small because it was drawn small. */
const PIX_BOX = {
  item:  { w:12, h:10, ox:2, oy:4 },
  heart: { w:8,  h:7,  ox:0, oy:1 },
  mess:  { w:10, h:9,  ox:4, oy:7, foot:true }
};
function pixBoxOf(id){ return id.slice(0, 5) === 'item.' ? PIX_BOX.item : PIX_BOX[id] || null; }

/* The sprite on its own canvas in one flat colour, for the outline stamps. */
function pixFlatCanvas(id, flat){
  if (!flat) return pixCanvas(id);
  const key = id + '|flat:' + flat;
  if (pixCache.has(key)) return pixCache.get(key);
  const p = PIX[id], c = makeCv(p.w + PIX_PAD*2, p.h + PIX_PAD*2);
  c.pad = PIX_PAD;
  pixDraw(readCtx(c), id, (p.ox || 0) + PIX_PAD, (p.oy || 0) + PIX_PAD, 1, flat);
  pixCache.set(key, c);
  return c;
}

/* Like pixDraw, and called the same way — (x, y) is where the box's origin
   goes — but a sprite bigger than its box is shrunk to fit it. */
function pixDrawBoxed(g, id, x, y, s, flat){
  const p = PIX[id], box = pixBoxOf(id);
  if (!p) return;
  s = s || 1;
  const fit = box ? Math.min(1, box.w / p.w, box.h / p.h) : 1;
  if (fit >= 1) return pixDraw(g, id, x, y, s, flat);
  const w = Math.max(1, Math.round(p.w * s * fit)), h = Math.max(1, Math.round(p.h * s * fit));
  const bx = x - box.ox * s, by = y - box.oy * s;
  const dx = Math.round(bx + (box.w * s - w) / 2);
  const dy = Math.round(box.foot ? by + box.h * s - h : by + (box.h * s - h) / 2);
  const was = g.imageSmoothingEnabled;
  g.imageSmoothingEnabled = false;
  g.drawImage(pixFlatCanvas(id, flat), PIX_PAD, PIX_PAD, p.w, p.h, dx, dy, w, h);
  g.imageSmoothingEnabled = was;
}

/* The cells a sprite actually paints, { x0, y0, x1, y1 }, or null if none.
   A grid is drawn with whatever margin the artist left, and an origin is
   wherever it suits the game, so neither says where the picture is. */
function pixInk(id){
  const key = id + '|ink';
  if (pixCache.has(key)) return pixCache.get(key);
  const p = PIX[id];
  let ink = null;
  if (p) p.rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === ' ' || x >= p.w || y >= p.h) return;
    if (!ink) ink = { x0: x, y0: y, x1: x, y1: y };
    else { ink.x0 = Math.min(ink.x0, x); ink.x1 = Math.max(ink.x1, x); ink.y0 = Math.min(ink.y0, y); ink.y1 = Math.max(ink.y1, y); }
  }));
  pixCache.set(key, ink);
  return ink;
}

/* A picture for a cell: the painted part of the sprite, as big as fits in
   maxW x maxH up to `cap` times, centred on (cx, cy). Scales of one and up are
   whole numbers, so every cell is the same size on screen; below one it
   shrinks by what it has to. The margin and the origin are both ignored — the
   Feed menu placed items by their origin, as if every one were a 12 x 10 grid
   with its origin at 2,4, which put a fish with its origin at 0,2 and a fern on
   a 14 x 23 grid well off the middle of their cells. */
function pixDrawFit(g, id, cx, cy, maxW, maxH, cap){
  const ink = pixInk(id);
  if (!ink) return;
  const iw = ink.x1 - ink.x0 + 1, ih = ink.y1 - ink.y0 + 1;
  let k = Math.min(maxW / iw, maxH / ih, cap || Infinity);
  if (k >= 1) k = Math.floor(k);
  const w = Math.max(1, Math.round(iw * k)), h = Math.max(1, Math.round(ih * k));
  const was = g.imageSmoothingEnabled;
  g.imageSmoothingEnabled = false;
  g.drawImage(pixCanvas(id), PIX_PAD + ink.x0, PIX_PAD + ink.y0, iw, ih,
              Math.round(cx - w / 2), Math.round(cy - h / 2), w, h);
  g.imageSmoothingEnabled = was;
}

/* Anything the editor changes has to drop the caches, or the game goes on
   showing what it baked before the edit. */
function pixInvalidate(){ pixCache.clear(); if (typeof HATS === 'object') for (const k in HATS) delete HATS[k]; }

/* Everything the game has baked, dropped in one call. The editor changes a
   number and then has to make the game forget several independent caches — the
   frame cache, the material cache, the pixel cache, the backdrop cache and the
   sky. Forgetting one of them is how an editor ends up showing the old
   sprite on a new palette, so there is one function and it clears them all.
   It is called at runtime, so the caches defined in later modules are there. */
function artChanged(){
  pixInvalidate();
  if (typeof paintCase === 'function') paintCase();   // the case is a sprite too
  if (typeof frameCache !== 'undefined') frameCache.clear();
  if (typeof matCache   !== 'undefined') matCache.clear();
  if (typeof warmQueue  !== 'undefined') warmQueue.length = 0;
  if (typeof bgCache    !== 'undefined') bgCache.clear();
  if (typeof skyCache   !== 'undefined') skyCache.clear();
  if (typeof skyViewCache !== 'undefined') skyViewCache.clear();
  if (typeof thumbCache !== 'undefined') thumbCache.clear();
  stageCache.clear();
}

/* ==========================================================================
   COLOUR + LIGHTING
   Palettes are generated as hue-shifted ramps: shadows drift cooler and more
   saturated, highlights warmer and less saturated. Shading uses one light,
   from the upper left, applied through a distance field so the form reads
   instead of pillowing evenly around the outline.
   ========================================================================== */

function hexToHsl(hex){
  let r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2;
  let h = 0, s = 0;
  if (mx !== mn){
    const d = mx - mn;
    s = l > .5 ? d/(2-mx-mn) : d/(mx+mn);
    h = mx === r ? (g-b)/d + (g<b?6:0) : mx === g ? (b-r)/d + 2 : (r-g)/d + 4;
    h *= 60;
  }
  return [h, s, l];
}
function hslToHex(h, s, l){
  h = ((h % 360) + 360) % 360; s = clamp(s,0,1); l = clamp(l,0,1);
  const c = (1 - Math.abs(2*l-1)) * s, x = c * (1 - Math.abs((h/60)%2 - 1)), m = l - c/2;
  let r,g,b;
  if (h<60) [r,g,b]=[c,x,0]; else if (h<120) [r,g,b]=[x,c,0]; else if (h<180) [r,g,b]=[0,c,x];
  else if (h<240) [r,g,b]=[0,x,c]; else if (h<300) [r,g,b]=[x,0,c]; else [r,g,b]=[c,0,x];
  const q = v => Math.round((v+m)*255).toString(16).padStart(2,'0');
  return '#' + q(r) + q(g) + q(b);
}
/* five steps, darkest first, with the hue rotated along the ramp */
function ramp(base, opts){
  opts = opts || {};
  const [h,s,l] = hexToHsl(base);
  const spread = opts.spread || .19, shift = opts.shift || 22;
  const out = [];
  for (let i=0;i<5;i++){
    const t = (i-2)/2;                                   // -1 shadow … +1 light
    out.push(hslToHex(
      h + (t<0 ? t*shift : t*shift*.55),                 // shadows swing further
      clamp(s + (t<0 ? .10*-t : -.13*t), .05, 1),
      clamp(l + t*spread, .05, .95)
    ));
  }
  return out;
}
function shiftRamp(r, n){ return r.map((_,i) => r[clamp(i+n,0,4)]); }
/* blend two hexes. Used to pull the underside toward the flank hue so that
   countershading reads as light falling off a body rather than as a second
   colour painted onto it. */
function mixCol(a, b, t){
  const A = [1,3,5].map(i => parseInt(a.slice(i,i+2),16));
  const B = [1,3,5].map(i => parseInt(b.slice(i,i+2),16));
  return '#' + A.map((v,i) => Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('');
}

/* Material keys, in paint order: a later layer wins where two overlap.

   The compositor only draws an internal edge where two *different* materials
   meet, so two shapes sharing a layer merge into one region with nothing
   between them. That is why the mandible has a layer of its own instead of
   sharing `head` — painted onto `head` it was drawn correctly, hinged
   correctly, and completely invisible, which is what left every animal with a
   mouthless face.

   `shield` and `jaw` sit below `head`, so a frill and a lower jaw pass behind
   the skull. `belly` and `mark` sit above the body but are masked to it, so
   both can be painted generously and let the mask trim them to the
   silhouette. `mark` stops below `belly`, which is how a coat pattern fades
   out where the countershading starts rather than running across it.

   `horn` sits above `mouth` because teeth, beaks and claws stand in front of
   the mouth cavity, not behind it. The other way round the gape painted over
   every tooth in it.

   `beak` is a layer and not just a colour on `horn` because a rostral and a
   brow horn are different materials and the compositor only draws an edge
   between different materials. Sharing `horn`, a ceratopsian's beak was two
   near-white blobs stuck on the front of a tan face with nothing dividing
   them from the horn sheaths above. A species that does not set `spec.beak`
   gets its horn colour here and nothing changes for it.

   `rim` is a dark border for a limb held against the body, which is the one
   place the silhouette outline cannot help: the rex's arm is the same material
   ramp as the chest it lies on, and on a speckled coat it vanished into the
   flank. It sits under `limb`, so a shape a pixel fatter than the limb leaves
   a pixel of rim showing round it, and it is masked to pixels already on the
   body — off the body the ordinary outline is already doing the job, and a
   rim there only made the arm look thicker. The coat is kept off it. */
const LAYERS = ['far','skin','rim','limb','shield','jaw','head','belly','mark','crest','mouth','horn','beak','sclera','pupil','glint'];
const BODY_TOP    = LAYERS.indexOf('head');
const BELLY_LAYER = LAYERS.indexOf('belly');
const MARK_LAYER  = LAYERS.indexOf('mark');
const RIM_LAYER   = LAYERS.indexOf('rim');
/* Countershading belongs to the trunk, the skull and the jaw. It is kept off
   the limbs — near-side limbs carry their own lit ramp and far-side limbs are
   held back in shade, and letting the belly claim either bleached every leg to
   the same cream as the underside. */
const BELLY_OK = LAYERS.map(n => n === 'skin' || n === 'shield' || n === 'jaw' || n === 'head');

function buildMaterials(spec){
  const skin = ramp(spec.skin), horn = ramp(spec.horn, {spread:.12, shift:14});
  return {
    /* Far-side limbs. Two steps down with the contrast raised turned them
       into a black mass slung under the body that read as shadow rather than
       as legs, which on the four-legged animals is half the sprite. */
    far:    { r: shiftRamp(skin, -1), lit:.55 },
    skin:   { r: skin,                lit:1 },
    /* the coat's own dark, pulled toward the outline: a green rim on a green
       coat and a rust one on a rust coat, so it reads as the arm's shadow
       rather than as a black line drawn round it */
    rim:    { r: ramp(mixCol(spec.crest, spec.outline, .45)), lit:0 },
    limb:   { r: shiftRamp(skin, 0),  lit:1.1 },
    /* display structures: a frill or a plate carries its own colour, which is
       standard in modern reconstructions and is also the only thing that
       stops a shield reading as a lump of neck at this size */
    shield: { r: ramp(spec.shield || spec.crest), lit:.85 },
    /* a shade under the skull, so the lip line reads as a step and not only
       as a seam */
    jaw:    { r: shiftRamp(skin, -1), lit:.85 },
    head:   { r: skin,                lit:.9 },
    /* Pulled a third of the way back toward the flank. Taken neat, the belly
       colours are far enough from the body that the underside read as a
       painted stripe; taken a step down their own ramp they fell into the
       dark, saturated end and inverted the countershading outright. */
    belly:  { r: ramp(mixCol(spec.belly, spec.skin, .38)), lit:.62 },
    mark:   { r: ramp(spec.mark || spec.crest), lit:.85 },
    crest:  { r: ramp(spec.crest),    lit:.7 },
    horn:   { r: horn,                lit:1.15 },
    /* Keratin, but not the same keratin. A beak is duller and darker than a
       horn sheath, and it has to be, or it reads as bone stuck to the face. */
    beak:   { r: ramp(spec.beak || spec.horn, {spread:.10, shift:8}), lit:.95 },
    mouth:  { r: ramp(spec.mouth, {spread:.10}), lit:.35 },
    sclera: { r: ramp('#f6f2e2', {spread:.07}),  lit:.3 },
    pupil:  { r: ramp('#181410', {spread:.05}),  lit:0 },
    glint:  { r: ramp('#fffdf2', {spread:.04}),  lit:0 },
    outline: spec.outline
  };
}

/* ---------- composite the layers, light them, draw a selective outline ----- */
const LIGHT = [-0.66, -0.75];      // upper-left
const RIM = 6;                     // how deep the lit/shadowed band reaches

/* Every pass below is per-pixel, and a sprite occupies well under half the
   box it is drawn in. The flatten pass has to look at all of it — that is how
   it finds out where the animal is — but it records the bounds while it goes,
   and the distance field, the lighting and the outline then run over those
   bounds plus a two-pixel margin for the dilation. Outside them every pixel is
   background, which is the value the arrays already hold. */
function composeSprite(layerCanvases, mats, w, h){
  const n = w*h;
  const id = new Int8Array(n).fill(-1);
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  const seen = i => {
    const x = i % w, y = (i - x) / w;
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  };
  for (let li=0; li<LAYERS.length; li++){
    const d = readCtx(layerCanvases[li]).getImageData(0,0,w,h).data;
    if (li === MARK_LAYER){
      // a coat rides the body, and stops where the countershading starts
      for (let i=0;i<n;i++) if (d[i*4+3] >= 118 && id[i] >= 0 && id[i] <= BODY_TOP && id[i] !== RIM_LAYER) id[i] = li;
    } else if (li === RIM_LAYER){
      for (let i=0;i<n;i++) if (d[i*4+3] >= 118 && id[i] >= 0) id[i] = li;
    } else if (li === BELLY_LAYER){
      for (let i=0;i<n;i++) if (d[i*4+3] >= 118 && id[i] >= 0 && BELLY_OK[id[i]]) id[i] = li;
    } else {
      for (let i=0;i<n;i++) if (d[i*4+3] >= 118){ if (id[i] < 0) seen(i); id[i] = li; }
    }
  }
  if (x1 < 0) return makeCv(w,h);                 // nothing was drawn
  x0 = Math.max(0, x0-2); y0 = Math.max(0, y0-2);
  x1 = Math.min(w-1, x1+2); y1 = Math.min(h-1, y1+2);

  // distance from the silhouette edge (two-pass chamfer)
  const dist = new Float32Array(n);
  const BIG = 1e6;
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
    const i = y*w+x;
    if (id[i] < 0){ dist[i] = 0; continue; }
    const out = (x===0||id[i-1]<0) || (x===w-1||id[i+1]<0) || (y===0||id[i-w]<0) || (y===h-1||id[i+w]<0);
    const seam = (x>0&&id[i-1]!==id[i]) || (x<w-1&&id[i+1]!==id[i]) ||
                 (y>0&&id[i-w]!==id[i]) || (y<h-1&&id[i+w]!==id[i]);
    dist[i] = out ? 0 : seam ? 2.6 : BIG;
  }
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
    const i = y*w+x; if (!dist[i]) continue;
    let v = dist[i];
    if (x>0) v = Math.min(v, dist[i-1]+1);
    if (y>0) v = Math.min(v, dist[i-w]+1);
    if (x>0&&y>0) v = Math.min(v, dist[i-w-1]+1.41);
    if (x<w-1&&y>0) v = Math.min(v, dist[i-w+1]+1.41);
    dist[i] = Math.min(v, BIG);
  }
  for (let y=y1;y>=y0;y--) for (let x=x1;x>=x0;x--){
    const i = y*w+x; if (!dist[i]) continue;
    let v = dist[i];
    if (x<w-1) v = Math.min(v, dist[i+1]+1);
    if (y<h-1) v = Math.min(v, dist[i+w]+1);
    if (x<w-1&&y<h-1) v = Math.min(v, dist[i+w+1]+1.41);
    if (x>0&&y<h-1) v = Math.min(v, dist[i+w-1]+1.41);
    dist[i] = v;
  }

  const out = makeCv(w,h), og = readCtx(out), img = og.createImageData(w,h), D = img.data;
  const rgbCache = new Map();
  const put = (i, hex, a) => {
    let c = rgbCache.get(hex);
    if (!c){ c = [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]; rgbCache.set(hex,c); }
    D[i*4]=c[0]; D[i*4+1]=c[1]; D[i*4+2]=c[2]; D[i*4+3]=a;
  };
  const outRamp = ramp(mats.outline, {spread:.09, shift:10});

  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
    const i = y*w+x;
    if (id[i] < 0) continue;
    const m = mats[LAYERS[id[i]]];
    const d = dist[i];
    let step = 0;
    if (m.lit > 0 && d < RIM){
      // inward gradient of the distance field points away from the surface
      const gx = (dist[i + (x<w-1?1:0)] - dist[i - (x>0?1:0)]);
      const gy = (dist[i + (y<h-1?w:0)] - dist[i - (y>0?w:0)]);
      const len = Math.hypot(gx,gy) || 1;
      const nx = -gx/len, ny = -gy/len;                   // outward normal
      const lam = nx*LIGHT[0] + ny*LIGHT[1];
      step = Math.round(lam * (1 - d/RIM) * 3.0 * m.lit);
    }
    put(i, m.r[clamp(2 + step, 0, 4)], 255);
  }
  // selective outline: sample the material it hugs, brighten it on the lit side
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
    const i = y*w+x;
    if (id[i] >= 0) continue;
    let near = -1, ox = 0, oy = 0;
    if (x>0 && id[i-1]>=0){ near = id[i-1]; ox = 1; }
    else if (x<w-1 && id[i+1]>=0){ near = id[i+1]; ox = -1; }
    if (near < 0){
      if (y>0 && id[i-w]>=0){ near = id[i-w]; oy = 1; }
      else if (y<h-1 && id[i+w]>=0){ near = id[i+w]; oy = -1; }
    }
    if (near < 0) continue;
    const lam = ox*LIGHT[0] + oy*LIGHT[1];
    put(i, outRamp[clamp(1 + Math.round(lam*1.4), 0, 3)], 255);
  }
  og.putImageData(img,0,0);
  return out;
}

/* ==========================================================================
   SPECIES ART
   Anatomy follows current reconstructions: lipped jaws and a barrel torso on
   the tyrannosaur, oversized horn sheaths and jugal horns on the ceratopsian,
   a sixty-degree S-curved neck over a shoulder hump on the brachiosaur.
   Proportions are then pushed toward a toy: bigger skull, bigger eye, shorter
   snout, rounder body. Shapes are painted onto material layers, and the
   lighting pass in the colour module turns those layers into shaded pixels.
   ========================================================================== */

/* The box every frame is drawn into. `BAKE_CX` is the centreline and `BAKE_G`
   the ground line inside it; a species draws with the ground at y = 0.

   Every pass in composeSprite is per-pixel over this whole box, so its area is
   the bake cost. The box was 232x210 and the largest frame any species and
   stage produces is 143x94 — five sixths of every pass was spent on empty
   canvas. Measured across every species, stage and animation, the union of
   what is actually touched is 154x95, and this is that plus a margin.

   It is a starting size rather than a limit now: a bake that touches the edge
   of the box grows it and runs again. See growBake below. */
let BAKE_W = 168, BAKE_H = 112, BAKE_G = 100, BAKE_CX = 84;

/* …and it grows if it has to.

   Every one of those numbers was fitted to the animals as they were, which was
   fine while the proportions only changed when someone edited a draw function.
   With the proportions on sliders they change all the time, and the first thing
   anyone does is make the tail longer — at which point the tip ran off the box
   and was cut square, silently, because a bake has no way of complaining.

   So a bake checks whether it touched the edge of its own box, and if it did,
   the box grows and everything re-bakes. It costs a couple of wasted bakes the
   first time a sprite outgrows the box and nothing after that. The cap is there
   because bake cost is the box's area, and an animal that needs more than this
   has something wrong with it rather than something long about it. */
const BAKE_MAX_W = 360, BAKE_MAX_H = 260;
function growBake(){
  if (BAKE_W >= BAKE_MAX_W && BAKE_H >= BAKE_MAX_H) return false;
  if (BAKE_W < BAKE_MAX_W){ BAKE_W += 32; BAKE_CX += 16; }   // half each side
  if (BAKE_H < BAKE_MAX_H){ BAKE_H += 24; BAKE_G  += 24; }   // all of it above
  frameCache.clear();                     // every cached frame was baked smaller
  return true;
}
/* Anything drawn against the border was cut off by it. The compositor leaves a
   two-pixel margin for the outline dilation, so a lit pixel on the boundary is
   not a near miss. */
function touchedEdge(cv){
  const g = readCtx(cv), w = cv.width, h = cv.height;
  const d = g.getImageData(0, 0, w, h).data;
  const hot = i => d[i*4+3] > 8;
  for (let x=0;x<w;x++) if (hot(x) || hot((h-1)*w + x)) return true;
  for (let y=0;y<h;y++) if (hot(y*w) || hot(y*w + w-1)) return true;
  return false;
}

/* STAGE, the per-stage multipliers, is data and lives in 00-art.js with the
   rest of what the editor can turn. */

/* --------------------------- gait and limbs -------------------------------
   The foot follows a stance/swing path against the ground, and the leg is
   solved with two-bone inverse kinematics. Bone lengths never change and a
   planted foot never slides, which is what stops a walk cycle looking rubbery.
   -------------------------------------------------------------------------- */
function gaitFoot(phase, stride, lift, duty){
  phase = ((phase % 1) + 1) % 1;
  if (phase < duty){                       // planted: starts ahead, slides back
    const t = phase / duty;
    return [stride * (-0.5 + t), 0];
  }
  const t = (phase - duty) / (1 - duty);   // airborne: swings from back to front
  return [stride * (0.5 - t), -lift * Math.sin(Math.PI * t)];
}
function limbIK(g, hx, hy, tx, ty, L1, L2, w, bend){
  const dx = tx - hx, dy = ty - hy;
  const raw = Math.hypot(dx, dy) || 0.001;
  const d = clamp(raw, Math.abs(L1 - L2) + 0.01, (L1 + L2) * 0.995);
  const ux = dx / raw, uy = dy / raw;
  const a = (L1*L1 - L2*L2 + d*d) / (2*d);
  const h = Math.sqrt(Math.max(0, L1*L1 - a*a));
  const kx = hx + ux*a - uy*h*bend, ky = hy + uy*a + ux*h*bend;
  const ax = hx + ux*d, ay = hy + uy*d;
  tube(g, [[hx,hy],[kx,ky]], [w, w*.64]);
  tube(g, [[kx,ky],[ax,ay]], [w*.64, w*.44]);
  return [ax, ay];
}
/* hy is the hip height above the ground line at y = 0, so the leg always reaches */
function legStep(g, hx, hy, phase, w, cfg, hornG){
  const len = Math.max(4, -hy);
  const mt = len * cfg.mt;
  if (cfg.thigh) oval(g, hx, hy + len*.17, w*.92, len*.25);
  const [ox, oy] = gaitFoot(phase, len*cfg.stride, len*cfg.lift, cfg.duty);
  const tx = hx + ox + len*(cfg.fwd||0), ty = oy;
  const ank = limbIK(g, hx, hy, tx + mt*cfg.back, ty - mt, (len-mt)/2*1.02, (len-mt)/2*1.02, w, cfg.bend);
  drawFoot(g, hornG, ank, tx, ty, w, cfg.foot || 'bird');
  return [tx, ty];
}

/* A leg folded under a resting animal.

   It cannot be legStep with a low hip. legStep takes the hip height *as* the
   leg length, so dropping the body shortens the bones — the animal ends up
   standing on stumps rather than sitting on folded ones, which is what the old
   sleep pose did and why it read as a crouch rather than as rest. Here the
   standing length comes in separately, the bones keep it, and the joint has to
   go somewhere: the knee swings out and the shank comes back down to the soil.

   `standLen` is what -hy would have been with the animal on its feet.

   The joint is placed, not solved. Handing limbIK an ankle behind the hip and
   letting `bend` find the knee is the obvious thing and it is wrong: with the
   hip barely a bone's length off the ground the perpendicular it swings the
   knee along points *downward*, so the knee came out on the soil under the
   belly and the whole leg stacked up inside the thigh mass. All that reached
   the glass was a haunch with two claws under it, which reads as an animal
   missing its legs rather than one sitting on them.

   What a folded leg actually does is lie flat: the femur runs forward and
   almost level — it has nowhere else to go when the hip is that low — the
   shank comes back down to the soil from the knee, and the metatarsus runs
   forward again from the heel. That last stretch is the one that matters,
   because it is the only part that clears the body: a sitting bird is a body
   with its toes out in front of it. `foldBack` turns the Z round for a limb
   whose joint folds the other way. */
function legFold(g, hx, hy, standLen, w, cfg, hornG){
  const mt = standLen * cfg.mt;
  const bone = (standLen - mt)/2 * 1.02;
  const ty = -w*.26;                                  // the ankle sits on the sole, not in it
  const dir = cfg.foldBack ? 1 : -1;                  // −x is forward, and the knee goes forward
  const drop = (cfg.foldDrop === undefined ? .12 : cfg.foldDrop) * bone;
  const kx = hx + dir*Math.sqrt(Math.max(1, bone*bone - drop*drop)), ky = hy + drop;
  const ax = kx - dir*Math.sqrt(Math.max(1, bone*bone - (ty-ky)*(ty-ky)));
