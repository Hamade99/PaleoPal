<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#1a1208">
<title>Paleopal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   PALEOPAL — the case
   The game lives inside one moulded, speckled dinosaur egg: a shell, a bone
   bezel, a recessed screen and five keys. All of it is CSS. The project ships
   no image assets and this file does not add any.

   Three rules hold the look together, and they are the whole difference
   between a designed object and a rendered one:

   1. ONE GRID. Every size, pad, radius and offset is a whole number of --px.
      The screen is 224 device pixels wide and snaps to a whole or half
      multiple of that, so the case and the world it contains share a grid.

   2. ONE SURFACE, ONE EDGE. Each material is a flat fill with a single hard
      edge and at most one highlight line. The first pass had gradients,
      inset highlights, drop shadows, a glare sheet and a page vignette all
      running at once at similar strength, which is what makes a thing read as
      rendered rather than moulded.

   3. NOTHING PERFECTLY SYMMETRICAL. Moulded plastic has a seam, a gate mark
      and a maker's stamp, and its decoration is cast, not laid out. The
      osteoderms are irregular, the brand sits off centre against the seam,
      and the four screws are not four of the same screw.
   ========================================================================== */
:root{
  /* the grid. Everything in the case is a multiple of this. */
  --px:4px;
  --lcd-w:448px;                     /* set by JS to a whole or half multiple of 224 */

  /* Screen side. The canvas art is tuned to these, so they do not move. */
  --bg:#0e1417; --deep:#141d21; --panel:#1b262a; --line:#2b3a3f;
  --bone:#e9e1cb; --dim:#8fa39a; --ink:#101a18;
  --moss:#8cb765; --ochre:#e0ac48; --rust:#cf6a44; --sky:#7fb2c9;

  /* Case side. Two families and no more: a warm sandstone plastic for the
     shell and a cool grey-green for everything that is not the shell. The
     first pass ran one saturated amber through the shell, the wallet, the
     buttons and the bezel, so nothing had anything to sit against. */
  --shell:#c08f43;                   /* the moulding */
  --shell-hi:#dcb060;                /* the one highlight line, top edges */
  --shell-lo:#8d6527;                /* the one shade, bottom edges */
  --shell-edge:#42290a;              /* the hard outline, used everywhere */
  --scute:#a9782f;
  --bezel:#d8ccac;                   /* bone */
  --bezel-lo:#a08e69;
  --bezel-edge:#5d5138;
  --key:#2f6b49;                     /* jungle green, the one accent */
  --key-hi:#448a60;
  --key-lo:#1b432e;
  --key-edge:#0c2419;
  --stamp:rgba(52,32,6,.55);         /* moulded lettering */

  --safe:env(safe-area-inset-bottom,0px);

  /* Cast-in speckle. Irregular on purpose: an even field of dots reads as
     noise, a cast one reads as material. */
  --speckles:
    radial-gradient(2px 2px at 17px 23px,rgba(74,44,10,.55) 98%,transparent),
    radial-gradient(1px 1px at 61px 70px,rgba(74,44,10,.45) 98%,transparent),
    radial-gradient(3px 3px at 40px 11px,rgba(120,80,30,.40) 98%,transparent),
    radial-gradient(1px 1px at 88px 47px,rgba(74,44,10,.50) 98%,transparent),
    radial-gradient(2px 2px at 12px 96px,rgba(120,80,30,.38) 98%,transparent),
    radial-gradient(1px 1px at 71px 33px,rgba(74,44,10,.42) 98%,transparent),
    radial-gradient(2px 2px at 34px 58px,rgba(120,80,30,.44) 98%,transparent);
  --speckle-size:97px 97px,97px 97px,131px 131px,131px 131px,73px 73px,73px 73px,113px 113px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  /* One flat ground. The radial vignette was doing the work a photograph does,
     not the work a background does. */
  background:#1a1208;
  color:var(--bone);
  font-family:'Pixelify Sans',ui-monospace,monospace;
  display:flex;align-items:flex-start;justify-content:center;
  overscroll-behavior:none;
}
#app{width:100%;max-width:520px;margin:auto 0;
  padding:calc(var(--px)*10) calc(var(--px)*3) calc(var(--px)*7 + var(--safe));position:relative}

/* ---------- the shell ---------- */
.shell{
  position:relative;
  padding:calc(var(--px)*13) calc(var(--px)*5) calc(var(--px)*10);
  border-radius:50% 50% 44% 44% / 20% 20% 15% 15%;
  background-image:var(--speckles),linear-gradient(var(--shell) 0 100%);
  background-size:var(--speckle-size),100% 100%;
  border:2px solid var(--shell-edge);
  /* one highlight along the crown, one shade along the base, one shadow under
     the whole thing. Nothing else. */
  box-shadow:
    inset 0 3px 0 var(--shell-hi),
    inset 0 -5px 0 var(--shell-lo),
    0 calc(var(--px)*2) 0 #33200a;
}
/* the mould seam, and the gate mark it runs to */
.shell::before{
  content:"";position:absolute;left:50%;top:calc(var(--px)*-1);bottom:calc(var(--px)*-1);
  width:1px;background:rgba(66,41,10,.30);pointer-events:none;
  transform:translateX(calc(var(--px)*9));
}
.shell::after{
  content:"";position:absolute;right:calc(var(--px)*7);bottom:calc(var(--px)*3);
  width:calc(var(--px)*2);height:calc(var(--px)*2);border-radius:50%;
  background:rgba(66,41,10,.22);box-shadow:0 1px 0 rgba(255,236,196,.25);
}

/* Osteoderms over the crown, cast rather than laid out: no two the same width,
   the spacing uneven, and the tallest one left of centre. A mirrored row of
   seven identical plates is the single most machine-made thing a case can do. */
.scutes{position:absolute;left:50%;top:calc(var(--px)*-9);transform:translateX(-50%);
  width:calc(var(--px)*56);height:calc(var(--px)*10);pointer-events:none}
.scutes i{position:absolute;bottom:0;transform-origin:50% 100%;
  background:var(--scute);
  border:2px solid var(--shell-edge);border-bottom:0;
  border-radius:56% 56% 0 0 / 76% 76% 0 0;
  box-shadow:inset 0 2px 0 var(--shell-hi)}
.scutes i:nth-child(1){left:0;    bottom:-21px;width:13px;height:15px;transform:rotate(-31deg)}
.scutes i:nth-child(2){left:30px; bottom:-11px;width:16px;height:24px;transform:rotate(-20deg)}
.scutes i:nth-child(3){left:64px; bottom:-2px; width:14px;height:27px;transform:rotate(-11deg)}
.scutes i:nth-child(4){left:92px; bottom:1px;  width:19px;height:33px;transform:rotate(-3deg)}
.scutes i:nth-child(5){left:126px;bottom:-1px; width:15px;height:26px;transform:rotate(7deg)}
.scutes i:nth-child(6){left:157px;bottom:-12px;width:17px;height:21px;transform:rotate(18deg)}
.scutes i:nth-child(7){left:191px;bottom:-22px;width:12px;height:14px;transform:rotate(30deg)}

/* Two three-toed feet. Flat plastic with one hard edge and a keratin claw on
   each toe — the claws have to break the silhouette or the foot reads as a
   tab with dots painted on it. */
.feet{position:absolute;left:0;right:0;bottom:calc(var(--px)*-3);
  display:flex;justify-content:center;gap:calc(var(--px)*13);pointer-events:none}
.feet i{position:relative;width:calc(var(--px)*24);height:calc(var(--px)*5);
  border-radius:0 0 calc(var(--px)*2) calc(var(--px)*2);
  background:var(--shell-lo);
  border:2px solid var(--shell-edge);border-top:0}
.feet b{position:absolute;width:calc(var(--px)*6);height:calc(var(--px)*5);
  bottom:calc(var(--px)*-3);
  border-radius:0 0 50% 50% / 0 0 72% 72%;
  background:var(--shell-lo);
  border:2px solid var(--shell-edge);border-top:0}
.feet b:nth-child(1){left:1px}
.feet b:nth-child(2){left:calc(var(--px)*8);width:calc(var(--px)*7);height:calc(var(--px)*6);
  bottom:calc(var(--px)*-4)}
.feet b:nth-child(3){right:1px}
.feet b::after{content:"";position:absolute;left:50%;bottom:1px;transform:translateX(-50%);
  width:calc(var(--px)*2);height:calc(var(--px)*2);border-radius:0 0 50% 50%;
  background:var(--bezel);box-shadow:0 0 0 1.5px var(--shell-edge)}

/* ---------- faceplate ---------- */
.shellhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:calc(var(--px)*2);padding:0 calc(var(--px)*2);margin-bottom:calc(var(--px)*3)}
/* the brand is moulded lettering, and it sits against the seam rather than in
   the middle of the shell */
.brand{
  flex:0 0 100%;text-align:center;position:relative;
  font-weight:700;font-size:calc(var(--px)*5);letter-spacing:2px;
  color:var(--stamp);text-shadow:0 1px 0 rgba(255,236,196,.45);
  padding-left:calc(var(--px)*9);
}
.brand span{color:#22503a}
.brand .rivet{position:absolute;left:50%;bottom:calc(var(--px)*-2);
  transform:translateX(calc(-50% + var(--px)*4.5));
  width:calc(var(--px)*11);height:2px;background:rgba(66,41,10,.30);
  box-shadow:0 1px 0 rgba(255,236,196,.35)}
.tools{display:flex;align-items:center;gap:calc(var(--px)*2);margin-top:calc(var(--px)*2)}
.wallet{
  display:flex;align-items:center;gap:calc(var(--px)*1.5);
  font-size:calc(var(--px)*4);color:var(--ochre);
  background:#141d21;border:2px solid var(--shell-edge);
  border-radius:calc(var(--px)*2);
  padding:calc(var(--px)*1) calc(var(--px)*2.5) calc(var(--px)*0.75);
  box-shadow:inset 0 2px 0 #0a1013
}
#coinArt{display:flex}

/* Small keys on the faceplate. Same moulding as the big ones underneath, so
   there is one button in this design rather than three. */
.iconbtn{
  background:var(--shell);
  border:2px solid var(--shell-edge);color:var(--stamp);
  width:calc(var(--px)*9);height:calc(var(--px)*9);
  border-radius:calc(var(--px)*2);cursor:pointer;
  font-size:calc(var(--px)*4);font-family:inherit;display:grid;place-items:center;
  box-shadow:inset 0 2px 0 var(--shell-hi),inset 0 -2px 0 var(--shell-lo),
             0 calc(var(--px)*1) 0 var(--shell-edge)
}
.iconbtn:hover{background:var(--shell-hi)}
.iconbtn:active,.iconbtn.down{transform:translateY(calc(var(--px)*1));
  box-shadow:inset 0 2px 0 var(--shell-lo)}
.iconbtn.off{filter:saturate(.35) brightness(.85)}
.iconbtn.dev{background:var(--key);border-color:var(--key-edge);color:#dff0e4;
  box-shadow:inset 0 2px 0 var(--key-hi),inset 0 -2px 0 var(--key-lo),
             0 calc(var(--px)*1) 0 var(--key-edge)}
.iconbtn.dev:hover{background:var(--key-hi)}
#btnNest{position:relative}
#nestCount{position:absolute;right:calc(var(--px)*-1);top:calc(var(--px)*-1);
  min-width:calc(var(--px)*4);height:calc(var(--px)*4);border-radius:calc(var(--px)*2);
  background:var(--rust);color:#fff;font-size:calc(var(--px)*2.5);
  line-height:calc(var(--px)*3.5);text-align:center;font-style:normal;
  border:1.5px solid var(--shell-edge)}
#nestCount:empty{display:none}

/* ---------- bone bezel ---------- */
.bezel{
  position:relative;border-radius:calc(var(--px)*5);padding:calc(var(--px)*3);
  background:var(--bezel);
  border:2px solid var(--bezel-edge);
  box-shadow:inset 0 2px 0 #f2ead2,inset 0 -3px 0 var(--bezel-lo),
             0 calc(var(--px)*1) 0 rgba(66,41,10,.5)
}
/* Four fixings, not four of the same screw: two slotted, one cross, one plug.
   Nobody reads them individually and everybody reads the difference. */
.screw{position:absolute;width:calc(var(--px)*2);height:calc(var(--px)*2);border-radius:50%;
  background:#b9aa85;box-shadow:inset 0 0 0 1px rgba(80,66,38,.7)}
.screw::after{content:"";position:absolute;left:1px;top:calc(50% - .5px);
  width:calc(100% - 2px);height:1px;background:rgba(70,58,32,.85)}
.screw.tr::before{content:"";position:absolute;top:1px;left:calc(50% - .5px);
  width:1px;height:calc(100% - 2px);background:rgba(70,58,32,.85)}
.screw.br::after{display:none}
.screw.tl{left:calc(var(--px)*1.5);top:calc(var(--px)*1.5)}
.screw.tr{right:calc(var(--px)*1.5);top:calc(var(--px)*1.5)}
.screw.bl{left:calc(var(--px)*1.5);bottom:calc(var(--px)*1.5)}
.screw.br{right:calc(var(--px)*1.5);bottom:calc(var(--px)*1.5)}

.screen{
  border-radius:calc(var(--px)*3);padding:calc(var(--px)*2.5);
  background:var(--bg);
  border:2px solid #05090a;
  box-shadow:inset 0 2px 0 #05090a
}

/* ---------- identity ---------- */
.ident{display:flex;align-items:baseline;gap:calc(var(--px)*2);flex-wrap:wrap;
  margin-bottom:calc(var(--px)*2)}
.dname{font-size:calc(var(--px)*5);line-height:1;cursor:pointer;
  border-bottom:1px dashed transparent;color:var(--bone)}
.dname:hover{border-bottom-color:var(--line)}
.dsub{font-size:calc(var(--px)*3);color:var(--dim)}
#nameEdit{font:inherit;font-size:calc(var(--px)*5);background:var(--panel);color:var(--bone);
  border:1px solid var(--line);border-radius:calc(var(--px)*1);
  padding:1px calc(var(--px)*1.5);width:calc(var(--px)*38)}

/* ---------- needs: the classic icon strip ---------- */
.needs{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--px)*1.5);
  margin-bottom:calc(var(--px)*2.5)}
.need{background:var(--deep);border:1px solid var(--line);
  padding:calc(var(--px)*1.25) calc(var(--px)*1.5) calc(var(--px)*1.5);
  display:flex;flex-direction:column;gap:calc(var(--px)*1)}
.need .cap{display:flex;align-items:center;gap:calc(var(--px)*1);min-height:calc(var(--px)*3.5)}
.need .cap canvas{image-rendering:pixelated;width:calc(var(--px)*3);height:calc(var(--px)*3);
  flex:0 0 calc(var(--px)*3)}
.need b{font-weight:500;font-size:calc(var(--px)*2.5);color:var(--dim);letter-spacing:.5px}
/* ten hard cells behind a black grid, square corners */
.track{position:relative;height:calc(var(--px)*2.5);background:#05090a;border:1px solid #000;
  overflow:hidden}
.fill{height:100%;width:50%;transition:width .45s linear,background .4s}
.seg{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#05090a calc(10% - 2px) 10%)}
.need.low b{color:var(--rust)}
.need.low{border-color:#6d3527}

/* ---------- the glass ---------- */
.stage{position:relative;display:flex;flex-direction:column;align-items:center}
/* The screen is 224 device pixels across and only ever shown at a whole or
   half multiple of that, set by fitScreen(). At an arbitrary fraction the
   pixel grid of the world came out uneven against the grid of the case, which
   is visible on everything with a one-pixel line in it. */
.lcd{position:relative;width:var(--lcd-w);max-width:100%;
  box-shadow:0 0 0 2px #05090a,0 0 0 3px rgba(140,183,101,.14)}
canvas#scene{display:block;width:100%;height:auto;image-rendering:pixelated;
  touch-action:none;cursor:pointer}
.lamp{position:absolute;right:0;bottom:calc(var(--px)*-2.5);
  width:calc(var(--px)*1.5);height:calc(var(--px)*1.5);border-radius:50%;background:var(--moss)}
.lamp.rest{background:var(--sky)}
.lamp.bad{background:var(--rust)}

.bubble{
  position:absolute;left:50%;top:calc(var(--px)*8);transform:translate(-50%,-4px);
  background:var(--bone);color:var(--ink);font-size:calc(var(--px)*3);
  padding:calc(var(--px)*1.5) calc(var(--px)*2.5);max-width:86%;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;line-height:1.3;
  border:2px solid var(--ink);z-index:2
}
.bubble.on{opacity:1;transform:translate(-50%,0)}
.picks span{position:absolute;bottom:calc(var(--px)*3.5);transform:translateX(-50%);
  text-align:center;font-size:calc(var(--px)*2.75);color:#b9c4bd;line-height:1.35;
  white-space:nowrap;background:rgba(10,18,16,.85);border:1px solid rgba(90,116,104,.55);
  padding:calc(var(--px)*0.75) calc(var(--px)*1.75)}
.picks b{display:block;font-size:calc(var(--px)*3);color:var(--bone);letter-spacing:.3px}
.badge{position:absolute;left:calc(var(--px)*1);top:calc(var(--px)*1);right:calc(var(--px)*1);
  display:flex;gap:calc(var(--px)*1);flex-wrap:wrap}
.tag{background:rgba(10,18,16,.88);border:1px solid #3a4d45;color:var(--bone);
  font-size:calc(var(--px)*2.5);padding:1px calc(var(--px)*1.5);
  display:flex;align-items:center;gap:calc(var(--px)*1);line-height:1.5}
.tag.warn{border-color:#8a4130;color:#f5c3ad;background:rgba(48,17,9,.88)}
.dot{width:calc(var(--px)*1.25);height:calc(var(--px)*1.25);border-radius:50%;background:var(--moss)}
.tag.warn .dot{background:var(--rust)}

/* ---------- mood strip ---------- */
.moodrow{display:flex;align-items:center;justify-content:space-between;
  gap:calc(var(--px)*2.5);margin:calc(var(--px)*2.5) 0 0}
.mood{font-size:calc(var(--px)*3.25);color:var(--bone);line-height:1.35}
.mood em{font-style:normal;color:var(--dim)}
.bondwrap{display:flex;align-items:center;gap:calc(var(--px)*1.5);font-size:calc(var(--px)*2.75);
  color:var(--dim);flex:0 0 auto}
.bondwrap canvas{image-rendering:pixelated}

/* ---------- the five keys ---------- */
.keys{padding-top:calc(var(--px)*4)}
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--px)*2)}
.act{
  background:var(--key);
  border:2px solid var(--key-edge);color:#dff0e4;
  border-radius:calc(var(--px)*3);min-height:calc(var(--px)*16);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--px)*1);
  font-family:inherit;font-size:calc(var(--px)*3);letter-spacing:.4px;cursor:pointer;
  position:relative;padding:calc(var(--px)*1.5) calc(var(--px)*0.5);
  box-shadow:inset 0 3px 0 var(--key-hi),inset 0 -3px 0 var(--key-lo),
             0 calc(var(--px)*1.5) 0 var(--key-edge)
}
.act:hover{background:var(--key-hi)}
/* A key that opened a screen stays pressed, the way a latching key does. */
.act:active,.act.down{transform:translateY(calc(var(--px)*1.5));
  box-shadow:inset 0 3px 0 var(--key-lo)}
.act .ico{display:flex;height:calc(var(--px)*6);align-items:center}
.act .ico canvas{width:calc(var(--px)*6);height:calc(var(--px)*6);image-rendering:pixelated}
.act[disabled]{opacity:.35;cursor:default;transform:none;filter:grayscale(.5);
  box-shadow:0 calc(var(--px)*1.5) 0 var(--key-edge)}
.act .nub{position:absolute;top:calc(var(--px)*1);right:calc(var(--px)*1.5);
  width:calc(var(--px)*2);height:calc(var(--px)*2);border-radius:50%;
  background:var(--rust);border:1px solid #40140a}

/* moulded nameplate and speaker slots */
.plate{display:flex;align-items:center;justify-content:center;gap:calc(var(--px)*2);
  margin-top:calc(var(--px)*4);
  font-size:calc(var(--px)*2.75);letter-spacing:2.4px;color:var(--stamp);
  text-shadow:0 1px 0 rgba(255,240,204,.5)}
.grille{width:calc(var(--px)*8);height:calc(var(--px)*2);
  background:repeating-linear-gradient(90deg,rgba(66,41,10,.34) 0 2px,transparent 2px 5px);
  box-shadow:0 1px 0 rgba(255,236,196,.4)}

/* ---------- the panels that stayed in the DOM ----------
   Only the dossier, the developer harness and the two notices. Everything a
   player does to the animal happens on the glass; these are for reading. */
.scrim{position:fixed;inset:0;background:rgba(10,6,2,.75);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,102%);
  width:100%;max-width:520px;background:var(--deep);
  border:2px solid var(--bezel-edge);border-bottom:0;
  border-radius:calc(var(--px)*4) calc(var(--px)*4) 0 0;
  padding:calc(var(--px)*3) calc(var(--px)*3) calc(var(--px)*4 + var(--safe));z-index:6;
  transition:transform .26s cubic-bezier(.2,.9,.3,1);max-height:84vh;overflow-y:auto
}
.sheet.on{transform:translate(-50%,0)}
.sheet.dock{max-height:52vh}
@media (min-width:860px){
  .sheet.dock{
    left:auto;right:0;top:0;bottom:0;width:calc(var(--px)*90);max-width:38vw;
    max-height:100vh;transform:translateX(104%);
    border-radius:calc(var(--px)*4) 0 0 calc(var(--px)*4);
    border:2px solid var(--bezel-edge);border-right:0;padding-top:calc(var(--px)*4)
  }
  .sheet.dock.on{transform:translateX(0)}
  .sheet.dock .grip{display:none}
}
.sheet h2{font-size:calc(var(--px)*5);font-weight:700;margin-bottom:2px;color:var(--bone)}
.sheet p.lede{font-size:calc(var(--px)*3.25);color:var(--dim);margin-bottom:calc(var(--px)*3);
  line-height:1.5}
.grip{width:calc(var(--px)*11);height:calc(var(--px)*1.25);background:var(--bezel-lo);
  margin:0 auto calc(var(--px)*3)}
.row{
  display:flex;align-items:center;gap:calc(var(--px)*3);width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);color:var(--bone);
  border-radius:calc(var(--px)*2);padding:calc(var(--px)*2.5) calc(var(--px)*3);
  margin-bottom:calc(var(--px)*1.75);cursor:pointer;font:inherit;
  box-shadow:0 calc(var(--px)*0.75) 0 #0b1214
}
.row:hover{border-color:#3d5158}
.row:active{transform:translateY(calc(var(--px)*0.75));box-shadow:none}
.row[disabled]{opacity:.4;cursor:default;box-shadow:none;transform:none}

<script>
'use strict';
/* ==========================================================================
   PALEOPAL — a pocket dinosaur care sim
   Sections: core → sprites → species → world → sim → render → ui
   ========================================================================== */

const W = 224, H = 168, GROUND = 140;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;
const rnd   = (a,b) => a + Math.random()*(b-a);
const pick  = a => a[(Math.random()*a.length)|0];
const $     = id => document.getElementById(id);
const HOUR  = 3600e3, MIN = 60e3;

/* ---------- storage: works as artifact, as a file, and inside a webview ---- */
const Store = {
  async get(k){
    if (window.storage) { try { const r = await window.storage.get(k); return r ? r.value : null; } catch(e){ return null; } }
    try { return localStorage.getItem(k); } catch(e){ return null; }
  },
  async set(k,v){
    if (window.storage) { try { await window.storage.set(k,v); return; } catch(e){ return; } }
    try { localStorage.setItem(k,v); } catch(e){}
  },
  async del(k){
    if (window.storage) { try { await window.storage.delete(k); return; } catch(e){ return; } }
    try { localStorage.removeItem(k); } catch(e){}
  }
};

/* ---------- audio ---------- */
let AC = null;
function tone(f, dur, type, vol, delay, slide){
  if (!G || !G.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime + (delay||0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(28, f + slide), t + dur);
    g.gain.setValueAtTime(vol || .06, t);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + .04);
  }catch(e){}
}
const SFX = {
  chomp:()=>{tone(200,.06,'square',.07);tone(140,.08,'square',.07,.06);},
  coin :()=>{tone(880,.06,'square',.05);tone(1320,.09,'square',.05,.06);},
  purr :()=>{tone(300,.14,'sine',.05,0,90);},
  crack:()=>tone(130,.07,'sawtooth',.09,0,-45),
  hatch:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.13,'square',.06,i*.1)),
  bonk :()=>tone(95,.15,'square',.09,0,-45),
  wash :()=>tone(420,.14,'triangle',.06,0,520),
  yawn :()=>tone(480,.42,'sine',.05,0,-300),
  roar :()=>{tone(72,.5,'sawtooth',.11,0,-32);tone(54,.55,'square',.08,.05,-22);},
  pop  :()=>tone(340,.05,'triangle',.07),
  sneeze:()=>{tone(700,.05,'square',.05);tone(240,.16,'sawtooth',.08,.05,-120);}
};

/* ==========================================================================
   SPRITE PIPELINE
   Shapes are drawn as smooth paths on an offscreen canvas, then hard-quantised
   (alpha threshold + palette snap) and given a dilated outline. That gives real
   pixel art with correct anatomy instead of hand-typed ASCII blobs.
   ========================================================================== */

function makeCv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function readCtx(c){ return c.getContext('2d', { willReadFrequently:true }); }
const article = w => /^[aeiou]/i.test(w) ? 'an ' : 'a ';
/* the copy is written out in words, so counts that appear in a sentence are too */
const NUM_WORD = ['No','One','Two','Three','Four','Five','Six','Seven','Eight'];
const numWord = n => NUM_WORD[n] || String(n);

/* tapered tube through a centreline — the workhorse for necks, tails, limbs */
function tube(g, pts, widths, col){
  const n = pts.length;
  const left = [], right = [];
  for (let i=0;i<n;i++){
    const p = pts[i];
    const a = pts[Math.max(0,i-1)], b = pts[Math.min(n-1,i+1)];
    let dx = b[0]-a[0], dy = b[1]-a[1];
    const L = Math.hypot(dx,dy) || 1; dx/=L; dy/=L;
    const w = widths[i]/2;
    left.push([p[0]-dy*w, p[1]+dx*w]);
    right.push([p[0]+dy*w, p[1]-dx*w]);
  }
  if (col) g.fillStyle = col;
  g.beginPath();
  curveThrough(g, left, true);
  const rr = right.slice().reverse();
  for (let i=0;i<rr.length;i++) g.lineTo(rr[i][0], rr[i][1]);
  g.closePath(); g.fill();
  // round the caps so tips read as tips, not chisels
  g.beginPath(); g.arc(pts[0][0],pts[0][1],Math.max(.5,widths[0]/2),0,7); g.fill();
  g.beginPath(); g.arc(pts[n-1][0],pts[n-1][1],Math.max(.5,widths[n-1]/2),0,7); g.fill();
}
function curveThrough(g, p, start){
  if (start) g.moveTo(p[0][0], p[0][1]);
  for (let i=0;i<p.length-1;i++){
    const a=p[i], b=p[i+1];
    const prev=p[Math.max(0,i-1)], next=p[Math.min(p.length-1,i+2)];
    const c1=[a[0]+(b[0]-prev[0])/6, a[1]+(b[1]-prev[1])/6];
    const c2=[b[0]-(next[0]-a[0])/6, b[1]-(next[1]-a[1])/6];
    g.bezierCurveTo(c1[0],c1[1],c2[0],c2[1],b[0],b[1]);
  }
}
function blob(g, pts, col){
  if (col) g.fillStyle = col;
  g.beginPath();
  const p = pts.concat([pts[0],pts[1]]);
  g.moveTo(p[0][0],p[0][1]);
  for (let i=0;i<p.length-1;i++){
    const a=p[i], b=p[i+1];
    const prev=p[(i-1+p.length)%p.length], next=p[(i+2)%p.length];
    g.bezierCurveTo(a[0]+(b[0]-prev[0])/6, a[1]+(b[1]-prev[1])/6,
                    b[0]-(next[0]-a[0])/6, b[1]-(next[1]-a[1])/6, b[0],b[1]);
  }
  g.closePath(); g.fill();
}
function oval(g,x,y,rx,ry,col,rot){
  if (col) g.fillStyle=col; g.beginPath(); g.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot||0,0,7); g.fill();
}

/* hard-edge pass: kill antialiasing, snap to the species ramp, dilate outline */
function crisp(src, palette, outline){
  const w = src.width, h = src.height;
  const g = readCtx(src);
  const img = g.getImageData(0,0,w,h), d = img.data;
  const ramp = palette.map(hex => [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16),hex]);
  const solid = new Uint8Array(w*h);
  for (let i=0;i<w*h;i++){
    const o=i*4;
    if (d[o+3] < 118){ d[o+3]=0; continue; }
    d[o+3]=255; solid[i]=1;
    let best=ramp[0], bd=1e9;
    for (const c of ramp){
      const dd=(c[0]-d[o])**2+(c[1]-d[o+1])**2+(c[2]-d[o+2])**2;
      if (dd<bd){bd=dd;best=c;}
    }
    d[o]=best[0]; d[o+1]=best[1]; d[o+2]=best[2];
  }
  // dilate a 1px outline into the transparent border
  const oc = [parseInt(outline.slice(1,3),16),parseInt(outline.slice(3,5),16),parseInt(outline.slice(5,7),16)];
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const i=y*w+x; if (solid[i]) continue;
    if ((x>0&&solid[i-1])||(x<w-1&&solid[i+1])||(y>0&&solid[i-w])||(y<h-1&&solid[i+w])){
      const o=i*4; d[o]=oc[0]; d[o+1]=oc[1]; d[o+2]=oc[2]; d[o+3]=255;
    }
  }
  g.putImageData(img,0,0);
  return src;
}

/* trim transparent margins so anchors and ground contact stay exact */
function trim(src){
  const w=src.width,h=src.height,g=readCtx(src);
  const d=g.getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(d[(y*w+x)*4+3]){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  }
  if (x1<0) return {cv:src,ox:0,oy:0,w,h};
  const nw=x1-x0+1, nh=y1-y0+1, out=makeCv(nw,nh);
  out.getContext('2d').drawImage(src,x0,y0,nw,nh,0,0,nw,nh);
  return {cv:out, ox:x0, oy:y0, w:nw, h:nh};
}

/* ==========================================================================
   COLOUR + LIGHTING
   Palettes are generated as hue-shifted ramps: shadows drift cooler and more
   saturated, highlights warmer and less saturated. Shading uses one light,
   from the upper left, applied through a distance field so the form reads
   instead of pillowing evenly around the outline.
   ========================================================================== */

function hexToHsl(hex){
  let r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2;
  let h = 0, s = 0;
  if (mx !== mn){
    const d = mx - mn;
    s = l > .5 ? d/(2-mx-mn) : d/(mx+mn);
    h = mx === r ? (g-b)/d + (g<b?6:0) : mx === g ? (b-r)/d + 2 : (r-g)/d + 4;
    h *= 60;
  }
  return [h, s, l];
}
function hslToHex(h, s, l){
  h = ((h % 360) + 360) % 360; s = clamp(s,0,1); l = clamp(l,0,1);
  const c = (1 - Math.abs(2*l-1)) * s, x = c * (1 - Math.abs((h/60)%2 - 1)), m = l - c/2;
  let r,g,b;
  if (h<60) [r,g,b]=[c,x,0]; else if (h<120) [r,g,b]=[x,c,0]; else if (h<180) [r,g,b]=[0,c,x];
  else if (h<240) [r,g,b]=[0,x,c]; else if (h<300) [r,g,b]=[x,0,c]; else [r,g,b]=[c,0,x];
  const q = v => Math.round((v+m)*255).toString(16).padStart(2,'0');
  return '#' + q(r) + q(g) + q(b);
}
/* five steps, darkest first, with the hue rotated along the ramp */
function ramp(base, opts){
  opts = opts || {};
  const [h,s,l] = hexToHsl(base);
  const spread = opts.spread || .19, shift = opts.shift || 22;
  const out = [];
  for (let i=0;i<5;i++){
    const t = (i-2)/2;                                   // -1 shadow … +1 light
    out.push(hslToHex(
      h + (t<0 ? t*shift : t*shift*.55),                 // shadows swing further
      clamp(s + (t<0 ? .10*-t : -.13*t), .05, 1),
      clamp(l + t*spread, .05, .95)
    ));
  }
  return out;
}
function shiftRamp(r, n){ return r.map((_,i) => r[clamp(i+n,0,4)]); }
/* blend two hexes. Used to pull the underside toward the flank hue so that
   countershading reads as light falling off a body rather than as a second
   colour painted onto it. */
function mixCol(a, b, t){
  const A = [1,3,5].map(i => parseInt(a.slice(i,i+2),16));
  const B = [1,3,5].map(i => parseInt(b.slice(i,i+2),16));
  return '#' + A.map((v,i) => Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('');
}

/* Material keys, in paint order: a later layer wins where two overlap.

   The compositor only draws an internal edge where two *different* materials
   meet, so two shapes sharing a layer merge into one region with nothing
   between them. That is why the mandible has a layer of its own instead of
   sharing `head` — painted onto `head` it was drawn correctly, hinged
   correctly, and completely invisible, which is what left every animal with a
   mouthless face.

   `shield` and `jaw` sit below `head`, so a frill and a lower jaw pass behind
   the skull. `belly` and `mark` sit above the body but are masked to it, so
   both can be painted generously and let the mask trim them to the
   silhouette. `mark` stops below `belly`, which is how a coat pattern fades
   out where the countershading starts rather than running across it.

   `horn` sits above `mouth` because teeth, beaks and claws stand in front of
   the mouth cavity, not behind it. The other way round the gape painted over
   every tooth in it. */
const LAYERS = ['far','skin','limb','shield','jaw','head','belly','mark','crest','mouth','horn','sclera','pupil','glint'];
const BODY_TOP    = LAYERS.indexOf('head');
const BELLY_LAYER = LAYERS.indexOf('belly');
const MARK_LAYER  = LAYERS.indexOf('mark');
/* Countershading belongs to the trunk, the skull and the jaw. It is kept off
   the limbs — near-side limbs carry their own lit ramp and far-side limbs are
   held back in shade, and letting the belly claim either bleached every leg to
   the same cream as the underside. */
const BELLY_OK = LAYERS.map(n => n === 'skin' || n === 'shield' || n === 'jaw' || n === 'head');

function buildMaterials(spec){
  const skin = ramp(spec.skin), horn = ramp(spec.horn, {spread:.12, shift:14});
  return {
    /* Far-side limbs. Two steps down with the contrast raised turned them
       into a black mass slung under the body that read as shadow rather than
       as legs, which on the four-legged animals is half the sprite. */
    far:    { r: shiftRamp(skin, -1), lit:.55 },
    skin:   { r: skin,                lit:1 },
    limb:   { r: shiftRamp(skin, 0),  lit:1.1 },
    /* display structures: a frill or a plate carries its own colour, which is
       standard in modern reconstructions and is also the only thing that
       stops a shield reading as a lump of neck at this size */
    shield: { r: ramp(spec.shield || spec.crest), lit:.85 },
    /* a shade under the skull, so the lip line reads as a step and not only
       as a seam */
    jaw:    { r: shiftRamp(skin, -1), lit:.85 },
    head:   { r: skin,                lit:.9 },
    /* Pulled a third of the way back toward the flank. Taken neat, the belly
       colours are far enough from the body that the underside read as a
       painted stripe; taken a step down their own ramp they fell into the
       dark, saturated end and inverted the countershading outright. */
    belly:  { r: ramp(mixCol(spec.belly, spec.skin, .38)), lit:.62 },
    mark:   { r: ramp(spec.mark || spec.crest), lit:.85 },
    crest:  { r: ramp(spec.crest),    lit:.7 },
    horn:   { r: horn,                lit:1.15 },
    mouth:  { r: ramp(spec.mouth, {spread:.10}), lit:.35 },
    sclera: { r: ramp('#f6f2e2', {spread:.07}),  lit:.3 },
    pupil:  { r: ramp('#181410', {spread:.05}),  lit:0 },
    glint:  { r: ramp('#fffdf2', {spread:.04}),  lit:0 },
    outline: spec.outline
  };
}

/* ---------- composite the layers, light them, draw a selective outline ----- */
const LIGHT = [-0.66, -0.75];      // upper-left
const RIM = 6;                     // how deep the lit/shadowed band reaches

/* Every pass below is per-pixel, and a sprite occupies well under half the
   box it is drawn in. The flatten pass has to look at all of it — that is how
   it finds out where the animal is — but it records the bounds while it goes,
   and the distance field, the lighting and the outline then run over those
   bounds plus a two-pixel margin for the dilation. Outside them every pixel is
   background, which is the value the arrays already hold. */
function composeSprite(layerCanvases, mats, w, h){
  const n = w*h;
  const id = new Int8Array(n).fill(-1);
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  const seen = i => {
    const x = i % w, y = (i - x) / w;
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  };
  for (let li=0; li<LAYERS.length; li++){
    const d = readCtx(layerCanvases[li]).getImageData(0,0,w,h).data;
    if (li === MARK_LAYER){
      // a coat rides the body, and stops where the countershading starts
      for (let i=0;i<n;i++) if (d[i*4+3] >= 118 && id[i] >= 0 && id[i] <= BODY_TOP) id[i] = li;
    } else if (li === BELLY_LAYER){
      for (let i=0;i<n;i++) if (d[i*4+3] >= 118 && id[i] >= 0 && BELLY_OK[id[i]]) id[i] = li;
    } else {
      for (let i=0;i<n;i++) if (d[i*4+3] >= 118){ if (id[i] < 0) seen(i); id[i] = li; }
    }
  }
  if (x1 < 0) return makeCv(w,h);                 // nothing was drawn
  x0 = Math.max(0, x0-2); y0 = Math.max(0, y0-2);
  x1 = Math.min(w-1, x1+2); y1 = Math.min(h-1, y1+2);

  // distance from the silhouette edge (two-pass chamfer)
  const dist = new Float32Array(n);
  const BIG = 1e6;
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
    const i = y*w+x;
    if (id[i] < 0){ dist[i] = 0; continue; }
    const out = (x===0||id[i-1]<0) || (x===w-1||id[i+1]<0) || (y===0||id[i-w]<0) || (y===h-1||id[i+w]<0);
    const seam = (x>0&&id[i-1]!==id[i]) || (x<w-1&&id[i+1]!==id[i]) ||
                 (y>0&&id[i-w]!==id[i]) || (y<h-1&&id[i+w]!==id[i]);
    dist[i] = out ? 0 : seam ? 2.6 : BIG;
  }
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
    const i = y*w+x; if (!dist[i]) continue;
    let v = dist[i];
    if (x>0) v = Math.min(v, dist[i-1]+1);
    if (y>0) v = Math.min(v, dist[i-w]+1);
    if (x>0&&y>0) v = Math.min(v, dist[i-w-1]+1.41);
    if (x<w-1&&y>0) v = Math.min(v, dist[i-w+1]+1.41);
    dist[i] = Math.min(v, BIG);
  }
  for (let y=y1;y>=y0;y--) for (let x=x1;x>=x0;x--){
    const i = y*w+x; if (!dist[i]) continue;
    let v = dist[i];
    if (x<w-1) v = Math.min(v, dist[i+1]+1);
    if (y<h-1) v = Math.min(v, dist[i+w]+1);
    if (x<w-1&&y<h-1) v = Math.min(v, dist[i+w+1]+1.41);
    if (x>0&&y<h-1) v = Math.min(v, dist[i+w-1]+1.41);
    dist[i] = v;
  }

  const out = makeCv(w,h), og = readCtx(out), img = og.createImageData(w,h), D = img.data;
  const rgbCache = new Map();
  const put = (i, hex, a) => {
    let c = rgbCache.get(hex);
    if (!c){ c = [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]; rgbCache.set(hex,c); }
    D[i*4]=c[0]; D[i*4+1]=c[1]; D[i*4+2]=c[2]; D[i*4+3]=a;
  };
  const outRamp = ramp(mats.outline, {spread:.09, shift:10});

  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
    const i = y*w+x;
    if (id[i] < 0) continue;
    const m = mats[LAYERS[id[i]]];
    const d = dist[i];
    let step = 0;
    if (m.lit > 0 && d < RIM){
      // inward gradient of the distance field points away from the surface
      const gx = (dist[i + (x<w-1?1:0)] - dist[i - (x>0?1:0)]);
      const gy = (dist[i + (y<h-1?w:0)] - dist[i - (y>0?w:0)]);
      const len = Math.hypot(gx,gy) || 1;
      const nx = -gx/len, ny = -gy/len;                   // outward normal
      const lam = nx*LIGHT[0] + ny*LIGHT[1];
      step = Math.round(lam * (1 - d/RIM) * 3.0 * m.lit);
    }
    put(i, m.r[clamp(2 + step, 0, 4)], 255);
  }
  // selective outline: sample the material it hugs, brighten it on the lit side
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
    const i = y*w+x;
    if (id[i] >= 0) continue;
    let near = -1, ox = 0, oy = 0;
    if (x>0 && id[i-1]>=0){ near = id[i-1]; ox = 1; }
    else if (x<w-1 && id[i+1]>=0){ near = id[i+1]; ox = -1; }
    if (near < 0){
      if (y>0 && id[i-w]>=0){ near = id[i-w]; oy = 1; }
      else if (y<h-1 && id[i+w]>=0){ near = id[i+w]; oy = -1; }
    }
    if (near < 0) continue;
    const lam = ox*LIGHT[0] + oy*LIGHT[1];
    put(i, outRamp[clamp(1 + Math.round(lam*1.4), 0, 3)], 255);
  }
  og.putImageData(img,0,0);
  return out;
}

/* ==========================================================================
   SPECIES ART
   Anatomy follows current reconstructions: lipped jaws and a barrel torso on
   the tyrannosaur, oversized horn sheaths and jugal horns on the ceratopsian,
   a sixty-degree S-curved neck over a shoulder hump on the brachiosaur.
   Proportions are then pushed toward a toy: bigger skull, bigger eye, shorter
   snout, rounder body. Shapes are painted onto material layers, and the
   lighting pass in the colour module turns those layers into shaded pixels.
   ========================================================================== */

/* The box every frame is drawn into. `BAKE_CX` is the centreline and `BAKE_G`
   the ground line inside it; a species draws with the ground at y = 0.

   Every pass in composeSprite is per-pixel over this whole box, so its area is
   the bake cost. The box was 232x210 and the largest frame any species and
   stage produces is 143x94 — five sixths of every pass was spent on empty
   canvas. Measured across every species, stage and animation, the union of
   what is actually touched is 154x95, and this is that plus a margin.

   Anything that makes an animal appreciably bigger — a longer-necked species,
   a taller stage — has to grow this. tools/sheet.html shows the clipping
   immediately. */
const BAKE_W = 168, BAKE_H = 112, BAKE_G = 100, BAKE_CX = 84;

/* Per-stage multipliers. Every feature that grows on its own schedule gets its
   own column — merging any two of them has produced a bad sprite at least once.

   `frill` is separate from `horn` for the reason `snout` is separate from
   `head`: a baby Triceratops already has a frill, deeply scalloped and
   obvious, while its horns are barely stubs. Driving the frill off the horn
   column left hatchlings with almost no frill under an enormous skull.

   `hornBend` is the ontogenetic sequence Horner and Goodwin read off a series
   of ten skulls: the postorbital horns start as straight stubs, curve
   backward in juveniles, straighten out in subadults, then recurve forward in
   adults. Negative is backward, positive forward. */
const STAGE = [
  { key:'hatchling', label:'Hatchling', s:.44, head:1.62, snout:.58, neck:.44, limb:.68, tail:.54, horn:.14, frill:.50, hornBend: 0.00 },
  { key:'juvenile',  label:'Juvenile',  s:.64, head:1.38, snout:.76, neck:.68, limb:.83, tail:.76, horn:.48, frill:.70, hornBend:-1.00 },
  { key:'subadult',  label:'Subadult',  s:.83, head:1.18, snout:.90, neck:.87, limb:.93, tail:.90, horn:.80, frill:.86, hornBend:-0.15 },
  { key:'adult',     label:'Adult',     s:1.0, head:1.06, snout:1.00, neck:1.00, limb:1.00, tail:1.00, horn:1.00, frill:1.00, hornBend: 1.00 }
];

/* --------------------------- gait and limbs -------------------------------
   The foot follows a stance/swing path against the ground, and the leg is
   solved with two-bone inverse kinematics. Bone lengths never change and a
   planted foot never slides, which is what stops a walk cycle looking rubbery.
   -------------------------------------------------------------------------- */
function gaitFoot(phase, stride, lift, duty){
  phase = ((phase % 1) + 1) % 1;
  if (phase < duty){                       // planted: starts ahead, slides back
    const t = phase / duty;
    return [stride * (-0.5 + t), 0];
  }
  const t = (phase - duty) / (1 - duty);   // airborne: swings from back to front
  return [stride * (0.5 - t), -lift * Math.sin(Math.PI * t)];
}
function limbIK(g, hx, hy, tx, ty, L1, L2, w, bend){
  const dx = tx - hx, dy = ty - hy;
  const raw = Math.hypot(dx, dy) || 0.001;
  const d = clamp(raw, Math.abs(L1 - L2) + 0.01, (L1 + L2) * 0.995);
  const ux = dx / raw, uy = dy / raw;
  const a = (L1*L1 - L2*L2 + d*d) / (2*d);
  const h = Math.sqrt(Math.max(0, L1*L1 - a*a));
  const kx = hx + ux*a - uy*h*bend, ky = hy + uy*a + ux*h*bend;
  const ax = hx + ux*d, ay = hy + uy*d;
  tube(g, [[hx,hy],[kx,ky]], [w, w*.64]);
  tube(g, [[kx,ky],[ax,ay]], [w*.64, w*.44]);
  return [ax, ay];
}
/* hy is the hip height above the ground line at y = 0, so the leg always reaches */
function legStep(g, hx, hy, phase, w, cfg, hornG){
  const len = Math.max(4, -hy);
  const mt = len * cfg.mt;
  if (cfg.thigh) oval(g, hx, hy + len*.17, w*.92, len*.25);
  const [ox, oy] = gaitFoot(phase, len*cfg.stride, len*cfg.lift, cfg.duty);
  const tx = hx + ox + len*(cfg.fwd||0), ty = oy;
  const ank = limbIK(g, hx, hy, tx + mt*cfg.back, ty - mt, (len-mt)/2*1.02, (len-mt)/2*1.02, w, cfg.bend);
  drawFoot(g, hornG, ank, tx, ty, w, cfg.foot || 'bird');
  return [tx, ty];
}
function drawFoot(g, hornG, ank, tx, ty, w, kind){
  if (kind === 'hoof'){
    // sauropod manus: the metacarpals stand in a vertical column and the whole
    // hand is a single hoof. No digits are visible in life, so none are drawn.
    tube(g, [[ank[0], ank[1]],[tx, ty - w*.44]], [w*.56, w*.60]);
    blob(g, [[tx - w*.32, ty - w*.52],[tx + w*.32, ty - w*.52],
             [tx + w*.36, ty - w*.10],[tx, ty - w*.03],[tx - w*.36, ty - w*.10]]);
    return;
  }
  if (kind === 'pad'){
    // sauropod pes: a wedge, deep at the heel where the fleshy pad sits and
    // sloping forward onto three claw-bearing inner toes
    tube(g, [[ank[0], ank[1]],[tx + w*.26, ty - w*.46]], [w*.50, w*.54]);
    blob(g, [[tx + w*.52, ty - w*.08],[tx + w*.60, ty - w*.40],[tx + w*.30, ty - w*.60],
             [tx - w*.16, ty - w*.44],[tx - w*.44, ty - w*.20],[tx - w*.40, ty - w*.03],
             [tx + w*.10, ty]]);
    if (hornG){
      blob(hornG, [[tx - w*.36, ty - w*.22],[tx - w*.58, ty - w*.10],[tx - w*.36, ty - w*.01]]);
      blob(hornG, [[tx - w*.20, ty - w*.30],[tx - w*.44, ty - w*.24],[tx - w*.24, ty - w*.12]]);
    }
    return;
  }
  if (kind === 'column'){
    // ceratopsian foot: short, broad and blunt-hooved
    tube(g, [[ank[0], ank[1]],[tx + w*.10, ty - w*.34]], [w*.50, w*.54]);
    blob(g, [[tx + w*.36, ty - w*.06],[tx + w*.40, ty - w*.34],[tx, ty - w*.46],
             [tx - w*.36, ty - w*.28],[tx - w*.38, ty - w*.02]]);
    if (hornG){
      blob(hornG, [[tx - w*.28, ty - w*.20],[tx - w*.46, ty - w*.08],[tx - w*.26, ty - w*.01]]);
      blob(hornG, [[tx - w*.08, ty - w*.26],[tx - w*.28, ty - w*.22],[tx - w*.10, ty - w*.10]]);
    }
    return;
  }
  tube(g, [[ank[0],ank[1]],[tx,ty]], [w*.46, w*.4]);
  oval(g, tx - w*.1, ty - w*.15, w*.56, w*.28);
}
function samplePath(pts, t){
  let total = 0; const seg = [];
  for (let i=0;i<pts.length-1;i++){ const d = Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]); seg.push(d); total += d; }
  let want = clamp(t,0,1) * total;
  for (let i=0;i<seg.length;i++){
    if (want <= seg[i] || i === seg.length-1){
      const u = seg[i] ? clamp(want/seg[i],0,1) : 0;
      return [lerp(pts[i][0], pts[i+1][0], u), lerp(pts[i][1], pts[i+1][1], u)];
    }
    want -= seg[i];
  }
  return pts[pts.length-1];
}
function toes(g, x, y, n, dir, size){
  for (let i=0;i<n;i++) oval(g, x + dir*i*size*1.7, y, size*.78, size*.55);
}
function eyeAt(M, x, y, r, state){
  /* A shut eye is a line, not a shape. The lid used to be drawn as wide as the
     pupil with rounded caps, which at this size read as a black smudge across
     the face rather than as a closed eye. */
  if (state === 1){                                        // closed: a soft lid line
    tube(M.pupil, [[x-r*1.35,y-r*.08],[x,y+r*.34],[x+r*1.35,y-r*.08]], [r*.24,r*.32,r*.24]);
    return;
  }
  if (state === 2){                                        // squinting, pleased
    tube(M.pupil, [[x-r*1.3,y+r*.34],[x,y-r*.40],[x+r*1.3,y+r*.34]], [r*.24,r*.32,r*.24]);
    return;
  }
  oval(M.sclera, x, y, r*1.1, r*1.24);
  oval(M.pupil,  x - r*.12, y + r*.14, r*.66, r*.86);
  oval(M.glint,  x - r*.46, y - r*.44, r*.3, r*.3);
}

/* ------------------------------- T. rex ----------------------------------- */

/* ------------------------------ hats -------------------------------------- */
const HAT_ART = {
  frond:  g => { g.fillStyle='#6f9c55'; g.fillRect(4,4,2,5); [[1,1],[3,0],[6,0],[8,1],[2,3],[7,3]].forEach(q=>g.fillRect(q[0],q[1],2,2)); },
  cap:    g => { g.fillStyle='#b08a4a'; g.fillRect(2,1,6,4); g.fillStyle='#8a6a36'; g.fillRect(0,5,10,2); },
  goggles:g => { g.fillStyle='#3a4d55'; g.fillRect(0,2,10,3); g.fillStyle='#9fd2e0'; g.fillRect(1,3,3,2); g.fillRect(6,3,3,2); },
  cone:   g => { g.fillStyle='#d95f7f'; g.fillRect(4,0,2,2); g.fillRect(3,2,4,2); g.fillRect(2,4,6,2); g.fillStyle='#5fb0a5'; g.fillRect(1,6,8,2); },
  hardhat:g => { g.fillStyle='#e0a92f'; g.fillRect(2,1,6,4); g.fillStyle='#c48c1c'; g.fillRect(0,5,10,2); g.fillRect(4,0,2,2); },
  crown:  g => { g.fillStyle='#d9a83f'; g.fillRect(0,0,2,3); g.fillRect(4,0,2,3); g.fillRect(8,0,2,3); g.fillRect(0,3,10,3); g.fillStyle='#c04848'; g.fillRect(4,4,2,2); }
};
function hatCanvas(id){
  const c = makeCv(12,11), g = readCtx(c);
  g.save(); g.translate(1,1); HAT_ART[id](g); g.restore();
  const d = g.getImageData(0,0,12,11), px = d.data, solid = new Uint8Array(12*11);
  for (let i=0;i<12*11;i++){ if (px[i*4+3] >= 118){ px[i*4+3] = 255; solid[i] = 1; } else px[i*4+3] = 0; }
  for (let y=0;y<11;y++) for (let x=0;x<12;x++){
    const i = y*12+x; if (solid[i]) continue;
    if ((x>0&&solid[i-1])||(x<11&&solid[i+1])||(y>0&&solid[i-12])||(y<10&&solid[i+12])){
      px[i*4]=0x24; px[i*4+1]=0x1d; px[i*4+2]=0x13; px[i*4+3]=255;
    }
  }
  g.putImageData(d,0,0);
  return c;
}
const HATS = {};
for (const k in HAT_ART) HATS[k] = hatCanvas(k);

/* ---------------------------- frame baking -------------------------------- */
/* Walk and idle are generated rather than typed out, because the only reason
   they were six frames and two frames was that a bake cost eight milliseconds
   and every pose is one. It costs about a third of that now, so the cycles are
   as long as they should be: twelve frames of walk reads as a walk instead of
   as six positions, and four frames of idle is a breath instead of a twitch.

   The body rises twice per stride, once under each foot, with sharp peaks and
   a flat trough — that asymmetry is the push-off. The tail swings once per
   stride, a quarter cycle behind it. */
const WALK_FRAMES = 12, IDLE_FRAMES = 4;
const TAU = Math.PI * 2;
const poseCycle = (count, fn) => Array.from({length:count}, (_, i) => fn(i/count, i));

const POSES = {
  idle:  poseCycle(IDLE_FRAMES, p => ({
           body: .65 - .65*Math.cos(TAU*p),          // one slow breath
           legPhase: 0,
           tail: .22*Math.sin(TAU*p)
         })),
  walk:  poseCycle(WALK_FRAMES, p => ({
           body: .2 + 1.3*Math.pow(Math.abs(Math.sin(TAU*p)), 1.4),
           legPhase: p,
           tail: .48*Math.sin(TAU*p + Math.PI/4)
         })),
  eat:   [ {body:0, legPhase:0, jaw:1, droop:.7, tail:.3}, {body:0, legPhase:0, jaw:.12, droop:.7, tail:-.1} ],
  sleep: [ {body:-2.5, legPhase:0, droop:1.5, tail:.1, eye:1} ],
  cheer: [ {body:5, legPhase:.5, jaw:.8, tail:.9, eye:2}, {body:0, legPhase:0, jaw:.35, tail:-.7, eye:2} ],
  sick:  [ {body:-1.5, legPhase:0, droop:1.1, tail:-.1, eye:1}, {body:-2.4, legPhase:0, droop:1.2, tail:0, eye:1} ]
};
const matCache = new Map();
function matsFor(spId, skinId){
  const key = spId + '|' + skinId;
  if (!matCache.has(key)){
    const k = skinOf(spId, skinId);
    matCache.set(key, buildMaterials(Object.assign({}, SPECIES[spId].spec, {
      skin:k.skin, belly:k.belly, crest:k.crest, mark:k.mark
    })));
  }
  return matCache.get(key);
}
/* Least-recently-used, because the key space is species x coat x stage x
   animation x frame x eye and every entry is a canvas. A player only ever has
   one species, one coat and one stage live, which is about thirty frames; the
   rest of what gets baked is shop and nest thumbnails. The cap is generous
   enough never to evict anything in use and small enough to bound the memory. */
const FRAME_CACHE_MAX = 180;
const frameCache = new Map();
function frameOf(spId, stage, anim, idx, blinking, skinId){
  skinId = skinId || 'wild';
  const poses = POSES[anim] || POSES.idle;
  const pose = poses[idx % poses.length];
  const eye = pose.eye !== undefined ? pose.eye : (blinking ? 1 : 0);
  const key = spId+'|'+skinId+'|'+stage+'|'+anim+'|'+(idx%poses.length)+'|'+eye;
  if (frameCache.has(key)){
    const hit = frameCache.get(key);
    frameCache.delete(key); frameCache.set(key, hit);   // Map keeps insertion order
    return hit;
  }

  const sp = SPECIES[spId], st = STAGE[stage], k = st.s * sp.scale;
  const canvases = [], M = {};
  for (const name of LAYERS){
    const c = makeCv(BAKE_W, BAKE_H), g = readCtx(c);
    g.fillStyle = '#000';
    g.translate(BAKE_CX, BAKE_G); g.scale(k, k);
    canvases.push(c); M[name] = g;
  }
  const P = Object.assign({stage, legPhase:0, body:0, jaw:0, tail:0, droop:0}, pose, {eye});
  const anchors = sp.draw(M, P);
  // Countershading and the coat both ride the body the draw function just laid
  // down, never a path computed alongside it — the same rule the surface
  // detail follows. Belly first: the coat is masked to stop where it starts.
  paintBelly(M.belly, anchors.spine, sp.belly);
  paintPattern(M.mark, skinOf(spId, skinId).pattern, anchors.spine);

  const composed = composeSprite(canvases, matsFor(spId, skinId), BAKE_W, BAKE_H);
  const t = trim(composed);
  const conv = a => [BAKE_CX + a[0]*k - t.ox, BAKE_G + a[1]*k - t.oy];
  const out = {
    cv: t.cv, w: t.w, h: t.h,
    ox: BAKE_CX - t.ox, oy: BAKE_G - t.oy,
    eye: conv(anchors.eye), mouth: conv(anchors.mouth), hat: conv(anchors.hat),
    eyeR: (anchors.eyeR || 3) * k, k, hs: k * st.head
  };
  frameCache.set(key, out);
  while (frameCache.size > FRAME_CACHE_MAX) frameCache.delete(frameCache.keys().next().value);
  return out;
}

/* Bake ahead. A cold bake is a few milliseconds and every pose is one, so a
   twelve-frame walk baked lazily hitches twelve times the first time an animal
   crosses the pen. Two frames a tick fills the whole of the current stage and
   coat inside a second, and does nothing at all once it is full. */
let warmQueue = [], warmKey = '';
function warmFrames(spId, stage, skinId){
  const key = spId + '|' + skinId + '|' + stage;
  if (key !== warmKey){
    warmKey = key;
    warmQueue = [];
    for (const anim in POSES)
      for (let i=0;i<POSES[anim].length;i++) warmQueue.push([anim, i, false]);
    warmQueue.push(['idle', 0, true]);            // the blink is a bake of its own
  }
  for (let n=0; n<2 && warmQueue.length; n++){
    const [anim, i, blink] = warmQueue.shift();
    frameOf(spId, stage, anim, i, blink, skinId);
  }
}

/* ==========================================================================
   SCREEN FONT
   The menus live inside the 224x168 screen, so their text has to be drawn as
   pixels rather than laid out as DOM. This is that font: 5x7 fixed width, one
   glyph per entry, seven rows of five bits each encoded as base32 so the table
   stays readable at a glance and small in the build.

   Drawing a glyph pixel by pixel would be thousands of fillRect calls a frame,
   so each colour the interface uses is baked once into a strip of every glyph
   and drawn from there. Colours are few and fixed, so the strips are built on
   first use and then never again.

   There are no image assets here either. The strips are drawn from the table
   at load, the same way every other picture in this game is made.
   ========================================================================== */

const FONT_W = 5, FONT_H = 7;
const FONT_ADV = 6;                 // glyph width plus one column of tracking
const FONT_LINE = 9;                // baseline to baseline

  'l':'C44444E', 'm':'00QLLLL', 'n':'00UHHHH', 'o':'00EHHHE', 'p':'0UHHUGG', 'q':'0FHHF11',
  'r':'00MOGGG', 's':'00FGE1U', 't':'88U8896', 'u':'00HHHJD', 'v':'00HHHA4', 'w':'00HHLLA',
  'x':'00HA4AH', 'y':'0HHHF1E', 'z':'00V248V', '.':'00000CC', ',':'0000664', ':':'0CC0CC0',
  '!':'4444404', '?':'EH16404', '\'':'4400000', '-':'000E000', '+':'044V440', '/':'12448G0',
  '%':'PQ248BJ', '(':'2488842', ')':'8422248', '*':'0LEVEL0', '#':'AVAAAVA',
  '\u00b7':'000CC00', '\u25b6':'8CEFEC8', '\u25c0':'26EUE62', '\u25b2':'044EEV0',
  '\u25bc':'0VEE440'
};

/* cursor and scroll marks, addressed by name so the screen code does not have
   to carry literal box-drawing characters around */
const GL_RIGHT = '▶', GL_LEFT = '◀', GL_UP = '▲', GL_DOWN = '▼';
const GL_DOT = '·';

const fontStrips = new Map();
function fontStrip(col){
  let strip = fontStrips.get(col);
  if (strip) return strip;
  const keys = Object.keys(GLYPHS);
  const cv = makeCv(keys.length * FONT_W, FONT_H), g = readCtx(cv);
  g.fillStyle = col;
  const index = new Map();
  keys.forEach((ch, n) => {
    const code = GLYPHS[ch], ox = n * FONT_W;
    index.set(ch, ox);
    for (let row=0; row<FONT_H; row++){
      const bits = B32.indexOf(code[row]);
      for (let bit=0; bit<FONT_W; bit++)
        if (bits & (1 << (FONT_W - 1 - bit))) g.fillRect(ox + bit, row, 1, 1);
    }
  });
  strip = { cv, index };
  fontStrips.set(col, strip);
  return strip;
}

const textW = s => s.length ? s.length * FONT_ADV - 1 : 0;

/* Draw a single line. `align` is 'left' (default), 'right' or 'centre', and x
   is the edge the alignment refers to. Returns the x the line ended at. */
function text(g, str, x, y, col, align){
  str = String(str);
  const strip = fontStrip(col || '#e9e1cb');
  let px = Math.round(align === 'right'  ? x - textW(str)
                    : align === 'centre' ? x - textW(str)/2 : x);
  const py = Math.round(y);
  for (let i=0; i<str.length; i++){
    const ox = strip.index.get(str[i]);
    if (ox !== undefined) g.drawImage(strip.cv, ox, 0, FONT_W, FONT_H, px, py, FONT_W, FONT_H);
    px += FONT_ADV;
  }
  return px;
}

/* Greedy wrap to a pixel width. Long words are broken rather than allowed to
   run off the screen, because at this size one over-long word is the whole
   line. */
function wrapText(str, maxW){
  const cols = Math.max(1, Math.floor((maxW + 1) / FONT_ADV));
  const out = [];
  for (const para of String(str).split('\n')){
    let line = '';
    for (const word of para.split(' ')){
      let w = word;
      while (w.length > cols){                     // break a word too long to fit
        if (line) { out.push(line); line = ''; }
        out.push(w.slice(0, cols));
        w = w.slice(cols);
      }
      if (!line) line = w;
      else if (line.length + 1 + w.length <= cols) line += ' ' + w;
      else { out.push(line); line = w; }
    }
    out.push(line);
  }
  return out;
}

/* Wrapped paragraph. Returns the y it finished at, so callers can stack. */
function textBlock(g, str, x, y, maxW, col, lineH){
  const step = lineH || FONT_LINE;
  for (const line of wrapText(str, maxW)){ text(g, line, x, y, col); y += step; }
  return y;
}

/* Cut a string to fit, with a trailing dot rather than three: at six pixels a
   character an ellipsis costs three characters of the thing being named. */
function fit(str, maxW){
  const cols = Math.max(1, Math.floor((maxW + 1) / FONT_ADV));
  str = String(str);
  return str.length <= cols ? str : str.slice(0, cols - 1) + '.';
}

/* Tyrannosaurus rex sprite
   Part of Paleopal. Load order matters; see build.py. */

const REX_SPEC = { skin:'#7e9c54', belly:'#b8bd80', crest:'#5b7940', horn:'#e9dfba',
                   mouth:'#8e4a45', outline:'#241d13' };
const REX_GAIT = { stride:.46, lift:.17, duty:.56, mt:.22, back:.34, bend:1, thigh:false, foot:'bird' };
function drawRex(M, P){
  const st = STAGE[P.stage];
  const hM = st.head, nM = st.neck, lM = st.limb, tM = st.tail;
  const bob = P.body, jaw = P.jaw||0, sw = P.tail||0, dr = P.droop||0;

  // skeleton landmarks. Hip is the acetabulum; everything else hangs off it.
  const hipX = 16,  hipY = -46*lM - bob;
  const backY = hipY - 24*lM, withX = -18, withY = hipY - 25*lM;
  const bellyY = hipY + 9*lM, throatY = hipY + 3*lM;
  const hx = withX - 26*nM - 4*hM, hy = withY - 10*nM - 2 + dr*9;
  const sM = st.snout;
  const sn = 25*hM*sM, hh = 14.5*hM;
  const T = d => hipX + d*tM;

  // far limb first, behind everything
  blob(M.far, [[hipX+9*lM, hipY-11*lM],[hipX+12*lM, hipY+4*lM],[hipX+2*lM, hipY+15*lM],
               [hipX-9*lM, hipY+13*lM],[hipX-13*lM, hipY-1*lM],[hipX-8*lM, hipY-11*lM]]);
  legStep(M.far, hipX-6, hipY+2, (P.legPhase+.5)%1, 14*lM, REX_GAIT);

  // one continuous mass from nape to tail tip: neck, ribcage, hips and tail
  const topLine = [[hx+11, hy-hh*.35],[withX, withY],[0, backY-1],[hipX+7, backY+1],[T(23), hipY-18*lM+sw*2]];
  blob(M.skin, [
    [hx+11, hy-hh*.35],                     // nape at the skull
    [withX, withY],                         // withers
    [0, backY-1],                           // back
    [hipX+7, backY+1],                      // over the hips
    [T(23), hipY-18*lM+sw*2],               // deep tail base
    [T(48), hipY-13*lM+sw*4],
    [T(72), hipY-7*lM+sw*6],                // tail tip
    [T(70), hipY-4*lM+sw*6],
    [T(43), hipY-1*lM+sw*4],
    [T(17), hipY+4*lM],
    [hipX-6, bellyY],                       // belly
    [-8, bellyY-1],
    [withX-7, throatY-2],                   // chest and throat
    [hx+9, hy+hh*.58]
  ]);

  /* Upper jaw, deep behind the eye. The premaxilla is squared off — a
     near-vertical front edge rather than a rounded nub — which is the quickest
     way to read tyrannosaur instead of generic theropod at this size. */
  const lipY = hy + hh*.30;
  blob(M.head, [[hx+13, hy-hh*.12],[hx+11, hy-hh*.96],[hx-sn*.30, hy-hh*1.04],
                [hx-sn*.62, hy-hh*.86],[hx-sn*.86, hy-hh*.62],
                // the front is carried on three near-vertical stations, so the
                // curve through them stays flat instead of rounding the tip off
                [hx-sn*.99, hy-hh*.44],[hx-sn*1.03, hy-hh*.16],[hx-sn*1.02, lipY-hh*.10],
                [hx-sn*.94, lipY],[hx-sn*.45, lipY+hh*.05],[hx+13, hy+hh*.36]]);

  /* Hinged mandible, on its own material. It was always drawn and always
     hinged, but it was painted onto `head`, and the compositor only draws an
     edge where two different materials meet — so the whole lower jaw merged
     into the skull and the animal had no mouth. It hangs below the upper
     jaw's oral margin, and that boundary is the lip line.

     −x is forward, so the jaw opens on a negative rotation. */
  const hinge = [hx + 11, hy + hh*.16], jawA = -jaw * .34;
  M.jaw.save(); M.jaw.translate(hinge[0], hinge[1]); M.jaw.rotate(jawA);
  blob(M.jaw, [[2,-hh*.16],[-sn*.40,-hh*.20],[-sn*.92,hh*.02],
               [-sn*.88,hh*.34],[-sn*.34,hh*.52],[2,hh*.44]]);
  M.jaw.restore();
  // pale chin, carried by the jaw rather than left floating under it
  M.belly.save(); M.belly.translate(hinge[0], hinge[1]); M.belly.rotate(jawA);
  oval(M.belly, -sn*.52, hh*.38, sn*.22, hh*.09);
  M.belly.restore();

  const about = (p, a, o) => [o[0] + (p[0]-o[0])*Math.cos(a) - (p[1]-o[1])*Math.sin(a),
                              o[1] + (p[0]-o[0])*Math.sin(a) + (p[1]-o[1])*Math.cos(a)];
  if (jaw > .06){
    /* The gape is the wedge between the two oral margins, anchored at the
       hinge. Drawing it as a slab carried around by the mandible put mouth
       lining outside the head; drawing it through `blob` bowed the curves
       outward and swallowed the whole face. Straight edges, because the two
       margins it runs between are straight. */
    const uTip = [hx - sn*.93, lipY - hh*.04];
    const lTip = about([hx - sn*.86, hy + hh*.36], jawA, hinge);
    const gape = [hinge, uTip, lTip];
    M.mouth.beginPath();
    M.mouth.moveTo(gape[0][0], gape[0][1]);
    for (let i=1;i<gape.length;i++) M.mouth.lineTo(gape[i][0], gape[i][1]);
    M.mouth.closePath(); M.mouth.fill();
    /* Teeth. The large ones are maxillary; the dentary shows tips only, which
       is both what the animal had and what reads at this size. */
    const tw = Math.max(.9, 1.25*hM);
    for (let i=0;i<5;i++){
      const u = .18 + i*.17;
      oval(M.horn, lerp(hinge[0],uTip[0],u), lerp(hinge[1],uTip[1],u) + hh*.10,
           tw, Math.max(1.3, (2.4 - i*.22)*hM));
    }
    for (let i=0;i<4;i++){
      const u = .26 + i*.18;
      oval(M.horn, lerp(hinge[0],lTip[0],u), lerp(hinge[1],lTip[1],u) - hh*.08,
           tw*.8, Math.max(1.0, 1.5*hM));
    }
  } else {
    // shut: lips cover the teeth, so all that shows is the oral margin itself
    tube(M.mouth, [[hx+9, hy+hh*.31],[hx-sn*.46, lipY+hh*.02],[hx-sn*.93, lipY-hh*.06]],
         [Math.max(.9,1.5*hM), Math.max(.8,1.25*hM), Math.max(.6,.8*hM)]);
  }

  const ex = hx - sn*.46, ey = hy - hh*.42;
  // lacrimal ridge above the eye, and the keratin row along the neck and back
  blob(M.crest, [[ex+7*hM, ey-hh*.32],[ex+1*hM, ey-hh*.66],[ex-7*hM, ey-hh*.5],[ex-6*hM, ey-hh*.26]]);
  for (let i=0;i<10;i++){
    const q = samplePath(topLine, .04 + i*.088);          // ride the actual back line
    oval(M.crest, q[0], q[1] + 1.6*lM, 2.3*lM, 1.4*lM);
  }
  // the ventral countershading is painted from the spine by paintBelly

  // two-fingered hand, palm turned inward the way a theropod wrist actually sits
  const ax = withX + 9, ay = withY + 22*lM;
  tube(M.limb, [[ax,ay],[ax-11*lM,ay+11*lM],[ax-20*lM,ay+7*lM]], [10*lM, 7.2*lM, 5.4*lM]);
  toes(M.horn, ax-23*lM, ay+6*lM, 2, -1, Math.max(1.3, 2.3*lM));

  // near limb: a heavy drumstick over the femur, then shank and bird foot
  blob(M.limb, [[hipX+14*lM, hipY-12*lM],[hipX+16*lM, hipY+5*lM],[hipX+5*lM, hipY+18*lM],
                [hipX-8*lM, hipY+15*lM],[hipX-14*lM, hipY-1*lM],[hipX-9*lM, hipY-13*lM]]);
  const foot = legStep(M.limb, hipX, hipY, P.legPhase, 15*lM, REX_GAIT);
  toes(M.horn, foot[0]-9*lM, foot[1]-1, 3, -1, Math.max(1.2, 2.1*lM));

  eyeAt(M, ex, ey, 3.5*hM, P.eye);
  oval(M.mouth, hx - sn*.84, hy - hh*.34, Math.max(.8,1.2*hM), Math.max(.8,1.1*hM));

  /* Centreline for the coat painter: nape to tail tip, carrying the body's
     half-depth at each station so a band knows how far to run. */
  const spine = [
    [hx + 13,   hy + hh*.06,  hh*.52],   // nape
    [withX - 4, withY + 12*lM, 12*lM],   // withers
    [-4,        hipY - 7*lM,   16*lM],   // ribcage
    [hipX + 4,  hipY - 7*lM,   16*lM],   // hips
    [T(24),     hipY - 9*lM,    9*lM],   // tail base
    [T(48),     hipY - 7*lM,    5.5*lM],
    [T(72),     hipY - 6*lM,    2.0*lM]  // tail tip
  ];

  return { eye:[ex,ey], eyeR:3.5*hM, mouth:[hx - sn*.82, hy + hh*.12],
           hat:[hx - sn*.16, hy - hh*1.02], top: hy - hh, spine };
}


/* Triceratops horridus sprite
   Part of Paleopal. Load order matters; see build.py.

   Proportions follow the modern skeletals: a deep barrel torso, a tail about
   one and a quarter times the length of the torso and deep at its base, and a
   skull that is large but not half the animal. The earlier version had a tail
   shorter than the torso, which read as a stub.

   Growth follows Horner and Goodwin's series of ten skulls:
     - the frill is present and deeply scalloped from the start, and lengthens
       with positive allometry (STAGE.frill)
     - the epoccipitals along the rim start as deep deltoid scallops and
       flatten to low spindles that fuse into the margin (EPI_DEPTH)
     - the brow horns are straight stubs, then curve backward, then straighten,
       then recurve forward (STAGE.hornBend)
   -------------------------------------------------------------------------- */
const TRI_SPEC = { skin:'#ab7040', belly:'#ca9b64', crest:'#8a5228', horn:'#efe6c8',
                   /* the frill carries its own colour. On the body ramp it was
                      separated from the neck by nothing but the outline, and a
                      shield that does not read as a shield is most of this
                      animal's silhouette thrown away. */
                   shield:'#c09155',
                   mouth:'#7e3a30', outline:'#26190f' };
const TRI_HIND = { stride:.34, lift:.11, duty:.66, mt:.15, back:.2,  bend:1,  thigh:true,  foot:'column' };
const TRI_FORE = { stride:.32, lift:.10, duty:.66, mt:.15, back:-.1, bend:-1, thigh:false, foot:'column' };
/* how far the rim scallops bite in, per growth stage: deltoid when young,
   low spindles fused to the margin when adult */
const EPI_DEPTH = [.22, .17, .12, .08];

function drawTrike(M, P){
  const st = STAGE[P.stage];
  const hM = st.head, nM = st.neck, lM = st.limb, tM = st.tail;
  const hF = st.horn, sM = st.snout, fM = st.frill, bend = st.hornBend;
  const bob = P.body, jaw = P.jaw||0, sw = P.tail||0, dr = P.droop||0;

  const hipX = 26, hipY = -41*lM - bob;
  const shX = -16, shY = -38*lM - bob;         // torso 42 long, was 36
  const withY = hipY - 25*lM;                  // tall neural spines: a shoulder hump
  const backY = hipY - 20*lM, bellyY = hipY + 14*lM;
  const T = d => hipX + d*tM;

  legStep(M.far, hipX-7, hipY+2, (P.legPhase+.5)%1, 16*lM, TRI_HIND);
  legStep(M.far, shX-7,  shY+3,  (P.legPhase+.25)%1, 14.5*lM, TRI_FORE);

  /* One closed mass: nape, ribcage, hips and tail. The tail leaves the hips
     nearly as deep as the pelvis and tapers the whole way out, which is what
     stops it reading as a stub bolted on the back. */
  blob(M.skin, [
    [shX-12, withY+7*lM],                      // nape, meeting the frill
    [shX-1,  withY],                           // shoulder hump
    [8,      backY-1],                         // back
    [hipX+4, backY+2],                         // hips
    [T(12),  hipY-17*lM+sw*1.5],               // tail base, still deep
    [T(26),  hipY-13*lM+sw*3],
    [T(39),  hipY-8.5*lM+sw*5],
    [T(50),  hipY-4*lM+sw*7],                  // tail tip
    [T(48),  hipY-1.5*lM+sw*7],
    [T(34),  hipY+1*lM+sw*4],
    [T(18),  hipY+5*lM+sw*1.5],
    [T(5),   hipY+10*lM],
    [hipX-6, bellyY],                          // belly
    [2,      bellyY+2*lM],
    [shX+3,  bellyY-1*lM],
    [shX-10, hipY+2*lM]                        // throat
  ]);

  /* Frill: a solid bone shield, tipped back off the skull roof.

     The previous version drew it as an upright ellipse centred near the
     withers, which meant its lower-back half was buried in the shoulder hump
     and the whole thing read as a lump of neck rather than a shield. It is
     now built in its own tilted frame and carried high enough that the rim
     stands clear of the body outline the whole way round — that separation is
     the entire silhouette of the animal.

     It rides STAGE.frill, not the horn column: a baby already has an obvious,
     deeply scalloped frill and almost no horns. */
  const fx = shX - 14*nM - 3, fy = hipY - 24*lM - 8*nM + dr*4;
  const fRx = 16.0*hM*fM, fRy = 22.0*hM*fM;
  const fTilt = -0.40;                          // tipped back off the skull roof
  const fc = Math.cos(fTilt), fs = Math.sin(fTilt);
  const rot = (px,py) => [fx + px*fc - py*fs, fy + px*fs + py*fc];
  const epi = EPI_DEPTH[P.stage];
  const rim = [];
  const A0 = Math.PI*1.04, A1 = Math.PI*2.16;   // front-top, over the crown, down the back
  /* The epoccipitals scallop the rim itself. Sixteen of them came out as a
     one-pixel sawtooth that read as fur; an adult shows five or six knobs in
     side profile, so the rim is stepped at that count instead. */
  const EPI_N = 8;
  for (let i=0;i<=EPI_N;i++){
    const a = A0 + (A1-A0)*i/EPI_N;
    const r = (i % 2) ? 1.0 : (1 - epi);
    rim.push(rot(Math.cos(a)*fRx*r, Math.sin(a)*fRy*r));
  }
  rim.push(rot(fRx*.30, fRy*.86));              // bottom margin, tucking toward the jaw
  rim.push(rot(-fRx*.62, fRy*.66));             // front-bottom, where the skull joins
  blob(M.shield, rim);

  /* Skull: long, low, and carried well forward and below the frill base. The
     cranium now stops at the oral margin instead of running down to the chin,
     because the mandible has to live somewhere. */
  const hx = fx - 17*hM*sM - 6, hy = fy + 13*hM, sn = 21*hM*sM, hh = 10.0*hM;
  const lipY = hy + hh*.40;
  blob(M.head, [[hx+19*hM, hy-hh*1.05],[hx-sn*.42, hy-hh*1.16],[hx-sn*.90, hy-hh*.58],
                [hx-sn*1.00, hy-hh*.04],[hx-sn*.88, lipY-hh*.04],
                [hx-sn*.40, lipY+hh*.04],[hx+19*hM, hy+hh*.9]]);

  /* Jaw. A ceratopsian bites with two beaks — the rostral above, the
     predentary below — and the gap between them is the mouth. The old sprite
     drew one cream mass across the whole snout, which read as a bald face and
     left the eat animation with nothing to move. */
  const jHinge = [hx + 7*hM, hy + hh*.42], jawA = -jaw*.26;
  M.jaw.save(); M.jaw.translate(jHinge[0], jHinge[1]); M.jaw.rotate(jawA);
  blob(M.jaw, [[3,-hh*.04],[-sn*.38,-hh*.10],[-sn*.80,hh*.08],
               [-sn*.74,hh*.44],[-sn*.26,hh*.56],[4,hh*.44]]);
  M.jaw.restore();

  // rostral: a parrot hook, not a rounded snout cap
  blob(M.horn, [[hx-sn*.82, hy-hh*.44],[hx-sn*1.18, hy-hh*.04],[hx-sn*1.26, hy+hh*.28],
                [hx-sn*1.04, hy+hh*.44],[hx-sn*.78, lipY-hh*.06]]);
  // predentary, riding the jaw so it opens with it
  M.horn.save(); M.horn.translate(jHinge[0], jHinge[1]); M.horn.rotate(jawA);
  blob(M.horn, [[-sn*.58, hh*.02],[-sn*.90, hh*.14],[-sn*.84, hh*.46],[-sn*.54, hh*.44]]);
  M.horn.restore();

  if (jaw > .06){
    const uTip = [hx - sn*.86, lipY - hh*.06];
    const lTip = [jHinge[0] + (-sn*.80)*Math.cos(jawA) - (hh*.06)*Math.sin(jawA),
                  jHinge[1] + (-sn*.80)*Math.sin(jawA) + (hh*.06)*Math.cos(jawA)];
    M.mouth.beginPath();
    M.mouth.moveTo(jHinge[0], jHinge[1]);
    M.mouth.lineTo(uTip[0], uTip[1]);
    M.mouth.lineTo(lTip[0], lTip[1]);
    M.mouth.closePath(); M.mouth.fill();
  } else {
    tube(M.mouth, [[hx+5*hM, hy+hh*.42],[hx-sn*.42, lipY+hh*.03],[hx-sn*.80, lipY-hh*.04]],
         [Math.max(.9,1.4*hM), Math.max(.8,1.2*hM), Math.max(.6,.9*hM)]);
  }
  const ex = hx - sn*.36, ey = hy - hh*.30;

  /* Brow horns. The keratin sheath ran well past the bone core, so an adult's
     are long; the curvature is the ontogenetic sequence — straight stubs, then
     backward, then straightening, then recurved forward. The mid control point
     bows against the tip, which is what makes a recurve read as a recurve
     rather than as a bent stick.

     Width tracks the sheath as well as the skull. Scaling thickness on head
     bulk alone gave hatchlings two fat cones where they should have stubs. */
  const hl = hh*(.45 + 1.70*hF);
  const hw = hM * (.40 + .60*hF);
  const browHorn = (dx, dy, len, w) => {
    const bx = ex + dx*hM, by = ey + dy;
    const tip = [bx - len*(.30 + .55*bend), by - len*.86];
    const mid = [(bx + tip[0])/2 + len*.20*bend, (by + tip[1])/2 + len*.05];
    tube(M.horn, [[bx,by], mid, tip], [w*hw, w*.52*hw, w*.12*hw]);
  };
  browHorn( 4, -hh*.54, hl,     9.4);
  browHorn(-4, -hh*.64, hl*.90, 7.6);
  // nasal horn: small in T. horridus, and small at every age
  tube(M.horn, [[hx-sn*.74, hy-hh*.28],[hx-sn*.88, hy-hh*(.45+.5*hF)]], [4.0*hM, 1.2*hM]);
  // jugal horn: a short cheek point aimed down and back, not a hanging tusk
  blob(M.horn, [[hx-sn*.18, hy+hh*.62],[hx-sn*.44, hy+hh*.56],[hx-sn*.24, hy+hh*1.06]]);

  // low nubbin feature scales over the flank and tail base
  for (const q of [[-2,-11],[10,-14],[22,-12],[15,-6],[32,-9],[2,-5],[41,-7]])
    oval(M.crest, q[0], hipY + q[1]*lM, 1.7*lM, 1.2*lM);

  // the ventral countershading is painted from the spine by paintBelly

  legStep(M.limb, hipX+2, hipY, P.legPhase, 18*lM, TRI_HIND, M.horn);
  legStep(M.limb, shX+4, shY+1, (P.legPhase+.75)%1, 16.5*lM, TRI_FORE, M.horn);

  eyeAt(M, ex, ey, 2.7*hM, P.eye);
  oval(M.mouth, hx - sn*.76, hy - hh*.20, Math.max(.8,1.2*hM), Math.max(.8,1*hM));

  /* Centreline for the coat painter: nape to tail tip, with the body's
     half-depth at each station so a band knows how far to run. */
  const spine = [
    [shX-8,   withY+9*lM,   9*lM],   // nape
    [shX+4,   hipY-6*lM,   17*lM],   // shoulder
    [10,      hipY-4*lM,   17*lM],
    [hipX+2,  hipY-3*lM,   16*lM],   // hips
    [T(13),   hipY-7*lM,   10*lM],   // tail base
    [T(27),   hipY-6*lM,    7*lM],
    [T(40),   hipY-4*lM,    4.5*lM],
    [T(50),   hipY-3*lM,    2.0*lM]  // tail tip
  ];

  // headgear sits on the crown of the frill, which the tilt moved forward as
  // well as up — the old anchor was still using the untilted top of the arc
  const crown = rot(0, -fRy*.90);
  return { eye:[ex,ey], eyeR:2.7*hM, mouth:[hx - sn*1.15, hy + hh*.25],
           hat:crown, top: crown[1], spine };
}

/* Brachiosaurus altithorax sprite
   Part of Paleopal. Load order matters; see build.py. */

/* ---------------------------- Brachiosaurus -------------------------------- */
const BRA_SPEC = { skin:'#71958a', belly:'#a9ba8e', crest:'#88a894', horn:'#e2e3bc',
                   mouth:'#4c3a35', outline:'#1b2422' };
const BRA_FORE = { stride:.30, lift:.06, duty:.74, mt:.07, back:0,   bend:-1, thigh:false, foot:'hoof' };
const BRA_HIND = { stride:.30, lift:.06, duty:.74, mt:.15, back:.30, bend:1,  thigh:true,  foot:'pad' };
function drawBrachio(M, P){
  const st = STAGE[P.stage];
  const hM = st.head, nM = st.neck, lM = st.limb, tM = st.tail;
  const bob = P.body, jaw = P.jaw||0, sw = P.tail||0, dr = P.droop||0;
  // forelimbs about 1.2 times the hindlimbs: the trait the animal is named for
  const foreLen = 56*lM, hindLen = 46*lM;
  const shX = -14, shY = -foreLen - bob, hipX = 30, hipY = -hindLen - bob;

  legStep(M.far, shX-7,  shY+4, (P.legPhase+.25)%1, 14*lM, BRA_FORE);
  legStep(M.far, hipX-7, hipY+3,(P.legPhase+.5)%1,  14*lM, BRA_HIND);

  // short tail for a sauropod, carried clear of the ground
  tube(M.skin, [[hipX,hipY],[hipX+22*tM,hipY+1+sw*3],[hipX+44*tM,hipY+3+sw*5],
                [hipX+66*tM,hipY+6+sw*7],[hipX+86*tM,hipY+10+sw*9]],
       [31*lM, 22*lM, 14*lM, 7*lM, 2.5*lM]);
  // the back slopes down from the shoulders to the hips
  tube(M.skin, [[shX,shY],[8,shY+8],[hipX,hipY]], [39*lM, 44*lM, 34*lM]);
  oval(M.skin, shX + 2, shY - 6*lM, 18*lM, 12*lM);          // shoulder hump

  // neck near sixty degrees, S-curved, drooping slightly at the head end
  const nl = 58*nM;
  const n1 = [shX - 9,  shY - nl*.30];
  const n2 = [shX - 19, shY - nl*.63];
  const n3 = [shX - 23, shY - nl*.94 + dr*10];
  tube(M.head, [[shX-3, shY-9],n1,n2,n3], [26*lM, 18*lM, 13*lM, 11*lM]);

  const sM = st.snout;
  const hx = n3[0] - 7*hM, hy = n3[1] - 4*hM, sn = 16*hM*sM, hh = 8*hM;

  /* The skull is about ten pixels long, so only three things can read on it:
     the crest silhouette, the eye, and the jaw line. It had two. The muzzle is
     squared off in front, where the spatulate teeth sat, rather than rounded
     to a lump. */
  const lipY = hy + hh*.34;
  blob(M.head, [[hx+10*hM,hy-hh*.8],[hx-sn*.35,hy-hh*1.15],[hx-sn*.94,hy-hh*.52],
                [hx-sn*1.04,hy-hh*.06],[hx-sn*.98,lipY-hh*.06],
                [hx-sn*.30,lipY+hh*.06],[hx+10*hM,hy+hh*.72]]);

  /* Mandible. The sauropod jaw line is long and close to straight, running
     back to below the eye. */
  const jHinge = [hx + 6*hM, hy + hh*.30], jawA = -jaw*.30;
  M.jaw.save(); M.jaw.translate(jHinge[0], jHinge[1]); M.jaw.rotate(jawA);
  blob(M.jaw, [[2,-hh*.06],[-sn*.42,-hh*.12],[-sn*.94,hh*.02],
               [-sn*.88,hh*.34],[-sn*.30,hh*.46],[3,hh*.36]]);
  M.jaw.restore();
  if (jaw > .06){
    const uTip = [hx - sn*.96, lipY - hh*.08];
    const lTip = [jHinge[0] + (-sn*.90)*Math.cos(jawA) - (hh*.04)*Math.sin(jawA),
                  jHinge[1] + (-sn*.90)*Math.sin(jawA) + (hh*.04)*Math.cos(jawA)];
    M.mouth.beginPath();
    M.mouth.moveTo(jHinge[0], jHinge[1]);
    M.mouth.lineTo(uTip[0], uTip[1]);
    M.mouth.lineTo(lTip[0], lTip[1]);
    M.mouth.closePath(); M.mouth.fill();
  } else {
    tube(M.mouth, [[hx+4*hM, hy+hh*.30],[hx-sn*.44, lipY+hh*.02],[hx-sn*.92, lipY-hh*.08]],
         [Math.max(.9,1.3*hM), Math.max(.8,1.1*hM), Math.max(.6,.8*hM)]);
  }

  // tall nasal chamber sitting on the roof of a very small skull
  blob(M.crest, [[hx+2*hM,hy-hh*1.0],[hx-sn*.16,hy-hh*2.05],[hx-sn*.62,hy-hh*1.8],[hx-sn*.6,hy-hh*.85]]);
  /* Nares on the crest. As a filled block this read as a hole punched in a
     tuft of hair; a notch bitten out of the crest's front edge reads as a
     nostril. */
  oval(M.mouth, hx - sn*.54, hy - hh*1.62, Math.max(.7,.9*hM), Math.max(.6,.7*hM));

  // the ventral countershading is painted from the spine by paintBelly

  const nf = legStep(M.limb, shX+4, shY+2, (P.legPhase+.75)%1, 17*lM, BRA_FORE);
  legStep(M.limb, hipX+2, hipY, P.legPhase, 17*lM, BRA_HIND, M.horn);
  oval(M.horn, nf[0] - 5.4*lM, nf[1] - 2.6*lM, 1.9*lM, 2.2*lM);   // short brachiosaurid thumb claw

  eyeAt(M, hx - sn*.48, hy - hh*.3, 2.9*hM, P.eye);

  /* Centreline for the coat painter. It runs the whole animal, neck included,
     so banding comes down the neck and resolves into rings out the tail —
     which is the one place a sauropod coat has somewhere to go. */
  const spine = [
    [n3[0], n3[1] + 4,   9*lM],          // base of the skull
    [n2[0], n2[1],      10*lM],
    [n1[0], n1[1],      13*lM],
    [shX - 2, shY + 2,  19*lM],          // shoulder hump
    [8,       shY + 8,  22*lM],          // deepest, over the ribs
    [hipX,    hipY,     17*lM],          // hips
    [hipX + 22*tM, hipY + 1,  11*lM],    // tail
    [hipX + 44*tM, hipY + 3,   7*lM],
    [hipX + 66*tM, hipY + 6,   3.5*lM],
    [hipX + 86*tM, hipY + 10,  1.5*lM]
  ];

  return { eye:[hx - sn*.48, hy - hh*.3], eyeR:2.9*hM, mouth:[hx - sn*.9, hy + hh*.5],
           hat:[hx - sn*.3, hy - hh*2.05], top: hy - hh*2.05, spine };
}
