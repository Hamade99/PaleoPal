    const t = clamp((y-GROUND-4)/(H-GROUND-4), 0, 1) * .62;
    for (let x=BG_L;x<BG_R;x++) if (hash1(x*.731 + y*57.3) < t) g.fillRect(x,y,1,1);
  }
  for (let i=0;i<80;i++){                                   // pebbles
    const x = (rnd(BG_L+2,BG_R-4))|0, y = (GROUND+6+rnd(0,BG_B-GROUND-9))|0;
    g.fillStyle = d1; g.fillRect(x,y,2,2); g.fillStyle = d2; g.fillRect(x,y,1,1);
  }
  for (let i=0;i<48;i++){                                   // ground cover
    const x = (rnd(BG_L+4,BG_R-4))|0, y = (GROUND+5+rnd(0,BG_B-GROUND-10))|0;
    g.fillStyle = mixHex(S_.grass,'#000000',.15); g.fillRect(x,y,1,3);
    g.fillRect(x-1,y+1,1,2); g.fillRect(x+1,y+1,1,2);
  }
  if (B.floor) B.floor(g, S_);

  bgCache.set(key, c);
  return c;
}

/* A habitat at thumbnail size, for the shop. What is being sold is the view,
   so the shelf shows the view rather than a swatch or a name. */
const thumbCache = new Map();
function biomeThumb(bid){
  const phase = skyPhase(viewDate()), key = bid + '|' + phase;
  if (!thumbCache.has(key)){
    const c = makeCv(W, H), g = c.getContext('2d');
    drawHabitatView(g, phase, bid, 3);
    thumbCache.set(key, c);
  }
  return thumbCache.get(key);
}

/* The sky, in screen space, for one habitat, phase and growth stage.

   Every row of the screen asks which world row it is showing and takes that
   row's colour, so the gradient is the world's and pulls back with the view;
   the ordered dither is laid at screen pixels, so it is equally crisp at every
   stage. Above the old top of the sky the gradient carries on toward a deeper
   zenith, four more bands of it: at the adult's view there are a hundred and
   forty rows up there, and one flat colour that tall read as a wall. The rows
   at and below the old top are exactly the bands they always were. */
const skyViewCache = new Map();
function skyView(bid, phase, stage){
  const key = bid + '|' + phase + '|' + stage;
  if (skyViewCache.has(key)) return skyViewCache.get(key);
  const S_ = skySpec(bid, phase), horizon = (HABITAT_ART[bid] || HABITAT_ART.valley).horizon;
  const zenith = mixHex(S_.top, '#0a1430', .40);
  const band = i => (i <= 4 ? mixHex(zenith, S_.top, i/4) : mixHex(S_.top, S_.low, Math.min(1, (i-4)/4)))
    .slice(1).match(/../g).map(h => parseInt(h, 16));
  const bands = Array.from({length:10}, (_, i) => band(i));
  const [, sy, , sh] = BG_CROP[stage];
  const c = makeCv(W, H), g = c.getContext('2d'), img = g.createImageData(W, H), d = img.data;
  for (let Y=0;Y<H;Y++){
    const y = sy - BG_PAD_Y + (Y + .5) * sh / H;               // the world row this screen row shows
    if (y >= horizon) break;
    const f = y < 0 ? (y - BG_T) / -BG_T * 4 : 4 + y / horizon * 4;
    const i = Math.floor(f), fr = f - i;
    for (let X=0;X<W;X++){
      const col = bands[BAYER[Y&3][X&3]/16 < fr ? i + 1 : i], o = (Y*W + X)*4;
      d[o] = col[0]; d[o+1] = col[1]; d[o+2] = col[2]; d[o+3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  skyViewCache.set(key, c);
  return c;
}
/* The habitat as the glass shows it at a growth stage: sky, then the baked
   world through that stage's crop. */
function drawHabitatView(g, phase, bid, stage, inSky){
  const [sx, sy, sw, sh] = BG_CROP[stage];
  const smooth = g.imageSmoothingEnabled;
  g.imageSmoothingEnabled = false;
  g.drawImage(skyView(bid, phase, stage), 0, 0);
  if (inSky) inSky();                          // whatever lives in the sky, behind the land
  g.drawImage(bakeBg(phase, bid), sx, sy, sw, sh, 0, 0, W, H);
  g.imageSmoothingEnabled = smooth;
}

/* --------------------------- moving backdrop ------------------------------- */
/* Clouds.

   The old ones were three stacked rectangles — a wide one, a narrower one on
   top, a narrower one on top of that — which is a wedding cake, and all four
   were the same wedding cake at four sizes.

   Fair-weather cumulus has three properties and none of them is a rectangle:

     1. A FLAT BASE. The condensation level is an altitude, so every cloud in
        a field has its bottom on the same line and that line is straight and
        sharp. It is the single most recognisable thing about a cumulus and
        the thing a stack of centred rectangles destroys.
     2. A CAULIFLOWER TOP of overlapping rounded lobes at different radii,
        with one dominant tower that is never in the middle.
     3. STRONG SIDE LIGHTING. The lobes facing the sun are near-white, the
        undersides are grey, and the base is the darkest part of the cloud —
        at dawn and dusk it is also the warmest, because it is being lit from
        underneath by a sun near the horizon.

   So a cumulus is drawn column by column against the union of its lobes, the
   way the ridges and the volcano are. Cirrus is a different cloud entirely —
   ice crystals sheared out into fibrous streaks with no body and no base —
   and having one kind of each is most of what stops the sky reading as four
   copies of one thing. */
const CLOUDS = [
  { x:30,  y:28, v:5.4, w:38, kind:'cumulus', seed:0.31 },
  { x:132, y:24, v:7.2, w:48, kind:'cumulus', seed:1.77 },
  { x:196, y:37, v:3.6, w:28, kind:'cumulus', seed:2.55 },
  { x:88,  y:9,  v:2.4, w:58, kind:'cirrus',  seed:0.94 },
  { x:20,  y:48, v:1.7, w:44, kind:'cirrus',  seed:3.10 }
];

/* Lobes are derived from the cloud's seed rather than stored, so the shape is
   fixed for the life of the cloud and no two clouds share one. */
function cloudLobes(c){
  if (c.lobes) return c.lobes;
  const n = 4 + (Math.abs(Math.sin(c.seed*12.9)) > .5 ? 1 : 0);
  const out = [];
  for (let i=0;i<n;i++){
    const u = (i + .5)/n;
    const r = c.w * (0.13 + 0.10*Math.abs(Math.sin(c.seed*3.7 + i*1.9)));
    out.push({ x: (u - .5) * c.w * (0.80 + 0.12*Math.sin(c.seed*7.1 + i*2.3)), r });
  }
  out[n > 4 ? 1 : 0].r *= 1.45;           // one dominant tower, off centre
  /* The lobe's widest point sits a third of a radius above the base, so most
     of the circle is above the flat bottom and the sides meet it steeply. At
     0.58 the tallest cloud stood thirty pixels off its base and ran off the
     top of the sky, where it was clipped into a rectangle. */
  for (const L of out) L.cy = -L.r*0.35;
  return (c.lobes = out);
}

function drawCumulus(g, c, x, top, body, shade, base){
  const half = Math.ceil(c.w/2), baseY = Math.round(c.y);
  const lobes = cloudLobes(c);
  const skyline = i => {                                   // top of the union of lobes
    let t = 0;
    for (const L of lobes){
      const dx = i - L.x;
      if (Math.abs(dx) < L.r){
        const y = L.cy - Math.sqrt(L.r*L.r - dx*dx);
        if (y < t) t = y;
      }
    }
    return t;
  };
  for (let i=-half;i<=half;i++){
    const t = Math.max(Math.round(skyline(i)), 1 - baseY); // never off the top of the sky
    if (t >= 0) continue;                                  // outside the cloud
    const h = -t, px = x + i;
    g.fillStyle = body; g.fillRect(px, baseY + t, 1, h);
    // the underside darkens toward the flat base
    g.fillStyle = shade;
    g.fillRect(px, baseY - Math.max(1, Math.round(h*.30)), 1, Math.max(1, Math.round(h*.30)));
    g.fillStyle = base; g.fillRect(px, baseY - 1, 1, 1);
    /* Sunlit crown. Light comes from the upper left, the same as everything
       else in this game, so a column whose surface is still rising to the
       right is facing the light and a column past the crest is not. */
    const rising = Math.round(skyline(i+1)) < t;
    g.fillStyle = top;
    g.fillRect(px, baseY + t, 1, rising ? 2 : 1);
  }
}

function drawCirrus(g, c, x, top, body){
  const half = c.w/2;
  for (let k=0;k<4;k++){
    const len = Math.round(c.w * (0.42 + 0.5*Math.abs(Math.sin(c.seed*5.3 + k*2.1))));
    const x0 = Math.round(x - half + (c.w - len) * (0.5 + 0.45*Math.sin(c.seed + k*1.6)));
    const y0 = Math.round(c.y + k*2 + Math.sin(c.seed*2.2 + k)*1.5);
    const rake = (k % 2 ? 1 : -1) * 2 / Math.max(1, len);   // sheared by the wind aloft
    for (let i=0;i<len;i++){
      const a = Math.sin((i/len) * Math.PI);                // fibrous: fades at both ends
      if (a < .34) continue;
      g.fillStyle = a > .82 ? top : body;
      g.fillRect(x0 + i, y0 + Math.round(i*rake), 1, 1);
    }
  }
}

function stepWorld(dt, now){
  for (const cloud of CLOUDS){ cloud.x += cloud.v*dt/1000; if (cloud.x > W+cloud.w) cloud.x = -cloud.w; }
  if (!flyer && now > flyerAt) flyer = {x:-14,y:rnd(18,54),v:rnd(26,40),p:0};
  if (flyer){
    flyer.x += flyer.v*dt/1000; flyer.p += dt;
    if (flyer.x > W+14){ flyer = null; flyerAt = now+rnd(25,60)*1000; }
  }
  for (const mote of MOTES){
    mote.x += mote.vx*dt/1000;
    mote.y += Math.sin(mote.p+now/1400)*dt*.0048;
    if (mote.x > W+2) mote.x = -2;
  }
}
function drawClouds(g, phase){
  const S_ = skyOf(phase), night = phase === 'night';
  /* A cloud is white lit and grey shaded, but the underside takes its colour
     from the horizon it is being lit by — which at dawn and dusk means the
     base of every cloud in the sky goes warm. */
  const top   = night ? 'rgba(206,216,240,.36)' : mixHex(S_.low, '#ffffff', .82);
  const body  = night ? 'rgba(158,170,200,.30)' : mixHex(S_.low, '#ffffff', .52);
  /* The underside darkens toward slate rather than toward the ground colour.
     Mixed toward S_.mid the bases came out green, which is a cloud with a
     field reflected in it; mixed toward S_.top they went purple at dawn,
     which is a cloud lit by the wrong half of the sky. Keeping the horizon's
     own hue and only taking light out of it leaves a grey base by day and a
     warm one at dawn and dusk, which is what a low sun actually does. */
  const shade = night ? 'rgba(112,124,156,.28)' : mixHex(S_.low, '#46505f', .24);
  const base  = night ? 'rgba(84,94,128,.32)'   : mixHex(S_.low, '#46505f', .46);
  for (const c of CLOUDS){
    const x = Math.round(c.x);
    if (c.kind === 'cirrus') drawCirrus(g, c, x, top, body);
    else drawCumulus(g, c, x, top, body, shade, base);
  }
}
let flyer = null, flyerAt = 4000;
function drawSkyBody(g, phase, now){
  // the sun and moon ride an arc keyed to the player's actual clock
  const d = viewDate(), h = d.getHours() + d.getMinutes()/60;
  const night = phase === 'night';
  const t = clamp(night ? ((h + 3) % 24) / 12 : (h - 6) / 13, 0, 1);
  const cx = 18 + t*(W-36), cy = 62 - Math.sin(clamp(t,0,1)*Math.PI) * 44;
  if (night){
    g.fillStyle = '#e8e6d2'; g.beginPath(); g.arc(cx, cy, 7, 0, 7); g.fill();
    g.fillStyle = skyOf(phase).top; g.beginPath(); g.arc(cx-3.5, cy-2.5, 6, 0, 7); g.fill();
  } else {
    g.fillStyle = phase === 'day' ? 'rgba(250,238,170,.35)' : 'rgba(250,200,140,.3)';
    g.beginPath(); g.arc(cx, cy, 12, 0, 7); g.fill();
    g.fillStyle = phase === 'day' ? '#f7ecac' : '#f6c887';
    g.beginPath(); g.arc(cx, cy, 7, 0, 7); g.fill();
  }
}
function drawFlyers(g){
  if (!flyer) return;
  const up = Math.sin(flyer.p/130) > 0;
  g.fillStyle = 'rgba(40,48,54,.7)';
  const x = Math.round(flyer.x), y = Math.round(flyer.y);
  g.fillRect(x-1, y, 3, 1);
  if (up){ g.fillRect(x-5, y-2, 4, 1); g.fillRect(x+2, y-2, 4, 1); }
  else   { g.fillRect(x-5, y+2, 4, 1); g.fillRect(x+2, y+2, 4, 1); }
}
/* The plume, and the light in the crater.

   Neither is baked with the cone. A backdrop is cached per sky phase and
   redrawn perhaps four times a day, so anything baked into it is a painting
   on a wall — the old smoke was a translucent rectangle that had never moved
   in the history of the game. Smoke is the one thing on a volcano that is
   always moving, and it is most of what says the mountain is alive.

   Eight puffs share one rising cycle, each a third of a turn behind the last.
   A puff widens and fades as it climbs and leans downwind with height, which
   is wind shear and is why a real plume bends. */
/* Thirty puffs over a slower cycle. The column climbs to the top of a world
   twice as tall as it was, and fourteen puffs spread over that read as a
   string of separate bubbles going up. */
const PLUME_N = 30, PLUME_MS = 11000;
function drawPlume(g, phase, now){
  /* The vent, not the apex. VOLC.top is where a pointed cone of this profile
     would come to a point, and the summit is truncated well below it — using
     it here drew the smoke, the lava and the runnel glow in clear sky above
     the mountain, with the glow reading as two arcs bridging the summit. */
  const px = VOLC.x, rimY = Math.round(VOLC.base - volcHeight(0));
  const night = phase === 'night';

  /* The crater. At night it is the only warm light in the scene, so it
     carries a slow pulse; by day it is mostly washed out and reads as heat
     rather than as fire. */
  const pulse = .72 + .28*Math.sin(now/1450) + .08*Math.sin(now/430);
  const glow = night ? .95 : phase === 'day' ? .34 : .62;
  const cw = Math.round(VOLC.half*CRATER_T);
  /* The haze over the vent stays inside the notch. Spread wide enough to
     stand against the sky it read as a pale arch bridging the summit. */
  g.fillStyle = 'rgba(226,104,44,' + (0.16*glow*pulse).toFixed(3) + ')';
  g.beginPath(); g.ellipse(px, rimY + 4, cw + 1, 5, 0, 0, 7); g.fill();
  /* The lava lies on the crater floor, which means asking the profile where
     the floor is rather than inventing a second curve for it — the first
     version bowed the pool the wrong way and put the deepest lava against
     the lips, which drew an orange arch over the notch. */
  for (let i=-cw+2;i<=cw-2;i++){
    const t = Math.abs(i)/cw;
    const y = Math.round(VOLC.base - volcHeight(Math.abs(i)/VOLC.half));
    g.fillStyle = 'rgba(206,66,28,' + (0.92*glow).toFixed(3) + ')';
    g.fillRect(px+i, y, 1, 2);
    if (t < .66){
      g.fillStyle = 'rgba(240,150,54,' + (0.92*glow*pulse).toFixed(3) + ')';
      g.fillRect(px+i, y, 1, 1);
    }
    if (t < .30){
      g.fillStyle = 'rgba(252,226,150,' + (0.88*glow*pulse).toFixed(3) + ')';
      g.fillRect(px+i, y, 1, 1);
    }
  }

  // the runnels, lit from inside the mountain
  /* The upper reach of each channel, lit from inside the mountain. Barely
     there by day; at night it is the only other warm thing in the frame. */
  g.fillStyle = 'rgba(200,74,30,' + ((night ? .70 : .30)*glow*pulse).toFixed(3) + ')';
  const lipY = Math.round(VOLC.base - volcHeight(CRATER_T));
  for (const dir of [-1, 1]){
    const seat = dir < 0 ? 0.40 : 0.52;
    for (let k=0;k<12;k++){
      const y = lipY + 2 + k;
      const rx = px + dir * volcSpan(y) * (seat + 0.05*Math.sin(k*.22));
      g.fillRect(Math.round(rx), y, 1, 1);
    }
  }

  // the column
  for (let i=0;i<PLUME_N;i++){
    const u = ((now/PLUME_MS + i/PLUME_N) % 1);
    const y = rimY + 1 - u * (rimY - BG_T + 3);           // vent to the top of the world's sky
    const r = 3 + u*u*24;                                 // spreading over the taller climb
    const drift = u*u*22 + Math.sin(now/2200 + i)*2.5;    // leaning downwind as it climbs
    /* Fourteen thin puffs rather than eight fat ones. At eight the alpha had
       to be high enough that each ellipse showed its own rim, and a column of
       visible rims is a string of bubbles, not smoke. */
    const a = (1 - u) * (night ? .20 : .30);
    if (a <= .02) continue;
    // by night smoke is a dark body against the sky, lit warm only at the vent
    const col = night ? (u < .22 ? 'rgba(150,104,78,' : 'rgba(28,34,56,')
                      : 'rgba(206,200,196,';
    g.fillStyle = col + a.toFixed(3) + ')';
    g.beginPath(); g.ellipse(px + drift, y, r, r*.78, 0, 0, 7); g.fill();
    if (u < .35 && !night){                                // hot, dark core at the vent
      g.fillStyle = 'rgba(96,80,72,' + (a*.8).toFixed(3) + ')';
      g.beginPath(); g.ellipse(px + drift*.6, y + 1, r*.55, r*.45, 0, 0, 7); g.fill();
    }
  }

  // embers, only when they would be visible
  if (night || phase === 'dusk'){
    for (let i=0;i<5;i++){
      const u = ((now/2600 + i*.2) % 1);
      const y = rimY + 1 - u*26;
      const x = px + Math.sin(now/700 + i*2.1) * (2 + u*7) + u*u*6;
      g.fillStyle = 'rgba(246,164,72,' + ((1-u)*.85).toFixed(3) + ')';
      g.fillRect(x|0, y|0, 1, 1);
    }
  }
}

/* --------------------------- live habitat layers ---------------------------
   Anything in a habitat that moves has to be drawn per frame, because the
   backdrop is baked once per biome and phase and then cached — the volcano's
   smoke sat still for the whole life of this project for exactly that reason.
   One hook per biome, called from drawScene.
   -------------------------------------------------------------------------- */

/* Salt lagoon: a surf line running up the sand and back down it. */
function drawSurf(g, phase, now){
  const S_ = skyOf(phase);
  const foam = mixHex(S_.water, '#ffffff', .72), wash = mixHex(S_.water, '#ffffff', .40);
  for (let k=0;k<3;k++){
    const u = ((now/3400 + k*.34) % 1);
    const reach = GROUND - 6 + Math.round(Math.sin(u*Math.PI) * 11);   // in and back out
    const a = Math.sin(u*Math.PI);
    if (a < .12) continue;
    for (let x=BG_L;x<BG_R;x++){
      const y = reach + Math.round(Math.sin(x*.06 + k*2.1 + now/900)*1.6);
      g.fillStyle = a > .55 ? foam : wash;
      g.fillRect(x, y, 1, 1);
      if (a > .70 && (x + k*3) % 7 < 3) g.fillRect(x, y+1, 1, 1);
    }
  }
}

/* Ash flats: the plume, and everything else an eruption is doing. A desolate
   place is only worth looking at if something is happening in it: lava
   breathing in the cracks of the crust on the flats and running in a channel
   down the flank, steam off the vents, bombs thrown out of the crater, and now
   and then lightning in the column, which ash does make. */
const ASH = Array.from({length:32}, () => ({ x:rnd(BG_L,BG_R), y:rnd(BG_T,GROUND), v:rnd(6,16), p:rnd(0,6.3) }));
function drawAshfall(g, phase, now){
  drawPlume(g, phase, now);
  drawPlume(g, phase, now + 2100);            // a second column, offset: it is erupting
  const night = phase === 'night', rimY = Math.round(VOLC.base - volcHeight(0));

  /* The flank channel: a hot knot every forty rows, travelling down it, over
     a glow that breathes. */
  const flow = ashFlow(), pulse = .62 + .38*Math.sin(now/900);
  flow.forEach(([x, y], i) => {
    const run = ((i - now/70) % 40 + 40) % 40, hot = run < 6;
    g.fillStyle = 'rgba(255,' + (hot ? 214 : 118) + ',' + (hot ? 110 : 40) + ','
                + ((night ? .95 : .72) * (hot ? 1 : .55) * pulse).toFixed(3) + ')';
    g.fillRect(x, y, 2, 1);
  });

  /* The cracks in the crust on the flats. Each plate of crust breathes on its
     own phase, so the glow moves across the field instead of blinking. */
  for (const [x, y, k] of ashCracks()){
    const b = .35 + .65*Math.max(0, Math.sin(now/1400 + k*1.9));
    g.fillStyle = 'rgba(255,' + Math.round(90 + 120*b) + ',' + Math.round(28 + 50*b) + ','
                + ((night ? .95 : .80) * b).toFixed(3) + ')';
    g.fillRect(x, y, 1, 1);
  }

  // steam off the fumaroles, leaning downwind as it climbs
  for (const [vx, vy] of ashVents()){
    for (let i=0;i<6;i++){
      const u = (now/2600 + i/6 + vx*.013) % 1, r = 1.5 + u*6;
      g.fillStyle = (night ? 'rgba(150,146,160,' : 'rgba(236,232,218,')
                  + ((1 - u) * (night ? .20 : .34)).toFixed(3) + ')';
      g.beginPath(); g.ellipse(vx + u*u*12 + Math.sin(now/700 + i)*1.2, vy - u*28, r, r*.7, 0, 0, 7); g.fill();
    }
  }

  /* Bombs: thrown out of the crater on a parabola, each with a short cooling
     trail, and gone once they land on the flank. Each throw picks its own
     direction off the hash of which throw it is. */
  for (let b=0;b<4;b++){
    const P = 2300 + b*410, n = Math.floor((now + b*977) / P), u = ((now + b*977) % P) / P;
    const vx = (hash1(n*3.1 + b) - .5) * 80, lift = 50 + hash1(n*5.3 + b)*30;
    const at = s => [Math.round(VOLC.x + vx*s), Math.round(rimY - lift*s + (lift + 40)*s*s)];
    if (at(u)[1] > rimY + 24) continue;
    for (let t=2;t>=0;t--){
      const [x, y] = at(Math.max(0, u - t*.025));
      g.fillStyle = t === 0 ? 'rgba(255,224,140,.95)' : 'rgba(236,104,40,' + (.6 - t*.2).toFixed(2) + ')';
      g.fillRect(x, y, 1, 1);
    }
  }

  /* Lightning in the ash column, a few times a minute: a jagged bolt that
     flickers twice, and a cold flash in the ash around it. */
  const LP = 5300, cyc = Math.floor(now/LP), lt = now % LP;
  if (hash1(cyc*1.7) > .3 && (lt < 60 || (lt > 110 && lt < 170))){
    let x = Math.round(VOLC.x + 8 + (hash1(cyc*2.3) - .5)*30), y = Math.round(rimY - 40 - hash1(cyc*3.9)*50);
    /* The flash is a few faint soft layers inside the ash, not one disc: a
       single translucent ellipse that size had a hard rim and read as a moon
       rising out of the plume. */
    for (let k=0;k<3;k++){
      g.fillStyle = 'rgba(214,206,255,.05)';
      g.beginPath(); g.ellipse(x + 1, y + 12, 8 + k*6, 7 + k*5, 0, 0, 7); g.fill();
    }
    g.fillStyle = 'rgba(248,246,255,.96)';
    for (let s=0;s<10;s++){
      const nx = x + Math.round((hash1(cyc*5.1 + s*1.3) - .5)*8), ny = y + 2 + Math.round(hash1(cyc*7.7 + s)*3);
      const steps = Math.max(1, Math.abs(nx - x), Math.abs(ny - y));
      for (let k=0;k<=steps;k++) g.fillRect(Math.round(lerp(x, nx, k/steps)), Math.round(lerp(y, ny, k/steps)), 1, 1);
      x = nx; y = ny;
    }
  }

  g.fillStyle = phase === 'night' ? 'rgba(180,176,186,.34)' : 'rgba(96,88,84,.42)';
  for (const a of ASH){
    a.y += a.v * 0.016;
    a.x += Math.sin(now/1100 + a.p) * .30;
    if (a.y > GROUND){ a.y = BG_T - 2; a.x = rnd(BG_L, BG_R); }
    g.fillRect(a.x|0, a.y|0, 1, 1);
  }
}

/* Fern gorge: the fall coming down, and the spray coming off it. */
function drawFallsSpray(g, phase, now){
  const S_ = skyOf(phase);
  const white = mixHex(S_.water, '#ffffff', .78), pale = mixHex(S_.water, '#ffffff', .40);
  const brink = fallsBrink();
  /* Streaks down the sheet at different rates, each holding its fraction of
     the way across as the sheet spreads, so none of them runs off its edge.
     They start under the glassy rows at the brink, where the water breaks up,
     and stop at the pool: run to the ground line they carried on over the
     treeline in front of the wall, which is a waterfall falling through a wood. */
  const y0 = brink + 2, span = FALLS.pool - y0 - 3;
  for (let k=0;k<7;k++){
    const off = (k - 3) / 3.4 + Math.sin(k*2.3)*.08;          // -1 … 1 across the sheet
    for (let i=0;i<4;i++){
      const y = y0 + ((now*(0.06 + k*0.008) + i*span/4 + k*13) % span);
      const x = Math.round(FALLS.x + off * (fallsHalf(y) - 1));
      g.fillStyle = (k % 2) ? white : pale;
      g.fillRect(x, y|0, 1, Math.min(4, FALLS.pool - y));
    }
  }
  // a glint travelling along the crest as the water rounds over it
  const gx = Math.floor((now/140) % (FALLS.half*2 + 5)) - 2;
  if (gx > 0 && gx < FALLS.half*2){
    g.fillStyle = '#ffffff'; g.fillRect(FALLS.x - FALLS.half + gx, brink - 1, 1, 1);
  }
  // the boil at the foot, and mist coming off it
  for (let i=0;i<9;i++){
    const u = ((now/1500 + i*.11) % 1);
    const r = 2 + u*7;
    g.fillStyle = 'rgba(226,240,240,' + ((1-u)*.24).toFixed(3) + ')';
    g.beginPath();
    g.ellipse(FALLS.x + Math.sin(i*2.1)*13, FALLS.pool - 1 - u*12, r, r*.62, 0, 0, 7);
    g.fill();
  }
  /* Flecks carried down the outflow and along the stream, each at its own
     speed and depth, so the water on the floor runs rather than lies there. */
  g.fillStyle = mixHex(S_.water, '#ffffff', .62);
  const chEnd = gorgeStreamTop(gorgeChannel(GROUND + 12));
  for (let i=0;i<5;i++){
    const u = (now/1800 + i/5) % 1, y = Math.round(lerp(GROUND - 3, chEnd, u));
    g.fillRect(gorgeChannel(y) + (i % 3) - 1, y, 1, 2);
  }
  for (let i=0;i<46;i++){
    const x = Math.round(BG_L + ((i*97.3 + now*(.012 + (i % 4)*.003)) % BG_SPAN));
    g.fillRect(x, gorgeStreamTop(x) + 1 + (i*7) % 9, 2 + (i % 3), 1);
  }
}

/* Polar dawn: aurora, and only when it would be visible. */
function drawAurora(g, phase, now){
  if (phase === 'day') return;
  const a = phase === 'night' ? 1 : .34;
  for (let k=0;k<3;k++){
    const base = 22 + k*9, amp = 7 - k*1.6;
    for (let x=BG_L;x<BG_R;x+=1){
      const y = base + Math.sin(x*.028 + now/2600 + k*1.7)*amp
                     + Math.sin(x*.071 + now/1500 + k)*2.2;
      const h = 10 + Math.sin(x*.041 + now/2000 + k*2.4)*7;
      if (h < 2) continue;
      const fade = (0.10 + 0.06*Math.sin(x*.02 + now/3100 + k)) * a;
      g.fillStyle = 'rgba(126,226,168,' + fade.toFixed(3) + ')';
      g.fillRect(x, y|0, 1, h|0);
      g.fillStyle = 'rgba(150,180,246,' + (fade*.7).toFixed(3) + ')';
      g.fillRect(x, (y+h*.7)|0, 1, (h*.5)|0);
    }
  }
}

/* The live layer, in the same world the landmarks were painted in.

   A backdrop is baked into a world wider than the screen and shown through a
   crop that widens with age. The live painters used to draw straight onto the
   screen at the landmarks' own coordinates, which is the same place only while
   the crop is scale 1 at the old offset — hatchling. From juvenile on the cone
   shrank and slid down under a crater glow and a plume that stayed where they
   were, and the rim floated off into the sky; the fall's spray ran up past its
   brink in the same way. So they paint onto a transparent world-sized canvas
   with the bake's translate, and that canvas goes through the backdrop's crop
   with the same nearest-neighbour sampling, which makes a baked pixel and a live
   pixel at one world coordinate land on one screen pixel at every stage. */
let liveCv = null, liveG = null;
function drawHabitatLive(g, phase, now, stage){
  if (!liveCv){ liveCv = makeCv(BG_W, BG_H); liveG = liveCv.getContext('2d'); }
  liveG.setTransform(1, 0, 0, 1, 0, 0);
  liveG.clearRect(0, 0, BG_W, BG_H);
  liveG.setTransform(1, 0, 0, 1, BG_PAD_X, BG_PAD_Y);
  const B = BIOMES[biomeId()] || BIOMES.valley;
  if (B.live) B.live(liveG, phase, now);
  if (B.pond) drawWater(liveG, phase, now, B.pond);   // ripples on the pond, where this habitat has one
  const [sx, sy, sw, sh] = BG_CROP[stage];
  const smooth = g.imageSmoothingEnabled;
  g.imageSmoothingEnabled = false;
  g.drawImage(liveCv, sx, sy, sw, sh, 0, 0, W, H);
  g.imageSmoothingEnabled = smooth;
}

/* A live rank of grass along the ground line, leaning on a slow breeze. The
   baked backdrop cannot move, so the boundary the animal stands on was the
   one hard line in the scene that never did anything. */
const BLADES = Array.from({length:34}, (_, i) => ({
  x: 3 + i*6.6 + (i%3)*1.7, h: 4 + (i%4)*2, p: (i*1.7) % 6.3
}));
function drawGrassLine(g, phase, now){
  const S_ = skyOf(phase);
  const col = mixHex(S_.grass, '#000000', .20), lit = mixHex(S_.grass, S_.low, .34);
  for (const b of BLADES){
    const lean = Math.sin(now/1600 + b.p) * 1.6 + Math.sin(now/430 + b.p*2) * .4;
    const x = b.x | 0;
    for (let k=0;k<b.h;k++){
      const t = k/b.h;
      g.fillStyle = k === b.h-1 ? lit : col;
      g.fillRect(Math.round(x + lean*t*t), GROUND - 1 - k, 1, 1);
    }
  }
}

function drawMotes(g, phase){
  g.fillStyle = phase === 'night' ? 'rgba(190,205,235,.30)' : 'rgba(255,248,208,.45)';
  for (const m of MOTES){
    g.fillRect(m.x|0, m.y|0, 1, 1);
  }
}
function drawWater(g, phase, now, pond){
  const S_ = skyOf(phase);
  const mid = Math.round((pond[0] + pond[1]) / 2), reach = (pond[1] - pond[0]) * .43;
  g.fillStyle = mixHex(S_.water, S_.low, .55);
  for (let i=0;i<4;i++){
    const y = GROUND + 10 + i*2;
    const half = Math.round(Math.sqrt(Math.max(0, 1 - Math.pow((y-GROUND-8)/12, 2))) * reach);
    if (half < 4) continue;
    const w = Math.round(6 + Math.abs(Math.sin(now/760 + i*1.7)) * (half - 4));
    const cx = mid + Math.round(Math.sin(now/1100 + i*2.2) * (half - w) * .5);
    g.fillRect(cx - (w>>1), y, w, 1);
  }
}

/* ---------------------- foreground, drawn over the animal ------------------ */
const FRONDS = [ {x:-3, s:1.15, p:0, dir:1}, {x:W+3, s:1.0, p:2.4, dir:-1} ];
function drawFronds(g, phase, now){
  const S_ = skyOf(phase);
  const dark = mixHex(S_.tree,'#000000',.40), body = S_.tree, lit = mixHex(S_.tree,S_.low,.32);
  for (const f of FRONDS){
    for (let a=0;a<4;a++){
      const ang = 0.44 + a*0.36 + Math.sin(now/1300 + f.p + a*.7) * 0.05;
      const len = (44 - a*5) * f.s;
      const bx = f.x, by = H + 3;
      for (let t=1;t<=13;t++){
        const u = t/13;
        const x = Math.round(bx + f.dir * Math.cos(ang) * len * u);
        const y = Math.round(by - Math.sin(ang) * len * u + u*u*5);
        const lf = Math.max(1, Math.round(lerp(7, 1.5, u) * f.s));
        g.fillStyle = (t & 1) ? body : dark;
        g.fillRect(x - 1, y - lf, 2, lf*2);                  // leaflets across the spine
        g.fillStyle = dark; g.fillRect(x - 1, y - 1, 2, 2);  // spine
        if (t < 5){ g.fillStyle = lit; g.fillRect(x - 1, y - lf, 2, 2); }
      }
    }
  }
}

/* ------------------------------ particles --------------------------------- */
let parts = [];
function emit(type, x, y, n, opt){
  opt = opt || {};
  for (let i=0;i<n;i++) parts.push({
    type, x: x + rnd(-4,4), y: y + rnd(-3,3),
    vx: opt.vx !== undefined ? rnd(-opt.vx,opt.vx) : rnd(-9,9),
    vy: opt.vy !== undefined ? opt.vy + rnd(-6,6) : rnd(-26,-10),
    g: opt.g || 0, life: opt.life || rnd(700,1200), age: 0, col: opt.col
  });
}
function stepParts(dt){
  for (const p of parts){ p.age += dt; p.vy += p.g*dt/1000; p.x += p.vx*dt/1000; p.y += p.vy*dt/1000; }
  parts = parts.filter(p => p.age < p.life);
}
/* Seven across rather than five, with a rim and a highlight. The old one was
   a 5x5 blob that vanished against the animal. The art is in PIX now. */
function heartPx(g,x,y){ pixDrawBoxed(g, 'heart', x, y, 1); }
function drawParts(g){
  for (const p of parts){
    const x = Math.round(p.x), y = Math.round(p.y), fade = p.age/p.life;
    if (p.type==='heart'){ heartPx(g,x,y); }
    else if (p.type==='spark'){ g.fillStyle = p.col||'#fff6d8'; g.fillRect(x,y,2,2); g.fillStyle='#ffffff'; g.fillRect(x,y,1,1); }
    else if (p.type==='crumb'){ g.fillStyle = p.col||'#9b7a52'; g.fillRect(x,y,1,1); }
    else if (p.type==='bubbleZ'){                       // an actual Z, not two squares
      g.fillStyle = fade < .6 ? '#dfe4f6' : '#9aa6c4';
      g.fillRect(x,y,5,1); g.fillRect(x+3,y+1,1,1); g.fillRect(x+2,y+2,1,1);
      g.fillRect(x+1,y+3,1,1); g.fillRect(x,y+4,5,1);
    }
    else if (p.type==='stink'){ g.fillStyle = fade<.5?'#7d9c5a':'#5d7a44'; g.fillRect(x,y,2,2); }
    else if (p.type==='note'){ g.fillStyle='#e8dcbf'; g.fillRect(x,y,2,4); g.fillRect(x+2,y-1,2,2); }
  }
}

/* --------------------------- props: food & mess ----------------------------
   Both are entries in PIX. `flat` paints every pixel one colour, which is what
   gives a food item the hard outline every animal in this game has — a green
   fern frond on a green grass line is otherwise invisible, and a bounding
   rectangle comes out as a black plaque instead of an outline.

   Boxed, so a food redrawn on a finer grid keeps its size and gains detail
   instead of growing out of its cell. See PIX_BOX in 00-art.js. */
function drawItem(g, id, x, y, s, flat){ pixDrawBoxed(g, 'item.' + id, x, y, s || 1, flat); }
/* A food as a picture in a cell or a row: centred on its painted pixels and
   sized to the space. drawItem is for items in the world, placed by origin. */
function drawItemFit(g, id, cx, cy, maxW, maxH, cap){ pixDrawFit(g, 'item.' + id, cx, cy, maxW, maxH, cap); }
function drawMess(g, x, y){ pixDrawBoxed(g, 'mess', x, y, 1); }

/* ==========================================================================
   CARE SIM
   Every number runs on wall-clock time, so an animal ages identically whether
   the tab is focused, backgrounded, or closed for two days. The keeper holds a
   nest of up to six animals; all of them age, only one is on screen.
   ========================================================================== */

/* The save is the product. A player's streak, their named animals and the time
   they put in all live in this one blob, so nothing here may drop it on the
   floor. SAVE_KEY keeps its historical name so existing installs still find
   their data; the version now travels inside the save, not in the key. */
const SAVE_VERSION = 2;
const SAVE_KEY = 'paleopal:save:2';
const BACKUP_KEY = 'paleopal:save:backup';
/* Developer mode plays a copy. Turning it on writes the nest to DEV_SAVE_KEY
   and reloads onto that copy; from then on every save goes there, so nothing
   done while testing — the tools, or ordinary play at odd hours — touches the
   real nest. Turning it off deletes the copy and reloads onto the real save,
   which catches up on the time spent away like any other absence. The switch
   is its own Store key rather than a field on the save, so the copy cannot
   carry it into the real nest. */
const DEV_SAVE_KEY = 'paleopal:save:dev', DEV_MODE_KEY = 'paleopal:dev:on';
let devMode = false;
const saveKey = () => devMode ? DEV_SAVE_KEY : SAVE_KEY;
const MAX_PETS = 6;

const FOODS = [
  { id:'fern',  name:'Fern frond',  cost:4,  fill:26, joy:3,  treat:false, note:'Cheap roughage. Herbivores love it.' },
  { id:'berry', name:'Ripe berries',cost:5,  fill:22, joy:6,  treat:false, note:'Sweet, small, gone in a second.' },
  { id:'cycad', name:'Cycad cone',  cost:7,  fill:34, joy:4,  treat:false, note:'Dense and filling. Takes a while to chew.' },
  { id:'fish',  name:'River fish',  cost:8,  fill:36, joy:5,  treat:false, note:'Oily and rich. Carnivores go quiet for it.' },
  { id:'meat',  name:'Haunch',      cost:12, fill:48, joy:7,  treat:false, note:'A full meal. Expensive.' },
  { id:'cake',  name:'Honey cake',  cost:10, fill:10, joy:22, treat:true,  note:'A treat. Three in an hour and the stomach protests.' }
];
const REMEDIES = [
  { id:'ginger', name:'Ginger root',  cost:12, cures:'bellyache', note:'Settles a churning stomach.' },
  { id:'broth',  name:'Warm broth',   cost:10, cures:'chill',     note:'For shivering and sneezing.' },
  { id:'dust',   name:'Dust bath',    cost:8,  cures:'mites',     note:'Grit works the parasites out of the skin.' },
  { id:'company',name:'Sit together', cost:0,  cures:'blues',     note:'No cure in a bottle. Just time and attention.' }
];
/* Each symptom names what the animal wants, in the same words its remedy is
   described in — sharp/settle, hot/warm, grit/grit, no shelf/no bottle. The
   Care screen shows the symptom above the list of four remedies, and it used
   to describe the illness without pointing at any of them, so picking the
   right one was a guess the first few times. The length is held to what it
   was: the screen reserves room for exactly the lines this text wraps to, and
   two illnesses at once have to fit above five rows. */
const ILLS = {
  bellyache:{ name:'Bellyache',  symptom:'Puffed up, off its food. Something sharp would settle it.', drain:'hunger' },
  chill:    { name:'Chill',      symptom:'Shivering and sneezing. It wants something hot in it.',     drain:'energy' },
  mites:    { name:'Skin mites', symptom:'Scratching nonstop. It needs grit to roll in.',             drain:'hygiene' },
  blues:    { name:'The blues',  symptom:'Head low, tail still. No shelf sells this cure.',           drain:'joy' }
};
const HAT_SHOP = [
  { id:'frond',   name:'Fern sprig',   cost:20,  slot:'head' },
  { id:'cap',     name:'Field cap',    cost:70,  slot:'head' },
  { id:'cone',    name:'Party cone',   cost:95,  slot:'head' },
  { id:'hardhat', name:'Site helmet',  cost:130, slot:'head' },
  { id:'crown',   name:'Bone crown',   cost:200, slot:'head' }
];
/* `slot` is where the thing sits on the animal; the pet stores it under a
   different name, and the two are not the same word. Writing `S[slot]` put
   every head hat in `S.head`, which nothing draws, nothing saves and the save
   validator does not know about — so the five head hats could be bought and
   paid for and never appeared, while the one face item there used to be worked,
   because `face` is the one slot whose two names happen to match. One map, and
   everything that turns a slot into a field goes through it. */
const GEAR_FIELD = { head:'hat', face:'face' };
const TRAITS = {
  appetite:[ {id:'greedy', name:'Bottomless', note:'Gets hungry fast and never says no.', hunger:1.35, foodJoy:1.0},
             {id:'picky',  name:'Particular', note:'Eats slowly, and only really enjoys its favourites.', hunger:.78, foodJoy:.7} ],
  tempo:   [ {id:'spirited',name:'Spirited',  note:'Never stops moving. Burns energy quickly.', energy:1.3, speed:1.35, joy:1.15},
             {id:'placid',  name:'Placid',    note:'Content to stand and watch the clouds.',    energy:.75, speed:.7,  joy:.85} ],
  social:  [ {id:'bold',   name:'Bold',       note:'Comes straight over when you reach in.',    bond:1.25, lonely:.8},
             {id:'shy',    name:'Cautious',   note:'Takes longer to trust, then never lets go.',bond:.75, lonely:1.3} ]
};
const NAMES = ['Pebble','Norbert','Tiny','Bonk','Fern','Cleo','Spike','Dot','Pip','Tank','Mochi','Juniper','Rust','Marrow','Basil','Willow','Grub','Tuck'];
const GROWTH_GATES = [20, 90, 240];      // minutes of well-cared-for time

/* The simulation's rates and its sleep window, in one place so the developer
   panel can turn them. These are the shipped values; `SIM` is what the tick
   reads, and it only differs from `SIM_DEFAULTS` on a machine where someone has
   tuned it (kept under its own Store key, never in the nest's save).

     hunger, hygiene, joy   points lost per hour awake (before traits)
     energyAwake/Asleep     points lost awake, regained asleep, per hour
     bedHour, wakeHour      the local-hour sleep window
     growth                 multiplier on well-kept minutes toward the next stage

   Illness onset. Each illness has a cause the player controls and a length of
   time that cause has to hold before the animal falls ill; the time runs back
   down while the cause is absent. Nothing here is a roll.
     mitesBelow/Hours       hygiene under this for this long
     bluesBelow/Hours       joy under this for this long
     chillAfter/Hours       kept awake past bedtime this long, then this long more
     bellyTreats/Hours      this many treats within the hour, held this long

   Mites and the blues were under 20 for two hours and under 15 for two and a
   half. Run through a week of twice-a-day visits that fed, washed, played with
   and treated the animal, those gave eleven to thirteen cases each — illness
   several times a day for someone doing everything right. */
const SIM_DEFAULTS = Object.freeze({ hunger:7.5, hygiene:4.0, joy:6.0, energyAwake:8.5, energyAsleep:20,
                                     bedHour:21, wakeHour:6, growth:1,
                                     mitesBelow:15, mitesHours:4, bluesBelow:10, bluesHours:4,
                                     chillAfter:2, chillHours:1, bellyTreats:3, bellyHours:.25 });
const SIM = Object.assign({}, SIM_DEFAULTS);
const SIM_KEY = 'paleopal-dev-tuning';
/* How long an animal woken by hand stays up before the night rule may put it
   back under. Without it, waking a tired animal at night was undone by the
   very next tick half a second later, which is what made sleep feel like a
   state the player had no handle on at all: a starving, filthy animal could
   not be fed or washed, and nothing you pressed changed that. */
const WAKE_GRACE = 20 * MIN;

let G = null, S = null;

function freshPet(){
  return {
    sp:null, name:'', born:0, growth:0, hat:null, face:null, owned:[], skin:'wild', skinsOwned:['wild'],
    biome:'valley',
    needs:{ hunger:78, energy:88, hygiene:100, joy:70 },
    health:100, bond:6, vet:false,
    traits:{ appetite:0, tempo:0, social:0 },
    asleep:false, ills:[], treats:[], mess:[], log:[],
    nightAwake:0, petBank:0, stageSeen:0, messTimer:0, wokeAt:0,
    exposure:{ bellyache:0, chill:0, mites:0, blues:0 }, simSeed:123456789,
    journal:[], records:{}, habitatAt:0
  };
}
function freshGame(){
  /* Which habitats have been paid for is the keeper's — a place is bought
     once and then open to the whole nest. Which one an animal is actually
     standing in is the animal's, the same way its coat and its hat are. Moving
     one animal to the lagoon used to move all of them, which made the nest a
     single enclosure with one view rather than five animals in five places. */
  return { v:SAVE_VERSION, pets:[freshPet()], active:0, coins:24, sound:true, dev:true, lastDay:'', streak:0,
           biomesOwned:['valley'],
           lastTick:Date.now(), lastSeen:Date.now() };
}

/* --------------------------- loading a save --------------------------------
   Adding a field needs no migration: Object.assign over freshGame/freshPet
   already fills in anything a older save is missing. A migration is only for
   a change that reshapes or reinterprets existing data.

   Each entry is keyed by the version it reads and must return the save one
   version further on, with o.v updated:

     MIGRATIONS[2] = o => { o.pets.forEach(p => p.joy = p.happy); o.v = 3; return o; };

   Nothing is registered yet; version 2 is the first schema that shipped.
   -------------------------------------------------------------------------- */
const MIGRATIONS = {};

/* Returns { game, why, keep, from }. `game` is null when the save could not be
   used, and then `why` completes the sentence "Your saved nest ..." and `keep`
   holds the original text so the caller can park it somewhere safe. */
function loadSave(raw){
  const fail = why => ({ game:null, why, keep:raw, from:null });
  if (!raw) return { game:null, why:null, keep:null, from:null };

  let o;
  try { o = JSON.parse(raw); } catch(e){ return fail('could not be read'); }
  if (!o || typeof o !== 'object') return fail('was not in a shape the game understands');

  if (!Number.isSafeInteger(o.v) || o.v < 0) return fail('had an invalid version');
  const from = o.v;
  if (from > SAVE_VERSION) return fail('was written by a newer version of the game');

  let v = from;
  while (v < SAVE_VERSION){
    const step = MIGRATIONS[v];
    if (!step) return fail('is version ' + v + ', which this build cannot upgrade');
    o = step(o);
    if (!o || (o.v | 0) <= v) return fail('stalled while upgrading from version ' + v);
    v = o.v | 0;
  }

  if (!Array.isArray(o.pets) || !o.pets.length || o.pets.length > MAX_PETS) return fail('had an invalid nest size');
  if (o.pets.some(p => !p || typeof p !== 'object' || Array.isArray(p) ||
      (p.sp !== null && p.sp !== undefined && !Object.hasOwn(SPECIES, p.sp)))) return fail('contained an unknown animal');

  const g = Object.assign(freshGame(), o);
  delete g.awayText; delete g.loadWarning;
  const number = (value, fallback, min=0, max=Number.MAX_SAFE_INTEGER) =>
    Number.isFinite(value) ? clamp(value, min, max) : fallback;
  const array = value => Array.isArray(value) ? value : [];
  g.pets = o.pets.map(rawPet => {
    const defaults = freshPet(), pet = Object.assign(freshPet(), rawPet);
    pet.sp = rawPet.sp || null;
    pet.name = typeof pet.name === 'string' ? pet.name.slice(0, 14) : '';
    pet.needs = Object.fromEntries(Object.entries(defaults.needs).map(([key, value]) =>
      [key, number(rawPet.needs?.[key], value, 0, 100)]));
    pet.traits = Object.fromEntries(Object.keys(TRAITS).map(key =>
      [key, Math.floor(number(rawPet.traits?.[key], 0, 0, TRAITS[key].length-1))]));
    pet.exposure = Object.fromEntries(Object.keys(ILLS).map(key => [key, number(rawPet.exposure?.[key], 0, 0, 24)]));
    for (const key of ['health','bond']) pet[key] = number(pet[key], defaults[key], 0, 100);
    for (const key of ['born','growth','nightAwake','petBank','messTimer','wokeAt','habitatAt']) pet[key] = number(pet[key], defaults[key]);
    pet.simSeed = number(pet.simSeed, defaults.simSeed, 1, 4294967295) >>> 0;
    pet.stageSeen = Math.floor(number(pet.stageSeen, 0, 0, 3));
    pet.asleep = pet.asleep === true; pet.vet = pet.vet === true;
    pet.ills = array(pet.ills).filter(ill => ill && Object.hasOwn(ILLS, ill.id))
      .filter((ill, index, list) => list.findIndex(other => other.id === ill.id) === index)
      .map(ill => ({id:ill.id, since:number(ill.since, Date.now())}));
    pet.treats = array(pet.treats).filter(Number.isFinite).slice(-20);
    pet.mess = array(pet.mess).filter(mess => mess && Number.isFinite(mess.x)).slice(0,4).map(mess => ({x:clamp(mess.x, 28, W-28)}));
    pet.log = array(pet.log).filter(entry => entry && typeof entry.txt === 'string' && Number.isFinite(entry.t)).slice(0,60)
      .map(entry => ({t:entry.t,txt:entry.txt.slice(0,500)}));
    pet.owned = array(pet.owned).filter(id => HAT_SHOP.some(hat => hat.id === id));
    for (const slot in GEAR_FIELD){
      const field = GEAR_FIELD[slot];
      if (!HAT_SHOP.some(hat => hat.id === pet[field] && hat.slot === slot) || !pet.owned.includes(pet[field])) pet[field] = null;
    }
    const skins = SKINS[pet.sp] || [];
    pet.skinsOwned = [...new Set(['wild', ...array(pet.skinsOwned).filter(id => skins.some(skin => skin.id === id))])];
    if (!pet.skinsOwned.includes(pet.skin)) pet.skin = 'wild';
    delete pet.lastPetAt;
    pet.journal = [...new Set(array(pet.journal).filter(id => journalEntries().some(entry => entry.id === id)))];
    pet.records = {};
    for (const [key, record] of Object.entries(rawPet.records || {})){
      if (!/^(snack|forage|leap|tug|guard):(rex|trike|brachio):[0-3]$/.test(key) || !record || typeof record !== 'object') continue;
      pet.records[key] = {best:Math.floor(number(record.best,0,0,1000)), weekly:Math.floor(number(record.weekly,0,0,1000)), week:Math.floor(number(record.week,0))};
    }
    pet.tally = {meals:Math.floor(number(rawPet.tally?.meals,0,0,999999))};
    return pet;
  });
  g.coins = Math.floor(number(g.coins, 24, 0, 999999));
  g.streak = Math.floor(number(g.streak, 0, 0, 99999));
  g.lastTick = number(g.lastTick, Date.now(), 0, Date.now());
  g.lastSeen = number(g.lastSeen, g.lastTick, 0, Date.now());
  g.lastDay = typeof g.lastDay === 'string' ? g.lastDay : '';
  g.sound = g.sound !== false; g.dev = g.dev === true;
  g.biomesOwned = [...new Set(['valley', ...array(g.biomesOwned).filter(id => Object.hasOwn(BIOMES, id))])];
  /* A save written before the habitat moved onto the pet has one on the
     keeper; every animal in it was standing there, so that is where they all
     start. After this the keeper has no habitat at all and `delete` is what
     stops a stale one being carried forward forever. */
  for (const pet of g.pets)
    if (!g.biomesOwned.includes(pet.biome))
      pet.biome = g.biomesOwned.includes(o.biome) ? o.biome : 'valley';
  delete g.biome;
  g.active = clamp(o.active | 0, 0, g.pets.length - 1);
  g.v = SAVE_VERSION;
  return { game:g, why:null, keep:null, from };
}
const trait = (k, pet = S) => TRAITS[k][pet.traits[k]];
const hatched = (pet = S) => !!pet && !!pet.sp && !!pet.born;
const stageIdx = (pet = S) => pet.growth < GROWTH_GATES[0] ? 0 : pet.growth < GROWTH_GATES[1] ? 1 : pet.growth < GROWTH_GATES[2] ? 2 : 3;
const bondPips = () => clamp(Math.floor(S.bond/20), 0, 5);
/* How old an animal is, in days, from the wall clock — so it goes on ageing
   while the game is shut, the same way growth and hunger do. Takes a pet, like
   `stageIdx` and `biomeId`, so the nest can ask about one that is not on
   screen. Clamped at zero: `born` is a timestamp, and a device clock nudged
   backwards would otherwise hand back a negative age. */
const ageDays  = (pet = S) => Math.max(0, Date.now() - pet.born) / 86400e3;

/* The badge on the glass. Hours for the first day, because an animal that has
   just hatched reading "0 D" is the one moment the counter is most looked at,
   and days after that. Grouped past a thousand — about three years, but the
   whole point of the number is that somebody gets there. */
function ageLabel(pet = S){
  const d = ageDays(pet);
  if (d < 1) return Math.max(1, Math.floor(d*24)) + ' H';
  return String(Math.floor(d)).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + ' D';
}
const hasIll   = (id, pet = S) => pet.ills.some(ill => ill.id === id);
/* A window that wraps midnight (21 to 6) is "after bed or before wake"; one
   tuned not to wrap (1 to 9) is "after bed and before wake". Equal hours mean
   no night at all. */
const isNight  = (now = Date.now()) => {
  /* In developer mode a pinned sky clock is the clock bedtime is judged by,
     for the live tick only — a catch-up over hours past still reads the hours
     they actually were. Outside developer mode the pin is a view and nothing
     else, as it always was. */
  const live = devMode && devHour !== null && Math.abs(now - Date.now()) < 5*MIN;
  const hour = live ? Math.floor(devHour) : new Date(now).getHours(), b = SIM.bedHour, w = SIM.wakeHour;
  return b > w ? (hour >= b || hour < w) : (hour >= b && hour < w);
};

function logEvent(txt, pet = S, now = Date.now()){
  pet.log.unshift({ t:now, txt });
  if (pet.log.length > 60) pet.log.length = 60;
}
function careScore(pet = S){
  const n = pet.needs;
  return clamp((n.hunger + n.energy + n.hygiene + n.joy) / 400, 0, 1);
}
function journalEntries(){
  return [
    ...STAGE.map((stage,index) => ({id:'stage:'+index, title:stage.label+' study'})),
    {id:'favourite',title:'Favourite meal'}, {id:'friend',title:'Trusted companion'},
    ...['snack','forage','leap'].map(kind => ({id:'game:'+kind,title:kind === 'snack' ? 'Snack run' : kind === 'forage' ? 'Forage' : 'River leap'})),
    ...Object.keys(BIOMES).map(id => ({id:'habitat:'+id,title:BIOMES[id].name || id}))
  ];
}
function observePet(pet = S, event, now = Date.now()){
  if (!hatched(pet)) return;
  const entries = pet.journal || (pet.journal = []);
  const add = id => { if (!entries.includes(id)) entries.push(id); };
  for (let stage=0;stage<=stageIdx(pet);stage++) add('stage:'+stage);
  if (event && journalEntries().some(entry => entry.id === event)) add(event);
  if (pet.bond >= 60) add('friend');
  for (const [count,hat] of [[4,'frond'],[10,'cap']]){
    if (entries.length >= count && !pet.owned.includes(hat)){
      pet.owned.push(hat);
      logEvent('Field journal reward: '+HAT_SHOP.find(item => item.id === hat).name+'.',pet,now);
    }
  }
}
function moodOf(){
  if (!hatched()) return { key:'egg', line:'The egg is warm.' };
  /* "Too weak to stand" was true when a collapsed animal could do nothing at
     all. It can be roused for a round of a game now — that is the only way it
     can pay for its own vet — so the line says worn out rather than claiming
     it cannot move. Every state has to be readable, and it has to be true. */
  if (S.vet) return { key:'ill', line:'is worn out, and needs a vet.' };
  if (S.asleep) return { key:'sleep', line:'is fast asleep.' };
  const ill = S.ills[0];
  if (ill) return { key:'ill', line:'is unwell. ' + ILLS[ill.id].symptom };
  const n = S.needs;
  if (n.hunger < 22) return { key:'hungry', line:'is hungry enough to nose at the dirt.' };
  if (n.energy < 20) return { key:'tired',  line:'keeps blinking slowly. It needs sleep.' };
  if (n.hygiene < 25)return { key:'dirty',  line:'smells, honestly. The flies agree.' };
  if (n.joy < 25)    return { key:'bored',  line:'is bored and keeps looking at you.' };
  if (careScore() > .82 && S.bond > 55) return { key:'happy', line:'is delighted with everything.' };
  if (careScore() > .6) return { key:'content', line:'is content.' };
  return { key:'meh', line:'is getting by.' };
}

/* ------------------------------ the tick ---------------------------------- */
function advanceSimulation(now, online){
  let cursor = Math.max(G.lastTick, now - 3*24*HOUR);
  while (cursor < now){
    const end = Math.min(now, (Math.floor(cursor/MIN)+1)*MIN);
    simulateAll(end-cursor, online && now-end < MIN, end);
    cursor = end;
  }
  G.lastTick = Math.max(G.lastTick, now);
}
function simulateAll(ms, online, now = Date.now()){
  G.pets.forEach((pet, index) => simulate(pet, ms, online && index === G.active, now));
}
function simulationRandom(pet){
  pet.simSeed = (Math.imul(pet.simSeed, 1664525) + 1013904223) >>> 0;
  return pet.simSeed / 4294967296;
}
function simulate(pet, ms, online, now = Date.now()){
  if (!hatched(pet) || ms <= 0) return;
  const h = ms / HOUR, n = pet.needs;
  const tA = trait('appetite', pet), tT = trait('tempo', pet), tS = trait('social', pet);
  const asleep = pet.asleep;

  n.hunger  = clamp(n.hunger  - SIM.hunger  * tA.hunger * h * (asleep ? .45 : 1), 0, 100);
  n.hygiene = clamp(n.hygiene - SIM.hygiene * h * (asleep ? .5 : 1), 0, 100);
  n.joy     = clamp(n.joy     - SIM.joy     * tT.joy * h * (asleep ? .3 : 1) * tS.lonely, 0, 100);
  n.energy  = asleep ? clamp(n.energy + SIM.energyAsleep * h, 0, 100)
                     : clamp(n.energy - SIM.energyAwake * tT.energy * h, 0, 100);

  if (!asleep && isNight(now-ms/2)) pet.nightAwake += h; else pet.nightAwake = Math.max(0, pet.nightAwake - h*.5);

  pet.treats = pet.treats.filter(time => now - time < HOUR);
  const risks = { bellyache:pet.treats.length >= SIM.bellyTreats, chill:pet.nightAwake > SIM.chillAfter,
                  mites:n.hygiene < SIM.mitesBelow, blues:n.joy < SIM.bluesBelow };
  const limits = { bellyache:SIM.bellyHours, chill:SIM.chillHours, mites:SIM.mitesHours, blues:SIM.bluesHours };
  for (const id in risks){
    pet.exposure[id] = risks[id] ? pet.exposure[id] + h : Math.max(0, pet.exposure[id] - h);
    if (!hasIll(id, pet) && pet.exposure[id] >= limits[id]) fallIll(id, pet, now);
  }

  const ill = pet.ills.length;
  if (ill) pet.health = clamp(pet.health - 7 * ill * h, 0, 100);
  else if (careScore(pet) > .55) pet.health = clamp(pet.health + 9 * h, 0, 100);
  else if (careScore(pet) < .3) pet.health = clamp(pet.health - 5 * h, 0, 100);
  if (pet.health <= 0 && !pet.vet){ pet.vet = true; pet.asleep = true; logEvent(pet.name + ' collapsed. It needs a vet.', pet, now); }

  const worst = Math.min(n.hunger, n.energy, n.hygiene, n.joy);
  if (worst < 15) pet.bond = clamp(pet.bond - 3 * h, 0, 100);
  else if (careScore(pet) > .75) pet.bond = clamp(pet.bond + 1.2 * tS.bond * h, 0, 100);

  const cs = careScore(pet);
  const rate = pet.vet ? 0 : cs > .6 ? 1 : cs > .35 ? .5 : .12;
  pet.growth += (ms/MIN) * rate * SIM.growth;

  if (!asleep && !pet.vet){
    pet.messTimer = (pet.messTimer || (18 + simulationRandom(pet)*14)*MIN) - ms;
    if (pet.messTimer <= 0){
      if (pet.mess.length < 4){
      pet.mess.push({ x: 28 + simulationRandom(pet)*(W-56) });
      n.hygiene = clamp(n.hygiene - 11, 0, 100);
      if (online){ say('Oops.'); SFX.pop(); }
      }
      pet.messTimer = (22 + simulationRandom(pet)*18)*MIN;
    }
  }

  /* Bedtime. An animal woken by hand gets WAKE_GRACE before the night rule
     may take it back, so there is time to feed, wash and play — which is the
     only reason anyone wakes one. Running the tank right down still overrules
     that: at six energy it drops wherever it stands, grace or no grace. */
  /* It goes down at bedtime whatever its energy, and it sleeps through the
     night. Before, it only settled after dark once energy was under thirty,
     and it woke on its own at 99 even at three in the morning — so a rested
     animal stayed up past bedtime on its own account, and staying up past
     bedtime is exactly what brings on a chill. Nine chills a week for a keeper
     who never once woke it: an illness with no cause the player could see.
     Now the late-hours count only fills while someone keeps it up. */
  const sleepy = isNight(now);
  const justWoken = now - (pet.wokeAt || 0) < WAKE_GRACE;
  /* In developer mode, waking an animal or putting it down holds until it is
     released: the night rule, the grace period and the energy floor all stand
     aside. Outside it they do not — which is why a wake at 21:11 was taken back
     by the next tick. A collapse still wins; that is a vet, not a bedtime. */
  const held = devMode && devSleepHold && devSleepHold.pet === pet && !pet.vet;
  if (held){
    if (asleep !== (devSleepHold.state === 'asleep')) setSleep(devSleepHold.state === 'asleep', online, pet);
  } else {
    if (!asleep && (n.energy <= 6 || (sleepy && !justWoken))) setSleep(true, online, pet);
    if (asleep && !pet.vet && !sleepy && n.energy >= 99) setSleep(false, online, pet);
    if (asleep && !pet.vet && !sleepy && n.energy > 72) setSleep(false, online, pet);
  }

  const st = stageIdx(pet);
  observePet(pet, undefined, now);
  if (st !== pet.stageSeen){
    pet.stageSeen = st;
    logEvent(pet.name + ' is now ' + article(STAGE[st].label) + STAGE[st].label.toLowerCase() + '.', pet, now);
    if (online){ say(pet.name + ' grew into ' + article(STAGE[st].label) + STAGE[st].label.toLowerCase() + '!'); SFX.roar(); emit('heart', dino.x, GROUND-40, 8); }
  }
}
function fallIll(id, pet = S, now = Date.now()){
  pet.ills.push({ id, since: now });
  logEvent(pet.name + ' came down with ' + ILLS[id].name.toLowerCase() + '.', pet, now);
}
function setSleep(v, online, pet = S){
  if (pet.asleep === v) return;
  pet.asleep = v;
  if (v){ if (online){ say('Yawn.'); SFX.yawn(); } }
  else   { if (online){ say('Morning.'); } }
}

/* --------------------------- player actions -------------------------------- */
function visitHabitat(now = Date.now()){
  if (!hatched() || S.asleep || S.vet || mode !== 'live') return false;
  const habitat = biomeId();
  if (S.habitatAt && now-S.habitatAt < 30*MIN) return false;
  S.habitatAt = now;
  const benefits = {valley:['joy',8],lagoon:['hygiene',8],ashfall:['joy',8],gorge:['joy',8],boreal:['energy',5]};
  const [need,gain] = benefits[habitat];
  S.needs[need] = clamp(S.needs[need]+gain,0,100);
  S.bond = clamp(S.bond+1,0,100);
  observePet(S,'habitat:'+habitat,now);
  logEvent('Explored '+BIOMES[habitat].name+'.',S,now);
  anim.play('inspect',1400);
  say({valley:'Fresh fern fronds.',lagoon:'Cool water, clean toes.',ashfall:'A smooth volcanic stone.',gorge:'Tracks beside the river.',boreal:'A quiet rest among the conifers.'}[habitat]);
  refreshLight();
  return true;
}

function feed(id){
  const f = FOODS.find(x => x.id === id), sp = SPECIES[S.sp];
  if (!f || feedFX || mode !== 'live') return;
  if (G.coins < f.cost) return refuse('Not enough coins. Dig, or win it at the games.');
  if (S.asleep) return refuse(S.name + ' is asleep.');
  if (hasIll('bellyache')) return refuse(S.name + ' turns away from it. Settle the stomach first.');
  if (S.needs.hunger > 94) return refuse(S.name + ' is full.');
  G.coins -= f.cost;
  swallow(id);
  closeScreen();                                  // back to the habitat to watch it land
  tossFood(id);
  refreshLight();
}
function swallow(id){
  const f = FOODS.find(x => x.id === id), sp = SPECIES[S.sp];
  const loved = sp.likes.includes(id), hated = sp.dislikes.includes(id);
  const tA = trait('appetite');
  S.needs.hunger = clamp(S.needs.hunger + f.fill * (hated ? .5 : 1), 0, 100);
  S.needs.joy = clamp(S.needs.joy + (f.joy + (loved ? 9 : hated ? -6 : 0)) * tA.foodJoy, 0, 100);
  if (loved){ S.bond = clamp(S.bond + 1.5, 0, 100); emit('heart', dino.x, dinoTop - 4, 3, {vy:-16}); }
  if (f.treat) S.treats.push(Date.now());
  S.tally = S.tally || {};
  S.tally.meals = (S.tally.meals || 0) + 1;
  observePet(S, loved ? 'favourite' : undefined);
  say(loved ? 'Its favourite. Gone in one gulp.' : hated ? 'It eats it. Slowly. Resentfully.' : 'Nom.');
  refresh();
}
/* One press, one mess: the one nearest the animal goes first. The pen clean
   pays what a whole scrub always paid — a coin and ten hygiene a mess, and the
   rinse on top once the last one is gone — so washing one at a time costs
   presses, not care. With nothing left to clean it is the rinse on its own. */
function scrub(){
  if (S.asleep) return refuse(S.name + ' is asleep.');
  SFX.wash();
  if (S.mess.length){
    let k = 0;
    S.mess.forEach((m, i) => { if (Math.abs(m.x - dino.x) < Math.abs(S.mess[k].x - dino.x)) k = i; });
    const [m] = S.mess.splice(k, 1);
    emit('spark', m.x, GROUND-6, 6);
    G.coins += 1;
    S.needs.hygiene = clamp(S.needs.hygiene + 10, 0, 100);
    if (S.mess.length){
      say('One cleaned up, and a coin in it. ' + numWord(S.mess.length) + ' to go.');
      return refresh();
    }
    S.needs.hygiene = clamp(S.needs.hygiene + 22, 0, 100);
    S.needs.joy = clamp(S.needs.joy + 4, 0, 100);
    say('That was the last of it. Found a coin in the muck.');
  } else {
    S.needs.hygiene = clamp(S.needs.hygiene + 22, 0, 100);
    S.needs.joy = clamp(S.needs.joy + 4, 0, 100);
    say('A good rinse.');
  }
  emit('spark', dino.x, GROUND-30, 8);
  refresh();
}
/* `at` is the point in canvas units that was actually touched. Hearts used to
   come off a fixed spot above the sprite, which read as unrelated to the tap;
   they now rise from under the finger. */
let lastPetAt = 0;
function pet(at){
  if (!hatched() || S.asleep || S.vet) return;
  const now = performance.now();
  if (now - lastPetAt < 320) return;
  lastPetAt = now;
  S.petBank++;
  const gain = clamp(1.1 - S.bond/160, .25, 1.1) * trait('social').bond;
  S.bond = clamp(S.bond + gain, 0, 100);
  S.needs.joy = clamp(S.needs.joy + 1.6, 0, 100);
  const cautious = trait('social').id === 'shy' && S.bond < 40;
  anim.play(cautious ? 'wary' : 'cheer', cautious ? 450 : 850);
  dino.tx = clamp(dino.x + (cautious ? -dino.dir*8 : dino.dir*4),22,W-22);
  dino.until = now + (cautious ? 1800 : 800);
  if (S.petBank % 6 === 1) say(cautious ? 'A little space, then another look.' : trait('tempo').id === 'placid' ? 'Leans into your hand.' : 'A happy bounce.');
  observePet();
  const hx = at ? at[0] : dino.x, hy = at ? at[1] : dinoTop - 4;
  emit('heart', hx - 3, hy - 6, 1, {vx:5, vy:-19, life:1000});
  SFX.purr();
  if (hasIll('blues') && S.petBank >= 8) cure('company', true);
  refreshLight();
}
function tuckIn(){
  if (!hatched()) return;
  if (S.vet) return refuse(S.name + ' is already down.');
  if (S.asleep) return refuse(S.name + ' is already asleep.');
  if (S.needs.energy > 70 && !devMode) return refuse('Too wide awake to settle. Try below 70 energy.');
  setSleep(true, true);
  if (devMode) devSleepHold = { pet: S, state: 'asleep' };
  S.bond = clamp(S.bond + 1.5, 0, 100);
  S.nightAwake = 0;
  S.wokeAt = 0;
  say(S.name + ' curls up and goes out like a light.');
  refresh();
}
/* The other half of the switch, and the one that was missing entirely: an
   animal put itself to sleep and there was no way to get it back. It could be
   starving, filthy and asleep at once, and every key that would have fixed
   that refused because it was asleep.

   Waking costs, because sleep is how energy comes back and the animal went
   under for a reason. It loses a little of what it had banked and a little
   trust, and at night it starts running up the late-hours count — the same
   field a player who keeps their animal up past bedtime fills, and the one
   that brings on a chill. The cost is a consequence of a decision, not a
   die roll. */
function wakeUp(){
  if (!hatched()) return;
  if (S.vet) return refuse(S.name + ' has not fallen asleep. It has collapsed, and needs a vet.');
  if (!S.asleep) return refuse(S.name + ' is already awake.');
  setSleep(false, true);
  S.wokeAt = Date.now();
  if (devMode) devSleepHold = { pet: S, state: 'awake' };
  S.needs.energy = clamp(S.needs.energy - 4, 0, 100);
  S.bond = clamp(S.bond - 2, 0, 100);
  if (isNight()) S.nightAwake += .5;
  logEvent(S.name + ' was woken early.');
  say(S.name + ' blinks awake, and is not impressed.');
  refresh();
}
function treat(remedyId){
  const r = REMEDIES.find(x => x.id === remedyId);
  if (G.coins < r.cost) return refuse('Not enough coins.');
  if (!S.ills.length) return refuse('Nothing to treat. ' + S.name + ' is well.');
  if (hasIll(r.cures)) return cure(remedyId);
  G.coins -= r.cost;
  S.bond = clamp(S.bond - 2, 0, 100);
  SFX.bonk();
  say('That was not it. ' + S.name + ' looks no better.');
  logEvent('Tried ' + r.name.toLowerCase() + '. Wrong call.');
  refresh();
}
function cure(remedyId, free){
  const r = REMEDIES.find(x => x.id === remedyId);
  if (!free) G.coins -= r.cost;
  S.ills = S.ills.filter(i => i.id !== r.cures);
  S.exposure[r.cures] = 0;
  S.health = clamp(S.health + 30, 0, 100);
  S.bond = clamp(S.bond + 4, 0, 100);
  S.petBank = 0;
  if (r.cures === 'chill') S.nightAwake = 0;
  if (r.cures === 'mites') S.needs.hygiene = clamp(S.needs.hygiene + 30, 0, 100);
  if (r.cures === 'blues') S.needs.joy = clamp(S.needs.joy + 25, 0, 100);
  SFX.hatch();
  anim.play('cheer', 1400);
  emit('heart', dino.x, GROUND-40, 6);
  say(S.name + ' shakes it off. That was the right call.');
  logEvent('Cured ' + ILLS[r.cures].name.toLowerCase() + '.');
  refresh();
}
function vetVisit(){
  if (G.coins < 30) return refuse('The vet costs 30 coins.');
  G.coins -= 30; S.vet = false; S.health = 60; S.ills = [];
  S.needs.hunger = Math.max(S.needs.hunger, 50);
  S.needs.joy = Math.max(S.needs.joy, 40);
  S.bond = clamp(S.bond - 5, 0, 100);
  setSleep(false, true);
  logEvent('Came home from the vet.');
  say(S.name + ' is home and steady again.');
  refresh();
}
function buyHat(id){
  const h = HAT_SHOP.find(x => x.id === id), slot = GEAR_FIELD[h.slot];
  if (S.owned.includes(id)){ S[slot] = S[slot] === id ? null : id; SFX.pop(); refresh(); return; }
  if (G.coins < h.cost) return refuse('Not enough coins.');
  G.coins -= h.cost; S.owned.push(id); S[slot] = id;
  SFX.coin(); say('Suits it.');
  refresh();
}
function buySkin(id){
  const k = skinOf(S.sp, id);
  if (S.skinsOwned.includes(id)){
    S.skin = id; SFX.pop(); say(S.name + ' tries on ' + k.name.toLowerCase() + '.');
    refresh(); return;
  }
  if (G.coins < k.cost) return refuse('Not enough coins.');
  G.coins -= k.cost; S.skinsOwned.push(id); S.skin = id;
  SFX.coin(); say('A whole new coat.');
  logEvent('Unlocked the ' + k.name.toLowerCase() + ' coat.');
  refresh();
}
/* Habitats. Bought once for the nest and then chosen per animal, the way a
   coat is: buying opens the place to everyone, moving moves the one you are
   looking at. Switching costs nothing and cannot leave an animal with no
   habitat at all. */
function buyHabitat(id){
  const b = BIOMES[id];
  if (!b) return;
  if (G.biomesOwned.includes(id)){
    if (S.biome === id) return refuse('Already out there.');
    S.biome = id; S.habitatAt = 0; SFX.pop();
    say('Moved ' + (S.name || 'the egg') + ' to the ' + b.name.toLowerCase() + '.');
    logEvent('Moved to the ' + b.name.toLowerCase() + '.');
    refresh(); save(); return;
  }
  if (G.coins < b.cost) return refuse('Not enough coins.');
  G.coins -= b.cost; G.biomesOwned.push(id); S.biome = id; S.habitatAt = 0;
  SFX.coin(); say('A new place to live.');
  logEvent('Opened up the ' + b.name.toLowerCase() + '.');
  refresh(); save();
}

function doTrick(){
  if (bondPips() < 3) return refuse(S.name + ' does not know you well enough yet.');
  if (S.asleep) return refuse(S.name + ' is asleep.');
  S.needs.joy = clamp(S.needs.joy + 12, 0, 100);
  S.needs.energy = clamp(S.needs.energy - 3, 0, 100);
  S.bond = clamp(S.bond + .8, 0, 100);
  anim.play('cheer', 1600); SFX.roar();
  emit('note', dino.x, dinoTop, 5, {vy:-18, life:1100});
  say(pick(['It spins on the spot.','A short, proud roar.','It stamps twice and looks at you.']));
  closeSheet(); refresh();
}
function refuse(msg){ SFX.bonk(); say(msg, 0, true); }

/* ------------------------------- the nest ---------------------------------- */
function switchPet(i){
  if (i === G.active || !G.pets[i]) return;
  G.active = i; S = G.pets[i];
  dino.x = W/2; dino.tx = W/2; dino.dist = 0; dino.dig = 0;
  feedFX = null;
  mode = hatched() ? 'live' : (S.sp ? 'egg' : 'choose');
  anim.play('idle', 0);
  closeSheet();
  document.title = (S.name || 'Paleopal') + ' — Paleopal';
  if (hatched()) say(S.name + ' trots over.');
  refresh(); paintChrome(); save();
}
function newEgg(){
  if (G.pets.length >= MAX_PETS) return refuse('The nest is full at ' + MAX_PETS + '.');
  G.pets.push(freshPet());
  G.active = G.pets.length - 1;
  S = G.pets[G.active];
  mode = 'choose';
  closeSheet(); refresh(); paintChrome(); save();
}
function releasePet(i){
  if (G.pets.length <= 1) return refuse('That is your only animal.');
  G.pets.splice(i, 1);
  G.active = clamp(G.active >= i ? G.active - 1 : G.active, 0, G.pets.length - 1);
  S = G.pets[G.active];
  mode = hatched() ? 'live' : (S.sp ? 'egg' : 'choose');
  closeSheet(); refresh(); paintChrome(); save();
}

/* ==========================================================================
   DEVELOPER TOOLS
   A test harness, not a cheat menu. There is no way to check a sprite across
   four growth stages, or to see what mites look like, without either playing
   for four hours or reaching in and setting the value. Everything here writes
   the same fields the simulation writes, so nothing below can produce a state
   the game could not have reached on its own.

   `G.dev` gates the button in the top bar; long-pressing the brand plate
   toggles it. It ships on. See ROADMAP.md — it comes off before release.

   The tools only work in developer mode, on a copy of the nest (see
   DEV_SAVE_KEY). Outside it the panel offers the switch and nothing else, so
   testing can never change the animal someone is actually raising.
   ========================================================================== */
const DEV_COINS = 99999;
/* Which way the player last forced sleep, in developer mode: { pet, state }.
   A knob like SIM and devHour, not a field — it is never saved, a reload
   clears it, and the rules take over again. */
let devSleepHold = null;

/* Tuning is kept apart from the nest: only the values that differ from the
   shipped ones, under SIM_KEY, and read back field by field so a stale or
   hand-edited entry can only set a known rate to a finite number. */
function saveTuning(){
  const diff = {};
  for (const k in SIM_DEFAULTS) if (SIM[k] !== SIM_DEFAULTS[k]) diff[k] = SIM[k];
  return Promise.resolve().then(() => Store.set(SIM_KEY, JSON.stringify(diff))).catch(() => {});
}
async function loadTuning(){
  try {
    const raw = await Store.get(SIM_KEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    for (const k in SIM_DEFAULTS) if (typeof o[k] === 'number' && Number.isFinite(o[k])) SIM[k] = o[k];
  } catch (error) { /* unreadable tuning is no tuning */ }
}

const DEV = {
  /* --- purse --- */
  fillPurse(){ G.coins = DEV_COINS; DEV.done('Purse filled.'); },
  addCoins(n){ G.coins = clamp(G.coins + n, 0, DEV_COINS); DEV.done('+' + n + ' coins.'); },
  emptyPurse(){ G.coins = 0; DEV.done('Purse emptied.'); },

  /* --- growth ---
     stageIdx() compares against GROWTH_GATES with <, so parking growth exactly
     on a gate lands in the stage above it. stageSeen is moved with it, or the
     next tick announces a growth spurt that did not happen. */
  setStage(i){
    if (!hatched()) return refuse('Hatch something first.');
    S.growth = i === 0 ? 0 : GROWTH_GATES[i-1];
    S.stageSeen = i;
    DEV.done(S.name + ' is now ' + article(STAGE[i].label) + STAGE[i].label.toLowerCase() + '.');
  },

  /* --- needs and health --- */
  fillNeeds(){
    for (const k in S.needs) S.needs[k] = 100;
    S.health = 100; S.vet = false; S.asleep = false;
    DEV.done('Every meter full.');
  },
  drainNeeds(){
    for (const k in S.needs) S.needs[k] = 8;
    DEV.done('Every meter down to eight.');
  },
  setBond(v){ S.bond = clamp(v, 0, 100); DEV.done('Bond set to ' + Math.round(S.bond) + '.'); },
  collapse(){ S.health = 0; S.vet = true; S.asleep = true; DEV.done(S.name + ' has collapsed.'); },
  /* Forced, and held: see devSleepHold. Waking writes wokeAt the way wakeUp()
     does, so letting go of the hold hands the rules an animal that was woken. */
  toggleSleep(){
    const wake = S.asleep;
    setSleep(!wake, false);
    if (wake) S.wokeAt = Date.now();
    devSleepHold = { pet: S, state: wake ? 'awake' : 'asleep' };
    DEV.done(wake ? 'Awake, and it stays up until you let the rules decide.'
                  : 'Asleep, and it stays down until you let the rules decide.');
  },
  releaseSleep(){ devSleepHold = null; DEV.done('Bedtime rules are back in charge.'); },

  /* --- the mode itself --- */
  async enter(){
    saveBlocked = true;
    try {
      await saveQueue;
      G.lastSeen = Date.now();
      await Store.set(SAVE_KEY, JSON.stringify(G));          // the real nest, as it is right now
      await Store.set(DEV_SAVE_KEY, JSON.stringify(G));      // and the copy developer mode will play
      await Store.set(DEV_MODE_KEY, '1');
      location.reload();
    } catch (error){ saveBlocked = false; storageNotice('Could not start developer mode. Nothing was changed.'); }
  },
  async exit(){
    saveBlocked = true;
    try {
      await saveQueue;
      await Store.del(DEV_MODE_KEY);
      await Store.del(DEV_SAVE_KEY);
      location.reload();
    } catch (error){ saveBlocked = false; storageNotice('Could not leave developer mode. Try again.'); }
  },
  /* Throw the copy away and take a fresh one of the real nest as it is now. */
  async restart(){
    saveBlocked = true;
    try {
      await saveQueue;
      const real = await Store.get(SAVE_KEY);
      if (real) await Store.set(DEV_SAVE_KEY, real); else await Store.del(DEV_SAVE_KEY);
      location.reload();
    } catch (error){ saveBlocked = false; storageNotice('Could not copy the real nest in. The copy is unchanged.'); }
  },

  /* --- illness --- */
  toggleIll(id){
    if (hasIll(id)) S.ills = S.ills.filter(i => i.id !== id);
    else S.ills.push({ id, since: Date.now() });
    DEV.done(hasIll(id) ? ILLS[id].name + ' set.' : ILLS[id].name + ' cleared.');
  },
  cureAll(){ S.ills = []; S.vet = false; S.health = Math.max(S.health, 60); DEV.done('All clear.'); },

  /* --- world --- */
  setBiome(id){ if (!BIOMES[id]) return; if (!G.biomesOwned.includes(id)) G.biomesOwned.push(id);
                S.biome = id; S.habitatAt = 0; DEV.done('Now in the ' + BIOMES[id].name.toLowerCase() + '.'); },
  addMess(){ if (S.mess.length < 4) S.mess.push({ x: rnd(28, W-28) }); DEV.done('Mess dropped.'); },
  clearMess(){ S.mess = []; DEV.done('Pen cleaned.'); },

  /* --- wardrobe --- */
  unlockAll(){
    S.skinsOwned = SKINS[S.sp].map(k => k.id);
    S.owned = HAT_SHOP.map(h => h.id);
    G.biomesOwned = BIOME_IDS.slice();
    DEV.done('Every coat, hat and habitat unlocked.');
  },

  /* --- species ---
     Coats are per species, so the wardrobe has to be reset with the skeleton
     or S.skin points at an id that SKINS[S.sp] has never heard of. */
  becomeSpecies(id){
    S.sp = id;
    S.skin = 'wild'; S.skinsOwned = ['wild'];
    if (!S.born){ S.born = Date.now(); S.stageSeen = stageIdx(); }
    if (!S.name) S.name = pick(NAMES);
    mode = 'live';
    DEV.done('Now ' + article(SPECIES[id].common) + SPECIES[id].common + '.');
  },
  hatchNow(){
    if (!S.sp) return refuse('Pick an egg first.');
    if (S.born) return refuse('Already hatched.');
    hatch();
  },

  /* --- time --- */
  bumpStreak(){ G.streak += 1; G.lastDay = new Date().toDateString(); DEV.done('Streak is ' + G.streak + '.'); },
  /* The clock the sky is drawn at: an hour, or null for the real one. A view
     only — see viewDate() — so it writes nothing the simulation reads. */
  setClock(hour){ devHour = hour === null ? null : ((hour % 24) + 24) % 24; },

  /* --- sliders ---
     A slider fires on every step of travel, so these write the field and
     nothing else: no message, no save, no rebuilding the panel under the
     pointer. The panel repaints; `commit()` saves once the drag lets go. */
  setNeed(k, v){ if (hatched() && k in S.needs) S.needs[k] = clamp(v, 0, 100); },
  setHealth(v){ if (hatched()) S.health = clamp(v, 0, 100); },
  setBondTo(v){ if (hatched()) S.bond = clamp(v, 0, 100); },
  /* Growth moves stageSeen with it, the way setStage does, so dragging across
     a gate does not announce a growth spurt on the next tick. */
  setGrowth(m){ if (!hatched()) return; S.growth = Math.max(0, m); S.stageSeen = stageIdx(); },
  setTune(k, v){ if (k in SIM_DEFAULTS && Number.isFinite(v)) SIM[k] = v; },
  commit(){ save(); saveTuning(); },
  resetTune(){ Object.assign(SIM, SIM_DEFAULTS); saveTuning(); DEV.done('Rates and sleep hours are back to the shipped values.'); },
  setMess(n){
    if (!hatched()) return;
    S.mess = S.mess.slice(0, n);
    while (S.mess.length < n) S.mess.push({ x: rnd(28, W-28) });
    DEV.done(n ? numWord(n) + ' in the pen.' : 'Pen cleaned.');
  },

  done(msg){
    save(); refresh(); paintChrome();
    if (msg) say(msg);
    if (openPanel) renderSheet(openPanel);
  }
};

/* ==========================================================================
   BEHAVIOUR + RENDER
   ========================================================================== */

const cv = $('scene'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

let mode = 'boot';            // boot | choose | egg | live | game
let dino = { x: W/2, dir: -1, tx: W/2, until: 0, walking:false, dig:0, digAt: 0, dist: 0 };
let dinoTop = GROUND - 40, dinoBox = [0,0,0,0];
let egg = { cracks: 0, wob: 0 };
let game = null, feedFX = null;
let habitatTarget = null;
let blinkAt = 0, blinking = false, blinkUntil = 0, zAt = 0;

function strideCycle(spId, stage){
  const growth = artFor(spId, stage).st, species = SPECIES[spId];
  return Math.max(3, species.strideBase * growth.limb * growth.s * species.scale);
}

function stepPresentation(dt, now){
  egg.wob = Math.max(0, egg.wob - dt * .0036);
  anim.t += dt;
  if (mode !== 'live' || !hatched()) return;
  if (now > blinkAt){ blinkUntil = now + 150; blinkAt = now + rnd(2400, 5200); }
  blinking = now < blinkUntil;
  for (const mess of S.mess) if (Math.random() < 1-Math.exp(-dt*.0006)) emit('stink', mess.x, GROUND-6, 1, {vy:-12, life:1000});
  if (S.asleep && now > zAt){ zAt = now + 1100; emit('bubbleZ', dino.x - 10*dino.dir, dinoTop+2, 1, {vy:-13, vx:3, life:2100}); }
  if (hasIll('chill') && Math.random() < 1-Math.exp(-dt*.00072)){ emit('spark', dino.x-14*dino.dir, dinoTop+8, 2, {col:'#cfe0e8'}); SFX.sneeze(); }
  if (hasIll('mites') && Math.random() < 1-Math.exp(-dt*.0012)) emit('crumb', dino.x+rnd(-10,10), dinoTop+10, 1, {col:'#8a7350', vy:-6, g:40});
}

const anim = {
  name:'idle', frame:0, t:0, until:0,
  play(n, ms){ this.name = n; this.frame = 0; this.t = 0; this.until = performance.now() + ms; },
  pick(){
    if (performance.now() < this.until) return this.name;
    if (S.vet || S.asleep) return 'sleep';
    if (S.ills.length) return 'sick';
    return dino.walking ? 'walk' : 'idle';
  }
};

let sayTimer = 0;
/* Wherever the player is actually looking. With a screen open that is the
   screen, and the message goes into its title bar rather than over the rows
   being chosen from; in a game it is the game, and it goes in a strip along the
   top; otherwise it is the habitat, where a bubble over the sky covers nothing
   that matters. `bad` marks a refusal, which is drawn red on all three. */
const hideBubble = () => { clearTimeout(sayTimer); $('bubble').classList.remove('on'); };
function say(text, ms, bad){
  if (screenOpen() || mode === 'game'){ hideBubble(); noteOnGlass(text, bad, ms); return; }
  const b = $('bubble');
  b.textContent = text;
  b.classList.toggle('bad', !!bad);
  b.classList.add('on');
  clearTimeout(sayTimer);
  sayTimer = setTimeout(() => b.classList.remove('on'), ms || 2800);
}

/* ------------------------------ feeding ----------------------------------- */
function tossFood(id){
  feedFX = { id, t: 0, phase: 'fly', from: [dino.x - dino.dir*46, 8], id2: id };
  SFX.pop();
}
function stepFeed(dt){
  if (!feedFX) return;
  feedFX.t += dt;
  if (feedFX.phase === 'fly' && feedFX.t > 620){
    feedFX.phase = 'bite'; feedFX.t = 0;
    anim.play('eat', 1500); SFX.chomp();
    emit('crumb', dino.x - 12*dino.dir, GROUND-26, 8, {vy:12, g:90, life:600});
  } else if (feedFX.phase === 'bite' && feedFX.t > 900){
    feedFX = null;
  }
}
function drawFeed(g, mouth){
  if (!feedFX || feedFX.phase !== 'fly') return;
  const u = clamp(feedFX.t / 620, 0, 1);
